services:
  paperless-postgres:
    container_name: paperless-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_POSTGRES_PASSWORD}
    volumes:
      # Postgres data on local NVMe per the post-phase-6 sizing rule.
      # Container chowns this dir to uid 999 (postgres) on first start, so
      # the host dir must be writable by uid 999. :Z lets SELinux relabel.
      - /var/lib/paperless-pgdata:/var/lib/postgresql/data:Z
    labels:
      autoheal: "true"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless && ls /var/lib/postgresql/data > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dockernet

  paperless-redis:
    container_name: paperless-redis
    image: redis:7
    restart: unless-stopped
    labels:
      autoheal: "true"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - dockernet

  paperless-tika:
    container_name: paperless-tika
    image: apache/tika:latest
    restart: unless-stopped
    # No in-container healthcheck / autoheal: the apache/tika image is
    # distroless, no wget / curl / shell tools available so internal probes
    # can't reach :9998. Same shape as cloudflare-tunnel. Tika is internal-
    # only (no public hostname), so liveness comes via paperless calling it
    # over dockernet — if tika is dead, paperless's own logs surface it.
    networks:
      - dockernet

    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
  paperless-gotenberg:
    container_name: paperless-gotenberg
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: gotenberg --chromium-disable-javascript=true --chromium-allow-list=file:///tmp/.*
    labels:
      autoheal: "true"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health > /dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dockernet

  paperless:
    container_name: paperless
    build:
      context: .
      dockerfile: Dockerfile
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_PAPERLESS:-unset}
    image: paperless-ngx:local
    pull_policy: never
    restart: unless-stopped
    depends_on:
      paperless-postgres:
        condition: service_healthy
      paperless-redis:
        condition: service_healthy
      paperless-tika:
        condition: service_started
      paperless-gotenberg:
        condition: service_started
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_DBHOST: paperless-postgres
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_POSTGRES_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_ADMIN_USER: nathan
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_URL: https://paperless.pod.haus
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://paperless.pod.haus
      PAPERLESS_ALLOWED_HOSTS: paperless.pod.haus
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_TIKA_ENABLED: "true"
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
      PAPERLESS_EMAIL_TASK_CRON: "*/10 * * * *"
      PAPERLESS_CONSUMER_ENABLE_BARCODES: "true"
      PAPERLESS_TIME_ZONE: ${TZ}
      # toweosp mail parser, baked into the image (see Dockerfile). Django
      # app path uses underscores (the source package is paperlessngx_mail_parser);
      # the project README's hyphenated form is a typo.
      PAPERLESS_APPS: paperlessngx_mail_parser.apps.MailparserConfig
    volumes:
      # Paperless app state (search index, models, classifiers) on local
      # NVMe per the sizing rule. Documents on Jump — small + random-read,
      # fits Jump's "durable + IOPS" bucket better than Pouch's HDDs.
      - /var/lib/paperless-data:/usr/src/paperless/data:z
      - /mnt/jump/paperless:/usr/src/paperless/media
    labels:
      autoheal: "true"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
    healthcheck:
      # Sentinel-marker check for /usr/src/paperless/media — proves the
      # bind source /mnt/jump/paperless is the real Jump NFS share via
      # its .podhaus-share-mounted marker. A bare-stub /mnt/jump lacks
      # the marker and goes red. /usr/src/paperless/data is local NVMe (no
      # remote-failure mode) so a cheap `ls` is fine. The 2026-05-23
      # post-reboot incident bit this — bare-stub Jump caused init to
      # fail with `mkdir: cannot create directory ... Permission denied`,
      # which surfaced via restart-loop rather than healthcheck red. See
      # docs/postmortems/2026-05-23-pouch-jump-mount-failure.md.
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ > /dev/null && ls /usr/src/paperless/data > /dev/null && [ -e /usr/src/paperless/media/.podhaus-share-mounted ]"]
      interval: 60s
      timeout: 15s
      # retries 15 (≈15-min patience at 60s interval): a kangaroo NFS
      # outage — every QNAP firmware auto-update reboots the NAS, dropping
      # Pouch/Jump for minutes — must ride out without autoheal restart-
      # storming this NFS-bind container. One successful probe after NFS
      # returns resets to healthy in ~60s.
      retries: 15
      start_period: 120s
    networks:
      - dockernet

  # Config-as-code for Paperless's mail account + ingest rule (DB objects
  # with no env/file config path). Upserts both via the REST API on every
  # deploy from the Komodo-injected Fastmail credentials, so a DB wipe +
  # redeploy reproduces the config with no manual UI step. Same shape as
  # plex-preferences-init. One-shot; ignore_services in stack.toml so its
  # exit-0 doesn't false-red the stack.
  paperless-mail-init:
    container_name: paperless-mail-init
    image: init-tools:local
    build:
      context: ../init-tools
      dockerfile: Dockerfile
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_PAPERLESS_MAIL_INIT:-unset}
    pull_policy: never
    user: "0:0"
    depends_on:
      paperless:
        condition: service_healthy
    environment:
      PAPERLESS_ADMIN_USER: nathan
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_FASTMAIL_USERNAME: ${PAPERLESS_FASTMAIL_USERNAME}
      PAPERLESS_FASTMAIL_PASSWORD: ${PAPERLESS_FASTMAIL_PASSWORD}
      PAPERLESS_FASTMAIL_HOSTNAME: ${PAPERLESS_FASTMAIL_HOSTNAME}
      PAPERLESS_FASTMAIL_PORT: ${PAPERLESS_FASTMAIL_PORT}
    volumes:
      # ${PODHAUS_REPO} is interpolated at compose-render time, so the stack
      # MUST surface PODHAUS_REPO=[[PODHAUS_REPO]] in stack.toml's environment
      # (it's not a container env var — see plex). Without it this resolves to
      # an empty prefix, Docker stubs an empty /paperless/scripts dir, and the
      # init silently no-ops.
      - ${PODHAUS_REPO}/paperless/scripts/mail-init.sh:/script/mail-init.sh:ro,z
    command:
      - /bin/sh
      - /script/mail-init.sh
    restart: "no"
    networks:
      - dockernet
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
      # Recreate (re-run the upsert) when the custom paperless image rebuilds.
      podhaus.depends-on-paperless: ${BUILD_HASH_PAPERLESS:-unset}

networks:
  dockernet:
    external: true
