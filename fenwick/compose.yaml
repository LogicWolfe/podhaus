services:
  # Owns the Signal device link. Long-lived: never restarted on a code
  # edit (deno --watch only restarts the fenwick process). State on an
  # NVMe bind so the link survives container/stack recreation.
  signal-cli-rest-api:
    container_name: signal-cli-rest-api
    image: bbernhard/signal-cli-rest-api:latest
    restart: unless-stopped
    environment:
      MODE: json-rpc
    security_opt:
      - label:disable
    volumes:
      - /var/lib/signal-cli:/home/.local/share/signal-cli
    networks:
      - dockernet

  # Local secret-detector: scrubs credentials out of inbound text
  # before the LLM/log/spans (gitleaks ∪ GLiNER). Fully offline at
  # runtime — weights baked at build, no egress. fenwick's inbound is
  # fail-closed on this, so fenwick waits for it to be healthy. Image
  # built on-host from the fenwick repo's secret-detector/ (config-as-
  # code); arch arm64 (bilby).
  secret-detector:
    container_name: secret-detector
    image: fenwick-secret-detector:0.1
    restart: unless-stopped
    security_opt:
      - label:disable
    networks:
      - dockernet
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # The bot. Deno runs .ts directly — no build, no node_modules. The
  # live repo is bind-mounted over /app and `deno run --watch` reloads
  # on edit. DENO_DIR is a named volume so the module cache (incl. the
  # Agent SDK's platform binary, warmed at image build) persists and
  # isn't shadowed by the source bind. Durable state (SQLite) is on an
  # NVMe bind outside the source tree — the process is runtime-stateless.
  fenwick:
    container_name: fenwick
    image: denoland/deno:2.7.14
    working_dir: /app
    command: ["deno", "run", "--watch", "--allow-all", "src/index.ts"]
    restart: unless-stopped
    depends_on:
      signal-cli-rest-api:
        condition: service_started
      # fenwick's inbound scrub is fail-closed — don't start it until
      # the detector is actually answering, or every message bounces.
      secret-detector:
        condition: service_healthy
    security_opt:
      - label:disable
    volumes:
      - ${FENWICK_REPO}:/app
      - fenwick_deno_dir:/deno-dir
      - /var/lib/fenwick:/data
    environment:
      TZ: ${TZ}
      DENO_DIR: /deno-dir
      LOG_LEVEL: info
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      SIGNAL_CLI_URL: ${SIGNAL_CLI_URL}
      SIGNAL_ACCOUNT: ${SIGNAL_ACCOUNT}
      FENWICK_ADMIN_SIGNAL: ${FENWICK_ADMIN_SIGNAL}
      FENWICK_ADMIN_NAME: ${FENWICK_ADMIN_NAME}
      FENWICK_DB_PATH: /data/fenwick.db
      HTTP_PORT: "8088"
      DOCS_ROOT: /app/docs
      # Native Deno OpenTelemetry → ClickStack collector (same endpoint
      # + ingestion key Alloy uses). Fenwick self-reports OTLP
      # (traces+logs+metrics, trace-correlated); Alloy drops fenwick's
      # stdout to avoid double-ingest (logging/bilby parsers/fenwick).
      OTEL_DENO: "true"
      OTEL_SERVICE_NAME: fenwick
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack-otel:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: authorization=${CLICKSTACK_INGESTION_KEY}
      # Bugsink (Sentry-protocol) error aggregation, internal dockernet
      # form. Empty until the 1P item exists + a redeploy (env is not
      # live-reload) → fenwick treats absent as "reporting disabled".
      BUGSINK_DSN: ${FENWICK_BUGSINK_DSN}
      # Internal HTTP injection-transport producer token (local /
      # dockernet auth branch). REQUIRED — fenwick fails its boot gate
      # if this is absent or an unrendered [[…]] placeholder, by
      # design (a missing secret is a loud error, never a partially
      # working bot). Provisioned: "Fenwick Internal Token" (1P
      # Homelab) → komodo-op → this var; a redeploy renders it (env is
      # not live-reload).
      INTERNAL_HTTP_TOKEN: ${FENWICK_INTERNAL_HTTP_TOKEN}
      # Per-member email credentials live in a dedicated 1Password
      # "Fenwick" vault, read/written at runtime via the self-hosted
      # Connect server on dockernet (not in fenwick.db). REQUIRED —
      # fenwick fails its boot gate if absent or an unrendered [[…]]
      # placeholder. Provisioned: "Fenwick 1Password" (1P Homelab,
      # fields vault id / access token) → komodo-op → these vars; a
      # redeploy renders them (env is not live-reload). OP_CONNECT_HOST
      # is the static internal dockernet address (non-secret).
      FENWICK_OP_VAULT: ${FENWICK_OP_VAULT}
      FENWICK_OP_TOKEN: ${FENWICK_OP_TOKEN}
      OP_CONNECT_HOST: http://op-connect-api:8080
      # The local secret-detector (static internal dockernet address,
      # non-secret like OP_CONNECT_HOST). REQUIRED — fenwick's inbound
      # scrub is fail-closed, so a missing URL fails the boot gate
      # loudly rather than silently leaving inbound unscrubbed.
      SECRET_DETECTOR_URL: http://secret-detector:8000
    networks:
      - dockernet
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "deno eval \"const r=await fetch('http://127.0.0.1:8088/health');Deno.exit(r.ok?0:1)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 150s

volumes:
  fenwick_deno_dir:

networks:
  dockernet:
    external: true
