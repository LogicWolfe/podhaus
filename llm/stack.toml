[[stack]]
name = "fractal-llm"
description = "Local model service on fractal: llama.cpp router, GPU watcher, model download"
tags = ["fractal", "podhaus"]

[stack.config]
server = "fractal"
linked_repo = "podhaus-fractal"
run_directory = "llm"
file_paths = ["compose.yaml"]
run_build = true
# The model download exits 0 by design; without this Komodo counts the exited
# container and marks the whole stack Unhealthy.
ignore_services = ["llm-model"]

environment = """
TZ=[[TZ]]
"""
