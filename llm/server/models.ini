version = 1

; Preset for the llama.cpp router in llm-server. The router starts with no
; model; the watcher asks it to load and unload this one. The section name is
; the model's id on the API: the router overwrites any alias key, so the
; served name qwen3.8-27b has to be the section name. The watcher's
; LLM_MODEL_NAME in compose.yaml must match it.
;
; Only the router's own settings are on its command line in compose.yaml
; (listen address, this file's path, --no-models-autoload). The router reads
; those from its argv, and strips them before it starts the model process.
; Everything else is here, so each setting sits beside its reason.
;
; Prompt and response text stays out of the logs. The log level is set in
; compose.yaml (LLAMA_ARG_LOG_VERBOSITY), one above the default, which adds
; counts and timings and no text. The slot-debug switches that do print prompt
; text (LLAMA_SERVER_SLOTS_DEBUG, LLAMA_SERVER_SLOTS_N_DIFF) and the
; prompt-logging directory are never set.
;
; The measurements quoted below were taken on the RTX 5090 with llama.cpp
; b11347 and are in docs/plans/local-llm-service.html.

[qwen3.8-27b]

; The router never loads a model by itself. After a boot straight into a
; game the model must stay out until the watcher sees the GPU quiet.
load-on-startup = false

; How long the router waits for the model process to exit at an unload before
; killing it. At the default 10 s, an unload with a request in flight held the
; VRAM for 10.3 s; at 2 s it was free 2.2 s after the unload. A game always
; wins, so a reply still streaming is cut.
stop-timeout = 2

; Written by llm-model into the llm-models volume, mounted here at /models.
model = /models/qwen3.8-27b-text-nvfp4-mtp.gguf

; --- Pool and slots ---
; One pool of 204,800 tokens shared by four slots: a main conversation and
; three subagents never wait for one another. 27.4 GiB of VRAM at this size,
; which leaves the Windows desktop about 3 GiB before the card is full (the
; whole-GPU reading stops rising near 31,100 MiB).
; 212,992 and above leave it 2.7 GiB or less; 262,144 spills out of VRAM and
; prompt reading falls from about 1,500 to about 30 tokens/s. LLM_POOL_TOKENS
; in compose.yaml must equal ctx-size.
ctx-size = 204800
parallel = 4
kv-unified = true

; --- Saved conversations ---
; An idle conversation is saved to memory whenever a new request starts, so a
; conversation left in VRAM does not slow the others (a 99,000-token one made
; every other request read 2.3 to 2.9 times slower).
cache-idle-slots = true
; 12 GiB holds the main conversation at 150,000 tokens (6.2 GiB), the largest
; subagent burst seen (4.8 GiB) and a chat agent's opening (0.8 GiB). One that
; does not fit is dropped without warning. The container's 17 GiB limit is
; this plus about 4.5 GiB of working memory.
cache-ram = 12288
; This model reuses part of a conversation only from a snapshot. Two are
; enough for follow-up turns (they re-read 42 to 263 tokens). Each costs about
; 150 MiB plus 2 KiB per token and travels inside every saved conversation;
; eight would cut the stated window to about 85,000 tokens.
ctx-checkpoints = 2
checkpoint-min-step = 8192
; At the default 0.1, a returning conversation is pulled into a newer
; conversation's slot because both begin with the same tools, and re-reads
; itself (measured: 18,200 tokens, 5.1 s).
slot-prompt-similarity = 0.5

; --- Model and drafter ---
n-gpu-layers = all
; A quantized V cache needs flash attention.
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
; The drafter is the model's built-in multi-token predictor. Two tokens on
; every step measured 96 to 104 tokens/s against 75 without; n-max 4 with
; p-min 0.75 was slower than no drafter here. Its 2.3 GiB of VRAM would
; otherwise carry about 50,000 more tokens of pool.
spec-type = draft-mtp
spec-draft-n-max = 2
spec-draft-p-min = 0
spec-draft-ngl = all
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0

; --- Chat template ---
; Claude Code sends system messages mid-conversation and the model's own
; template raises on them. The adjusted template renders a later system
; message as a user turn; the original it was derived from sits beside it.
jinja = true
chat-template-file = /etc/llm-server/qwen3.8-late-system-as-user.jinja

; --- Metrics ---
; Request counts and token totals for Alloy to scrape. The router forwards
; GET /metrics?model=qwen3.8-27b to the model process, so the flag belongs to
; the model process, not the router.
metrics = true
