services:
  minio:
    container_name: minio
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    # Single-node mode. `--console-address :9001` separates the admin UI
    # port (9001) from the S3 API port (9000) so the cloudflare tunnel
    # ingress can target just the console while internal services keep
    # using the API at `http://minio:9000`.
    command: server /data --console-address :9001
    # SELinux on Fedora Asahi denies cross-label access into the
    # bind-mounted data dir; same pattern as every other bilby stack.
    security_opt:
      - label:disable
    environment:
      TZ: ${TZ}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Enables S3 virtual-hosted-style addressing: a request with Host
      # <bucket>.storage.pod.haus is parsed as bucket <bucket>. Publii's
      # aws-sdk-js v3 only does virtual-host, so this is required for it;
      # path-style (Host == storage.pod.haus, and internal/loopback
      # Hosts like 127.0.0.1/minio:9000 which aren't under this domain)
      # is unaffected. See docs/terraform.html.
      MINIO_DOMAIN: ${MINIO_DOMAIN}
      # Tells the console to use the tunnel hostname when issuing OAuth
      # redirects so links from the UI stay valid behind Cloudflare
      # Access. Harmless if the console isn't exposed.
      MINIO_BROWSER_REDIRECT_URL: https://minio.pod.haus
    volumes:
      # Local NVMe per the storage-tier rule — terraform state is tiny,
      # hot, and backed up nightly by Backrest. Absolute host path so
      # there's no relative-resolution-against-periphery surprise.
      - /var/lib/minio:/data
    networks:
      - dockernet
    # API published on loopback only so bilby's host-installed `mcli`
    # can reach it (see hosts.html#bilby-cli-tools). Containers continue
    # to use `http://minio:9000` over dockernet; the console comes in
    # via the cloudflare tunnel. Loopback binding keeps MinIO entirely
    # off the host LAN — only processes on bilby itself can hit it.
    ports:
      - 127.0.0.1:9000:9000
    labels:
      autoheal: "true"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
    healthcheck:
      # MinIO ships curl in the official image; the /minio/health/live
      # endpoint returns 200 once the server is accepting requests.
      test: ["CMD-SHELL", "curl -fSs http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Idempotent bootstrap of MinIO's terraform-state bucket. Lives with
  # the MinIO stack so a fresh deploy is self-sufficient (no manual
  # `mcli mb` step, no chicken-and-egg with terraform). Uses the MinIO
  # image's built-in `mc` client (same binary as host-installed `mcli`).
  # mc options are idempotent: alias set overwrites, --ignore-existing
  # is a no-op on existing bucket, and version enable is a no-op when
  # already enabled. Marked ignore_services in stack.toml so the
  # one-shot exit-0 doesn't flip the stack Unhealthy.
  minio-init:
    container_name: minio-init
    image: quay.io/minio/minio:latest
    security_opt:
      - label:disable
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - dockernet
    restart: "no"
    entrypoint:
      - sh
      - -euc
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/terraform-state
        mc version enable local/terraform-state
        echo "terraform-state bucket ready (versioned)"

    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
networks:
  dockernet:
    external: true
