[[stack]]
name = "minio"
description = "Single-node S3-compatible object storage — Terraform state backend + future blob/object storage tenants"
tags = ["podhaus"]

[stack.config]
server = "podhaus"
files_on_host = true
run_directory = "/etc/komodo/repo/minio"
# minio-init is a one-shot bootstrap (creates the terraform-state
# bucket, idempotent). Without ignore_services Komodo would count
# its exit-0 toward stack health and flip the stack Unhealthy. Same
# pattern as plex/backup/flood/tailscale.
ignore_services = ["minio-init"]

environment = """
TZ=[[TZ]]
MINIO_ROOT_USER=[[OP__KOMODO__MINIO_ROOT__USERNAME]]
MINIO_ROOT_PASSWORD=[[OP__KOMODO__MINIO_ROOT__CREDENTIAL]]
MINIO_DOMAIN=storage.pod.haus
"""
