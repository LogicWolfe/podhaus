[[stack]]
name = "radarr"
description = "Radarr — movie metadata lookups + poster art for Fenwick, lookup-only"
tags = ["podhaus"]

[stack.config]
# Same host as Sonarr and Fenwick: it only needs to be reachable from
# Fenwick over dockernet. Linked repo, like every stack that is not on
# bilby.
server = "bandicoot"
linked_repo = "podhaus-bandicoot"
run_directory = "radarr"

environment = """
TZ=[[TZ]]
RADARR_API_KEY=[[OP__KOMODO__RADARR_API__CREDENTIAL]]
"""
