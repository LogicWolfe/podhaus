[[stack]]
name = "pinelake-caddy"
description = "Pomerium mTLS origin for Pinelake Flood and Syncthing"
tags = ["pinelake", "podhaus"]

[stack.config]
server = "pinelake"
linked_repo = "podhaus-pinelake"
run_directory = "caddy/pinelake"
run_build = true
ignore_services = ["pinelake-caddy-secrets-init"]
environment = """
TZ=America/Edmonton
POMERIUM_ORIGIN_CA_CERT_B64=[[OP__KOMODO__POMERIUM_ORIGIN_PKI__CA_CERT_B64]]
POMERIUM_ORIGIN_SERVER_CERT_B64=[[OP__KOMODO__POMERIUM_ORIGIN_PKI__SERVER_CERT_B64]]
POMERIUM_ORIGIN_SERVER_KEY_B64=[[OP__KOMODO__POMERIUM_ORIGIN_PKI__SERVER_KEY_B64]]
"""
