x-podhaus-content-paths:
  - ../../config

# fractal's protected origin.
#
# Unlike bilby's Caddy this owns no public TLS and issues no certificates, so
# it runs the stock upstream image — there is no ACME DNS-01 to satisfy and
# therefore no reason to build the caddy-dns/cloudflare module in. It
# terminates Pomerium's mTLS and dispatches by Host, and serves the local
# model service to callers on fractal itself over a loopback-only port and to
# Fenwick on bandicoot over the LAN. It also serves the model service's setup
# page (llm-setup/) on the first two.
services:
  fractal-caddy-secrets-init:
    build:
      context: ../../init-tools
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_FRACTAL_CADDY_SECRETS_INIT:-unset}
    image: init-tools:local
    pull_policy: never
    restart: "no"
    environment:
      POMERIUM_ORIGIN_CA_CERT_B64: ${POMERIUM_ORIGIN_CA_CERT_B64}
      POMERIUM_ORIGIN_SERVER_CERT_B64: ${POMERIUM_ORIGIN_SERVER_CERT_B64}
      POMERIUM_ORIGIN_SERVER_KEY_B64: ${POMERIUM_ORIGIN_SERVER_KEY_B64}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf '%s' "$${POMERIUM_ORIGIN_CA_CERT_B64}" | base64 -d > /secrets/pomerium-origin-ca.pem
        printf '%s' "$${POMERIUM_ORIGIN_SERVER_CERT_B64}" | base64 -d > /secrets/pomerium-origin-server-cert.pem
        printf '%s' "$${POMERIUM_ORIGIN_SERVER_KEY_B64}" | base64 -d > /secrets/pomerium-origin-server-key.pem
    volumes:
      - fractal-caddy-secrets:/secrets
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}

  fractal-caddy:
    container_name: fractal-caddy
    image: caddy:2
    restart: unless-stopped
    depends_on:
      fractal-caddy-secrets-init:
        condition: service_completed_successfully
    volumes:
      # Directory binds only.
      - /opt/komodo-periphery/etc-komodo/repos/podhaus-fractal/caddy/fractal:/etc/caddy:ro
      - fractal-caddy-secrets:/run/podhaus-secrets:ro
      - fractal-caddy-data:/data
      - fractal-caddy-config:/config
    environment:
      TZ: ${TZ}
      # The one LAN address the http://:8086 listener admits, read when Caddy
      # parses the Caddyfile.
      BANDICOOT_LAN_IPV4: ${BANDICOOT_LAN_IPV4}
    ports:
      # The local model service's listener (http://:8085 in the Caddyfile). It
      # has no sign-in, so it is published on fractal's loopback only.
      - "127.0.0.1:8085:8085"
      # Fenwick's listener (http://:8086), which admits bandicoot only. Every
      # interface rather than the LAN address: that address exists in the WSL
      # guest only under mirrored networking, and a bind to an absent address
      # would stop the whole container, the signed-in route with it.
      - "8086:8086"
    networks:
      - dockernet
    labels:
      autoheal: "true"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
      podhaus.depends-on-fractal-caddy-secrets-init: ${BUILD_HASH_FRACTAL_CADDY_SECRETS_INIT:-unset}
    healthcheck:
      # `caddy validate` proves the config parses; a TCP probe of :4443 would
      # need a client certificate we deliberately do not have here.
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  fractal-caddy-secrets:
  fractal-caddy-data:
  fractal-caddy-config:

networks:
  dockernet:
    external: true
