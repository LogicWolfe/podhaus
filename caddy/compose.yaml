services:
  caddy-secrets-init:
    build:
      context: ../init-tools
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_CADDY_SECRETS_INIT:-unset}
    image: init-tools:local
    pull_policy: never
    restart: "no"
    environment:
      POMERIUM_ORIGIN_CA_CERT_B64: ${POMERIUM_ORIGIN_CA_CERT_B64}
      POMERIUM_ORIGIN_SERVER_CERT_B64: ${POMERIUM_ORIGIN_SERVER_CERT_B64}
      POMERIUM_ORIGIN_SERVER_KEY_B64: ${POMERIUM_ORIGIN_SERVER_KEY_B64}
      LOG_INGEST_CA_CERT_B64: ${LOG_INGEST_CA_CERT_B64}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf '%s' "$${POMERIUM_ORIGIN_CA_CERT_B64}" | base64 -d > /secrets/pomerium-origin-ca.pem
        printf '%s' "$${POMERIUM_ORIGIN_SERVER_CERT_B64}" | base64 -d > /secrets/pomerium-origin-server-cert.pem
        printf '%s' "$${POMERIUM_ORIGIN_SERVER_KEY_B64}" | base64 -d > /secrets/pomerium-origin-server-key.pem
        printf '%s' "$${LOG_INGEST_CA_CERT_B64}" | base64 -d > /secrets/log-ingest-ca.pem
    volumes:
      - caddy-secrets:/secrets
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}

  caddy:
    container_name: caddy
    build:
      context: .
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_CADDY:-unset}
    image: caddy-cloudflare:local
    pull_policy: never
    restart: unless-stopped
    # SELinux enforcing on Fedora Asahi denies cross-label reads into
    # the bind-mounted Caddyfile; same pattern as every other bilby
    # stack (docs-server / gatus).
    security_opt:
      - label:disable
    depends_on:
      caddy-secrets-init:
        condition: service_completed_successfully
    # Public TLS front: must be reachable on the host LAN interface so
    # the UniFi WAN:443 port-forward (and the split-horizon LAN name)
    # land here. Unlike MinIO (loopback-only), Caddy is intentionally
    # LAN/WAN-facing.
    ports:
      - 443:443
    environment:
      TZ: ${TZ}
      # Cloudflare token for ACME DNS-01 and Sky's cache-tag purge,
      # from 1Password via komodo-op.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      NATHANBAXTER_CACHE_TAG: ${NATHANBAXTER_CACHE_TAG}
      SKY_CACHE_MANIFEST_URL: ${SKY_CACHE_MANIFEST_URL}
      SKY_CACHE_ZONE: ${SKY_CACHE_ZONE}
      SKY_CACHE_TAG: ${SKY_CACHE_TAG}
      SKY_CACHE_STATE_FILE: ${SKY_CACHE_STATE_FILE}
      GATUS_BASE_URL: http://gatus:8080
      GATUS_HEARTBEAT_PUSH_TOKEN: ${GATUS_HEARTBEAT_PUSH_TOKEN}
      HYPERDX_MCP_GATEWAY_TOKEN: ${HYPERDX_MCP_GATEWAY_TOKEN}
      PAPERLESS_API_GATEWAY_TOKEN: ${PAPERLESS_API_GATEWAY_TOKEN}
    volumes:
      # Directory bind (not file bind) so atomic-rename edits to the
      # Caddyfile on the host surface in the container — same gotcha
      # documented across the fleet. Read-only: Caddy never writes it.
      - ${PODHAUS_REPO}/caddy:/etc/caddy:ro
      # Cert + ACME account state MUST persist — Let's Encrypt rate
      # limits make losing /data expensive.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-secrets:/run/podhaus-secrets:ro
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    networks:
      - dockernet
    labels:
      autoheal: "true"
      ofelia.enabled: "true"
      ofelia.job-exec.sky-cache-invalidate.schedule: "0 * * * * *"
      ofelia.job-exec.sky-cache-invalidate.command: "/bin/sh /etc/caddy/scripts/sky-cache-invalidate.sh"
      podhaus.depends-on-caddy-secrets-init: ${BUILD_HASH_CADDY_SECRETS_INIT:-unset}
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
    healthcheck:
      # Caddy's localhost admin API answers when the server is up
      # (busybox wget is present in the alpine-based caddy image).
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2019/config/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  dockernet:
    external: true

volumes:
  caddy-data:
  caddy-config:
  caddy-secrets:
