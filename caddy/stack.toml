[[stack]]
name = "caddy"
description = "Public TLS front for MinIO S3 (own LE wildcard; not Cloudflare-proxied)"
tags = ["podhaus"]

[stack.config]
server = "podhaus"
files_on_host = true
run_directory = "/etc/komodo/repo/caddy"
# Builds Caddy and the shared secret-rendering init image inline.
run_build = true
ignore_services = ["caddy-secrets-init"]

environment = """
TZ=[[TZ]]
PODHAUS_REPO=[[PODHAUS_REPO]]
CLOUDFLARE_API_TOKEN=[[OP__KOMODO__CLOUDFLARE_API_TOKEN__CREDENTIAL]]
NATHANBAXTER_CACHE_TAG=nathanbaxter
SKY_CACHE_MANIFEST_URL=http://minio:9000/skycroeser-net/files.publii.json
SKY_CACHE_ZONE=skycroeser.net
SKY_CACHE_TAG=skycroeser
SKY_CACHE_STATE_FILE=/data/cache-state/skycroeser-manifest-version
GATUS_HEARTBEAT_PUSH_TOKEN=[[OP__KOMODO__GATUS_HEARTBEAT_PUSH_TOKEN__TOKEN]]
POMERIUM_ORIGIN_CA_CERT_B64=[[OP__KOMODO__POMERIUM_ORIGIN_PKI__CA_CERT_B64]]
POMERIUM_ORIGIN_SERVER_CERT_B64=[[OP__KOMODO__POMERIUM_ORIGIN_PKI__SERVER_CERT_B64]]
POMERIUM_ORIGIN_SERVER_KEY_B64=[[OP__KOMODO__POMERIUM_ORIGIN_PKI__SERVER_KEY_B64]]
LOG_INGEST_CA_CERT_B64=[[OP__KOMODO__LOG_INGEST_PKI__CA_CERT_B64]]
FENWICK_EVENTS_GATEWAY_TOKEN=[[OP__KOMODO__POMERIUM_GATEWAY_TOKENS__FENWICK_EVENTS]]
HYPERDX_MCP_GATEWAY_TOKEN=[[OP__KOMODO__POMERIUM_GATEWAY_TOKENS__HYPERDX_MCP]]
PAPERLESS_API_GATEWAY_TOKEN=[[OP__KOMODO__POMERIUM_GATEWAY_TOKENS__PAPERLESS_API]]
"""
