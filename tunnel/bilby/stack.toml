[[stack]]
name = "bilby-tunnel"
description = "Outbound wstunnel client: bilby's services on Numbat"
tags = ["podhaus"]

[stack.config]
server = "podhaus"
files_on_host = true
run_directory = "/etc/komodo/repo/tunnel/bilby"

environment = """
PODHAUS_REPO=[[PODHAUS_REPO]]
TUNNEL_CA_CERT_B64=[[OP__KOMODO__NUMBAT_TUNNEL__CA_CERT_B64]]
TUNNEL_CERT_B64=[[OP__KOMODO__NUMBAT_TUNNEL__BILBY_CERT_B64]]
TUNNEL_KEY_B64=[[OP__KOMODO__NUMBAT_TUNNEL__BILBY_KEY_B64]]
"""
