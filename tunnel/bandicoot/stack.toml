[[stack]]
name = "bandicoot-tunnel"
description = "Outbound wstunnel client: bandicoot's services on Numbat"
tags = ["bandicoot", "podhaus"]

[stack.config]
server = "bandicoot"
linked_repo = "podhaus-bandicoot"
run_directory = "tunnel/bandicoot"

environment = """
TUNNEL_CA_CERT_B64=[[OP__KOMODO__NUMBAT_TUNNEL__CA_CERT_B64]]
TUNNEL_CERT_B64=[[OP__KOMODO__NUMBAT_TUNNEL__BANDICOOT_CERT_B64]]
TUNNEL_KEY_B64=[[OP__KOMODO__NUMBAT_TUNNEL__BANDICOOT_KEY_B64]]
"""
