[[stack]]
name = "fractal-tunnel"
description = "Outbound wstunnel client: fractal's services on Numbat"
tags = ["fractal", "podhaus"]

[stack.config]
server = "fractal"
linked_repo = "podhaus-fractal"
run_directory = "tunnel/fractal"

environment = """
TUNNEL_CA_CERT_B64=[[OP__KOMODO__NUMBAT_TUNNEL__CA_CERT_B64]]
TUNNEL_CERT_B64=[[OP__KOMODO__NUMBAT_TUNNEL__FRACTAL_CERT_B64]]
TUNNEL_KEY_B64=[[OP__KOMODO__NUMBAT_TUNNEL__FRACTAL_KEY_B64]]
"""
