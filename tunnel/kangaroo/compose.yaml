# kangaroo's wstunnel CLIENT: dials Numbat's tunnel server and publishes
# kangaroo's SSH (ssh://kangaroo); host networking, so 127.0.0.1:22 is the QTS
# sshd. Numbat grants this certificate exactly these listeners
# (tunnel/numbat/restrictions.yaml).

# The shared launcher, outside this directory, in the content hash.
x-podhaus-content-paths:
  - ../launcher

services:
  kangaroo-tunnel:
    container_name: kangaroo-tunnel
    image: ghcr.io/erebe/wstunnel:latest
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    security_opt:
      - label=disable
      - no-new-privileges=true
    entrypoint: ["/usr/bin/dumb-init", "--", "/etc/tunnel/launcher/run-wstunnel"]
    command:
      - client
      - --tls-verify-certificate
      - --tls-certificate=/tmp/tunnel/cert.pem
      - --tls-private-key=/tmp/tunnel/key.pem
      - -R
      - tcp://127.0.0.1:2303:127.0.0.1:22
      - wss://relay.numbat.pod.haus:2334
    environment:
      TUNNEL_CA_CERT_B64: ${TUNNEL_CA_CERT_B64}
      TUNNEL_CERT_B64: ${TUNNEL_CERT_B64}
      TUNNEL_KEY_B64: ${TUNNEL_KEY_B64}
    volumes:
      # The launcher, from this host's checkout by host path: Komodo runs
      # Compose inside Periphery, where a relative bind resolves elsewhere.
      - /share/CACHEDEV2_DATA/Container/komodo-periphery/etc-komodo/repos/podhaus/tunnel:/etc/tunnel:ro
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
