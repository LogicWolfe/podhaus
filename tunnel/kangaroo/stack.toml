[[stack]]
name = "kangaroo-tunnel"
description = "Outbound wstunnel client: kangaroo's services on Numbat"
tags = ["kangaroo", "podhaus"]

[stack.config]
server = "kangaroo"
linked_repo = "podhaus"
run_directory = "tunnel/kangaroo"

environment = """
TUNNEL_CA_CERT_B64=[[OP__KOMODO__NUMBAT_TUNNEL__CA_CERT_B64]]
TUNNEL_CERT_B64=[[OP__KOMODO__NUMBAT_TUNNEL__KANGAROO_CERT_B64]]
TUNNEL_KEY_B64=[[OP__KOMODO__NUMBAT_TUNNEL__KANGAROO_KEY_B64]]
"""
