[[stack]]
name = "pinelake-tunnel"
description = "Outbound wstunnel client: pinelake's services on Numbat"
tags = ["pinelake", "podhaus"]

[stack.config]
server = "pinelake"
linked_repo = "podhaus-pinelake"
run_directory = "tunnel/pinelake"

environment = """
TUNNEL_CA_CERT_B64=[[OP__KOMODO__NUMBAT_TUNNEL__CA_CERT_B64]]
TUNNEL_CERT_B64=[[OP__KOMODO__NUMBAT_TUNNEL__PINELAKE_CERT_B64]]
TUNNEL_KEY_B64=[[OP__KOMODO__NUMBAT_TUNNEL__PINELAKE_KEY_B64]]
"""
