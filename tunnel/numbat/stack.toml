[[stack]]
name = "numbat-tunnel"
description = "wstunnel server on Numbat: the outbound tunnels every origin host dials"
tags = ["numbat", "podhaus"]

[stack.config]
server = "numbat"
linked_repo = "podhaus-numbat"
run_directory = "tunnel/numbat"

environment = """
TUNNEL_CA_CERT_B64=[[OP__KOMODO__NUMBAT_TUNNEL__CA_CERT_B64]]
TUNNEL_CERT_B64=[[OP__KOMODO__NUMBAT_TUNNEL__SERVER_CERT_B64]]
TUNNEL_KEY_B64=[[OP__KOMODO__NUMBAT_TUNNEL__SERVER_KEY_B64]]
"""
