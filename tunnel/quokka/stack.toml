[[stack]]
name = "quokka-tunnel"
description = "Outbound wstunnel client: quokka's services on Numbat"
tags = ["quokka", "podhaus"]

[stack.config]
server = "quokka"
linked_repo = "podhaus-quokka"
run_directory = "tunnel/quokka"

environment = """
TUNNEL_CA_CERT_B64=[[OP__KOMODO__NUMBAT_TUNNEL__CA_CERT_B64]]
TUNNEL_CERT_B64=[[OP__KOMODO__NUMBAT_TUNNEL__QUOKKA_CERT_B64]]
TUNNEL_KEY_B64=[[OP__KOMODO__NUMBAT_TUNNEL__QUOKKA_KEY_B64]]
"""
