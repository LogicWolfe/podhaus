[[stack]]
name = "kangaroo-autoheal"
description = "Restart unhealthy autoheal-labeled containers on kangaroo"
tags = ["kangaroo", "podhaus"]

[stack.config]
server = "kangaroo"
linked_repo = "podhaus"
# No per-stack webhook. The shared podhaus procedure reconciles content
# hashes in Stage 1, then handles compose-text changes and new stacks
# through Stage 2's wildcard IfChanged pass.
run_directory = "autoheal/kangaroo"
file_paths = ["compose.yaml", "../compose.shared.yaml"]
