[[stack]]
name = "kangaroo-autoheal"
description = "Restart unhealthy autoheal-labeled containers on kangaroo"
tags = ["kangaroo", "podhaus"]
deploy = true

[stack.config]
server = "kangaroo"
linked_repo = "podhaus"
# No webhook_force_deploy / no per-stack webhook — the single push
# webhook's podhaus-push-deploy procedure force-deploys this via
# Stage 2 (BatchDeployStack "kangaroo-*"). See
# logging/kangaroo/stack.toml + komodo/sync/procedures.toml.
run_directory = "autoheal/kangaroo"
file_paths = ["compose.yaml", "../compose.shared.yaml"]
