# Shared service definition for autoheal (willfarrell/autoheal). Each
# host stack combines its overlay with this file through `file_paths`.
# The host overlays contain only genuinely host-specific settings.

services:
  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # No healthcheck — willfarrell/autoheal runs as a shell script with
    # no persistent process name to probe. restart: unless-stopped
    # handles crashes; autoheal can't heal itself anyway.
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
