[[stack]]
name = "kookaburra-logging"
description = "Alloy on kookaburra — ships container logs + self-telemetry to ClickStack (cross-tailnet to bilby-podnet.tail9ceb.ts.net:4318 via MagicDNS)"
tags = ["kookaburra", "podhaus"]

[stack.config]
server = "kookaburra"
linked_repo = "podhaus-kookaburra"
# The shared podhaus procedure reconciles content hashes in Stage 1,
# then handles compose-text changes and new stacks through Stage 2's
# wildcard IfChanged pass.
run_directory = "logging/kookaburra"
file_paths = ["compose.yaml", "../compose.shared.yaml"]

environment = """
CLICKSTACK_INGESTION_KEY=[[OP__KOMODO__CLICKSTACK_INGESTION_KEY__CREDENTIAL]]
"""
