# kookaburra's logging overlay. Ships container logs cross-tailnet to
# bilby's ClickStack collector (bilby's tailnet IP, port 4318). alloy
# stays on the shared compose's `dockernet` network — kookaburra has
# its own dockernet bridge created during bootstrap (mirrors kangaroo).
# Outbound packets to bilby's tailnet IP route via the host's
# tailscale0 (bridge → host → tailscale0 → over WG → bilby).
services:
  alloy:
    # SELinux Enforcing on Fedora 43 — same pattern as bilby's stacks.
    security_opt:
      - label:disable
    volumes:
      # Absolute host path because Periphery's container-side relative-
      # path resolution doesn't match the kookaburra host's view of the
      # cloned repo (same reason as relay/kookaburra). Directory bind
      # (not file bind) — alloy reloads on file change; file-binding
      # would pin the inode.
      - /opt/komodo-periphery/etc-komodo/repos/podhaus-kookaburra/logging/kookaburra/alloy-conf:/etc/alloy:ro
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
