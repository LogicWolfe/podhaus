# Kangaroo's logging overlay. Just the alloy bind-mount for the
# kangaroo-specific alloy-config.alloy (different host label, write
# target points cross-LAN to bilby's published victoria-logs at
# 10.0.0.119:9428, no per-container JSON-rewrite stages since the
# matched container names — op-connect-api, flood — only exist on bilby).

include:
  - ../compose.shared.yaml

services:
  alloy:
    volumes:
      # Absolute host path because Periphery's container-side relative-
      # path resolution doesn't match the QNAP host's view of the cloned
      # repo, and ${PODHAUS_REPO} doesn't exist on kangaroo.
      - /share/CACHEDEV1_DATA/Container/komodo-periphery/etc-komodo/repos/podhaus/logging/kangaroo/alloy-config.alloy:/etc/alloy/config.alloy:ro
