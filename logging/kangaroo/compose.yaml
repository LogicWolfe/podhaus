# Kangaroo's logging overlay: the alloy-conf bind for the kangaroo
# config.alloy plus the shared ../alloy-modules bind every host carries.


services:
  alloy:
    volumes:
      # Absolute host path because Periphery's container-side relative-
      # path resolution doesn't match the QNAP host's view of the cloned
      # repo, and ${PODHAUS_REPO} doesn't exist on kangaroo.
      #
      # Directory bind (not file bind) — alloy reloads config on file
      # change; an atomic-rename save on host would otherwise pin the
      # inode and silently hide updates. The bound dir contains exactly
      # config.alloy, matching the path alloy is told to read via the
      # shared compose's `command:` line. See
      # docs/stack-conventions.html#bind-mounts.
      - /share/CACHEDEV2_DATA/Container/komodo-periphery/etc-komodo/repos/podhaus/logging/kangaroo/alloy-conf:/etc/alloy:ro
      - /share/CACHEDEV2_DATA/Container/komodo-periphery/etc-komodo/repos/podhaus/logging/alloy-modules:/etc/alloy-modules:ro
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
