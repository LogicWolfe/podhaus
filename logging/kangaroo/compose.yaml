# Alloy on kangaroo, shipping container logs to bilby's Victoria Logs.
#
# Bilby's logging stack hosts the VL backend; kangaroo runs only the
# scraping side. Logs are pushed over LAN to bilby's :9428 (published).
# In Grafana / vmui, kangaroo's logs appear alongside bilby's, filterable
# by `host="kangaroo"`.
services:
  alloy:
    container_name: alloy
    image: grafana/alloy:latest
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    # No SELinux label:disable — QTS doesn't run SELinux. (Bilby's alloy
    # needs this on Fedora Asahi; kangaroo doesn't.)
    volumes:
      # Absolute host path because Periphery's container-side relative-
      # path resolution doesn't match the QNAP host's view of the cloned
      # repo (same gotcha as kangaroo/backrest's template mount).
      - /share/CACHEDEV1_DATA/Container/komodo-periphery/etc-komodo/repos/podhaus/kangaroo/logging/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    labels:
      autoheal: "true"
    # Alloy's base image is minimal Debian with no curl/wget/nc; we use
    # bash's /dev/tcp shortcut to test the metrics-port socket as the
    # liveness probe. Same shape as bilby's alloy.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/12345' 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  alloy-data:
