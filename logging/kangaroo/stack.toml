[[stack]]
name = "kangaroo-logging"
description = "Alloy on kangaroo — ships container logs to bilby's Victoria Logs"
tags = ["kangaroo", "podhaus"]
deploy = true

[stack.config]
server = "kangaroo"
linked_repo = "podhaus"
run_directory = "logging/kangaroo"
file_paths = ["../compose.shared.yaml", "compose.yaml"]

environment = """
TZ=[[TZ]]
"""
