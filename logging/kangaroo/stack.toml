[[stack]]
name = "kangaroo-logging"
description = "Alloy on kangaroo — ships container logs + self-telemetry to ClickStack (cross-LAN to bilby)"
tags = ["kangaroo", "podhaus"]
deploy = true

[stack.config]
server = "kangaroo"
linked_repo = "podhaus"
# No webhook_force_deploy / no per-stack webhook. The single push
# webhook drives the podhaus-push-deploy procedure, whose Stage 2
# (BatchDeployStack "kangaroo-*") force-deploys this linked_repo stack
# unconditionally (git pull + compose), sidestepping the stale-clone
# deadlock (the change-check compares the Periphery clone, which only
# advances during a deploy). bilby files_on_host stacks ride Stage 1's
# DeployStackIfChanged (they diff the live bind-mount — no churn).
# See komodo/sync/procedures.toml + docs/komodo.html.
run_directory = "logging/kangaroo"
file_paths = ["compose.yaml", "../compose.shared.yaml"]

environment = """
CLICKSTACK_INGESTION_KEY=[[OP__KOMODO__CLICKSTACK_INGESTION_KEY__CREDENTIAL]]
"""
