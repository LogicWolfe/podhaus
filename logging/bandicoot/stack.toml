[[stack]]
name = "bandicoot-logging"
description = "Alloy on bandicoot, shipping to the ClickStack collector on the same host over dockernet"
tags = ["bandicoot", "podhaus"]

[stack.config]
server = "bandicoot"
linked_repo = "podhaus-bandicoot"
run_directory = "logging/bandicoot"
file_paths = ["../compose.shared.yaml", "compose.yaml"]

environment = """
CLICKSTACK_INGESTION_KEY=[[OP__KOMODO__CLICKSTACK_INGESTION_KEY__CREDENTIAL]]
CLICKHOUSE_TZ=[[TZ]]
"""
