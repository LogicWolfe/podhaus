# bandicoot's logging overlay: the alloy-conf and shared module binds from
# the linked podhaus clone, the files Alloy tails here, and the SELinux opt
# Fedora Asahi Remix needs. Alloy reaches the ClickStack collector on this
# host by container name over dockernet, so it needs no client certificate.
services:
  alloy:
    # SELinux enforcing denies cross-label writes to docker.sock and reads
    # of the bind-mounted config dir; label=disable covers both (bilby
    # pattern).
    security_opt:
      - label=disable
    environment:
      # The zone ClickHouse writes its error log in: the clickstack stack's
      # own TZ, read by config.alloy through sys.env(). An empty zone would
      # silently parse as UTC, so the deploy refuses to start without one.
      CLICKHOUSE_TZ: ${CLICKHOUSE_TZ:?set from [[TZ]] in stack.toml}
    volumes:
      - /opt/komodo-periphery/etc-komodo/repos/podhaus-bandicoot/logging/bandicoot/alloy-conf:/etc/alloy:ro
      - /opt/komodo-periphery/etc-komodo/repos/podhaus-bandicoot/logging/alloy-modules:/etc/alloy-modules:ro
      # Files Alloy tails on this host (see config.alloy): ClickHouse's
      # error log and the systemd journal.
      - /var/lib/clickstack/clickhouse-logs:/var/log/podhaus/clickhouse:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
