[[stack]]
name = "logging"
description = "Victoria Logs + Alloy + Grafana — centralised logs (bilby)"
tags = ["podhaus"]
deploy = true

[stack.config]
server = "podhaus"
files_on_host = true
run_directory = "/etc/komodo/repo/logging/bilby"
file_paths = ["../compose.shared.yaml", "compose.yaml"]

environment = """
TZ=[[TZ]]
PODHAUS_REPO=[[PODHAUS_REPO]]
"""
