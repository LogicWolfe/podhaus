[[stack]]
name = "logging"
description = "Alloy log collector on bilby, shipping to ClickStack"
tags = ["podhaus"]

[stack.config]
server = "podhaus"
files_on_host = true
run_directory = "/etc/komodo/repo/logging/bilby"
file_paths = ["compose.yaml", "../compose.shared.yaml"]

environment = """
PODHAUS_REPO=[[PODHAUS_REPO]]
CLICKSTACK_INGESTION_KEY=[[OP__KOMODO__CLICKSTACK_INGESTION_KEY__CREDENTIAL]]
BANDICOOT_LAN_IPV4=[[OP__KOMODO__PODHAUS_LAN_ADDRESSES__BANDICOOT_IPV4]]
TURN_TOUCH_BURROW_IPV4=[[OP__KOMODO__PODHAUS_LAN_ADDRESSES__TURN_TOUCH_BURROW_IPV4]]
LED_STRIP_GRASSHOPPER_IPV4=[[OP__KOMODO__PODHAUS_LAN_ADDRESSES__LED_STRIP_GRASSHOPPER_IPV4]]
"""
