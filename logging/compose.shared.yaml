# Shared service definition for the logging stack's Alloy. Each host
# stack combines its overlay with this file through `file_paths` and adds
# host-specific bits (alloy-conf bind path + per-service parsers/, and
# on bilby the rtorrent-cleanup file tail).
#
# Alloy bridges container logs to OTLP and ships to ClickStack: bilby
# in-network, kangaroo cross-LAN, and Numbat/fractal through their mTLS
# ingest paths. The
# ingestion key and endpoint live in each host's config and stack TOML.

services:
  alloy:
    container_name: alloy
    image: grafana/alloy:latest
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    environment:
      # ClickStack OTLP ingestion API key, read by config.alloy via
      # sys.env(). Generated by HyperDX at first boot; injected as a
      # secret through logging/<host>/stack.toml from 1Password.
      CLICKSTACK_INGESTION_KEY: ${CLICKSTACK_INGESTION_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - dockernet
    labels:
      autoheal: "true"
    # Alloy's base image is minimal Debian with no curl/wget/nc; we use
    # bash's /dev/tcp shortcut to test the metrics-port socket as the
    # liveness probe.
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/12345' 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  dockernet:
    external: true

volumes:
  alloy-data:
