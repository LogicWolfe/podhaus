# Shared service definition for the logging stack's Alloy. Each host
# stack combines its overlay with this file through `file_paths` and adds
# the host-specific bits: the alloy-conf bind, the shared ../alloy-modules
# bind, and the read-only binds for whatever files that host tails (Plex
# and Flood logs, the systemd journal, ClickHouse's error log).
#
# Alloy bridges container logs, tailed files and the journal to OTLP and
# ships to the ClickStack collector on bandicoot: bandicoot by container
# name, bilby, kangaroo and fractal across the home LAN in plaintext, and
# numbat, voltaire and pinelake through the mTLS ingest path. The ingestion
# key and endpoint live in each host's config and stack TOML.

# ../alloy-modules is outside every host's stack directory, so on its own
# a change there would not move STACK_CONTENT_HASH and the linked-repo
# hosts would never pull it (their clones only advance on a deploy). The
# content-hash action folds these extra paths into the stack hash.
x-podhaus-content-paths:
  - ../alloy-modules

services:
  alloy:
    container_name: alloy
    image: grafana/alloy:latest
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    environment:
      # ClickStack OTLP ingestion API key, read by config.alloy via
      # sys.env(). Generated by HyperDX at first boot; injected as a
      # secret through logging/<host>/stack.toml from 1Password.
      CLICKSTACK_INGESTION_KEY: ${CLICKSTACK_INGESTION_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - dockernet
    # The healthcheck's memory of the previous check. A tmpfs is emptied
    # on every start, so a restarted Alloy, whose counters begin again at
    # zero, is never compared with the process it replaced.
    tmpfs:
      - /run/alloy-health
    labels:
      autoheal: "true"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
    # Healthy while the exporter's requests are completing. A process can
    # keep its port open while sending nothing (docs/postmortems/2026-06-19
    # and 2026-08-08), so the check reads, from Alloy's own metrics, how
    # many HTTP requests the clickstack exporter has completed, whatever
    # their outcome, and fails when that count has not risen since the
    # previous check. Every host's config.alloy sends Alloy's own metrics
    # through that exporter every 60 s, so a working exporter completes a
    # request every minute however quiet the host's logs are.
    #
    # Completed, not delivered: while the collector or the path to it is
    # down, every request still ends (refused, unresolvable, or cut off by
    # the 30 s timeout), so the count keeps rising, Alloy is not restarted,
    # and the 30-minute retry delivers its in-memory queue once the path is
    # back. A restart would drop that queue. The count stops only when
    # requests never return, the shape of both recorded wedges: such a
    # request holds its queue worker whatever the retry budget, and with
    # every worker held the exporter sends nothing until it is restarted.
    # Autoheal restarts the container once it is unhealthy; the restart
    # drops what the wedged exporter had queued and ships some lines twice
    # (docs/logging.md#what-is-collected).
    #
    # Five failed checks a minute apart: unhealthy 5-6 minutes after the
    # last request completed, depending on where the wedge falls between
    # checks; a pause under 5 minutes never trips it.
    #
    # The image has bash but no curl, wget or nc, so the request goes
    # through bash's /dev/tcp. `$$` is Compose's escape for a literal `$`.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/12345 || exit 1
          printf 'GET /metrics HTTP/1.0\r\n\r\n' >&3
          completed=$$(awk '/^http_client_request_duration_seconds_count[{]/ && /component_id="otelcol[.]exporter[.]otlphttp[.]clickstack"/ { total += $$NF; found = 1 } END { if (found) printf "%.0f", total }' <&3)
          if [ -z "$$completed" ]; then
            echo "Alloy reports no completed requests by otelcol.exporter.otlphttp.clickstack"
            exit 1
          fi
          previous=$$(cat /run/alloy-health/completed 2>/dev/null)
          echo "$$completed" > /run/alloy-health/completed || exit 1
          echo "exporter requests completed: $$completed, at the previous check: $${previous:-none}"
          [ "$$completed" != "$$previous" ]
      interval: 60s
      timeout: 10s
      retries: 5

networks:
  dockernet:
    external: true

volumes:
  alloy-data:
