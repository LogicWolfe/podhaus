[[stack]]
name = "fractal-logging"
description = "Alloy on fractal, shipping to Bilby through the mTLS log-ingest gateway"
tags = ["fractal", "podhaus"]

[stack.config]
server = "fractal"
linked_repo = "podhaus-fractal"
run_directory = "logging/fractal"
file_paths = ["../compose.shared.yaml", "compose.yaml"]
ignore_services = ["alloy-secrets-init"]
run_build = true

environment = """
CLICKSTACK_INGESTION_KEY=[[OP__KOMODO__CLICKSTACK_INGESTION_KEY__CREDENTIAL]]
FRACTAL_CERT_B64=[[OP__KOMODO__LOG_INGEST_PKI__FRACTAL_CERT_B64]]
FRACTAL_KEY_B64=[[OP__KOMODO__LOG_INGEST_PKI__FRACTAL_KEY_B64]]
"""
