# Komodo Periphery for kookaburra (DigitalOcean droplet, syd1,
# Fedora 43 x86_64). Like kangaroo, this is the only stack on
# kookaburra that is NOT itself Komodo-managed — it has to come up
# before kookaburra can be a Komodo target. Bootstrapped via
# ./kookaburra_bootstrap from bilby.
#
# Tailscale on kookaburra IS Komodo-managed
# (tailscale/kookaburra/stack.toml). The bootstrap only does the
# initial `docker compose up` of tailscale so Periphery can join the
# tailnet; Komodo manages it thereafter. If a tailscale redeploy ever
# cuts off connectivity to bilby, SSH from bilby is the recovery path
# — same posture as Periphery itself.
#
# v2 outbound mode: Periphery dials Core over tailnet at
# ws://bilby-podnet:9120 (resolved via MagicDNS — see daemon.json on
# kookaburra). No inbound :8120 listener exposed publicly; the noise
# handshake gates auth. Host networking is no longer required since
# nothing inbound needs to be reachable.

services:
  periphery:
    container_name: komodo-periphery
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    restart: unless-stopped
    init: true
    # network_mode: host kept so the Periphery process can reach the
    # tailscale0 interface (the Periphery container would otherwise be
    # isolated to dockernet and unable to dial 100.64.0.0/10). The
    # outbound dial target resolves via MagicDNS configured at the
    # host docker daemon level.
    network_mode: host
    environment:
      # v2 PKI: noise-handshake mutual auth. periphery.key generated by
      # the bootstrap process, core.pub copied from bilby's keys volume.
      # Pubkey derived from periphery.key is the kookaburra-periphery.pub
      # committed in komodo/keys/ that Core's KOMODO_PERIPHERY_PUBLIC_KEYS
      # trusts.
      PERIPHERY_PRIVATE_KEY: file:/config/keys/periphery.key
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      # v2 outbound: Periphery dials Core over tailnet. bilby-podnet
      # resolves to bilby's tailnet IP via MagicDNS (/etc/docker/daemon.json
      # forwards container DNS to 100.100.100.100 first).
      PERIPHERY_CORE_ADDRESSES: ws://bilby-podnet:9120
      PERIPHERY_CONNECT_AS: kookaburra
      PERIPHERY_CONFIG_PATHS: /etc/komodo/periphery.config.toml
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      # Periphery state: cloned linked-repo working dirs, deployed stack
      # files, action cache. Persisted on the droplet.
      - /opt/komodo-periphery/etc-komodo:/etc/komodo
      # v2 PKI keys (private + core.pub trust). Separate bind so a
      # periphery state reset doesn't take the keys with it.
      - /opt/komodo-periphery/keys:/config/keys
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sk --max-time 5 -o /dev/null https://localhost:8120/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
