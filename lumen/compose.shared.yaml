services:
  lumen-ollama:
    image: ollama/ollama:latest
    container_name: lumen-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - lumen-models:/root/.ollama
    networks: [dockernet]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH}

  lumen-tools:
    image: lumen:local
    build:
      context: image
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_LUMEN_TOOLS}
    pull_policy: never
    restart: "no"
    command: [prepare]
    environment:
      LUMEN_UID: "1000"
      LUMEN_GID: "1000"
    volumes:
      - lumen-data:/data
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH}

  lumen-model:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://lumen-ollama:11434
    command: [pull, ordis/jina-embeddings-v2-base-code]
    networks: [dockernet]
    depends_on:
      lumen-ollama:
        condition: service_healthy
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH}

  lumen-sweep:
    image: lumen:local
    pull_policy: never
    container_name: lumen-sweep
    restart: "no"
    command: [sweep]
    security_opt: [label:disable]
    environment:
      LUMEN_UID: "1000"
      LUMEN_GID: "1000"
      LUMEN_IMAGE: lumen:local
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: /etc/podhaus
        target: /etc/podhaus
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/podhaus/docs-sources
        target: /opt/podhaus/docs-sources
        read_only: true
        bind:
          create_host_path: false
          propagation: rslave
      - lumen-data:/data
    depends_on:
      lumen-tools:
        condition: service_completed_successfully
      lumen-model:
        condition: service_completed_successfully
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH}
      podhaus.depends-on-lumen-tools: ${BUILD_HASH_LUMEN_TOOLS}

networks:
  dockernet:
    external: true
volumes:
  lumen-models:
    name: lumen-models
  lumen-data:
    name: lumen-data
