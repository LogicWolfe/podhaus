[[stack]]
name = "bilby-lumen"
description = "Local semantic search and code embeddings on Bilby"
tags = ["bilby", "podhaus"]

[stack.config]
project_name = "lumen"
server = "podhaus"
files_on_host = true
run_directory = "/etc/komodo/repo/lumen"
file_paths = ["compose.shared.yaml", "bilby/compose.yaml"]
run_build = true
auto_pull = false
ignore_services = ["lumen-tools", "lumen-model", "lumen-sweep"]
