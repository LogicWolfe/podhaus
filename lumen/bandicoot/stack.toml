[[stack]]
name = "bandicoot-lumen"
description = "Local semantic search and code embeddings on Bandicoot"
tags = ["bandicoot", "podhaus"]

[stack.config]
project_name = "lumen"
server = "bandicoot"
linked_repo = "podhaus-bandicoot"
run_directory = "lumen"
file_paths = ["compose.shared.yaml", "bandicoot/compose.yaml"]
run_build = true
auto_pull = false
ignore_services = ["lumen-tools", "lumen-model", "lumen-sweep"]
