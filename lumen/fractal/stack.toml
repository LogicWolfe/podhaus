[[stack]]
name = "fractal-lumen"
description = "Local semantic search and code embeddings on Fractal"
tags = ["fractal", "podhaus"]

[stack.config]
project_name = "lumen"
server = "fractal"
linked_repo = "podhaus-fractal"
run_directory = "lumen"
file_paths = ["compose.shared.yaml", "fractal/compose.yaml"]
run_build = true
auto_pull = false
ignore_services = ["lumen-tools", "lumen-model", "lumen-sweep"]
