[[stack]]
name = "voltaire-lumen"
description = "Local semantic search and code embeddings on Voltaire"
tags = ["voltaire", "podhaus"]

[stack.config]
project_name = "lumen"
server = "voltaire"
linked_repo = "podhaus-voltaire"
run_directory = "lumen"
file_paths = ["compose.shared.yaml", "voltaire/compose.yaml"]
run_build = true
auto_pull = false
ignore_services = ["lumen-tools", "lumen-model", "lumen-sweep"]
