[[stack]]
name = "bandicoot-relay"
description = "Outbound bandicoot SSH + mTLS HTTP origins for Numbat Pomerium"
tags = ["bandicoot", "podhaus"]

[stack.config]
server = "bandicoot"
linked_repo = "podhaus-bandicoot"
run_directory = "relay/bandicoot"
file_paths = ["compose.yaml"]
run_build = true
auto_pull = false

environment = """
RATHOLE_NOISE_REMOTE_PUBLIC_KEY=[[OP__KOMODO__RATHOLE_RELAY__NOISE_PUBLIC_KEY]]
RATHOLE_BANDICOOT_SSH_TOKEN=[[OP__KOMODO__NUMBAT_RATHOLE__BANDICOOT_SSH]]
RATHOLE_BANDICOOT_HTTP_TOKEN=[[OP__KOMODO__NUMBAT_RATHOLE__BANDICOOT_HTTP]]
"""
