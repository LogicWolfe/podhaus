# Bandicoot outbound SSH and mTLS docs origins, managed by Komodo.
services: host SSH and the local mTLS origin (bandicoot-caddy, for
# bandicoot.docs.pod.haus).
#
# This replaces the podhaus-pomerium-ssh-origin systemd unit (the last
# consumer of the script-managed origin pattern besides kangaroo's --ca-only
# branch). bandicoot sits on a foreign LAN with no route from the home
# network, so this outbound tunnel is what makes `ssh bandicoot.pod.haus`
# work at all.
services:
  bandicoot-rathole-client:
    container_name: bandicoot-rathole-client
    build:
      context: ..
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_BANDICOOT_RATHOLE_CLIENT:-unset}
    image: bandicoot-rathole:local
    pull_policy: never
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      # SELinux enforcing on Fedora Asahi Remix denies cross-label reads of
      # the bind-mounted config dir without label:disable (bilby pattern).
      - label:disable
      - no-new-privileges:true
    environment:
      RATHOLE_CONFIG_TEMPLATE: /etc/rathole/client.toml.tmpl
      RATHOLE_NOISE_REMOTE_PUBLIC_KEY: ${RATHOLE_NOISE_REMOTE_PUBLIC_KEY}
      RATHOLE_BANDICOOT_SSH_TOKEN: ${RATHOLE_BANDICOOT_SSH_TOKEN}
      RATHOLE_BANDICOOT_HTTP_TOKEN: ${RATHOLE_BANDICOOT_HTTP_TOKEN}
    volumes:
      # Directory bind, never a single file — an atomic-rename save on the
      # host would otherwise leave the container on the orphaned inode.
      - /opt/komodo-periphery/etc-komodo/repos/podhaus-bandicoot/relay/bandicoot:/etc/rathole:ro
    networks:
      - dockernet
    labels:
      autoheal: "true"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}

networks:
  dockernet:
    external: true
