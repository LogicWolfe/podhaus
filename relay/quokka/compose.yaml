# quokka rathole CLIENT — dials OUT to Numbat's control port and publishes
# two services: host SSH and the local mTLS origin (quokka-caddy, for
# quokka.docs.pod.haus).
#
# quokka lives on the home LAN, so on the LAN `ssh quokka.pod.haus`
# goes direct via the split-horizon record; this tunnel is the off-LAN path
# (ssh://quokka through Pomerium) and the only path for the docs route,
# on the fractal pattern.
services:
  quokka-rathole-client:
    container_name: quokka-rathole-client
    build:
      context: ..
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_QUOKKA_RATHOLE_CLIENT:-unset}
    image: quokka-rathole:local
    pull_policy: never
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      # SELinux enforcing on Fedora denies cross-label reads of
      # the bind-mounted config dir without label=disable (bilby pattern).
      - label=disable
      - no-new-privileges=true
    environment:
      RATHOLE_CONFIG_TEMPLATE: /etc/rathole/client.toml.tmpl
      RATHOLE_NOISE_REMOTE_PUBLIC_KEY: ${RATHOLE_NOISE_REMOTE_PUBLIC_KEY}
      RATHOLE_QUOKKA_SSH_TOKEN: ${RATHOLE_QUOKKA_SSH_TOKEN}
      RATHOLE_QUOKKA_HTTP_TOKEN: ${RATHOLE_QUOKKA_HTTP_TOKEN}
    volumes:
      # Directory bind, never a single file — an atomic-rename save on the
      # host would otherwise leave the container on the orphaned inode.
      - /opt/komodo-periphery/etc-komodo/repos/podhaus-quokka/relay/quokka:/etc/rathole:ro
    networks:
      - dockernet
    labels:
      autoheal: "true"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}

networks:
  dockernet:
    external: true
