# kookaburra rathole SERVER — public-outward (bilby dials in over the
# internet to :2333; relayed bytes flow back through that single
# connection). TLS terminates at bilby Caddy; this box only sees
# ciphertext.
services:
  rathole-server:
    container_name: rathole-server
    build:
      context: ..
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_RATHOLE_SERVER:-unset}
    image: rathole:local
    pull_policy: never
    restart: unless-stopped
    # SELinux Enforcing on Fedora 43 denies cross-label reads into the
    # bind-mounted template dir — same pattern as every bilby stack.
    security_opt:
      - label:disable
    environment:
      RATHOLE_CONFIG_TEMPLATE: /etc/rathole/server.toml.tmpl
      RATHOLE_TOKEN: ${RATHOLE_TOKEN}
      RATHOLE_NOISE_LOCAL_PRIVATE_KEY: ${RATHOLE_NOISE_LOCAL_PRIVATE_KEY}
      # Server template doesn't reference the remote pubkey, but the
      # entrypoint's envsubst list includes it harmlessly.
      RATHOLE_NOISE_REMOTE_PUBLIC_KEY: ${RATHOLE_NOISE_REMOTE_PUBLIC_KEY:-unused}
    volumes:
      # Periphery clones the linked-repo to /etc/komodo/repos/<name>/
      # *inside* its own container, which is bind-mounted from
      # /opt/komodo-periphery/etc-komodo/repos/<name>/ on the kookaburra
      # host. Docker daemon (running on the host) resolves bind sources
      # against the host filesystem, so the compose must use the HOST
      # path here — a relative `./` would be interpreted as Periphery's
      # in-container path, which Docker can't find on the host.
      # Same pattern kangaroo's stacks use (absolute path via the host
      # mount). Directory bind (never single-file) — committed template.
      - /opt/komodo-periphery/etc-komodo/repos/podhaus-kookaburra/relay/kookaburra:/etc/rathole:ro
    # Host networking: rathole needs to bind 0.0.0.0:443 + 0.0.0.0:2333
    # on the droplet's public interface.
    network_mode: host
    labels:
      autoheal: "true"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
