[[stack]]
name = "kookaburra-relay"
description = "rathole SERVER on kookaburra — public :443 (data) + :2333 (control, noise+token). bilby's rathole client dials in over the internet. TLS terminates at bilby Caddy; the droplet only ever sees ciphertext."
tags = ["kookaburra", "podhaus"]
deploy = true

[stack.config]
server = "kookaburra"
linked_repo = "podhaus"
run_directory = "relay/kookaburra"
file_paths = ["compose.yaml"]
run_build = true
auto_pull = false

environment = """
TZ=[[TZ]]
RATHOLE_TOKEN=[[OP__KOMODO__RATHOLE_RELAY__TOKEN]]
RATHOLE_NOISE_LOCAL_PRIVATE_KEY=[[OP__KOMODO__RATHOLE_RELAY__NOISE_PRIVATE_KEY]]
"""
