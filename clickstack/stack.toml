[[stack]]
name = "clickstack"
description = "ClickStack — ClickHouse + HyperDX + OTel collector + Mongo (observability backend, replaces Victoria Logs)"
tags = ["podhaus"]

[stack.config]
# Lives on bandicoot: 21 GB of local telemetry state that grows, and the
# fleet's one sustained CPU load, on the host with the NVMe and the cores
# (docs/plans/bandicoot-migration.md). Linked repo, like every stack that
# is not on bilby.
server = "bandicoot"
linked_repo = "podhaus-bandicoot"
run_directory = "clickstack"

# CLICKSTACK_INGESTION_KEY is intentionally NOT here — it's generated by
# HyperDX on first boot and consumed by Alloy (the logging stack), not by
# clickstack itself. It's added to logging/{bilby,kangaroo}/stack.toml
# after bootstrap. See docs/monitoring.html.
environment = """
TZ=[[TZ]]
# The linked-repo checkout on bandicoot, for the config.d and scripts
# binds. The global PODHAUS_REPO is bilby's deploy tree and does not apply.
PODHAUS_REPO=/opt/komodo-periphery/etc-komodo/repos/podhaus-bandicoot
EXPRESS_SESSION_SECRET=[[OP__KOMODO__CLICKSTACK_SESSION_SECRET__PASSWORD]]
CLICKHOUSE_PASSWORD=[[OP__KOMODO__CLICKSTACK_CLICKHOUSE_PASSWORD__PASSWORD]]
GATUS_OFELIA_PUSH_TOKEN=[[OP__KOMODO__GATUS_OFELIA_PUSH_TOKEN__TOKEN]]
"""
