[[stack]]
name = "onepassword"
description = "1Password Connect + komodo-op secret sync"
tags = ["podhaus"]

[stack.config]
# Lives with Core on bandicoot so komodo-op reaches komodo-core:9120 on
# dockernet and the Fenwick bot reaches op-connect-api there.
server = "bandicoot"
linked_repo = "podhaus-bandicoot"
run_directory = "onepassword"
# Komodo runs `docker compose build` before `up` so the locally-built
# komodo-op image is always present without manual pre-build. auto_pull
# disabled so Komodo doesn't try to fetch the local-only :local-arm64 tag
# from a registry. See migration doc, "Stack customization primitives".
run_build = true
auto_pull = false

environment = """
OP_CREDENTIALS=[[ONEPASSWORD_CREDENTIALS]]
OP_SERVICE_ACCOUNT_TOKEN=[[ONEPASSWORD_CONNECT_TOKEN]]
KOMODO_API_KEY=[[ONEPASSWORD_API_KEY]]
KOMODO_API_SECRET=[[ONEPASSWORD_API_SECRET]]
"""
