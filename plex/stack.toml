[[stack]]
name = "plex"
description = "Plex Media Server — local NVMe state, Pouch media + BIFs"
tags = ["podhaus"]
deploy = true

[stack.config]
server = "podhaus"
files_on_host = true
run_directory = "/etc/komodo/repo/plex"
# init-tools image built inline by the plex-preferences-init service.
# See backup/stack.toml for the same pattern.
run_build = true

environment = """
TZ=[[TZ]]
PODHAUS_REPO=[[PODHAUS_REPO]]
MEDIA_DIR=[[MEDIA_DIR]]
PLEX_ONLINE_TOKEN=[[OP__KOMODO__PLEX_ONLINE_TOKEN__CREDENTIAL]]
"""
