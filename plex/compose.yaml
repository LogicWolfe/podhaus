services:
  # Init container — renders Preferences.xml.tmpl with envsubst (filling in
  # PLEX_ONLINE_TOKEN), then runs plex-preferences.py to merge enforced
  # identity attrs (MachineIdentifier, Token, etc.) onto the existing
  # Preferences.xml — preserving everything Plex has written at runtime.
  # On first boot when no existing file exists, the script writes the
  # rendered template as the initial file. Runs once per `docker compose up`;
  # doesn't re-run on per-container restarts. Replaces komodo-start's prior
  # host-side render. See migration doc, "Stack customization primitives".
  plex-preferences-init:
    container_name: plex-preferences-init
    image: init-tools:local
    # See backup/compose.yaml for the rationale on relative vs absolute
    # build contexts (periphery-side resolution, unlike volume sources).
    build:
      context: ../init-tools
      dockerfile: Dockerfile
    pull_policy: never
    user: "0:0"
    environment:
      PLEX_ONLINE_TOKEN: ${PLEX_ONLINE_TOKEN}
    volumes:
      - ${PODHAUS_REPO}/plex/Preferences.xml.tmpl:/tmpl/Preferences.xml.tmpl:ro,z
      - ${PODHAUS_REPO}/plex/plex-preferences.py:/script/plex-preferences.py:ro,z
      - /var/lib/plex-local:/config:z
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p '/config/Library/Application Support/Plex Media Server'
        envsubst < /tmpl/Preferences.xml.tmpl > /tmp/rendered.xml
        python3 /script/plex-preferences.py /tmp/rendered.xml '/config/Library/Application Support/Plex Media Server/Preferences.xml'
        chown 1000:100 '/config/Library/Application Support/Plex Media Server/Preferences.xml'
        echo "merged Preferences.xml"
    restart: "no"

  plex:
    container_name: plex
    hostname: Bilby
    image: plexinc/pms-docker:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      plex-preferences-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
      PLEX_UID: "1000"
      PLEX_GID: "100"
      CHANGE_CONFIG_DIR_OWNERSHIP: "false"
    volumes:
      # All Plex state on local NVMe (DB, config, metadata)
      - /var/lib/plex-local:/config:z
      # Transcode scratch on local NVMe. Was a 4G tmpfs originally — RAM
      # made sense back when "all bilby state on NFS" meant disk-backed
      # transcode would have been disastrous. Post-phase-6 pivot the M1's
      # internal NVMe handles this trivially (transcoding is ~1 MB/s vs
      # 1+ GB/s available), and freeing 4 GB of RAM headroom is more
      # valuable than the theoretical RAM-vs-NVMe speed delta. Owned
      # 1000(nathan):100(users) on the host to match the Plex process's
      # uid/gid (PLEX_UID=1000 PLEX_GID=100 above).
      - /var/lib/plex-transcode:/transcode:z
      # BIFs (video scrubbing thumbnails) live on Pouch — ~183 GB
      - ${MEDIA_DIR}/plex-video-thumbnails:/config/Library/Application Support/Plex Media Server/Media/localhost
      # Media files
      - ${MEDIA_DIR}:/Users/Shared/Pouch
      # Healthcheck + ofelia scripts as a directory bind so host edits
      # propagate without restart. See flood/compose.yaml for the rationale
      # (file-level binds pin the inode at mount time; atomic-rename saves
      # detach the container's view from the host file).
      - ${PODHAUS_REPO}/plex/scripts:/scripts:ro,z
    labels:
      autoheal: "true"
      # Monthly statistics_bandwidth prune + VACUUM via ofelia (label-based
      # docker job scheduler — see ofelia/compose.yaml). Runs on the 1st
      # of each month at 05:30 AWST (cron is interpreted in the ofelia
      # container's local time, set via TZ). 05:30 sits after the nightly
      # Backrest pipeline (04:00–05:20) so today's plex backup snapshot
      # preserves the pre-cleanup state. Both fall inside the 04:00–06:00
      # dead-time window. Plex never prunes this table itself; without the
      # cleanup it grows unbounded (caused the April 2026 outage when it
      # hit 47 GB / 796M rows). Monthly cadence is plenty — the table
      # grows at ~30 rows/day so even a missed month means ~900 extra
      # rows of headroom, not gigabytes.
      ofelia.enabled: "true"
      ofelia.job-exec.plex-stats-cleanup.schedule: "30 5 1 * *"
      ofelia.job-exec.plex-stats-cleanup.command: "/scripts/stats-cleanup.sh"
    healthcheck:
      test: ["CMD", "/scripts/healthcheck.sh"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 180s
