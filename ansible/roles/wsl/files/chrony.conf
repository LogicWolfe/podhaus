# Managed by Ansible (podhaus wsl role). Replaces Fedora's packaged file,
# which never reads /etc/chrony.d, so there is no drop-in to put this in.

# The pool's volunteers are polled at chrony's default rate. Cloudflare is the
# source polled every 64 s, because the Hyper-V time driver puts the guest
# back on Windows time at every resume and chrony corrects it at its next poll.
pool 2.fedora.pool.ntp.org iburst
server time.cloudflare.com iburst maxpoll 6

# The Windows host's clock, which the guest follows. noselect keeps it in
# `chronyc sources` as a measurement without ever steering the guest to it;
# optional keeps a missing device from stopping chronyd, since time sync
# matters more than the measurement.
refclock PHC /dev/ptp_hyperv poll 3 dpoll -2 noselect optional

driftfile /var/lib/chrony/drift
ntsdumpdir /var/lib/chrony
leapseclist /usr/share/zoneinfo/leap-seconds.list
logdir /var/log/chrony

# Step at any time, not just the first three updates: the guest's clock jumps
# whenever the Windows host sleeps and wakes.
makestep 1.0 -1
