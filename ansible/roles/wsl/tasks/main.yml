# WSL2 guest specifics.
#
# A WSL guest is not a normal host in two ways that matter here:
#   - its lifecycle is owned by Windows (no real boot; an autostart task on
#     the Windows side starts the instance), and
#   - /etc/wsl.conf is read only at instance start, so a persistent config
#     change here only takes effect on the next WSL instance restart — which
#     Windows drives on its own (reboots, updates), not this role. We write
#     the config correctly by construction and apply the live equivalent
#     immediately, rather than asking the operator to force a restart.
# Interop is disabled (`[interop] enabled=false`), so nothing in this role
# can reach or drive the Windows side even if it wanted to.
---
- name: Assert this really is a WSL guest
  ansible.builtin.assert:
    that: "'microsoft' in ansible_facts['kernel'] | lower"
    fail_msg: >-
      {{ inventory_hostname }} is in the wsl role but its kernel
      ({{ ansible_facts['kernel'] }}) is not a WSL kernel.

- name: Ensure the [network] section exists in /etc/wsl.conf
  # insertafter below is a no-op if this header is missing, so the hostname
  # line would land outside any section and WSL may not parse it. Guarantee
  # the header first so the persistent write is correct by construction —
  # nothing downstream needs to prove it took effect.
  ansible.builtin.lineinfile:
    path: /etc/wsl.conf
    regexp: '^\[network\]'
    line: '[network]'
    insertafter: EOF
    state: present

- name: Set the guest hostname in /etc/wsl.conf
  # WSL rewrites /etc/hostname from this key on every instance start, so
  # hostnamectl alone does not survive. This is the persistent half.
  ansible.builtin.lineinfile:
    path: /etc/wsl.conf
    regexp: '^hostname\s*='
    line: "hostname={{ podhaus_hostname }}"
    insertafter: '^\[network\]'
    state: present
  register: wsl_hostname_conf

- name: Apply the hostname to the running instance
  # The immediate half, so the current session and anything provisioned in
  # this run already sees the right name.
  ansible.builtin.hostname:
    name: "{{ podhaus_hostname }}"

- name: Note that the persistent hostname will confirm itself naturally
  # Informational, not an action item. The running instance already has the
  # right name (task above) and the [network] header is guaranteed to exist
  # (task above), so the write is correct by construction. Windows restarts
  # WSL instances on its own routinely (reboots, updates) — that's what will
  # exercise this, with no need to force a `wsl --shutdown` just to check.
  ansible.builtin.debug:
    msg: >-
      /etc/wsl.conf changed. The persistent hostname will take effect on
      Windows' own next WSL instance restart — no action needed.
  when: wsl_hostname_conf is changed

# ---- sshd hardening ---------------------------------------------------
# The key vault that used to live here — public keys on the unencrypted
# root, so sshd can authenticate before the LUKS /home is unlocked — is now
# the fleet-wide authorized_keys role, which renders the same path on every
# host. What stays is the inbound hardening, which is a property of this
# guest's exposure (a Windows :22 forward from the LAN) rather than of the
# access policy.

- name: Harden inbound sshd on the guest
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-wsl-vault.conf
    content: |
      # Managed by Ansible (podhaus wsl role). AuthorizedKeysFile is set by
      # the authorized_keys role in 15-authorized-keys.conf.
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd for the vault

# ---- LAN DNS ----------------------------------------------------------
# [network] generateResolvConf=false means the guest keeps whatever is
# written here, so this file is ours to own. The image shipped pointing at
# public resolvers, made immutable to stop WSL rewriting it — bringup
# residue predating both that wsl.conf key and split-horizon DNS.
#
# Public resolvers cannot see the internal view. A records for LAN hosts
# exist only on the UniFi resolver (podhaus
# terraform/dns_unifi_split_horizon.tf), so bilby.pod.haus resolved to
# nothing from this guest while resolving fine from the Windows host beside
# it. One nameserver and not two on purpose: a public resolver listed as a
# second entry gets used on rotation, which turns a clean failure into
# intermittently missing internal names.

- name: Inspect the bringup resolv.conf attributes
  ansible.builtin.stat:
    path: /etc/resolv.conf
    get_attributes: true
  register: wsl_resolv_conf

- name: Clear the immutable flag from the bringup resolv.conf
  # Redundant once WSL is told not to generate the file, and it blocks the
  # write below. Gate the relative attribute operation on the actual flag;
  # ansible.builtin.file otherwise reports it changed on every run because the
  # normal extents flag remains present.
  ansible.builtin.file:
    path: /etc/resolv.conf
    attributes: "-i"
  when:
    - podhaus_wsl_resolver is defined
    - "'immutable' in wsl_resolv_conf.stat.attributes"

- name: Point the guest at the LAN resolver
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # Managed by Ansible (podhaus wsl role). The UniFi resolver serves the
      # split-horizon view of pod.haus and forwards everything else.
      nameserver {{ podhaus_wsl_resolver }}
    owner: root
    group: root
    mode: "0644"
  when: podhaus_wsl_resolver is defined

# ---- Encrypted /home unlock -------------------------------------------
# The other half of the vault above: that one gets the operator in while
# /home is locked, this one gets /home open once he is. Also hand-rolled
# ahead of Ansible (2026-07-25, from /root/setup); owned here since
# 2026-08-13.
#
# Deliberately interactive and deliberately not in /etc/crypttab: the
# passphrase lives only in Nathan's head, so the guest can restart
# unattended — as Windows makes it do — and still come up with /home shut.

- name: Provision the /home unlock command
  # /usr/local/bin and not /usr/local/sbin, which the script's own usage text
  # used to claim: Fedora ships /usr/local/sbin as a symlink to bin, so the
  # two paths are one file. Writing via the sbin name and then tidying away
  # "the other copy" would delete the command outright.
  ansible.builtin.copy:
    src: unlock-home
    dest: /usr/local/bin/unlock-home
    owner: root
    group: root
    mode: "0755"
  when: podhaus_wsl_encrypted_home | default(false)

- name: Provision the system fish config directory
  # Normally the fish package's, but the hook below is useless if it lands
  # anywhere else, so do not depend on install order to have created it.
  ansible.builtin.file:
    path: /etc/fish/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: podhaus_wsl_encrypted_home | default(false)

- name: Install the login-time /home unlock hook
  # Fires on the operator's first interactive login after an instance start,
  # unlocks, then re-execs so the session is configured as if it had begun
  # with /home present. See the file's own header for why it is a shell hook
  # rather than an sshd or PAM one. Only reached when the login shell is
  # fish; a non-fish shell falls back to running `sudo unlock-home` by hand.
  ansible.builtin.template:
    src: home-unlock.fish.j2
    dest: /etc/fish/conf.d/00-home-unlock.fish
    owner: root
    group: root
    mode: "0644"
  when: podhaus_wsl_encrypted_home | default(false)

# ---- X11 socket directory ---------------------------------------------
# WSL init (re)creates /tmp/.X11-unix -> /mnt/wslg/.X11-unix at every
# instance start, but automount is disabled on this guest so /mnt/wslg
# never exists and the link dangles. Anything needing a local X socket —
# cc-clip's Xvfb for the Codex clipboard bridge — chases it into nothing
# and fails to bind on every display number. The unit swaps the debris
# for a real sticky directory each boot, conditioned tightly so a guest
# that actually ran WSLg would keep its working link.

- name: Install the X11 socket directory unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/wsl-x11-socket-dir.service
    content: |
      [Unit]
      Description=Replace WSL's dangling WSLg X11 socket symlink with a real directory
      # The symlink is laid down by WSL init before systemd starts; make
      # sure the tmpfs /tmp is in place before touching anything under it.
      After=tmp.mount
      RequiresMountsFor=/tmp
      # Scope strictly to the broken shape: a symlink whose WSLg target is
      # absent. Skips (successfully) when WSLg is real or nothing is there.
      ConditionPathIsSymbolicLink=/tmp/.X11-unix
      ConditionPathExists=!/mnt/wslg/.X11-unix

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/bin/rm /tmp/.X11-unix
      ExecStart=/usr/bin/mkdir -m 1777 /tmp/.X11-unix

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  register: wsl_x11_unit

- name: Enable and start the X11 socket directory unit
  ansible.builtin.systemd_service:
    name: wsl-x11-socket-dir.service
    enabled: true
    state: started
    daemon_reload: "{{ wsl_x11_unit is changed }}"
