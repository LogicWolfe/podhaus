# WSL2 guest specifics.
#
# A WSL guest is not a normal host in two ways that matter here:
#   - its lifecycle is owned by Windows (no real boot; an autostart task on
#     the Windows side starts the instance), and
#   - /etc/wsl.conf is read only at instance start, so a persistent config
#     change here only takes effect on the next WSL instance restart — which
#     Windows drives on its own (reboots, updates), not this role. We write
#     the config correctly by construction and apply the live equivalent
#     immediately, rather than asking the operator to force a restart.
# Interop is disabled (`[interop] enabled=false`), so nothing in this role
# can reach or drive the Windows side even if it wanted to.
---
- name: Assert this really is a WSL guest
  ansible.builtin.assert:
    that: "'microsoft' in ansible_facts['kernel'] | lower"
    fail_msg: >-
      {{ inventory_hostname }} is in the wsl role but its kernel
      ({{ ansible_facts['kernel'] }}) is not a WSL kernel.

- name: Ensure the [network] section exists in /etc/wsl.conf
  # insertafter below is a no-op if this header is missing, so the hostname
  # line would land outside any section and WSL may not parse it. Guarantee
  # the header first so the persistent write is correct by construction —
  # nothing downstream needs to prove it took effect.
  ansible.builtin.lineinfile:
    path: /etc/wsl.conf
    regexp: '^\[network\]'
    line: '[network]'
    insertafter: EOF
    state: present

- name: Set the guest hostname in /etc/wsl.conf
  # WSL rewrites /etc/hostname from this key on every instance start, so
  # hostnamectl alone does not survive. This is the persistent half.
  ansible.builtin.lineinfile:
    path: /etc/wsl.conf
    regexp: '^hostname\s*='
    line: "hostname={{ podhaus_hostname }}"
    insertafter: '^\[network\]'
    state: present
  register: wsl_hostname_conf

- name: Apply the hostname to the running instance
  # The immediate half, so the current session and anything provisioned in
  # this run already sees the right name.
  ansible.builtin.hostname:
    name: "{{ podhaus_hostname }}"

- name: Note that the persistent hostname will confirm itself naturally
  # Informational, not an action item. The running instance already has the
  # right name (task above) and the [network] header is guaranteed to exist
  # (task above), so the write is correct by construction. Windows restarts
  # WSL instances on its own routinely (reboots, updates) — that's what will
  # exercise this, with no need to force a `wsl --shutdown` just to check.
  ansible.builtin.debug:
    msg: >-
      /etc/wsl.conf changed. The persistent hostname will take effect on
      Windows' own next WSL instance restart — no action needed.
  when: wsl_hostname_conf is changed

# ---- SSH key vault ----------------------------------------------------
# On a guest whose /home is LUKS-encrypted and unlocked manually after
# each instance start, sshd cannot read ~/.ssh/authorized_keys until the
# operator is already in — a bootstrap deadlock. The vault keeps public
# keys on the unencrypted root so SSH works pre-unlock. Predates Ansible
# (hand-rolled 2026-07-25); owned here since 2026-08-08.

- name: Provision the SSH key vault directory
  ansible.builtin.file:
    path: /etc/ssh/authorized_keys
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: podhaus_wsl_vault_keys is defined

- name: Install the operator's vaulted authorized keys
  ansible.builtin.copy:
    dest: "/etc/ssh/authorized_keys/{{ podhaus_operator }}"
    content: |
      {% for key in podhaus_wsl_vault_keys %}
      {{ key }}
      {% endfor %}
    owner: root
    group: "{{ podhaus_operator }}"
    mode: "0640"
  when: podhaus_wsl_vault_keys is defined

- name: Point sshd at the vault
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-wsl-vault.conf
    content: |
      # Public keys live outside /home so login works while /home is still locked.
      AuthorizedKeysFile /etc/ssh/authorized_keys/%u
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no
    owner: root
    group: root
    mode: "0644"
  when: podhaus_wsl_vault_keys is defined
  notify: Reload sshd for the vault

# ---- X11 socket directory ---------------------------------------------
# WSL init (re)creates /tmp/.X11-unix -> /mnt/wslg/.X11-unix at every
# instance start, but automount is disabled on this guest so /mnt/wslg
# never exists and the link dangles. Anything needing a local X socket —
# cc-clip's Xvfb for the Codex clipboard bridge — chases it into nothing
# and fails to bind on every display number. The unit swaps the debris
# for a real sticky directory each boot, conditioned tightly so a guest
# that actually ran WSLg would keep its working link.

- name: Install the X11 socket directory unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/wsl-x11-socket-dir.service
    content: |
      [Unit]
      Description=Replace WSL's dangling WSLg X11 socket symlink with a real directory
      # The symlink is laid down by WSL init before systemd starts; make
      # sure the tmpfs /tmp is in place before touching anything under it.
      After=tmp.mount
      RequiresMountsFor=/tmp
      # Scope strictly to the broken shape: a symlink whose WSLg target is
      # absent. Skips (successfully) when WSLg is real or nothing is there.
      ConditionPathIsSymbolicLink=/tmp/.X11-unix
      ConditionPathExists=!/mnt/wslg/.X11-unix

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/bin/rm /tmp/.X11-unix
      ExecStart=/usr/bin/mkdir -m 1777 /tmp/.X11-unix

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  register: wsl_x11_unit

- name: Enable and start the X11 socket directory unit
  ansible.builtin.systemd_service:
    name: wsl-x11-socket-dir.service
    enabled: true
    state: started
    daemon_reload: "{{ wsl_x11_unit is changed }}"
