# Docker engine + the host-provisioned bridge networks.
#
# Replaces the hand-rolled equivalents in numbat_bootstrap and
# kangaroo_bootstrap, and absorbed komodo-start's ensure_network — the host,
# not Komodo, owns external networks (Komodo has no CreateNetwork execution
# and Compose refuses to adopt a pre-existing external network).
---
- name: Add the Docker CE repository
  tags: [package-repositories]
  # Flavour is distro-derived (podhaus_docker_repo_flavors) so the same task
  # serves Fedora hosts and Rocky/numbat, whose cloud-init installs Docker's
  # rhel repo at this same dest — a hardcoded fedora URL would overwrite it.
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ podhaus_docker_repo_flavors[ansible_facts['distribution']] }}/docker-ce.repo"
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: "0644"
  when: podhaus_docker_engine_managed

- name: Install Docker CE
  tags: [docker-packages]
  # Gated on podhaus_docker_engine_managed: bilby runs Fedora's moby-engine
  # (pre-existing state, not part of the provisioning migration), and
  # installing docker-ce beside it would be a second engine.
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: podhaus_docker_engine_managed

- name: Assert podman is absent
  tags: [docker-packages]
  # Docker is the fleet's single container engine. voltaire arrived
  # podman-only (its dev postgres container has since been dump/restored
  # onto docker); this keeps it from creeping back on any engine-managed
  # host. dnf's remove pulls podman's own-only dependencies (conmon,
  # netavark, aardvark-dns, crun, ...) with it, so a bare presence check
  # is enough — no separate cleanup of those needed.
  ansible.builtin.dnf:
    # Fedora Workstation ships toolbox, which requires Podman. Neither is
    # part of the fleet Docker runtime; remove them in one transaction.
    name: [podman, toolbox]
    state: absent
  when: podhaus_docker_engine_managed

- name: Install the daemon-API Python bindings
  tags: [docker-packages]
  # community.docker talks to the daemon's HTTP API through requests. A task
  # of its own, outside the engine gate, because the network tasks below need
  # it on every docker host — including those whose engine this role does not
  # manage. Named here rather than shelling out to `docker network inspect ||
  # create`, so the network tasks keep their idempotency and check-mode
  # diff — the properties this layer exists to provide.
  ansible.builtin.dnf:
    name: python3-requests
    state: present

- name: Check the Windows-provided NVIDIA driver is visible in the guest
  tags: [docker-packages]
  # The GPU reaches a WSL guest through /dev/dxg and a driver stub that
  # Windows places under /usr/lib/wsl/lib. If it is missing, the toolkit
  # would install cleanly and every GPU container would then fail to start,
  # so stop here with the cause.
  ansible.builtin.stat:
    path: /usr/lib/wsl/lib/nvidia-smi
  register: podhaus_docker_wsl_nvidia_smi
  when: podhaus_docker_nvidia_gpu

- name: Assert the guest sees the GPU
  tags: [docker-packages]
  ansible.builtin.assert:
    that: podhaus_docker_wsl_nvidia_smi.stat.exists
    fail_msg: >-
      /usr/lib/wsl/lib/nvidia-smi is missing: Windows is not exposing the
      GPU to this guest. Install the NVIDIA driver on the Windows host.
  when: podhaus_docker_nvidia_gpu

- name: Add the NVIDIA container toolkit repository
  tags: [package-repositories]
  # NVIDIA's own repository, as published by the install guide. Packages are
  # unpinned: the first install takes the current stable release, and ordinary
  # `dnf upgrade` follows NVIDIA's stable channel afterwards. The file signs its
  # metadata (repo_gpgcheck) rather than each package.
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo
    dest: /etc/yum.repos.d/nvidia-container-toolkit.repo
    mode: "0644"
  when: podhaus_docker_nvidia_gpu

- name: Install the NVIDIA container toolkit
  tags: [docker-packages]
  # The four packages the install guide names. Installing them provides the
  # `nvidia-container-runtime` binary the runtime in daemon.json points at, the
  # hooks Docker's nvidia device driver looks for on PATH, and a systemd unit
  # that writes the GPU's CDI spec before docker.service starts. No Linux
  # NVIDIA driver is installed or wanted: Windows owns the driver. Docker looks
  # for those hooks only when the daemon starts, so a reinstall restarts it
  # even when daemon.json is unchanged.
  ansible.builtin.dnf:
    name:
      - nvidia-container-toolkit
      - nvidia-container-toolkit-base
      - libnvidia-container-tools
      - libnvidia-container1
    state: present
  notify: Restart docker
  when: podhaus_docker_nvidia_gpu

- name: Configure the Docker daemon
  tags: [docker-daemon]
  # `local` log driver with rotation on every podhaus host; live-restore per
  # podhaus_docker_live_restore; the `nvidia` runtime per
  # podhaus_docker_nvidia_gpu (the same entry `nvidia-ctk runtime configure`
  # writes, kept here so this template stays the only writer of the file).
  # The template's byte layout is load-bearing —
  # see templates/daemon.json.j2 before touching either. Flipping bilby to
  # live-restore is a deliberate human act in a 04:00 maintenance window (one
  # unprotected daemon restart), never a handler side effect — which is why
  # the false-render must byte-match bilby's existing file.
  #
  # Deliberately no `dns:` key — and never set per-container `dns:` in
  # compose either; that replaces 127.0.0.11 and breaks service-name
  # resolution.
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart docker

- name: Enable and start Docker
  tags: [docker-daemon]
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started

- name: Flush handlers so the daemon config is live before the network is created
  tags: [docker-daemon]
  ansible.builtin.meta: flush_handlers

- name: Add the operator to the docker group
  tags: [docker-daemon]
  ansible.builtin.user:
    name: "{{ podhaus_operator }}"
    groups: docker
    append: true

- name: Create the dockernet bridge
  # Inspect-or-create. Compose declares this `external: true` and refuses to
  # adopt a network it did not make, so the host owns it. The subnet is not
  # incidental: 172.18.0.1 is the documented gateway address host-network
  # services are reached on.
  #
  # `attachable` is deliberately unspecified. docker_network treats any
  # specified-and-different option as cause to RECREATE the network, and
  # bilby's live dockernet (created flagless, so attachable=false) would be
  # torn down with every running stack still attached. Omitted options are
  # never compared — and attachable is a swarm-overlay concept anyway,
  # meaningless for the bridge driver.
  community.docker.docker_network:
    name: "{{ podhaus_dockernet_name }}"
    driver: bridge
    ipam_config:
      - subnet: "{{ podhaus_dockernet_subnet }}"
        gateway: "{{ podhaus_dockernet_gateway }}"
    state: present

- name: Create the additional host-provisioned bridge networks
  # podhaus_extra_networks: bridges that stacks reference as `external: true`
  # beyond dockernet (bilby: the two fenwick nets). Labels only — no ipam and
  # no attachable, because the live networks carry auto-assigned subnets
  # (fenwick: 172.27/172.28) that must stand; specifying different ipam would
  # recreate them under running containers, and nothing depends on specific
  # ranges (services resolve by name).
  community.docker.docker_network:
    name: "{{ item.name }}"
    driver: bridge
    labels: "{{ item.labels }}"
    state: present
  loop: "{{ podhaus_extra_networks }}"
  loop_control:
    label: "{{ item.name }}"
