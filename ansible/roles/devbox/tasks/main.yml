---
- name: Add the HashiCorp repository
  tags: [package-repositories]
  # Not Fedora's repos (Terraform was dropped after the 2023 BSL relicense)
  # and not OpenTofu — podhaus Terraform state must stay compatible with
  # stock HashiCorp Terraform, which any machine is expected to run.
  ansible.builtin.get_url:
    url: https://rpm.releases.hashicorp.com/fedora/hashicorp.repo
    dest: /etc/yum.repos.d/hashicorp.repo
    mode: "0644"

- name: Install development packages
  ansible.builtin.dnf:
    name:
      - golang
      - nodejs
      - terraform
      - glow
    state: present

- name: Permit the clipboard SSH reverse tunnel under SELinux
  tags: [clipboard-tunnel]
  when: ansible_facts.selinux.status == 'enabled'
  block:
    - name: Install SELinux port management support
      ansible.builtin.dnf:
        name: policycoreutils-python-utils
        state: present

    - name: Label the clipboard tunnel port for SSH
      community.general.seport:
        ports: "18339"
        proto: tcp
        setype: ssh_port_t
        state: present

# Any SSH session on the host may now forward to any unreserved port, which
# is the point on a development machine: tunnels to its dev services.
- name: Permit SSH local forwards to development ports under SELinux
  tags: [ssh-local-forward]
  when: ansible_facts.selinux.status == 'enabled'
  block:
    - name: Install the SELinux module compiler
      ansible.builtin.dnf:
        name: checkpolicy
        state: present

    - name: Place the SSH local-forward policy module source
      ansible.builtin.copy:
        src: podhaus_ssh_local_forward.te
        dest: /etc/selinux/podhaus_ssh_local_forward.te
        owner: root
        group: root
        mode: "0644"
      register: devbox_ssh_local_forward_te

    - name: List loaded SELinux modules
      ansible.builtin.command: semodule -l
      register: devbox_selinux_modules
      changed_when: false
      check_mode: false

    - name: Build and load the SSH local-forward policy module
      when: >-
        devbox_ssh_local_forward_te.changed or
        'podhaus_ssh_local_forward' not in devbox_selinux_modules.stdout_lines
      ansible.builtin.shell: |
        set -eu
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        checkmodule -M -m -o "$work/podhaus_ssh_local_forward.mod" /etc/selinux/podhaus_ssh_local_forward.te
        semodule_package -o "$work/podhaus_ssh_local_forward.pp" -m "$work/podhaus_ssh_local_forward.mod"
        semodule -i "$work/podhaus_ssh_local_forward.pp"
      changed_when: true
