# Bring the per-user systemd manager back when it dies unexpectedly.
#
# Upstream ships user@.service with no Restart= because systemd-logind
# owns its lifecycle: logind starts it on a user's first session and
# stops it after the last one closes. That model has a hole — if the
# manager is killed while sessions are still open, logind still regards
# the user as active, so no "first session" event ever fires again and
# the failed unit is never restarted. Every user service under it
# (machine-ssh-agent, op-daemon, dbus-broker) stays dead until a human
# notices, and new logins do not repair it.
#
# 2026-08-08: a global OOM killed the manager (user@.service carries
# OOMScoreAdjust=100, which makes it a preferred victim while freeing
# almost nothing) and it sat `failed` for 2h32m across several new SSH
# logins. The dead machine-ssh-agent blocked all SSH to other hosts.
# See docs/postmortems/2026-08-08-bilby-oom-session-teardown.md
#
# on-failure, not always: a clean logout stops the unit normally and
# must not be restarted. The start-limit keeps a genuinely broken
# manager from spinning instead of surfacing the fault.

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=2s
