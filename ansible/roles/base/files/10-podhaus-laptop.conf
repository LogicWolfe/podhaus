# Installed by ansible/roles/base (podhaus_is_laptop). Do not edit on the host.
#
# A laptop that is also a fleet host must never leave the network because its
# lid closed or nobody touched it. Every lid handling variant is ignored, on
# battery and on power, docked or not, and the idle action is off. Suspend is
# also masked at the unit level (see the role), so a desktop session's own
# idle policy cannot sleep the machine either.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
