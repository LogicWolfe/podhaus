# NFS-bind hardening for a host whose containers bind the QNAP shares
# (Pouch at /mnt/pouch, Jump at /mnt/jump). Absorbed
# bilby/host-systemd/install.sh (deleted).
#
# Every task here exists because an outage proved it necessary. Layered
# defence, keeping a QNAP outage visible, recoverable, and incapable of
# silently writing container data to local disk:
#
#   1. wait-for-qnap-nfs.service holds docker.service start until TCP/2049
#      on the QNAP responds (or 180 s timeout — then docker starts anyway
#      and individual NFS-bind containers fail loudly via their sentinel
#      healthchecks). dockerd's boot-time container fanout is what fired
#      the automount burst after the 2026-05-30 power outage.
#   2. The docker.service.d drop-in wires that wait into docker's startup.
#   3. StartLimit*=0 drop-ins on mnt-{pouch,jump}.automount: systemd's
#      default start-rate limit put mnt-jump.automount into
#      permanently-failed state (never auto-retried) for ~14 h on
#      2026-05-30.
#   4. chattr +i on the BARE mountpoints: with NFS unmounted, Docker's
#      auto-create of bind-source subdirs fails loudly at container start
#      instead of silently writing real data to local disk (the 2026-05-23
#      near-miss: backrest was about to write its next scheduled backup to
#      a local stub).
#   5. .podhaus-share-mounted sentinels on the real shares, so container
#      healthchecks can prove they bound the share and not a stub.
#
# Postmortems: docs/postmortems/2026-05-23-pouch-jump-mount-failure.md,
# 2026-05-30-power-outage-nfs-recovery.md, 2026-06-16-firmware-reboot-
# recovery.md (which codified 4 + 5 after a share rebuild wiped them).
---
- name: Install the QNAP reachability gate unit
  ansible.builtin.copy:
    src: wait-for-qnap-nfs.service
    dest: /etc/systemd/system/wait-for-qnap-nfs.service
    mode: "0644"
  notify: Reload systemd units

- name: Create the systemd drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - docker.service.d
    - mnt-pouch.automount.d
    - mnt-jump.automount.d

- name: Order docker.service after the reachability gate
  ansible.builtin.copy:
    src: 10-wait-for-qnap.conf
    dest: /etc/systemd/system/docker.service.d/10-wait-for-qnap.conf
    mode: "0644"
  notify: Reload systemd units

- name: Disable the start-rate limit on both automount units
  # One source file, two drop-in dirs: the units must stay identical, so
  # they are identical by construction.
  ansible.builtin.copy:
    src: 10-no-rate-limit.conf
    dest: "/etc/systemd/system/{{ item }}/10-no-rate-limit.conf"
    mode: "0644"
  loop:
    - mnt-pouch.automount.d
    - mnt-jump.automount.d
  notify: Reload systemd units

- name: Flush handlers so systemd knows the units before they are enabled
  ansible.builtin.meta: flush_handlers

- name: Enable the reachability gate
  # Enabled, not started: it is a boot-time gate; starting it now would
  # just poll a QNAP that is already up.
  ansible.builtin.systemd_service:
    name: wait-for-qnap-nfs.service
    enabled: true

- name: Set the immutable-bit tripwire on the bare mountpoints
  # The +i bit lives on the underlying btrfs inode, which NFS shadows when
  # mounted — reaching it on a live host takes a non-recursive bind mount
  # of /, a trick no Ansible module provides, so this stays a script. Its
  # output is the change contract: TRIPWIRE-SET means a bit was newly set,
  # TRIPWIRE-OK means it was already there (unchanged). The script fails
  # loudly if a bare dir has content — that is exactly the local-disk
  # contamination this tripwire exists to catch, and it needs a human.
  ansible.builtin.script: chattr-tripwire.sh
  register: nfs_tripwire
  changed_when: "'TRIPWIRE-SET' in nfs_tripwire.stdout"

- name: Provision the Forgejo directory trees
  # Forgejo keeps SQLite/config on local NVMe and repositories on Jump.
  # Both sides are provisioned here so a fresh host has the exact ownership
  # the rootless image and QNAP's all_squash mapping expect (uid 1000 /
  # gid 100). config/ is 0700, not 0750: Forgejo's runtime tightens the
  # dir holding app.ini's secrets itself, and asserting anything looser
  # would flip-flop against it on every run.
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "1000"
    group: "100"
    mode: "{{ item.mode | default('0750') }}"
  loop:
    - path: /var/lib/forgejo
    - path: /var/lib/forgejo/data
    - path: /var/lib/forgejo/data/log
    - path: /var/lib/forgejo/config
      mode: "0700"
    - path: /mnt/jump/forgejo
    - path: /mnt/jump/forgejo/repositories
    - path: /mnt/jump/forgejo/lfs
    - path: /mnt/jump/forgejo/attachments
    - path: /mnt/jump/forgejo/repo-archives
  loop_control:
    label: "{{ item.path }}"

- name: Touch the share sentinels
  # One .podhaus-share-mounted per NFS bind-source subpath, written ON the
  # share (touching the path triggers the automount). preserve/preserve
  # keeps re-runs at changed=0. A missing parent means the share is
  # unmounted or the subpath was never provisioned — that fails loudly
  # rather than warn-and-continue. Keep this list in sync with NFS binds
  # (AGENTS.md: drop a marker when you add one); a share rebuild wipes the
  # markers, and re-running this play is what restores them.
  ansible.builtin.file:
    path: "{{ item }}/.podhaus-share-mounted"
    state: touch
    modification_time: preserve
    access_time: preserve
  loop:
    - /mnt/pouch
    - /mnt/jump
    - /mnt/jump/backups
    - /mnt/jump/paperless
    - /mnt/jump/paperless/documents
    - /mnt/jump/plex-video-thumbnails
    - /mnt/jump/forgejo
