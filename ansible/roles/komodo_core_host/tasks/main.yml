# Host prerequisites for Komodo Core itself (not Periphery — see
# komodo_periphery for that). Moved out of komodo-start so that script
# needs no sudo and touches nothing but Komodo. Creates only the PKI keys
# dir now — bilby's /etc/komodo/ssl belongs to its own Periphery root and
# already exists there; it was never this role's to create on any other
# host.
---
- name: Create the v2 PKI keys directory
  # Private keys for Core and every Periphery live here; pubkeys are
  # mirrored in komodo/keys/*.pub. Owned by the operator, not root: the
  # komodo_periphery role reads key material from this directory on the
  # control node with become: false, and 0700 already keeps everyone else
  # out.
  ansible.builtin.file:
    path: /opt/komodo/keys
    state: directory
    owner: "{{ podhaus_operator }}"
    group: "{{ podhaus_operator }}"
    mode: "0700"
