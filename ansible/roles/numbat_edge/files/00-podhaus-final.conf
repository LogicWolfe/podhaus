# Managed by Ansible (podhaus numbat_edge role). CA trust lives in
# 00-podhaus-pomerium-ca.conf (sshd_pomerium_ca role), AuthorizedKeysFile in
# 15-authorized-keys.conf (authorized_keys role) — this file is only what is
# numbat-specific: the loopback bind and inbound hardening.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
ListenAddress 127.0.0.1:22
