---
- name: Reload sshd
  # Reload, never restart: reloads do not drop established connections, so
  # the session running this playbook survives a bad edit long enough to fix it.
  ansible.builtin.systemd_service:
    name: sshd
    state: reloaded
  when: ansible_service_mgr == "systemd"

- name: Apply socket-activated sshd configuration
  # macOS launchd starts sshd for each connection, so the next connection
  # reads the new drop-in without restarting Remote Login or this session.
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  when: ansible_system == "Darwin"
  listen: Reload sshd
