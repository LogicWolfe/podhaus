# Trust Pomerium's SSH user CA.
#
# Pomerium mints a short-lived certificate for the authenticated user and
# presents it to this host, so `ssh://<host>` routes work without any
# long-lived key being distributed. Without this the route authenticates
# fine at the edge and then fails at the target.
#
# Replaced bilby/host-sshd/install.sh and pomerium-ssh-origin-bootstrap
# (both deleted). kangaroo, which Ansible can't reach (QTS has no
# Python), gets the same trust from kangaroo_bootstrap's start.sh.
---
- name: Install the Pomerium SSH user CA
  # Read from 1Password, where Terraform (the CA's producer) publishes the
  # public half — the repo carries no copy to drift. The lookup runs on the
  # control node with its ambient op auth; the target needs nothing.
  ansible.builtin.copy:
    content: |
      {{ lookup('community.general.onepassword', 'Pomerium Secrets',
                field='ssh_user_ca_pub', section='Secrets', vault='Homelab') }}
    dest: /etc/ssh/pomerium-user-ca.pub
    owner: root
    group: "{{ sshd_pomerium_ca_group }}"
    mode: "0644"
    validate: ssh-keygen -l -f %s
  notify: Reload sshd

- name: Trust the CA in sshd
  # A drop-in, not an edit to sshd_config: the main file stays vendor-owned
  # and this is removable in one step.
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-podhaus-pomerium-ca.conf
    owner: root
    group: "{{ sshd_pomerium_ca_group }}"
    mode: "0644"
    content: |
      # Managed by ansible/roles/sshd_pomerium_ca. Do not edit on the host.
      TrustedUserCAKeys /etc/ssh/pomerium-user-ca.pub
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Remove the legacy CA block appended to sshd_config
  # bilby's pre-role installer (bilby/host-sshd/install.sh, deleted) wrote
  # the trust straight into sshd_config as a marker comment + directive;
  # the drop-in above replaces it. Removing it keeps the main file
  # vendor-owned again. Matches nothing on hosts that never had the
  # installer; changed only when the block is actually removed.
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: >-
      \n{1,2}# --- podhaus: Pomerium SSH user CA ---\nTrustedUserCAKeys /etc/ssh/pomerium-user-ca\.pub\n
    replace: "\n"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Verify sshd accepts the resulting configuration
  # Belt-and-braces beyond the per-file validate: proves the *combined*
  # config parses before a reload can lock anyone out.
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
