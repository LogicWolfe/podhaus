---
- name: Install earlyoom
  ansible.builtin.dnf:
    name: earlyoom
    state: present

- name: Configure earlyoom thresholds and avoid list
  ansible.builtin.copy:
    src: earlyoom
    dest: /etc/default/earlyoom
    mode: "0644"
  notify: Restart earlyoom

- name: Run earlyoom
  ansible.builtin.systemd_service:
    name: earlyoom.service
    enabled: true
    state: started

# Fedora's preset enables systemd-oomd; bilby was installed without it. It
# stays as the distribution's late backstop behind earlyoom.
- name: Keep systemd-oomd at Fedora's default
  ansible.builtin.systemd_service:
    name: systemd-oomd.service
    enabled: true
    state: started
