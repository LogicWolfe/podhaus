# fractal — Fedora 44 under WSL2 on a Windows desktop (Ryzen 9 9950X3D).
#
# Both a podhaus host and Nathan's remote development machine, so it takes
# Ansible (machine state) and chezmoi (user state) together.
---
# The split-horizon name (podhaus terraform/dns_unifi_split_horizon.tf),
# which on the LAN resolves to the WINDOWS host; Windows forwards only :22
# into the guest. The guest's own address (172.19.x/20) is WSL NAT and
# unreachable from the LAN. Terraform is the only owner of the IP — Ansible
# rides the name, so a re-address is a Terraform change alone. Runs are
# LAN-only by construction: off-LAN the name does not resolve at all.
ansible_host: fractal.pod.haus
ansible_user: nathan

# WSL2 specifics -------------------------------------------------------
podhaus_is_wsl: true

# The image ships as `fedora-wsl`. Renamed so the machine's identity is
# consistent everywhere it surfaces: the chezmoi machine-key filename
# (id_fractal.pub), Alloy's `host` log label, the Komodo server name, and
# the rathole service names. Persisted in /etc/wsl.conf; a running instance
# also gets it applied immediately.
podhaus_hostname: fractal

# The machine identity. There is no TPM and no USB passthrough in this
# guest (verified: /dev/tpm* absent, /sys/class/tpm empty, no USB devices
# exposed), so unlike bilby (YubiKey PIV) and voltaire (TPM) this is a soft
# ed25519 key on the LUKS-encrypted /home. chezmoi mints and holds it —
# Ansible only installs the tooling, never key material.
#
# An earlier ~/.ssh/id_ was minted a minute before this
# one, while the guest still answered to its pre-rename hostname, and it was
# registered with Pomerium and left there — a drifted duplicate that no agent
# ever served. Deregistered 2026-08-13; this is the live identity, and the
# agent is the check: machine-ssh-agent-load derives the filename from the
# hostname, so `ssh-add -L` on the host is always the authority.
podhaus_machine_key: >-
  ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGc4palJ9QLWwFABcbyHKXNUvrTRpKdAkqATs8Bmr5xW
  fractal machine key

# The UniFi gateway, which serves the split-horizon view of pod.haus. The
# guest's public resolvers could not see it, so LAN hostnames resolved from
# the Windows host but not from inside WSL. Routes fine over WSL NAT.
podhaus_wsl_resolver: 10.0.0.1

# /home is a LUKS volume on a separate VHDX, unlocked by hand once per WSL
# instance start. Nothing stores the passphrase, so an unattended restart
# leaves it locked on purpose. This turns on both halves of the wsl role's
# handling: the `unlock-home` command and the login hook that runs it.
podhaus_wsl_encrypted_home: true

# Development machine ---------------------------------------------------
# Nathan clones what he works on; nothing here manufactures a repo manifest
# that would immediately drift from reality. The docs server serves whatever
# is present.
podhaus_repos_dir: /home/nathan/repos

# Direct Forgejo origin for the Actions protocol. The public address traverses
# Pomerium and correctly redirects unauthenticated browser-shaped traffic;
# runner registration keeps git.pod.haus as TLS SNI but resolves it to Bilby's
# internal Caddy. This address is Terraform-owned in UniFi.
podhaus_forgejo_internal_address: 10.0.0.119

# Komodo Periphery ------------------------------------------------------
# Outbound v2: Periphery dials Core, so nothing listens publicly. Same
# contract numbat uses.
podhaus_periphery_dir: /opt/komodo-periphery
podhaus_periphery_connect_as: fractal
podhaus_periphery_core_address: wss://core-connect.pod.haus
