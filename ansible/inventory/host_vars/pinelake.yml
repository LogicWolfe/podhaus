# pinelake — M1 Mac mini at Nathan's dad's home.
---
ansible_host: home.pinelake.haus
ansible_user: baxter@pinelake
ansible_python_interpreter: /usr/bin/python3

podhaus_operator: baxter
podhaus_timezone: America/Edmonton
podhaus_docker_become: false
podhaus_docker_home: /Users/baxter
podhaus_docker_cli: /opt/homebrew/bin/docker
podhaus_periphery_dir: /Users/Shared/Podhaus/periphery
podhaus_periphery_owner: baxter
podhaus_periphery_group: staff
sshd_pomerium_ca_group: wheel

# The public hostname is canonical while the Pomerium route selector rides the
# SSH username (user@route), matching numbat and voltaire. OS-account work uses
# podhaus_operator.
