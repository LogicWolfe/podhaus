# bandicoot — Apple Silicon MacBook Pro on Fedora Asahi Remix 44 (aarch64,
# 16 KiB kernel pages). Runtime host and Nathan's development machine.
---
# The split-horizon name (podhaus terraform/dns_unifi_split_horizon.tf),
# which on the LAN resolves to the USB Ethernet adapter's UniFi-reserved
# address. Terraform is the only owner of the IP — Ansible rides the name,
# so a re-address is a Terraform change alone. Off-LAN the name does not
# resolve, so runs are LAN-only by construction, as fractal's are. The
# adapter is a Realtek RTL8153 (1 GbE; Asahi has no Thunderbolt) named
# enu1u4 after its USB port, so it must stay in that port. Wi-Fi is left
# connected but is not a management path: its MAC is randomised and
# nothing is reserved for it.
ansible_host: bandicoot.pod.haus
ansible_user: nathan
podhaus_hostname: bandicoot

# A MacBook, so the lid will be closed and nobody will be at the keyboard
# for weeks. The base role ignores the lid switch, turns off idle action
# and masks the sleep targets so neither logind nor the GNOME session can
# take the host off the network. Power draw with the lid shut is the
# accepted cost of a laptop being a runtime host.
podhaus_is_laptop: true

# The USB Ethernet adapter and the dock hub it hangs off are pinned out of
# USB runtime suspend; a suspended link is an unplugged one for a host
# whose management path and fixed IP live on that adapter. Vendor/product
# IDs from the USB tree, so the rule follows the device across ports.
podhaus_usb_autosuspend_exempt:
  - vendor: 0bda
    product: "8153"
    comment: Realtek RTL8153 USB gigabit Ethernet
  - vendor: 05e3
    product: "0626"
    comment: Genesys Logic USB 3.1 hub in the dock

# Fresh engine, live-restore from day one. SELinux remains enforcing;
# the bind-mount stacks explicitly carry label:disable.
podhaus_docker_engine_managed: true
podhaus_docker_live_restore: true

# User checkouts stay user state; Ansible exposes read-only docs slots.
podhaus_repos_dir: /home/nathan/repos
podhaus_docs_sources:
  - name: home
    source: /home/nathan/repos
    required_path: .
  - name: chezmoi
    source: /home/nathan/.local/share/chezmoi
    required_path: .git

# Outbound Periphery uses the fleet defaults and this inventory hostname.
podhaus_periphery_dir: /opt/komodo-periphery

# The machine identity: YubiKey 5C PIV slot 9a (ECCP256), hardware-resident
# and served by machine-ssh-agent, exactly bilby's arrangement. There is no
# TPM on Apple Silicon under Asahi, so without the YubiKey this would have
# been a soft key on an unencrypted /home; with it, the only secret on disk
# is the PIV PIN in ~/.config/machine-ssh/pin, which is inert without the
# token. The management key is stored on the YubiKey, PIN-protected; the
# firmware (5.2.4) predates AES management keys, so it is TDES. The
# certificate in the slot is self-signed for one year (2027-09-09),
# matching bilby's; opensc reads the key regardless of validity.
podhaus_machine_key: >-
  ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEcljMJnML/KqPHE0FFmzxgK0U7eRooK3GZH1/JeGFkR82EUx9cVoVQ88BO9SvbTfX+7CA3HAQvHPtCDuNbZTfs=
  bandicoot machine key
