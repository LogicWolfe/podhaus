# bandicoot — Apple Silicon MacBook Pro on Fedora Asahi Remix 44 (aarch64,
# 16 KiB kernel pages). Runtime host, Nathan's development machine, the
# Komodo Core host, and the Ansible/Terraform control node — it
# provisions itself.
---
# The split-horizon name (podhaus terraform/dns_unifi_split_horizon.tf),
# which on the LAN resolves to the USB Ethernet adapter's UniFi-reserved
# address. Terraform is the only owner of the IP — other hosts and the
# Peripheries reach bandicoot by this name, so a re-address is a Terraform
# change alone. Off-LAN the name does not resolve, so those connections
# are LAN-only by construction, as fractal's are. The adapter is a
# Realtek RTL8153 (1 GbE; Asahi has no Thunderbolt) named enu1u4 after
# its USB port, so it must stay in that port. Wi-Fi is left connected but
# is not a management path: its MAC is randomised and nothing is
# reserved for it.
ansible_user: nathan
podhaus_hostname: bandicoot

# With connection: local, modules would otherwise run under whatever
# Python ansible itself runs from — the project's pipenv venv, which
# doesn't carry the daemon-API bindings the docker role installs as a
# SYSTEM package. Pinning the system interpreter makes local module
# execution identical to every remote host, where discovery picks
# /usr/bin/python3 anyway.
ansible_connection: local
ansible_python_interpreter: /usr/bin/python3

# A MacBook, so the lid will be closed and nobody will be at the keyboard
# for weeks. The base role ignores the lid switch, turns off idle action
# and masks the sleep targets so neither logind nor the GNOME session can
# take the host off the network. Power draw with the lid shut is the
# accepted cost of a laptop being a runtime host.
podhaus_is_laptop: true

# The USB Ethernet adapter and the dock hub it hangs off are pinned out of
# USB runtime suspend; a suspended link is an unplugged one for a host
# whose management path and fixed IP live on that adapter. Vendor/product
# IDs from the USB tree, so the rule follows the device across ports.
podhaus_usb_autosuspend_exempt:
  - vendor: 0bda
    product: "8153"
    comment: Realtek RTL8153 USB gigabit Ethernet
  - vendor: 05e3
    product: "0626"
    comment: Genesys Logic USB 3.1 hub in the dock

# Fresh engine, live-restore from day one. SELinux remains enforcing;
# the bind-mount stacks explicitly carry label:disable.
podhaus_docker_engine_managed: true
podhaus_docker_live_restore: true

# User checkouts stay user state; Ansible exposes read-only docs slots.
podhaus_repos_dir: /home/nathan/repos
podhaus_docs_sources:
  - name: home
    source: /home/nathan/repos
    required_path: .
  - name: chezmoi
    source: /home/nathan/.local/share/chezmoi
    required_path: .git

# Storage binds ---------------------------------------------------------
# The same two QNAP exports bilby binds, on the same terms (see bilby.yml
# for what the options mean), so a service moved here finds /mnt/jump and
# /mnt/pouch exactly as it left them. kangaroo exports both to every LAN
# address. Sentinels and managed directories are added per service as it
# arrives; the volume roots get a sentinel automatically.
storage_binds_mounts:
  - root: /mnt/jump
    source: "10.0.0.25:/Jump"
    fstypes: [nfs, nfs4]
    fstab_options: nfsvers=4.1,rw,nolock,soft,timeo=600,retrans=5,noatime,_netdev,nofail,x-systemd.automount
  - root: /mnt/pouch
    source: "10.0.0.25:/Pouch"
    fstypes: [nfs, nfs4]
    fstab_options: nfsvers=4.1,rw,nolock,soft,timeo=600,retrans=5,noatime,_netdev,nofail,x-systemd.automount

# bandicoot's restic repository on Jump, beside bilby's and kangaroo's;
# the sentinel is what backup/bandicoot's healthcheck proves before it
# will write there. Ownership is Jump's all_squash mapping. /mnt/pouch/Kids
# is MeTube's download target; its sentinel is what the container
# healthcheck proves before it writes there.
storage_binds_extra_sentinels:
  - /mnt/jump/backups-bandicoot
  - /mnt/pouch/Kids
storage_binds_managed_dirs:
  - path: /mnt/jump/backups-bandicoot
    owner: "1000"
    group: "100"
  # MeTube's queue state (NVMe) and scratch dir (NVMe). Owner matches
  # /mnt/pouch/Kids (uid 1000 / gid 100) so the container, which runs as
  # that uid, can write the finished download straight to Pouch.
  - path: /var/lib/metube/state
    owner: "1000"
    group: "100"
  - path: /var/lib/metube/tmp
    owner: "1000"
    group: "100"

# Both halves of both automount pairs, as on bilby.
storage_binds_rate_limit_dropin_dirs:
  - mnt-pouch.mount.d
  - mnt-pouch.automount.d
  - mnt-jump.mount.d
  - mnt-jump.automount.d

# The two fenwick-private bridges (browser-quarantine topology; rationale in
# the fenwick repo's docs/networking.html). Labels match the live networks
# exactly; subnets stay auto-assigned — see the docker role's network task
# for why they must not be specified. Copied from bilby's host_vars for the
# Fenwick family's move here; removed from bilby's once the move lands.
podhaus_extra_networks:
  - name: fenwick-net
    labels:
      fenwick.net: private
      managed-by: fenwick-repo
  - name: fenwick-webagent-net
    labels:
      fenwick.net: webagent-quarantine
      managed-by: fenwick-repo

# Forgejo Actions runner ------------------------------------------------
# The fleet's one runner lives here (moved from fractal, which now carries
# no active jobs). Registration keeps git.pod.haus as TLS SNI but resolves
# it to bilby's internal Caddy; this address is Terraform-owned in UniFi.
# Labels are the fleet's existing ones so workflows need no change; the
# images behind them are multi-arch and run natively on aarch64, which
# matches bilby, where Komodo builds the same images.
podhaus_forgejo_internal_address: 10.0.0.119

# Core runs on this host; its own Periphery dials it on the LAN name
# above rather than needing any inventory-hostname trick.
podhaus_periphery_dir: /opt/komodo-periphery

# The machine identity: YubiKey 5C PIV slot 9a (ECCP256), hardware-resident
# and served by machine-ssh-agent, exactly bilby's arrangement. There is no
# TPM on Apple Silicon under Asahi, so without the YubiKey this would have
# been a soft key on an unencrypted /home; with it, the only secret on disk
# is the PIV PIN in ~/.config/machine-ssh/pin, which is inert without the
# token. The management key is stored on the YubiKey, PIN-protected; the
# firmware (5.2.4) predates AES management keys, so it is TDES. The
# certificate in the slot is self-signed for one year (2027-09-09),
# matching bilby's; opensc reads the key regardless of validity.
podhaus_machine_key: >-
  ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEcljMJnML/KqPHE0FFmzxgK0U7eRooK3GZH1/JeGFkR82EUx9cVoVQ88BO9SvbTfX+7CA3HAQvHPtCDuNbZTfs=
  bandicoot machine key
