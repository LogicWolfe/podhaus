# podhaus fleet inventory.
#
# Every host is listed so the fleet is legible in one place, but membership
# in `provisioned` is what makes a host an actual Ansible target. Hosts
# outside that group are still bootstrapped by their existing scripts and
# are listed here as documentation until they are migrated deliberately.
#
# Adding a host is an entry here plus group membership. If onboarding a host
# ever requires a new script, this layer has failed at its one job.
---
all:
  children:
    # ---- Hosts Ansible currently manages -------------------------------
    provisioned:
      hosts:
        fractal:
        # Live check-mode pass, real run, and second-run changed=0 all
        # confirmed 2026-08-04 (docs/plans/host-provisioning-migration.md).
        # The live-restore flip landed the same day, so bilby now carries
        # the fleet-default daemon config with nothing held back.
        bilby:
        # Live pass 2026-08-08: audited check-mode deltas, real run
        # ok=43 changed=10, second run changed=0, Core reports the server
        # Ok. playbooks/numbat-bootstrap.yml is the fresh-VM path and
        # playbooks/numbat.yml the steady state (connection vars in
        # host_vars/numbat.yml — note the nathan@numbat route selector).
        numbat:

    # ---- Listed, not yet migrated --------------------------------------
    # voltaire is still owned by hand. Do not add a host to `provisioned`
    # without running the check-mode equivalence pass first (see
    # docs/plans/host-provisioning-migration.md, "Verification").
    pending_migration:
      hosts:
        voltaire:
          ansible_host: voltaire.pod.haus
          ansible_user: nathan
          podhaus_bootstrap_script: null

    # ---- Deliberately excluded -----------------------------------------
    # kangaroo (QNAP QTS) has no Python interpreter at all — verified: no
    # python3, no /opt/bin/python3, no Python QPKG; only MalwareRemover and
    # container-station are installed. Reaching it would mean `raw`-only
    # (no facts, no check mode, no idempotent modules), or installing an
    # Entware Python onto an appliance OS whose firmware auto-updates
    # periodically wipe it — see the 2026-06-16 firmware-reboot postmortem.
    # `kangaroo_bootstrap` stays the supported path. Not a gap; a decision.
    excluded:
      hosts:
        kangaroo:
          ansible_user: admin
          podhaus_bootstrap_script: kangaroo_bootstrap
      vars:
        ansible_connection: local
        ansible_host: unreachable.invalid

    # ---- Role groups ---------------------------------------------------
    # A host joins these by capability, not by name, so pinelake (and any
    # future host) inherits the right roles from membership alone.
    docker_hosts:
      hosts:
        bilby:
        fractal:
        numbat:

    komodo_periphery_hosts:
      hosts:
        fractal:
        numbat:

    # The public gateway's dual-address nftables + relay dispatcher
    # (numbat_edge role). Only numbat today; a successor gateway would
    # join here.
    edge_hosts:
      hosts:
        numbat:

    # Komodo Core itself, not Periphery — currently bilby alone, but
    # membership (not the hostname) is what site.yml gates on.
    komodo_core_hosts:
      hosts:
        bilby:

    # QNAP NFS-bind hardening (wait-for-qnap gate, automount rate-limit
    # drop-ins, the chattr +i tripwire, share sentinels). Hosts that bind
    # Pouch/Jump.
    nfs_binds_hosts:
      hosts:
        bilby:

    # Hosts running firewalld with a declarative zone/service config in
    # ansible/roles/firewalld/files/.
    firewalld_hosts:
      hosts:
        bilby:

    # Machines that are also Nathan's development environments. These get
    # chezmoi on top; Ansible provides only the system packages chezmoi
    # would otherwise need root for.
    devboxes:
      hosts:
        fractal:
