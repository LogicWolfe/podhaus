# podhaus fleet inventory.
#
# Every host is listed so the fleet is legible in one place, but membership
# in `provisioned` is what makes a host an actual Ansible target.
#
# Adding a host is an entry here plus group membership. If onboarding a host
# ever requires a new script, this layer has failed at its one job. Read
# `--check --diff` and audit every delta before the first real run against a
# host already carrying load. See docs/host-provisioning.md.
---
all:
  children:
    # ---- Hosts Ansible manages -----------------------------------------
    provisioned:
      hosts:
        # Each comment describes the host BELOW it.
        #
        # WSL2 dev guest, reached over the LAN via the Windows host's :22
        # forward (connection vars in host_vars/fractal.yml).
        fractal:
        # The control node; runs against itself (ansible_connection: local).
        bilby:
        # playbooks/numbat-bootstrap.yml is the fresh-VM path and
        # playbooks/numbat.yml the steady state (connection vars in
        # host_vars/numbat.yml — note the nathan@numbat route selector).
        numbat:
        # Reached through Pomerium; its SSH origin is the voltaire-relay
        # container, so this host has no inbound path of its own.
        voltaire:

    # ---- Deliberately excluded -----------------------------------------
    # kangaroo (QNAP QTS) has no Python interpreter at all — verified: no
    # python3, no /opt/bin/python3, no Python QPKG; only MalwareRemover and
    # container-station are installed. Reaching it would mean `raw`-only
    # (no facts, no check mode, no idempotent modules), or installing an
    # Entware Python onto an appliance OS whose firmware auto-updates
    # periodically wipe it — see the 2026-06-16 firmware-reboot postmortem.
    # `kangaroo_bootstrap` stays the supported path. Not a gap; a decision.
    excluded:
      hosts:
        kangaroo:
          ansible_user: admin
          podhaus_bootstrap_script: kangaroo_bootstrap
      vars:
        ansible_connection: local
        ansible_host: unreachable.invalid

    # ---- Role groups ---------------------------------------------------
    # A host joins these by capability, not by name, so a new host inherits
    # the right roles from membership alone.
    docker_hosts:
      hosts:
        bilby:
        fractal:
        numbat:
        voltaire:

    komodo_periphery_hosts:
      hosts:
        fractal:
        numbat:
        voltaire:

    # The public gateway's dual-address nftables + relay dispatcher
    # (numbat_edge role). Only numbat today; a successor gateway would
    # join here.
    edge_hosts:
      hosts:
        numbat:

    # Komodo Core itself, not Periphery — currently bilby alone, but
    # membership (not the hostname) is what site.yml gates on.
    komodo_core_hosts:
      hosts:
        bilby:

    # QNAP NFS-bind hardening (wait-for-qnap gate, automount rate-limit
    # drop-ins, the chattr +i tripwire, share sentinels). Hosts that bind
    # Pouch/Jump.
    nfs_binds_hosts:
      hosts:
        bilby:

    # Hosts running firewalld with a declarative zone/service config in
    # ansible/roles/firewalld/files/.
    firewalld_hosts:
      hosts:
        bilby:

    # Machines that are also Nathan's development environments. These get
    # chezmoi on top; Ansible provides only the system packages chezmoi
    # would otherwise need root for.
    devboxes:
      hosts:
        fractal:
        voltaire:

    # ---- SSH access policy ---------------------------------------------
    # Membership here is what the authorized_keys role turns into grants, so
    # these groups are the access policy — read them as "who may log in
    # where", not as a description of what a host runs.
    #
    # Distinct from `devboxes` above, which is a provisioning group (who
    # gets the devbox role). bilby is a machine Nathan develops on but does
    # not take that role, which is exactly why these cannot be the same list.

    # Nathan's development machines. They mesh: each one authorizes every
    # other one's machine key, so he can move between them directly without
    # routing through the Pomerium edge.
    remote_dev_machines:
      hosts:
        bilby:
        fractal:
        voltaire:

    # The subset that also reaches every homelab target. Nathan's MacBook
    # belongs to this set conceptually but is not an Ansible host and has no
    # machine key (machine-key-mode is none on darwin), so it participates
    # through podhaus_personal_key, which every target authorizes anyway.
    homelab_dev_machines:
      hosts:
        bilby:
        fractal:

    # Everything Komodo manages, which is the working definition of a
    # homelab target. kangaroo belongs here too — it runs containers — but
    # it is not an Ansible target (see `excluded`), so its equivalent grant
    # is applied by kangaroo_bootstrap instead.
    homelab_targets:
      hosts:
        bilby:
        fractal:
        numbat:
        voltaire:
