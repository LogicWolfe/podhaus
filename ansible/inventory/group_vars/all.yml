# Fleet-wide defaults.
---
# Every podhaus host runs on Perth time. Matches komodo/sync/variables.toml's
# TZ; declared again here because Ansible sets the *host* clock, which is
# upstream of the container TZ Komodo injects.
podhaus_timezone: Australia/Perth

# The cross-stack bridge every Komodo stack declares as `external: true`.
# Compose refuses to adopt a pre-existing external network and Komodo has no
# CreateNetwork execution, so the host must provision it — the docker role
# does, on every docker host. 172.18.0.0/16 is load-bearing: the
# service-name convention and the 172.18.0.1 gateway address both assume it.
podhaus_dockernet_name: dockernet
podhaus_dockernet_subnet: 172.18.0.0/16
podhaus_dockernet_gateway: 172.18.0.1

# The operator's OS account on every host. Distinct from ansible_user
# because the two answer different questions: podhaus_operator is who owns
# home directories, joins the docker group, and holds the Komodo keys;
# ansible_user is the SSH username, which on a Pomerium-reached host also
# carries the route selector (numbat's is nathan@numbat — Pomerium parses
# user@route, and Ansible's ssh plugin passes -o User before
# ssh_common_args, so ~/.ssh/config's User rewrite can never win). Roles
# must always use podhaus_operator for OS-account work.
podhaus_operator: nathan

# Auth to every host rides the operator's machine-key agent. It is pinned
# explicitly rather than left ambient so a future `Host *`
# IdentityAgent line in ~/.ssh/config cannot silently redirect it (the same
# trap the ssh procedure and numbat bootstrap already guard against).
ansible_ssh_common_args: >-
  -o IdentityAgent={{ lookup('env', 'SSH_AUTH_SOCK') }}
  -o ConnectTimeout=15

# ---- Fleet LAN addresses --------------------------------------------
# Terraform is the only place a home-LAN address is written down: the
# locals in podhaus terraform/lan_addresses.tf define each one, the
# unifi_client reservations beside them pin the DHCP lease that makes it
# true, and Terraform publishes the consumed subset to the 1Password item
# "Podhaus LAN Addresses". Read it back here rather than restating it, so a
# re-address is a Terraform change alone.
#
# Same channel numbat's public addresses use (host_vars/numbat.yml), and
# deliberately not DNS-derived for the same reason: the split-horizon
# records are consumers of these values, so resolving them would be
# circular. Ansible evaluates a lookup only when something references the
# variable, so a host that needs none of these pays nothing.
podhaus_bilby_ipv4: >-
  {{ lookup('community.general.onepassword', 'Podhaus LAN Addresses',
            section='LAN', field='bilby_ipv4', vault='Homelab') }}
podhaus_bandicoot_ipv4: >-
  {{ lookup('community.general.onepassword', 'Podhaus LAN Addresses',
            section='LAN', field='bandicoot_ipv4', vault='Homelab') }}
podhaus_kangaroo_ipv4: >-
  {{ lookup('community.general.onepassword', 'Podhaus LAN Addresses',
            section='LAN', field='kangaroo_ipv4', vault='Homelab') }}

# ---- SSH identities -------------------------------------------------
# Public halves live here because inventory IS Ansible's configuration
# store, and host-provisioning.md's one-producer rule already says a host
# keeps its private key and "only the public half committed or documented".
# 1Password is the channel for material that needs protecting; these need a
# single authoritative location, not secrecy. What was wrong before was six
# copies of the same literal, not the literals themselves.
#
# Per-host machine keys are declared as podhaus_machine_key in host_vars,
# beside the host that mints them. The authorized_keys role reads both
# through hostvars, so adding a machine key to a host is one line and the
# fleet's access policy follows from group membership alone.

# Nathan's personal key — the identity he connects with from anything that
# is not a fleet machine. Also injected into numbat at create time by
# Terraform (terraform/ssh_authorized_key.pub), which is upstream of
# Ansible and stays a separate copy for that reason.
podhaus_personal_key: >-
  ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIZSaoga8/dYnCgeiOSaV+3Xe5Tl6AkBpqO0T863ZajR
  Nathan personal key

# Keys granted only on a specific target. Host vars override this empty fleet
# default when a key should not become a personal or machine identity across
# the wider SSH policy.
podhaus_host_authorized_keys: []
