# Provision bandicoot: runtime host, the Komodo Core host, and the
# Ansible/Terraform control node — it provisions itself.
# Review --check --diff, apply, then require a second run with changed=0.
# chezmoi runs separately as nathan and is never invoked by this play.
---
- name: Provision bandicoot
  hosts: bandicoot
  gather_facts: true
  roles:
    - role: disk_tmp
      tags: [disk-tmp]
    - role: base
      tags: [base]
    - role: docs_sources
      tags: [docs-sources]
    - role: gnome_on_demand
      tags: [gnome-on-demand]
    - role: docker
      tags: [docker]
    - role: devbox
      tags: [devbox]
    - role: authorized_keys
      tags: [ssh]
    - role: sshd_pomerium_ca
      tags: [ssh]
    - role: storage_binds
      tags: [storage]
    - role: firewalld
      tags: [firewall]
    - role: komodo_core_host
      tags: [komodo]
    - role: komodo_periphery
      tags: [periphery]
    - role: forgejo_runner
      become: true
      tags: [forgejo-runner]
