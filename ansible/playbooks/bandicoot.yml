# Provision bandicoot from bilby under op-vault dev.
# Review --check --diff, apply, then require a second run with changed=0.
# chezmoi runs separately as nathan and is never invoked by this play.
---
- name: Provision bandicoot
  hosts: bandicoot
  gather_facts: true
  roles:
    - role: base
      tags: [base]
    - role: docs_sources
      tags: [docs-sources]
    - role: docker
      tags: [docker]
    - role: devbox
      tags: [devbox]
    - role: authorized_keys
      tags: [ssh]
    - role: sshd_pomerium_ca
      tags: [ssh]
    - role: firewalld
      tags: [firewall]
    - role: komodo_periphery
      tags: [periphery]
