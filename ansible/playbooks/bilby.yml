# Provision bilby: primary podhaus host, Komodo control node — and the
# Ansible control node, so it provisions itself (ansible_connection: local).
#
# In `provisioned`/`site.yml` since 2026-08-04 (live check-mode pass, real
# run, and second-run changed=0 all confirmed). This file stays as a
# single-host entry point — same role as playbooks/fractal.yml — for
# targeted iteration:
#   cd ansible
#   ansible-playbook playbooks/bilby.yml --check --diff   # read first
#   ansible-playbook playbooks/bilby.yml
#
# The live-restore flip is still a scheduled 04:00-window human act — until
# it happens, host_vars/bilby.yml pins podhaus_docker_live_restore: false,
# so a run outside the window must come back with the docker daemon-config
# task unchanged.
---
- name: Provision bilby
  hosts: bilby
  gather_facts: true

  roles:
    - role: docker
      tags: [docker]
    - role: sshd_pomerium_ca
      tags: [ssh]
    - role: nfs_binds
      tags: [nfs]
    - role: firewalld
      tags: [firewall]
    - role: komodo_core_host
      tags: [komodo]
