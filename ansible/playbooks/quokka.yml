# Root-owned machine state; chezmoi is applied separately as nathan.
---
- name: Provision quokka
  hosts: quokka
  gather_facts: true
  roles:
    - role: disk_tmp
      tags: [disk-tmp]
    - role: base
      tags: [base]
    - role: earlyoom
      tags: [earlyoom]
    - role: docs_sources
      tags: [docs-sources]
    - role: gnome_on_demand
      tags: [gnome-on-demand]
    - role: docker
      tags: [docker]
    - role: devbox
      tags: [devbox]
    - role: authorized_keys
      tags: [ssh]
    - role: sshd_pomerium_ca
      tags: [ssh]
    - role: sshd_liveness
      tags: [ssh]
    - role: komodo_periphery
      tags: [periphery]
