# Provision numbat: the public gateway, in steady state.
#
# Reached through Pomerium (numbat's own sshd is loopback-only; the
# ssh://numbat.pod.haus route carries the session in via the relay):
#   cd ansible
#   ansible-playbook playbooks/numbat.yml --check --diff   # read first
#   ansible-playbook playbooks/numbat.yml
#
# A single-host entry point, not a separate source of truth: numbat is in
# `provisioned`, so `site.yml` covers it too and the two are equivalent
# (`site.yml --limit numbat` reports the same changed=0). A fresh VM is
# brought to this steady state by playbooks/numbat-bootstrap.yml first.
---
- name: Provision numbat
  hosts: numbat
  gather_facts: true

  roles:
    - role: base
      tags: [base]
    - role: docker
      tags: [docker]
    - role: numbat_edge
      tags: [edge]
    - role: sshd_pomerium_ca
      tags: [ssh]
    - role: komodo_periphery
      tags: [periphery]
