# Provision fractal: podhaus host + Nathan's remote development machine.
#
# Run from any machine with the op-unlock agent active:
#   cd ansible
#   ansible-playbook playbooks/fractal.yml --check --diff   # read first
#   ansible-playbook playbooks/fractal.yml
#
# chezmoi is applied separately, by Nathan, as himself. This playbook
# deliberately does not invoke it — that would put user state under root's
# control and break the boundary the whole layer exists to draw.
---
- name: Provision fractal
  hosts: fractal
  gather_facts: true

  roles:
    - role: wsl
      tags: [wsl]
    - role: base
      tags: [base]
    - role: docker
      tags: [docker]
    - role: devbox
      tags: [devbox]
    - role: authorized_keys
      tags: [ssh]
    - role: sshd_pomerium_ca
      tags: [ssh]
    - role: komodo_periphery
      tags: [periphery]

  post_tasks:
    - name: Summarize what the operator still has to do by hand
      # These are genuinely outside Ansible's reach, not unfinished work.
      ansible.builtin.debug:
        msg: >-
          Host provisioning complete. Remaining manual steps:
          (1) run `chezmoi init --apply` as {{ podhaus_operator }} to lay down user
          state and mint the soft machine key;
          (2) register the resulting ~/.ssh/id_fractal.pub on git.pod.haus
          (LogicWolfe) and github.com (logicwolfe);
          (3) `gh auth login` for the HTTPS credential helper.
          The persistent WSL hostname (if changed this run) needs no separate
          step — it confirms itself on Windows' own next WSL restart.
