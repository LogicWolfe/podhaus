# Provision Pinelake's macOS appliance and container-runtime substrate.
#
# Run from a development machine with its machine-key agent active:
#   cd ansible
#   ansible-playbook playbooks/pinelake.yml --check --diff   # read first
#   ansible-playbook playbooks/pinelake.yml
#
# The role provisions OrbStack as the appliance runtime. It does not migrate or
# deploy Plex, Syncthing, or Flood, and it never restarts OrbStack in-band.
---
- name: Provision Pinelake appliance substrate
  hosts: pinelake
  gather_facts: true

  roles:
    - role: pinelake_macos
      tags: [macos, pinelake]
    - role: sshd_pomerium_ca
      tags: [ssh]
    - role: komodo_periphery
      tags: [periphery]
