# nb-macbook-air steady state: root SSH policy, safety assertions and the
# repository source list for the MacBook development client. Deliberately tiny — the Mac joins the
# managed development surface (machine identity, op-vault, managed SSH via
# chezmoi) but none of Podhaus runtime management.
#
# Run on the MacBook itself; the play connects locally, so managing the Mac
# needs no network path to it from another machine:
#   cd ansible
#   pipenv run ansible-playbook playbooks/nb-macbook-air.yml -K --check --diff
#   pipenv run ansible-playbook playbooks/nb-macbook-air.yml -K
# -K because escalation is Nathan's account password; the Mac has no
# passwordless sudo rule and must not gain one.
#
# chezmoi is applied separately, by Nathan, as himself — same boundary as
# every other host.
---
- name: Manage the MacBook development client
  hosts: mac_clients
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Refuse to run anywhere but on a Mac
      # The connection is local, so started on another machine this play
      # would apply the MacBook's root policy to that machine instead.
      ansible.builtin.assert:
        that: ansible_facts.system == "Darwin"
        fail_msg: Run playbooks/nb-macbook-air.yml on the MacBook itself.

  roles:
    - role: mac_ssh
      tags: [ssh]
    - role: mac_docs_sources
      tags: [docs-sources]
