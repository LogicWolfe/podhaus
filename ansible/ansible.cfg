# podhaus host provisioning.
#
# Scope: root-owned machine state only. Anything under $HOME belongs to
# chezmoi (see docs/plans/host-provisioning/index.md for the boundary).
#
# This is NOT wired into the push-to-deploy webhook and must not be. Host
# provisioning is an explicitly authorized action, like `terraform apply`.
# Komodo still owns everything containerized; these roles only place the
# host-level prerequisites a Periphery needs.

[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
host_key_checking    = True
interpreter_python   = auto_silent
# Machine state is the deliverable; a diff you can read before applying is
# the whole reason this replaced the bootstrap scripts. YAML-shaped results
# come from core's own option — the community.general.yaml callback that
# used to provide this was removed in that collection's 12.0.0.
stdout_callback      = default
result_format        = yaml
display_skipped_hosts = False
forks                = 10
retry_files_enabled  = False

[ssh_connection]
pipelining = True
# ControlPersist matters here: several roles run many small tasks against
# hosts reached through Pomerium, where connection setup is the dominant cost.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey

[privilege_escalation]
become        = True
become_method = sudo
become_ask_pass = False
