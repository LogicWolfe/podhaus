# tailscale — the management-plane fabric (tag:podnet). Host-mode +
# kernel WG so the tailscale0 interface lives on the host network
# namespace; other containers (Komodo Core, the alloy log shipper,
# Periphery on kookaburra) reach tailnet IPs through normal host
# routing — no SOCKS5/sidecar gymnastics needed.
services:
  # Active-claim cleanup. Tailscale identifies a device by its
  # machine key (held in the tailscale-state volume). Anytime that
  # volume is regenerated — droplet rebuild, accidental `docker
  # volume rm`, fresh host — the new container registers as a NEW
  # device, and the Tailscale coord server appends a `-N` suffix to
  # the bare hostname to avoid collision. The old ghost then sticks
  # around indefinitely until manually pruned in the admin UI.
  #
  # This init deletes any device whose declared `hostname` matches
  # TS_HOSTNAME (the `name` field carries Tailscale's collision-
  # resolved `-N` suffix, but `hostname` is what the node reported —
  # always the bare name) AND has been disconnected for more than
  # 60s, so the freshly-starting tailscaled can claim the bare name.
  # Best-effort: any API error becomes a warning + exit 0 (a stale
  # ghost is worse than a stale ghost AND a wedged bootstrap).
  #
  # OAuth client = the existing `Tailscale OAuth Client` 1P item,
  # scopes `auth_keys:write` (existing) + `devices:core:write` (added
  # for this cleanup). Long-lived, no 90-day rotation chore.
  #
  # The 60s threshold was chosen to be long enough that a normal
  # container restart (disconnect window typically <30s) doesn't
  # trip cleanup, but short enough that the DO droplet rebuild path
  # (destroy → create → cloud-init → bootstrap, ~2min end-to-end)
  # always finds the prior node past the threshold and prunes it
  # — otherwise the rebuilt node ends up with a `-N` suffix forever.
  # The edge case: a preserved-state stack that's been stopped >60s
  # before being started again will have its device entry deleted;
  # tailscaled re-registers automatically using TS_AUTHKEY, costing
  # only a tailnet IP change (not a real failure).
  tailscale-cleanup:
    image: init-tools:local
    # See backup/compose.yaml for the rationale on relative vs absolute
    # build contexts (periphery-side resolution, unlike volume sources).
    build:
      context: ../init-tools
      dockerfile: Dockerfile
    pull_policy: never
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME}
      TS_OAUTH_CLIENT_ID: ${TS_OAUTH_CLIENT_ID}
      TS_OAUTH_CLIENT_SECRET: ${TS_OAUTH_CLIENT_SECRET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -u
        # Best-effort: trap any error, warn, exit 0 so a transient
        # Tailscale API outage never blocks the tailscale service.
        trap 'echo "[tailscale-cleanup] WARN: cleanup error (rc=$$?). Continuing." >&2; exit 0' EXIT

        TOKEN=$$(curl -sf -X POST "https://api.tailscale.com/api/v2/oauth/token" \
          --data-urlencode "client_id=$$TS_OAUTH_CLIENT_ID" \
          --data-urlencode "client_secret=$$TS_OAUTH_CLIENT_SECRET" \
          | jq -r .access_token)
        if [ -z "$$TOKEN" ] || [ "$$TOKEN" = "null" ]; then
          echo "[tailscale-cleanup] no access_token; check OAuth client + scope"; exit 0
        fi

        DEVICES_JSON=$$(curl -sf -H "Authorization: Bearer $$TOKEN" \
          "https://api.tailscale.com/api/v2/tailnet/-/devices")
        if [ -z "$$DEVICES_JSON" ]; then
          echo "[tailscale-cleanup] device list fetch failed; exiting"; exit 0
        fi

        # Count all devices matching the declared hostname, regardless of
        # state. considered=0 + a visible ghost in admin = silent-failure
        # signal (API didn't actually return our devices).
        considered=$$(echo "$$DEVICES_JSON" \
          | jq --arg h "$$TS_HOSTNAME" '[.devices[] | select(.hostname == $$h)] | length')

        NOW=$$(date -u +%s)
        # Match on the device-reported `hostname` (always the bare
        # name we set via TS_HOSTNAME) rather than `name` (which
        # Tailscale mutates with -N collision suffixes). Disconnect
        # state is `connectedToControl == false` plus lastSeen > 60s
        # ago — sufficient buffer for a normal restart, short enough
        # that the rebuild path finds the prior node already stale.
        TARGETS=$$(mktemp)
        echo "$$DEVICES_JSON" | jq -r --arg h "$$TS_HOSTNAME" --argjson now "$$NOW" '
              .devices[]
              | select(
                  (.hostname == $$h)
                  and (.connectedToControl == false)
                  and ((.lastSeen
                        | sub("\\.[0-9]+Z$$"; "Z")
                        | fromdateiso8601) < ($$now - 60))
                )
              | "\(.id)\t\(.name)"
            ' > $$TARGETS

        # Read from a file (not a pipe) so `deleted` survives the loop —
        # ash runs the right side of a pipe in a subshell.
        deleted=0
        while IFS=$$(printf '\t') read -r id name; do
          [ -n "$$id" ] || continue
          echo "[tailscale-cleanup] deleting stale device $$name ($$id)"
          if curl -sf -X DELETE -H "Authorization: Bearer $$TOKEN" \
               "https://api.tailscale.com/api/v2/device/$$id" >/dev/null; then
            deleted=$$(( deleted + 1 ))
            echo "[tailscale-cleanup]   deleted."
          else
            echo "[tailscale-cleanup]   delete failed."
          fi
        done < $$TARGETS
        rm -f $$TARGETS

        echo "[tailscale-cleanup] done — considered=$$considered deleted=$$deleted"
        trap - EXIT
    restart: "no"

  tailscale:
    image: tailscale/tailscale:latest
    depends_on:
      tailscale-cleanup:
        condition: service_completed_successfully
    # Container name = Tailscale device name = ${TS_HOSTNAME} (set per
    # host in stack.toml: bilby-podnet, kookaburra-podnet, ...). One
    # knob, one source of truth, and `docker ps` on any host shows the
    # tailnet identity unambiguously vs the outer host.
    container_name: ${TS_HOSTNAME}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host
    volumes:
      - tailscale-state:/var/lib/tailscale
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME}
      TS_STATE_DIR: /var/lib/tailscale
      # No subnet routes, no exit-node, no Funnel. Just a tailnet node
      # tagged tag:podnet (the tag is baked into the auth key itself,
      # so no --advertise-tags needed).
      TS_USERSPACE: "false"
      # Accept Tailscale's DNS (100.100.100.100) so the host can
      # resolve MagicDNS hostnames (kookaburra, bilby-1, ...).
      # Containers on dockernet pick this up via the `dns:` field in
      # the consuming stack's compose (set explicitly to
      # 100.100.100.100). MagicDNS itself is a tailnet-wide setting in
      # the Tailscale admin (currently TF-unmanaged: OAuth client
      # needs `dns:write` to manage it as code — follow-up).
      TS_EXTRA_ARGS: "--accept-dns=true"
    restart: unless-stopped
    labels:
      autoheal: "true"

volumes:
  tailscale-state:
