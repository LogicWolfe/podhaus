[[stack]]
name = "tailscale"
description = "Tailscale management-plane node (tag:podnet) — bilby. Carries Komodo Core→Periphery + log ship-back. NOT on the rathole data path."
tags = ["podhaus"]
deploy = true

[stack.config]
server = "podhaus"
files_on_host = true
run_directory = "/etc/komodo/repo/tailscale/bilby"
file_paths = ["compose.yaml", "../compose.shared.yaml"]
# tailscale-cleanup is an init container built inline from init-tools/.
# run_build = true tells Komodo to `docker compose build` before `up`
# so init-tools:local is materialized on this Periphery.
run_build = true
# tailscale-cleanup is a one-shot init that exits 0; without this
# Komodo would count its terminated state and mark the stack
# Unhealthy. Same pattern as plex/flood/backup init containers.
ignore_services = ["tailscale-cleanup"]

environment = """
TS_AUTHKEY=[[OP__KOMODO__TAILSCALE_AUTH_KEY__CREDENTIAL]]
TS_HOSTNAME=bilby-podnet
TS_OAUTH_CLIENT_ID=[[OP__KOMODO__TAILSCALE_OAUTH_CLIENT__CLIENT_ID]]
TS_OAUTH_CLIENT_SECRET=[[OP__KOMODO__TAILSCALE_OAUTH_CLIENT__CLIENT_SECRET]]
"""
