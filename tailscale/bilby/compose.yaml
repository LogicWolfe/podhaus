# bilby tailscale node. The shared definition (../compose.shared.yaml)
# pulls everything from env; nothing host-specific to override here
# beyond what stack.toml supplies. Komodo composes both files via
# file_paths in stack.toml.
services:
  tailscale-cleanup:
    # build: must live here (not in compose.shared.yaml) — docker
    # compose resolves context relative to the first file's directory.
    build:
      context: ../../init-tools
      dockerfile: Dockerfile
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_TAILSCALE_CLEANUP:-unset}
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
  tailscale:
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
      # Recreate when the tailscale-cleanup image rebuilds (init-tools/
      # changes). The cleanup init runs against the tailscale API at
      # startup; if its image changes but tailscale itself doesn't
      # restart, the cleanup re-runs but tailscale keeps its old env.
      podhaus.depends-on-tailscale-cleanup: ${BUILD_HASH_TAILSCALE_CLEANUP:-unset}
