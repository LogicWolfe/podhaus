[[stack]]
name = "bugsink"
description = "Bugsink — self-hosted Sentry-protocol error tracker (fenwick is the intended client)"
tags = ["podhaus"]
deploy = true

[stack.config]
server = "podhaus"
files_on_host = true
run_directory = "/etc/komodo/repo/bugsink"
# bugsink-init chowns the data volume for UID 14237 then exits 0 — not
# a failure. Without this Komodo counts the exited init and marks the
# whole stack Unhealthy (a false red). See AGENTS.md.
ignore_services = ["bugsink-init"]

# SECRET_KEY + CREATE_SUPERUSER come from the 1Password Homelab items
# "Bugsink Secret Key" / "Bugsink Create Superuser", auto-synced by
# komodo-op (one Komodo Variable per 1Password field). NOTE: "Bugsink
# Create Superuser" is stored split on purpose — email in the item's
# username field, password in credential — so komodo-op emits TWO
# vars (__USERNAME, __CREDENTIAL). Bugsink's CREATE_SUPERUSER must be
# `email:password` (prestart.py raises if it has no colon), so we
# reconstruct it from both below. This expression is coupled to the
# split layout: if the 1P item is ever flattened to a single
# credential=email:password field, switch this back to a single
# [[…__CREDENTIAL]] reference (else you get a leading colon). TZ is
# seeded by komodo-start.
environment = """
TZ=[[TZ]]
BUGSINK_SECRET_KEY=[[OP__KOMODO__BUGSINK_SECRET_KEY__CREDENTIAL]]
BUGSINK_CREATE_SUPERUSER=[[OP__KOMODO__BUGSINK_CREATE_SUPERUSER__USERNAME]]:[[OP__KOMODO__BUGSINK_CREATE_SUPERUSER__CREDENTIAL]]
"""
