substitutions:
  device_name: turn-touch-burrow
  friendly_name: "Turn Touch Burrow"
  turn_touch_mac: "D0:B3:F2:63:CE:08"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Boot disconnected. Without this the link sensor sits unknown until the
  # first connect, and "never connected" would be indistinguishable from
  # "connected, not reporting" on the very metric meant to tell them apart.
  on_boot:
    - binary_sensor.template.publish:
        id: ble_link
        state: false

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# INFO keeps steady-state quiet. Raise to DEBUG to get the per-notification raw
# byte trace from the decode lambda plus ESPHome's own GATT notify lines — that
# pair is what makes a misbehaving remote diagnosable.
#
# hardware_uart is required on this board: the C3's Serial is the native
# USB-Serial/JTAG peripheral, not UART0. Attaching to it over USB resets the
# chip, though, so prefer `esphome logs --device <ip>` over serial once the
# device is on wifi.
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Exists only to carry /metrics for the Alloy scrape. The UI is incidental:
# its assets come from a CDN, so it renders only with internet, while /metrics
# is generated locally and is the part we consume. Watch `heap_free` after
# enabling — a C3 running wifi + BLE + an HTTP server is the memory-tight
# configuration, and if it destabilises this is the first thing to drop.
web_server:
  port: 80

prometheus:

# Low duty cycle: this chip is single-core, so BLE scanning contends with wifi
# for the same core. We only ever connect to one known MAC, so passive and
# infrequent is sufficient.
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 300ms
    active: false

ble_client:
  - mac_address: ${turn_touch_mac}
    id: turn_touch
    on_connect:
      - logger.log: "Turn Touch connected"
      - lambda: |-
          id(ble_connected) = true;
          id(disconnected_since_ms) = 0;
      - binary_sensor.template.publish:
          id: ble_link
          state: true
    on_disconnect:
      - logger.log: "Turn Touch disconnected"
      - lambda: |-
          id(ble_connected) = false;
          id(disconnected_since_ms) = millis();
      - binary_sensor.template.publish:
          id: ble_link
          state: false

# Link watchdog. Triggered by connection state, never by button activity: the
# remote is legitimately silent for ten hours overnight, so a press-timeout
# watchdog would have to cycle the link on a schedule and spend the remote's
# coin cell proving liveness. Connection state is a local bool on a
# mains-powered ESP32, so watching it is free, and the only thing that reaches
# the remote — the reconnect — happens only when we are already broken.
#
# esp32_ble_tracker's own auto_connect is already retrying underneath this;
# the forced disconnect/connect exists to shake ESP-IDF's GATT client out of a
# stuck state it will otherwise sit in indefinitely (observed 2026-08-09: link
# dropped during a button burst and never came back over 2.5 h while the ESP32
# stayed up and connected to HA the whole time).
#
# If the remote only advertises on a button press — unknown, and what
# `ble_reconnect_cycles` against the recovery timestamps will tell us — then no
# watchdog can beat "first press wakes it, second press works", and this
# becomes a fallback rather than the mechanism.
# 5 minutes, not 90 s. esp32_ble_tracker retries on its own roughly every 30 s
# and each attempt runs a 20 s connect timeout, so a short watchdog interval
# does not retry sooner — it aborts an attempt that is still in flight and
# leaves the GATT client in DISCONNECTING when the open event lands. This is a
# last resort behind the tracker's own retry, not a faster version of it.
#
# The fire timestamp is stamped BEFORE the disconnect rather than after the
# connect: anything that interrupts the action list after that point would
# otherwise leave the spacing unrecorded and the watchdog firing every tick.
interval:
  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              return !id(ble_connected) &&
                     (millis() - id(disconnected_since_ms)) > 300000 &&
                     (millis() - id(last_cycle_ms)) > 300000;
          then:
            - logger.log:
                level: INFO
                format: "BLE link down >5min, cycling ble_client"
            - lambda: |-
                id(last_cycle_ms) = millis();
                id(reconnect_cycles) += 1;
            - ble_client.disconnect: turn_touch
            - delay: 2s
            - ble_client.connect: turn_touch

globals:
  # Last raw payload, for duplicate suppression: the remote re-sends identical
  # notifications and each must not be read as a fresh edge.
  - id: last_byte0
    type: uint8_t
    initial_value: '0xFF'
  - id: last_byte1
    type: uint8_t
    initial_value: '0x00'
  # Buttons whose hold has already fired; their release must not also emit a press.
  - id: held
    type: uint8_t
    initial_value: '0x00'
  # Link state, mirrored from the ble_client triggers. ESPHome exposes no
  # connection entity of its own, so the triggers are the only source.
  - id: ble_connected
    type: bool
    initial_value: 'false'
  - id: disconnected_since_ms
    type: uint32_t
    initial_value: '0'
  # Liveness: any notification counts, including the duplicates the decode
  # suppresses — a repeat still proves the remote is transmitting.
  - id: last_notify_ms
    type: uint32_t
    initial_value: '0'
  - id: notify_count
    type: uint32_t
    initial_value: '0'
  - id: reconnect_cycles
    type: uint32_t
    initial_value: '0'
  # Written only by the watchdog. Spacing must not depend on
  # disconnected_since_ms, which the ble_client triggers also write.
  - id: last_cycle_ms
    type: uint32_t
    initial_value: '0'

# Free heap is the number to watch now that web_server shares the C3 with wifi
# and BLE. A downward trend here precedes the instability, rather than
# following it.
debug:
  update_interval: 60s

binary_sensor:
  - platform: template
    id: ble_link
    name: "BLE link"
    device_class: connectivity
    entity_category: diagnostic

event:
  - platform: template
    id: button_north
    name: "North"
    device_class: button
    event_types: ["press", "hold", "double"]
  - platform: template
    id: button_east
    name: "East"
    device_class: button
    event_types: ["press", "hold", "double"]
  - platform: template
    id: button_west
    name: "West"
    device_class: button
    event_types: ["press", "hold", "double"]
  - platform: template
    id: button_south
    name: "South"
    device_class: button
    event_types: ["press", "hold", "double"]

sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: turn_touch
    id: button_state
    internal: true
    service_uuid: "99c31523-dc4f-41b1-bb04-4e4deb81fadd"
    characteristic_uuid: "99c31525-dc4f-41b1-bb04-4e4deb81fadd"
    notify: true
    # Never poll. A GATT read of this characteristic returns a value unrelated to
    # button state (observed 0x40EB at rest, vs 0xFF00 on notify), which the decode
    # below would interpret as four buttons down plus three double-taps.
    update_interval: never
    # Raw bytes arrive here as std::vector<uint8_t>; on_notify would only see
    # the parsed float. Events are dispatched as a side effect and the returned
    # value is just the raw bitmask, kept internal for debugging.
    lambda: |-
      if (x.size() != 2) {
        ESP_LOGW("turn_touch", "unexpected payload size %u", (unsigned) x.size());
        return NAN;
      }
      id(notify_count)++;
      id(last_notify_ms) = millis();
      const uint8_t byte0 = x[0], byte1 = x[1];
      ESP_LOGD("turn_touch", "raw %02X %02X (prev %02X %02X, held %02X)",
               byte0, byte1, id(last_byte0), id(last_byte1), id(held));
      if (byte0 == id(last_byte0) && byte1 == id(last_byte1)) {
        ESP_LOGD("turn_touch", "  duplicate, ignored");
        return (float) byte0;
      }

      const uint8_t was_down = (uint8_t) (~id(last_byte0)) & 0x0F;
      id(last_byte0) = byte0;
      id(last_byte1) = byte1;

      const uint8_t down = (uint8_t) (~byte0) & 0x0F;
      const uint8_t doubled = ((uint8_t) (~byte0) >> 4) & 0x0F;

      for (uint8_t i = 0; i < 4; i++) {
        const uint8_t bit = 1 << i;
        const char *type = nullptr;
        if (doubled & bit) {
          type = "double";
        } else if (byte1 == 0xFF && (down & bit) && !(id(held) & bit)) {
          type = "hold";
        } else if ((was_down & bit) && !(down & bit) && !(id(held) & bit)) {
          type = "press";
        }
        if (type == nullptr)
          continue;
        ESP_LOGD("turn_touch", "  bit %u -> %s", i, type);
        switch (i) {
          case 0: id(button_north).trigger(type); break;
          case 1: id(button_east).trigger(type); break;
          case 2: id(button_west).trigger(type); break;
          case 3: id(button_south).trigger(type); break;
        }
      }

      if (byte1 == 0xFF)
        id(held) |= down;
      id(held) &= down;

      return (float) byte0;

  - platform: ble_client
    type: characteristic
    ble_client_id: turn_touch
    id: battery_level
    name: "Battery"
    service_uuid: "180F"
    characteristic_uuid: "2A19"
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    # The remote only re-samples its gauge at boot, so polling faster buys
    # nothing. It doubles as the link probe of last resort: a failed GATT read
    # publishes NAN, which is how the 2026-08-09 wedge was identified after the
    # fact. `ble_link` now reports the same thing within seconds instead of up
    # to half an hour later.
    update_interval: 30min

  - platform: wifi_signal
    name: "WiFi signal"
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  - platform: debug
    free:
      name: "Heap free"
      entity_category: diagnostic

  # Counters, not gauges: rate() over these answers "is the remote actually
  # transmitting" and "is the watchdog firing", which a point-in-time value
  # cannot.
  - platform: template
    name: "BLE notifications"
    id: ble_notifications
    entity_category: diagnostic
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return (float) id(notify_count);'

  - platform: template
    name: "BLE reconnect cycles"
    id: ble_reconnect_cycles
    entity_category: diagnostic
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return (float) id(reconnect_cycles);'

  # NAN until the first notification ever received — an unknown age is not the
  # same as a zero one, and reporting 0 would read as "just heard from it".
  - platform: template
    name: "BLE last notification age"
    id: ble_last_notify_age
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      if (id(last_notify_ms) == 0)
        return NAN;
      return (float) ((millis() - id(last_notify_ms)) / 1000);
