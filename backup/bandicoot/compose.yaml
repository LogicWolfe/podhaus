# bandicoot's backrest overlay. Extends backup/compose.shared.yaml with
# the linked-repo template binds, the SELinux opt, the restic repo on
# Jump and the source-data binds for stacks that live on bandicoot.
# Grows a bind per service as each one moves here.

services:
  backrest-init:
    build:
      context: ../init-tools
      dockerfile: Dockerfile
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_BACKREST_INIT:-unset}
    volumes:
      - /opt/komodo-periphery/etc-komodo/repos/podhaus-bandicoot/backup:/tmpl/shared:ro,z
      - /opt/komodo-periphery/etc-komodo/repos/podhaus-bandicoot/backup/bandicoot:/tmpl/host:ro,z
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
  backrest:
    security_opt:
      - label:disable
    # Overrides the shared healthcheck with the Jump sentinel check, as
    # bilby's does: the repo bind must be the real NFS share, never a stub.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9898/ > /dev/null && [ -e /repos/podhaus-bandicoot/.podhaus-share-mounted ]"]
      interval: 60s
      timeout: 10s
      retries: 15
      start_period: 30s
    volumes:
      # Restic repository on Jump (NAS SSD), its own directory beside
      # bilby's and kangaroo's; provisioned by the storage_binds role.
      - /mnt/jump/backups-bandicoot:/repos/podhaus-bandicoot
      # ClickStack HyperDX app-state: the nightly mongodump archives the
      # Ofelia job on clickstack-mongo writes. Quiescent gzip archives,
      # restic-safe. ClickHouse telemetry is deliberately not backed up.
      - /var/lib/clickstack/mongo-dumps:/userdata/clickstack/mongo:ro
      # Fenwick: the bot's SQLite (identity, activity log, guidance,
      # schedules) + the Signal device link (signal-cli account store).
      # Both irrecoverable if lost — the link additionally means a
      # human-only re-registration (fenwick docs/signal.html). Live-file
      # crash-consistent snapshots, same acceptance as the pgdata binds
      # on bilby (SQLite recovers from db+wal at open); the 04:15 slot is
      # a quiet hour for the bot. Moved from bilby's backup 2026-09-09.
      - /var/lib/fenwick:/userdata/fenwick:ro
      - /var/lib/signal-cli:/userdata/signal-cli:ro
      # Docker named volumes owned by Komodo Core and onepassword, moved
      # here from bilby. Referenced via `external: true` in the volumes
      # block below so docker can share the live data with the owning
      # container read-only.
      - komodo_postgres-data:/userdata/komodo/postgres:ro
      - komodo_ferretdb-state:/userdata/komodo/ferretdb:ro
      - onepassword_op-connect-data:/userdata/onepassword:ro
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
      podhaus.depends-on-backrest-init: ${BUILD_HASH_BACKREST_INIT:-unset}

volumes:
  # External volumes owned by other stacks — Backrest mounts them
  # read-only as backup sources. `external: true` tells compose to
  # reuse the existing volumes by name rather than creating
  # project-prefixed clones.
  komodo_postgres-data:
    external: true
  komodo_ferretdb-state:
    external: true
  onepassword_op-connect-data:
    external: true
