[[stack]]
name = "pinelake-backup"
description = "Backrest to TerraMaster restic with a Pinelake-specific OneDrive mirror"
tags = ["pinelake", "podhaus"]

[stack.config]
server = "pinelake"
linked_repo = "podhaus-pinelake"
run_directory = "backup/pinelake"
file_paths = ["compose.yaml", "../compose.shared.yaml"]
run_build = true
ignore_services = ["backrest-init"]
environment = """
TZ=[[TZ]]
RESTIC_REPO_PASSWORD=[[OP__KOMODO__RESTIC_REPO_PASSWORD__CREDENTIAL]]
RCLONE_ONEDRIVE_TOKEN_B64=[[OP__KOMODO__RCLONE_ONEDRIVE_TOKEN_PINELAKE__NOTES_B64]]
GATUS_BACKREST_PUSH_TOKEN=[[OP__KOMODO__GATUS_OFELIA_PUSH_TOKEN__TOKEN]]
GATUS_BASE_URL=https://gatus.pod.haus
GATUS_BACKREST_ENDPOINT_ID=backup_backrest-pinelake-nightly
BACKREST_INSTANCE=pinelake
"""

[stack.config.pre_deploy]
path = "/"
command = "/etc/komodo/repos/podhaus-pinelake/pinelake/periphery/predeploy-mount-gate .podhaus-backups/pinelake-restic"
