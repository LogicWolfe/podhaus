[[stack]]
name = "pinelake-backup"
description = "Local Backrest snapshots of Pinelake service state to TerraMaster"
tags = ["pinelake", "podhaus"]

[stack.config]
server = "pinelake"
linked_repo = "podhaus-pinelake"
run_directory = "backup/pinelake"
file_paths = ["../compose.shared.yaml", "compose.yaml"]
run_build = true
ignore_services = ["backrest-init"]
environment = """
TZ=America/Edmonton
RESTIC_REPO_PASSWORD=[[OP__KOMODO__RESTIC_REPO_PASSWORD__CREDENTIAL]]
BACKREST_INSTANCE=pinelake
"""

[stack.config.pre_deploy]
path = "/"
command = "/etc/komodo/repos/podhaus-pinelake/pinelake/periphery/predeploy-mount-gate .podhaus-backups/pinelake-restic"
