# Bilby's backrest overlay. Extends backup/compose.shared.yaml with
# bilby-specific bits: SELinux opt, ${PODHAUS_REPO}-rooted bind mounts
# for templates, /mnt/jump/backups bind for the bilby restic repo,
# and the full set of source-data mounts for stacks that live on bilby.
#
# Bilby's stack name is `backup`; project name = `backup`; named volumes
# (backrest-data, backrest-config, backrest-cache, backrest-rclone) are
# prefixed with `backup_`.


services:
  backrest-init:
    # Build context is resolved relative to the FIRST compose file's
    # directory, not the file the service is defined in. stack.toml has
    # file_paths = ["../compose.shared.yaml", "compose.yaml"] (shared
    # first so this overlay's healthcheck override wins per the
    # 2026-05-23 file_paths flip), so context is resolved from
    # backup/ → ../init-tools = <repo-root>/init-tools. Periphery's
    # internal docker client packages the context tarball from there.
    build:
      context: ../init-tools
      dockerfile: Dockerfile
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_BACKREST_INIT:-unset}
    volumes:
      - ${PODHAUS_REPO}/backup/rclone.conf.tmpl:/tmpl/rclone.conf.tmpl:ro,z
      - ${PODHAUS_REPO}/backup/bilby/config.json.tmpl:/tmpl/config.json.tmpl:ro,z

    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
  backrest:
    # Backrest shell hooks need docker socket access to exec into other
    # containers for live DB dumps (plex library, paperless pg, komodo pg).
    # label:disable lifts SELinux confinement for that.
    security_opt:
      - label:disable
    # Overrides the shared compose's healthcheck — adds a sentinel check
    # proving /repos/podhaus is the real Jump NFS share (not a bare-stub
    # local-disk dir from a missed mount). The 2026-05-23 incident saw
    # backrest silently restic-init a fresh empty repo on the bare stub
    # when Jump didn't auto-mount post-reboot; without this check the
    # next scheduled backup would have written real data to local disk.
    # See docs/postmortems/2026-05-23-pouch-jump-mount-failure.md.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9898/ > /dev/null && [ -e /repos/podhaus/.podhaus-share-mounted ]"]
      interval: 60s
      timeout: 10s
      # retries 15 (≈15-min patience at 60s interval): a kangaroo NFS
      # outage — every QNAP firmware auto-update reboots the NAS, dropping
      # Pouch/Jump for minutes — must ride out without autoheal restart-
      # storming this NFS-bind container. One successful probe after NFS
      # returns resets to healthy in ~60s.
      retries: 15
      start_period: 30s
    volumes:
      # Restic repository target on Jump (NAS SSD). Per the storage tier
      # rule, the backup repo lives on Jump — durable storage we'd hate
      # to lose, on a different physical drive set than Pouch's bulk media.
      - /mnt/jump/backups:/repos/podhaus

      # Source data — all read-only. Layout:
      #   /userdata/<stack>          — host bind mounts for migrated stacks
      #   /userdata/<stack>/<dir>    — nested for stacks with multiple volumes
      #
      # Host bind mounts (post-phase-6 migrated stacks):
      - /var/lib/plex-local:/userdata/plex:ro
      - /var/lib/flood-db:/userdata/flood:ro
      - /var/lib/home-assistant:/userdata/home-assistant:ro
      - /var/lib/paperless-pgdata:/userdata/paperless/pgdata:ro
      - /var/lib/paperless-data:/userdata/paperless/data:ro
      - /mnt/jump/paperless/documents:/userdata/paperless/documents:ro
      # Umami analytics Postgres — live datadir snapshot (same crash-
      # consistent restic-on-pgdata pattern as paperless/komodo above;
      # Postgres WAL-replays on restore). Local NVMe, not reproducible.
      - /var/lib/umami-pgdata:/userdata/umami/pgdata:ro
      - /var/lib/minio:/userdata/minio:ro
      # Pets engine: its SQLite DB + the MinIO bucket holding the art the DB
      # references, mounted together so one plan snapshots a consistent set
      # (the app writes an asset before the DB references it, so a combined
      # snapshot never has a dangling reference).
      - /var/lib/pets-alive:/userdata/pets:ro
      - /var/lib/minio/pets-alive-assets:/userdata/pets-assets:ro
      # ClickStack HyperDX app-state: the nightly mongodump archives
      # (ofelia job on clickstack-mongo writes /var/lib/clickstack/
      # mongo-dumps). Quiescent gzip archives — restic-safe, unlike a
      # live mongo data dir. ClickHouse telemetry is deliberately NOT
      # backed up (regenerable; see clickstack-migration/backup-and-dr).
      - /var/lib/clickstack/mongo-dumps:/userdata/clickstack/mongo:ro
      #
      # Docker named volumes from stacks that still use them (NAS squash
      # carve-out stacks + logging + onepassword). Referenced via
      # `external: true` in the volumes block below so docker can share
      # the live data with the owning container read-only.
      - komodo_postgres-data:/userdata/komodo/postgres:ro
      - komodo_ferretdb-state:/userdata/komodo/ferretdb:ro
      - onepassword_op-connect-data:/userdata/onepassword:ro
      - logging_alloy-data:/userdata/logging/alloy:ro
      # (grafana-data + victoria-logs binds removed — ClickStack
      # replaced both; ClickHouse telemetry is deliberately not backed
      # up, HyperDX app-state is the mongo-dumps plan above.)
      - gatus_gatus-data:/userdata/gatus:ro
      # Bugsink SQLite db + event storage live under /data.
      - bugsink_bugsink-data:/userdata/bugsink:ro
      # Mumble (Murmur): SQLite registered-users + channel ACLs and
      # the auto-generated server TLS cert/key. Tiny; restoring the
      # cert preserves the server fingerprint so already-trusted
      # clients don't re-prompt after a rebuild.
      - mumble_mumble-data:/userdata/mumble:ro
      # Music Assistant server state (AirPlay provider config, player
      # settings, instance id HA pairs against, library metadata). Named
      # volume from the music-assistant stack.
      - music-assistant_music-assistant-data:/userdata/music-assistant:ro
      # Pocket ID: SQLite db (pocket-id.db) + uploads under /app/data.
      # The IdP's ENCRYPTION_KEY lives in 1Password, not here — a restore
      # needs it (see docs/plans/pocket-id.md).
      - pocket-id_pocket-id-data:/userdata/pocket-id:ro

    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
      # Recreate when the backrest-init image rebuilds (init-tools/
      # changes). backrest reads the rendered config + rclone.conf that
      # backrest-init drops into its named volumes at startup; without
      # this label, an init-tools change rebuilds the init image but
      # backrest keeps using whatever config it had when it last started.
      podhaus.depends-on-backrest-init: ${BUILD_HASH_BACKREST_INIT:-unset}
volumes:
  # External volumes owned by other stacks — Backrest mounts them
  # read-only as backup sources. `external: true` tells compose to
  # reuse the existing volumes by name rather than creating
  # project-prefixed clones.
  komodo_postgres-data:
    external: true
  komodo_ferretdb-state:
    external: true
  onepassword_op-connect-data:
    external: true
  logging_alloy-data:
    external: true
  gatus_gatus-data:
    external: true
  bugsink_bugsink-data:
    external: true
  mumble_mumble-data:
    external: true
  music-assistant_music-assistant-data:
    external: true
  pocket-id_pocket-id-data:
    external: true
