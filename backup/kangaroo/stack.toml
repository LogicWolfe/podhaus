[[stack]]
name = "kangaroo-backup"
description = "Backrest + restic + rclone off-site sync (kangaroo)"
tags = ["kangaroo", "podhaus"]

[stack.config]
server = "kangaroo"
linked_repo = "podhaus"
# No per-stack webhook. The shared podhaus procedure reconciles content
# and build-context hashes in Stage 1, then handles compose-text changes
# and new stacks through Stage 2's wildcard IfChanged pass.
run_directory = "backup/kangaroo"
file_paths = ["compose.yaml", "../compose.shared.yaml"]
# init-tools image built inline by the backrest-init service via `build:`.
# See backup/bilby/stack.toml for the same pattern on bilby.
run_build = true
# `backrest-init` is a one-shot init container — see backup/bilby/stack.toml.
ignore_services = ["backrest-init"]

# Per-host environment block. Variable NAMES match bilby's stack.toml
# (the contract shared with backup/compose.shared.yaml). VALUES differ:
# kangaroo's gatus token is a separate 1P item, kangaroo's rclone OAuth
# is a separate 1P item (independent refresh-token chain to avoid race),
# and the gatus base URL points cross-LAN at bilby's published port.
environment = """
TZ=[[TZ]]
RESTIC_REPO_PASSWORD=[[OP__KOMODO__RESTIC_REPO_PASSWORD__CREDENTIAL]]
RCLONE_ONEDRIVE_TOKEN_B64=[[OP__KOMODO__RCLONE_ONEDRIVE_TOKEN_KANGAROO__NOTES_B64]]
GATUS_BACKREST_PUSH_TOKEN=[[OP__KOMODO__GATUS_BACKREST_KANGAROO_PUSH_TOKEN__TOKEN]]
GATUS_BASE_URL=http://10.0.0.119:8080
GATUS_BACKREST_ENDPOINT_ID=backup_backrest-kangaroo-nightly
BACKREST_INSTANCE=kangaroo
"""
