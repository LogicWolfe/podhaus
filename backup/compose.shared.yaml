# Shared service definition for Backrest. Each host stack combines its
# overlay with this file through `file_paths` and adds host-specific bits
# (build context, template bind-mount paths, source data binds, repo
# bind, security_opt). The contract here is the in-container env-var
# names — each host's stack.toml maps host-specific 1P-backed Komodo
# Variables onto the same names declared here. Bilby and kangaroo add
# compose.onedrive.yaml; Pinelake deliberately remains local-only.

services:
  backrest-init:
    container_name: backrest-init
    image: init-tools:local
    pull_policy: never
    user: "0:0"
    environment:
      RESTIC_REPO_PASSWORD: ${RESTIC_REPO_PASSWORD}
      GATUS_BACKREST_PUSH_TOKEN: ${GATUS_BACKREST_PUSH_TOKEN}
      GATUS_BASE_URL: ${GATUS_BASE_URL}
      GATUS_BACKREST_ENDPOINT_ID: ${GATUS_BACKREST_ENDPOINT_ID}
      GATUS_BACKREST_FORGEJO_ENDPOINT_ID: ${GATUS_BACKREST_FORGEJO_ENDPOINT_ID:-}
      # Per-plan dead-man's-switch endpoint (bilby's pets plan); empty on
      # hosts that don't set it (e.g. kangaroo has no pets plan).
      GATUS_BACKREST_PETS_ENDPOINT_ID: ${GATUS_BACKREST_PETS_ENDPOINT_ID:-}
      GATUS_BACKREST_YIAYIA_ENDPOINT_ID: ${GATUS_BACKREST_YIAYIA_ENDPOINT_ID:-}
      BACKREST_INSTANCE: ${BACKREST_INSTANCE}
    volumes:
      - backrest-config:/config
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        # Render config.json from per-host template. Every variable used
        # by config.json.tmpl must be set in this container's environment
        # — envsubst silently strips unknown $${VAR} references.
        envsubst < /tmpl/host/config.json.tmpl > /config/config.json
        chmod 600 /config/config.json
        echo "rendered /config/config.json"
    restart: "no"

    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
  backrest:
    container_name: backrest
    image: garethgeorge/backrest:latest
    restart: unless-stopped
    depends_on:
      backrest-init:
        condition: service_completed_successfully
    ports:
      # Published on each host's LAN so bilby's cloudflared can route
      # backup.pod.haus -> backrest:9898 (dockernet, bilby) and
      # kangaroo-backup.pod.haus -> the active kangaroo LAN IP:9898.
      - 9898:9898
    environment:
      BACKREST_PORT: "0.0.0.0:9898"
      BACKREST_CONFIG: /config/config.json
      BACKREST_DATA: /data
      BACKREST_RESTIC_COMMAND: /bin/restic
      XDG_CACHE_HOME: /cache
      TZ: ${TZ}
      # No RESTIC_REPOSITORY / RESTIC_PASSWORD — config.json's password
      # field (rendered from 1P) is the single source of truth. Backrest
      # 1.13.0 fail-fasts when both are set (issue #1192). For ad-hoc
      # restic CLI use Backrest's UI "Run Command" feature.
      GATUS_BACKREST_PUSH_TOKEN: ${GATUS_BACKREST_PUSH_TOKEN}
      GATUS_BASE_URL: ${GATUS_BASE_URL}
      GATUS_BACKREST_FORGEJO_ENDPOINT_ID: ${GATUS_BACKREST_FORGEJO_ENDPOINT_ID:-}
    volumes:
      # Backrest runtime state (oplog, jwt-secret, kvdb, tasklogs).
      - backrest-data:/data
      # Init-rendered config.json lives here. Backrest may rewrite the
      # file in-place on UI edits; the next deploy's init container
      # re-renders from the template, so any drift is erased — repo is
      # the source of truth.
      - backrest-config:/config
      - backrest-cache:/cache
      # Backrest backing up its own state — separate mount point so the
      # backrest-state plan targets it explicitly via /userdata/backrest-state.
      - backrest-data:/userdata/backrest-state:ro
    networks:
      - dockernet
    labels:
      autoheal: "true"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
      # Recreate when the backrest-init image rebuilds (init-tools/
      # changes). backrest-init renders config.json from the template
      # into a named volume at startup; without this label, an
      # init-tools change rebuilds the init image but backrest keeps
      # using whatever config it last started against.
      podhaus.depends-on-backrest-init: ${BUILD_HASH_BACKREST_INIT:-unset}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9898/ > /dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  dockernet:
    external: true

volumes:
  # Backrest's own state (runtime data + restic cache + rendered configs).
  # Small, latency sensitive, stay local per the post-phase-6 sizing rule.
  backrest-data:
  backrest-cache:
  backrest-config:
