x-podhaus-content-paths:
  - ../config

services:
  search-indexer:
    container_name: search-indexer
    build:
      context: .
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_SEARCH_INDEXER:-unset}
    image: search-indexer:local
    pull_policy: never
    restart: unless-stopped
    # SELinux: same label:disable pattern as every other bilby stack so the
    # bind-mounted scripts dir is readable.
    security_opt:
      - label:disable
    networks:
      - dockernet
    volumes:
      - ${PODHAUS_REPO}/search-indexer/scripts:/scripts:ro
      - search-indexer-state:/state
    environment:
      # Internal S3 API over dockernet; scoped skycroeser-net key (read HTML,
      # write /_pagefind/). Same key Publii deploys with — see stack.toml.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.search-index.schedule: "0 * * * * *"
      ofelia.job-exec.search-index.command: "/scripts/index.sh"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
    healthcheck:
      test: ["CMD-SHELL", "pidof sleep >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  dockernet:
    external: true

volumes:
  search-indexer-state:
