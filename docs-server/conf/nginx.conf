#
# nginx config for docs.pod.haus. Three jobs:
#
#   1. Serve the bind-mounted docs/ directory as static files.
#   2. Disable browser caching for HTML / JSON / Markdown so file writes
#      are immediately visible on refresh.
#   3. Expose JSON directory listings via autoindex_format under the
#      /_listing/<path>/ URL family. /_listing/         → root /docs/,
#      /_listing/runbooks/  → runbooks,  /_listing/plans/  → plans,
#      /_listing/plans/<dir>/ → nested-plan contents, and so on.
#      The site's nav.js + plan-list.js fetch these to build navigation
#      from the filesystem with no manifest to maintain.
#
# sendfile is off because some Linux distros (Fedora Asahi included) have
# historically had mmap weirdness over fuse / overlay / bind-mount combos
# where a fresh write isn't visible until the kernel page cache rotates.
# Switching to plain read() makes "save file → refresh browser → see it"
# 100% reliable. The performance cost is negligible at our scale.
#

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types {
        text/markdown md;
    }

    sendfile        off;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown application/javascript application/json image/svg+xml;

    # Compact JSON-friendly access log: one line per request, easy to grep
    # in Victoria Logs.
    log_format docs '$remote_addr "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log docs;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # No caching, anywhere, ever. The whole point of this site is
        # "save file → refresh browser → see it". Browser cache between
        # refreshes is the enemy of that workflow. Network round-trips
        # are sub-100ms on the LAN, so the cost is invisible. If perf
        # ever becomes a real problem (it won't on a homelab scale),
        # this is the lever to revisit.
        #
        # `no-store` means "do not store any version of this response,
        # period" — distinct from `no-cache` which allows storage but
        # forces revalidation. We want no-store so even a Back-button
        # navigation re-fetches fresh.
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma        "no-cache" always;
        expires    -1;

        # ---- JSON directory listings for nav + plans auto-discovery ----
        # Generic pattern: /_listing/<path>/ returns the JSON listing
        # of /usr/share/nginx/html/<path>/. Handles:
        #   /_listing/           → root of /docs/ (top-level pages + subdirs)
        #   /_listing/runbooks/  → runbook pages
        #   /_listing/plans/     → top-level plans (files and subdirs)
        #   /_listing/plans/big-plan/  → nested-plan contents
        # `index __no_index_file__` suppresses the global
        # `index index.html;` so autoindex actually fires.
        location ~ ^/_listing(/.*)?$ {
            alias /usr/share/nginx/html$1;
            autoindex on;
            autoindex_format json;
            autoindex_exact_size off;
            autoindex_localtime  on;
            index __no_index_file__;
            default_type application/json;
        }

        # Hide implementation-detail files from being served. The
        # _template.html and any future _* files are author tools, not
        # production content. Placed before the default location so the
        # 404 takes precedence.
        location ~ /_template\.html$ { return 404; }

        # Default static serve. Trailing-slash directories serve their
        # index.html; otherwise 404.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
