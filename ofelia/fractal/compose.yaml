x-podhaus-content-paths:
  - ../jobs

services:
  fractal-ofelia:
    extends:
      file: ../jobs/compose.yaml
      service: scheduler
    container_name: fractal-ofelia
    image: mcuadros/ofelia:0.4.0-beta.5
    restart: unless-stopped
    command: daemon --docker
    environment:
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - label:disable
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
