<!--
  Copy this file when adding a new doc page:
    cp docs/_template.html docs/<new-page>.html
  Then:
    1. Update <title>.
    2. Replace the <main> content.
    3. Add a link entry to docs/assets/nav.json.

  Everything else (topbar, sidebar, TOC, theme handling) is injected by
  nav.js. Styling comes from Tailwind utilities + docs/assets/style.css.
-->
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page title — podhaus docs</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/vendor/tailwind.js"></script>
  <script src="/assets/tailwind.config.js"></script>
</head>
<body class="bg-bg text-text font-sans antialiased min-h-full flex flex-col">
  <div id="topbar"></div>
  <div class="flex-1 w-full max-w-screen-2xl mx-auto flex">
    <aside id="sidebar"
      class="hidden lg:block lg:w-64 lg:shrink-0 border-r border-border lg:sticky lg:top-14 lg:h-[calc(100vh-3.5rem)] lg:overflow-y-auto">
    </aside>
    <main class="flex-1 min-w-0 px-6 lg:px-10 py-8 lg:py-10 prose dark:prose-invert max-w-prose mx-auto">
      <h1>Page title</h1>
      <p>Replace this with the page content.</p>
    </main>
    <aside id="toc"
      class="hidden xl:block xl:w-56 xl:shrink-0 xl:sticky xl:top-14 xl:h-[calc(100vh-3.5rem)]">
    </aside>
  </div>
  <script src="/assets/vendor/marked.min.js"></script>
  <script src="/assets/nav.js"></script>
</body>
</html>
