[[stack]]
name = "cloudflare-ddns"
description = "Keeps the storage.pod.haus A record on the current WAN IP — see docs/plans/minio-public-caddy.md"
tags = ["podhaus"]
deploy = true

[stack.config]
server = "podhaus"
files_on_host = true
run_directory = "/etc/komodo/repo/cloudflare-ddns"

environment = """
TZ=[[TZ]]
CLOUDFLARE_API_TOKEN=[[OP__KOMODO__CLOUDFLARE_API_TOKEN__CREDENTIAL]]
"""
