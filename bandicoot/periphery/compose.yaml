# bandicoot Komodo Periphery — v2 outbound.
#
# Bootstrap-managed (by ansible/roles/komodo_periphery), not Komodo-managed:
# Core reaches this host only through the connection this container makes, so
# a Komodo-driven redeploy of it would sever the path it runs on. Same reason
# kangaroo's, fractal's and bilby's Peripheries stay outside Komodo.
#
# Core runs on this host, so Periphery dials the LAN name the published port
# answers on instead of the internet relay every other Periphery uses — no
# internet dependency for the connection to come up. extra_hosts below is
# for linked repos on git.pod.haus (bilby's internal Caddy; the public name
# is Pomerium and redirects Git).
services:
  periphery:
    container_name: komodo-periphery
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    restart: unless-stopped
    init: true
    # SELinux is enforcing on Fedora Asahi Remix; cross-label access to
    # docker.sock and the bind-mounted config dirs needs label:disable.
    security_opt:
      - label:disable
    extra_hosts:
      - "git.pod.haus:10.0.0.119"
    environment:
      PERIPHERY_PRIVATE_KEY: file:/config/keys/periphery.key
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_CORE_ADDRESSES: ws://bandicoot.pod.haus:9120
      PERIPHERY_CONNECT_AS: bandicoot
      PERIPHERY_SERVER_ENABLED: "true"
      PERIPHERY_CONFIG_PATHS: /etc/komodo/periphery.config.toml
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /opt/komodo-periphery/etc-komodo:/etc/komodo
      - /opt/komodo-periphery/keys:/config/keys
    healthcheck:
      test: ["CMD-SHELL", "curl -sk --max-time 5 -o /dev/null https://localhost:8120/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      autoheal: "true"
