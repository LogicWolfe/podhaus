services:
  unpackerr:
    container_name: unpackerr
    image: ghcr.io/unpackerr/unpackerr:latest
    restart: unless-stopped
    # Run as flood's uid/gid so extracted files end up owned the same as
    # the RAR files rtorrent wrote. Keeps permission handling consistent
    # across the auto-extract flow.
    user: "1000:1001"
    environment:
      TZ: ${TZ}
    volumes:
      # Directory bind (not file bind) — unpackerr reads its config at
      # startup and on SIGHUP; a single-file bind would silently break
      # post-edit reloads due to inode pinning. See
      # docs/stack-conventions.html#bind-mounts.
      - ${PODHAUS_REPO}/unpackerr/conf:/config:ro,z
      - ${MEDIA_DIR}:/data
    # SELinux enforcing on Fedora Asahi denies cross-label reads of the
    # bind-mounted config; same workaround used by logging/, grafana, etc.
    security_opt:
      - label:disable
    labels:
      autoheal: "true"
    # The upstream image has no HTTP probe — but it does ship `test` (busybox
    # `[`), which is all we need: prove /data is the real Pouch NFS via the
    # sentinel file dropped on the QNAP share. A bare-stub /mnt/pouch lacks
    # the sentinel and goes red. Caught by the 2026-05-23 post-reboot
    # incident, where unpackerr silently spammed `stat /data/Movies: no such
    # file` every iteration with no health signal upstream. See
    # docs/postmortems/2026-05-23-pouch-jump-mount-failure.md.
    healthcheck:
      test: ["CMD", "test", "-e", "/data/.podhaus-share-mounted"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - dockernet

networks:
  dockernet:
    external: true
