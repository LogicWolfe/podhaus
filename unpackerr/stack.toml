[[stack]]
name = "unpackerr"
description = "Auto-extract multipart RAR torrents under /data/Movies, /data/TV, /data/Kids"
tags = ["podhaus"]
deploy = true

[stack.config]
server = "podhaus"
files_on_host = true
run_directory = "/etc/komodo/repo/unpackerr"

environment = """
TZ=[[TZ]]
MEDIA_DIR=[[MEDIA_DIR]]
PODHAUS_REPO=[[PODHAUS_REPO]]
"""
