# Unpackerr — auto-extract multipart RAR torrents in place.
#
# Folder mode only. No Sonarr/Radarr/Lidarr integration; torrents are
# managed manually in Flood. Extraction is the only operation performed
# by this container — file lifecycle is owned by rtorrent (via the
# flood/rtorrent-cleanup.sh erase hook).
#
# Watched paths recurse automatically: setting path = "/data/Kids" also
# catches /data/Kids/TV/MyFavoriteShow/episode.rar without listing each
# level.

interval = "2m"
# Quiet period after the last fsnotify event before extraction starts.
# 20s handles typical rtorrent write flushes; if a download stalls
# longer than 20s mid-transfer, we may fire a premature attempt and
# rely on retry_delay × max_retries to recover.
start_delay = "20s"
retry_delay = "5m"
max_retries = 3
parallel = 1
log_queues = "30m"

[[folder]]
path = "/data/Movies"
# Extract into the same dir as the archive, not an _unpackerred/ subfolder.
# Required for the cleanup flow: the erase-hook script deletes RAR files
# by pattern and leaves everything else in place, so the extracted content
# has to live alongside the archives to survive.
move_back = true
# Never delete. Rtorrent keeps the RARs for seeding; the erase hook
# decides when they go. delete_after=0 makes unpackerr hands-off.
delete_after = "0s"
delete_original = false
delete_files = false
disable_log = false

[[folder]]
path = "/data/TV"
move_back = true
delete_after = "0s"
delete_original = false
delete_files = false
disable_log = false

[[folder]]
path = "/data/Kids"
move_back = true
delete_after = "0s"
delete_original = false
delete_files = false
disable_log = false
