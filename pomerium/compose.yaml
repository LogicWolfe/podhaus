services:
  pomerium-secrets-init:
    build:
      context: ../init-tools
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_POMERIUM_SECRETS_INIT:-unset}
    image: init-tools:local
    pull_policy: never
    restart: "no"
    environment:
      SSH_USER_CA_KEY_B64: ${SSH_USER_CA_KEY_B64}
      SSH_HOST_KEY_B64: ${SSH_HOST_KEY_B64}
      ORIGIN_CLIENT_CERT_B64: ${ORIGIN_CLIENT_CERT_B64}
      ORIGIN_CLIENT_KEY_B64: ${ORIGIN_CLIENT_KEY_B64}
      ORIGIN_CA_CERT_B64: ${ORIGIN_CA_CERT_B64}
      SIGNING_KEY_B64: ${SIGNING_KEY_B64}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        NUMBAT_APPLICATION_IPV4="$$(getent hosts app.numbat.pod.haus | awk 'NR == 1 { print $$1 }')"
        NUMBAT_RELAY_IPV4="$$(getent hosts relay.numbat.pod.haus | awk 'NR == 1 { print $$1 }')"
        test -n "$${NUMBAT_APPLICATION_IPV4}"
        test -n "$${NUMBAT_RELAY_IPV4}"
        export NUMBAT_APPLICATION_IPV4 NUMBAT_RELAY_IPV4
        envsubst '$$NUMBAT_APPLICATION_IPV4 $$NUMBAT_RELAY_IPV4' < /source/config.yaml > /config/config.yaml
        printf '%s' "$${SSH_USER_CA_KEY_B64}" | base64 -d > /secrets/ssh-user-ca-key
        printf '%s' "$${SSH_HOST_KEY_B64}" | base64 -d > /secrets/ssh-host-key
        printf '%s' "$${ORIGIN_CLIENT_CERT_B64}" | base64 -d > /secrets/origin-client-cert.pem
        printf '%s' "$${ORIGIN_CLIENT_KEY_B64}" | base64 -d > /secrets/origin-client-key.pem
        printf '%s' "$${ORIGIN_CA_CERT_B64}" | base64 -d > /secrets/origin-ca.pem
        printf '%s' "$${SIGNING_KEY_B64}" | base64 -d > /secrets/signing-key.pem
    volumes:
      - ${NUMBAT_REPO_PATH:-/opt/komodo-periphery/etc-komodo/repos/podhaus-numbat}/pomerium:/source:ro
      - pomerium-config:/config
      - pomerium-secrets:/secrets
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}

  pomerium:
    container_name: pomerium
    image: pomerium/pomerium:latest
    restart: unless-stopped
    network_mode: host
    # Containment for memory exhaustion under scan floods (CVE-2026-50285
    # was a pre-auth zstd bomb on /.pomerium/callback, fixed in 0.32.8;
    # the box was exhausted twice in 2026-08). Normal pomerium+envoy sits
    # well under this; a runaway gets cgroup-OOM-killed and unless-stopped
    # brings it back in seconds instead of taking the 1.5 GB host down.
    mem_limit: 640m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      pomerium-secrets-init:
        condition: service_completed_successfully
    environment:
      SHARED_SECRET: ${SHARED_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      IDP_CLIENT_ID: ${IDP_CLIENT_ID}
      IDP_CLIENT_SECRET: ${IDP_CLIENT_SECRET}
      TZ: ${TZ}
    volumes:
      - pomerium-config:/pomerium:ro
      - pomerium-secrets:/run/pomerium-secrets:ro
      - pomerium-autocert:/data/autocert
    labels:
      podhaus.depends-on-pomerium-secrets-init: ${BUILD_HASH_POMERIUM_SECRETS_INIT:-unset}
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}

  ssh-auth-notify:
    container_name: ssh-auth-notify
    build:
      context: ./ssh-auth-notify
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_SSH_AUTH_NOTIFY:-unset}
    image: ssh-auth-notify:local
    pull_policy: never
    restart: unless-stopped
    # Host networking to reach the databroker gRPC ingress on 127.0.0.1:5443;
    # the docker socket feeds the route-context log follower.
    network_mode: host
    depends_on:
      pomerium:
        condition: service_started
    environment:
      SHARED_SECRET: ${SHARED_SECRET}
      AUTHENTICATE_URL: https://authenticate.pod.haus
      FENWICK_EVENT_URL: https://fenwick-events.pod.haus/events/async
      FENWICK_GATEWAY_TOKEN: ${FENWICK_EVENTS_GATEWAY_TOKEN}
      FENWICK_EVENT_TOKEN: ${FENWICK_INTERNAL_HTTP_TOKEN}
      FENWICK_DEFAULT_USER: ${FENWICK_DEFAULT_USER}
      FENWICK_USER_BY_FINGERPRINT: ${FENWICK_USER_BY_FINGERPRINT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}

volumes:
  pomerium-config:
  pomerium-secrets:
  pomerium-autocert:
