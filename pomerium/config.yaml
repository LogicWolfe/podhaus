address: ${NUMBAT_APPLICATION_IPV4}:443
http_redirect_addr: ${NUMBAT_APPLICATION_IPV4}:80

authenticate_service_url: https://authenticate.pod.haus
idp_provider: oidc
idp_provider_url: https://id.pod.haus
# offline_access makes Pocket ID issue a refresh token, letting Pomerium
# keep the IdP tokens fresh for the whole session window below. groups puts
# the person's Pocket ID group names in the token, which the family and
# friends route policies match on.
idp_scopes: [openid, email, profile, groups, offline_access]

# 30-day sessions instead of the 14-hour default. Personal deployment:
# the threat model does not include an already-authorized machine
# retaining access, and daily re-auth was the real cost.
cookie_expire: 720h

# The signed-in person's email as a plain header, beside the signed assertion,
# on routes with pass_identity_headers. fractal's Caddy records it as the
# caller of llm.pod.haus; stock Caddy cannot read inside the signed assertion.
# Pomerium overwrites any value a client sends, and removes the header on
# routes that do not pass identity headers.
jwt_claims_headers:
  X-Pomerium-Claim-Email: email

autocert: true
autocert_dir: /data/autocert
autocert_email: nathan@nathanbaxter.com
# Sessions, SSH key bindings and parked SSH sign-ins live in the databroker.
# The file backend keeps them across container recreates; with the in-memory
# default every deploy of this stack logged out every browser and killed
# every SSH sign-in waiting for a tap. The path is a named volume.
databroker_storage_type: file
databroker_storage_connection_string: file:///data/databroker
# debug (not info) so the "ssh keyboard-interactive auth request" line exists:
# it is the only place the target route appears for a pending SSH auth, and
# ssh-auth-notify joins it against the databroker record by key fingerprint.
log_level: debug
proxy_log_level: info
signing_key_file: /run/pomerium-secrets/signing-key.pem

ssh_address: ${NUMBAT_RELAY_IPV4}:22
ssh_user_ca_key_file: /run/pomerium-secrets/ssh-user-ca-key
ssh_host_key_files: [/run/pomerium-secrets/ssh-host-key]

runtime_flags:
  ssh_routes_portal: true

routes:
  - &family_route
    from: https://edge-canary.pod.haus
    to: https://127.0.0.1:8443
    preserve_host_header: true
    tls_upstream_server_name: pomerium-origin.pod.haus
    tls_custom_ca_file: /run/pomerium-secrets/origin-ca.pem
    tls_client_cert_file: /run/pomerium-secrets/origin-client-cert.pem
    tls_client_key_file: /run/pomerium-secrets/origin-client-key.pem
    allow_websockets: true
    idle_timeout: 0s
    # Who is in each group is Pocket ID's to say (terraform/pocket_id.tf);
    # no person is named here.
    policy: &family_policy
      - allow:
          or:
            - claim/groups: family

  - <<: *family_route
    from: https://bugs.pod.haus
  - <<: *family_route
    from: https://backup.pod.haus
  - <<: *family_route
    from: https://fenwick.pod.haus
    pass_identity_headers: true
  - <<: *family_route
    from: https://kangaroo-backup.pod.haus
  - <<: *family_route
    from: https://kangaroo.pod.haus

  - &public_route
    from: https://komodo.pod.haus
    to: https://127.0.0.1:8443
    prefix: /listener/github
    preserve_host_header: true
    tls_upstream_server_name: pomerium-origin.pod.haus
    tls_custom_ca_file: /run/pomerium-secrets/origin-ca.pem
    tls_client_cert_file: /run/pomerium-secrets/origin-client-cert.pem
    tls_client_key_file: /run/pomerium-secrets/origin-client-key.pem
    allow_public_unauthenticated_access: true
  # Gatus authenticates external-endpoint writes with its own bearer token.
  # This narrow machine route lets remote appliance jobs report without a
  # browser session while leaving the status UI behind the friends policy.
  - <<: *public_route
    from: https://gatus.pod.haus
    prefix: null
    regex: '^/api/v1/endpoints/[^/]+/external$'
  # Friends routes: the family, plus members of Pocket ID's `friends` group.
  - &friends_route
    <<: *family_route
    from: https://gatus.pod.haus
    policy:
      - allow:
          or:
            - claim/groups: family
            - claim/groups: friends
  - <<: *family_route
    from: https://komodo.pod.haus
  - <<: *family_route
    from: https://torrent.pod.haus
  - <<: *family_route
    from: https://home.pod.haus
  - <<: *family_route
    from: https://plex.pod.haus
  - <<: *family_route
    from: https://music.pod.haus
  - <<: *family_route
    from: https://metube.pod.haus

  - <<: *public_route
    from: https://watch.pod.haus
    prefix: /api/mcp
  - <<: *family_route
    from: https://watch.pod.haus
  - <<: *friends_route
    from: https://docs.pod.haus
  - <<: *family_route
    from: https://rustfs.pod.haus
  - <<: *family_route
    from: https://paperless.pod.haus
  - <<: *family_route
    from: https://stats.pod.haus

  - <<: *public_route
    from: https://git.pod.haus
    prefix: null
    regex: '^/[^/]+/[^/]+\.git/info/lfs(/.*)?$'
  # Forgejo REST API. Forgejo's own token auth is the boundary behind
  # this exception (REQUIRE_SIGNIN_VIEW is on, so anonymous API calls
  # get 401 from Forgejo itself) — same stance as RustFS S3 SigV4. Needed
  # so Terraform's forgejo provider works from any machine.
  - <<: *public_route
    from: https://git.pod.haus
    prefix: null
    regex: '^/api/v1(/.*)?$'
  - <<: *friends_route
    from: https://git.pod.haus

  - &nathan_route
    <<: *family_route
    from: https://sync.pod.haus
    policy: &nathan_policy
      - allow:
          and:
            - email:
                is: nathan@nathanbaxter.com
  - <<: *nathan_route
    from: https://dev.nathanbaxter.com
  # Sonarr is an admin tool (numbers MeTube's downloads for Plex), not a
  # family surface like MeTube itself — nathan_route, not family_route.
  - <<: *nathan_route
    from: https://sonarr.pod.haus
  # bookshelf verifies the signed assertion header itself and admits only
  # Nathan's address, so the route must pass identity headers.
  - <<: *nathan_route
    from: https://books.pod.haus
    pass_identity_headers: true

  # Per-host docs servers. One docs permission for every docs site: the same
  # friends policy as docs.pod.haus, so a link to any host's docs server opens
  # for anyone who can read the shared site.
  #
  # bilby's own docs-server, addressed by its per-host name — an alias onto
  # the same container docs.pod.haus already serves.
  - <<: *friends_route
    from: https://bilby.docs.pod.haus
  # fractal's docs server. Same mTLS origin contract as every other protected
  # route, but terminating on fractal's Caddy through its own loopback rathole
  # service rather than bilby's.
  - <<: *friends_route
    from: https://fractal.docs.pod.haus
    to: https://127.0.0.1:8444
  # The local model's installer files, open to anyone so that `curl | sh`
  # works from a bare terminal: the two install scripts, the token command,
  # the Claude Code launcher and the pi extension. None holds a secret; a key
  # comes only from Pocket ID, on the token command's client, which admits
  # only the family and friends groups. Passes no identity headers.
  - <<: *public_route
    from: https://llm.pod.haus
    to: https://127.0.0.1:8444
    prefix: null
    regex: '^/setup/(claude\.sh|pi\.sh|llm-token|claude-podhaus|podhaus\.ts)$'
  # The setup page itself, for the friends policy. The person signs in here
  # first; the page then signs in again on the token command's Pocket ID
  # client to fetch the key, which Pomerium cannot hand to a browser. fractal's
  # Caddy records the email as the caller.
  - <<: *friends_route
    from: https://llm.pod.haus
    to: https://127.0.0.1:8444
    prefix: /setup
    pass_identity_headers: true
  # The local model on fractal, through the same tunnel port as its docs
  # server. The control page is Nathan's and comes first, so its paths never
  # fall to the model route below.
  - <<: *nathan_route
    from: https://llm.pod.haus
    to: https://127.0.0.1:8444
    regex: '^/control(/.*)?$'
    pass_identity_headers: true
  # The model itself, for the friends policy. Clients have no browser, so they
  # send a Pocket ID access token as their API key (the token command served
  # by the setup page fetches one). Pomerium checks each token with Pocket ID's userinfo endpoint
  # once, at first use, and keeps the result for cookie_expire (30 days):
  # userinfo carries no expiry. The policy reads the groups stored then, merged
  # with Pomerium's shared record of the person. The tokens last a year
  # (terraform/pocket_id.tf), so removal from a group takes effect at that
  # re-check, up to 30 days later; a deny rule here is immediate. Userinfo carries no
  # audience either, so a token Pocket ID issued to any client for an admitted
  # person is accepted, and an allowed-audiences list would refuse every token.
  #
  # A long prompt is read in silence for minutes before the first byte (Claude
  # Code was seen waiting 330 s), and an answer can stream for many minutes.
  - <<: *friends_route
    from: https://llm.pod.haus
    to: https://127.0.0.1:8444
    bearer_token_format: idp_access_token
    pass_identity_headers: true
    idle_timeout: 10m
    timeout: 30m
  # bandicoot's and voltaire's docs servers. Same shape as fractal's, each
  # with its own loopback rathole service and its own Caddy mTLS origin.
  - <<: *friends_route
    from: https://bandicoot.docs.pod.haus
    to: https://127.0.0.1:8447
  - <<: *friends_route
    from: https://voltaire.docs.pod.haus
    to: https://127.0.0.1:8445
  - <<: *nathan_route
    from: https://torrent.pinelake.haus
    to: https://127.0.0.1:8446
  - <<: *nathan_route
    from: https://sync.pinelake.haus
    to: https://127.0.0.1:8446
  # Pine Lake's Plex web UI, for checking the server is up and that playback
  # starts. Streaming clients never use this route — it is deliberately absent
  # from Plex's advertised connection list, which carries LAN addresses only.
  - <<: *nathan_route
    from: https://plex.pinelake.haus
    to: https://127.0.0.1:8446

  # Pocket ID is the gate; the key you hold decides how much that identity
  # buys. Two allow rules, OR'd: a registered key may assume any principal
  # (including root — the hosts run `PermitRootLogin without-password` with
  # no AuthorizedPrincipalsFile, so `ssh root@bilby` through Pomerium lands
  # a root shell, accepted knowingly since the same person could sudo);
  # an unregistered key is confined to the host's own login account.
  #
  # The key list is evaluated only *after* browser sign-in — v0.33.0 writes
  # the binding record before any policy runs — so it cannot suppress the
  # sign-in prompt. It decides what an approved link is worth. Which key
  # you hold separately decides whether the link is pushed to Signal at all
  # (ssh-auth-notify's owner map). An unregistered key on the host's own
  # account still works end to end: copy the URL Pomerium prints on the
  # terminal, approve, connect. A new device is never locked out, only less
  # convenient and less privileged.
  #
  # Keep in lockstep with POMERIUM_SSH_KEY_OWNERS in stack.toml —
  # registering a key means both lists.
  #
  # The behavioural rule this leaves: Pomerium hands the sign-in URL to
  # whoever is connecting, so a link reaching you by any route other than
  # Fenwick is someone else's parked connection. Never approve one you did
  # not just cause.
  - from: ssh://numbat
    to: ssh://127.0.0.1:22
    policy: &nathan_ssh_policy
      - allow:
          and:
            - email:
                is: nathan@nathanbaxter.com
            - ssh_publickey: &registered_ssh_keys
                - 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIZSaoga8/dYnCgeiOSaV+3Xe5Tl6AkBpqO0T863ZajR Nathan personal key'
                - 'ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEcljMJnML/KqPHE0FFmzxgK0U7eRooK3GZH1/JeGFkR82EUx9cVoVQ88BO9SvbTfX+7CA3HAQvHPtCDuNbZTfs= bandicoot machine key'
                - 'ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBICkcW0YaP8wowCjemalLW81NWyautlRaCMEfbadXgFib10oScWeU+l2CWzhmwUFDl0njYlicAtgtVMXYtq16iM= bilby machine key'
                - 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGc4palJ9QLWwFABcbyHKXNUvrTRpKdAkqATs8Bmr5xW fractal machine key'
                - 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC5zEJO7pWBiUNL3Sx7VvTUCpIIaZoKVvNeqMKymgDl3 nb-macbook-air machine key'
                - 'ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBOzuSyhdhW8qk35HF8k7ftbnXPJrGEKGpf0QSdD2VCddcAX3NGMIa21nalGFpBOFK3QDBgd+nOogSOC8H/vzEjY= voltaire machine key'
      - allow:
          and:
            - email:
                is: nathan@nathanbaxter.com
            - ssh_username:
                is: nathan
  - from: ssh://bilby
    to: ssh://127.0.0.1:2201
    policy: *nathan_ssh_policy
  - from: ssh://bandicoot
    to: ssh://127.0.0.1:2206
    policy: *nathan_ssh_policy
  - from: ssh://voltaire
    to: ssh://127.0.0.1:2202
    policy: *nathan_ssh_policy
  - from: ssh://fractal
    to: ssh://127.0.0.1:2204
    policy: *nathan_ssh_policy
  - from: ssh://pinelake
    to: ssh://127.0.0.1:2205
    policy:
      - allow:
          and:
            - email:
                is: nathan@nathanbaxter.com
            - ssh_publickey: *registered_ssh_keys
      - allow:
          and:
            - email:
                is: nathan@nathanbaxter.com
            - ssh_username:
                is: baxter
  # QTS names its UID 0 account `admin` and has no root passwd entry, so
  # that — not `nathan` — is kangaroo's unregistered-key fallback.
  - from: ssh://kangaroo
    to: ssh://127.0.0.1:2203
    policy:
      - allow:
          and:
            - email:
                is: nathan@nathanbaxter.com
            - ssh_publickey: *registered_ssh_keys
      - allow:
          and:
            - email:
                is: nathan@nathanbaxter.com
            - ssh_username:
                is: admin
