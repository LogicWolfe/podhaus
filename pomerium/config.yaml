address: ${NUMBAT_APPLICATION_IPV4}:443
http_redirect_addr: ${NUMBAT_APPLICATION_IPV4}:80

authenticate_service_url: https://authenticate.pod.haus
idp_provider: oidc
idp_provider_url: https://id.pod.haus
# offline_access makes Pocket ID issue a refresh token, letting Pomerium
# keep the IdP tokens fresh for the whole session window below.
idp_scopes: [openid, email, profile, offline_access]

# 30-day sessions instead of the 14-hour default. Personal deployment:
# the threat model does not include an already-authorized machine
# retaining access, and daily re-auth was the real cost. Sessions still
# die on every Pomerium restart (databroker_storage_type: memory), so
# this is an upper bound, not a guarantee.
cookie_expire: 720h

autocert: true
autocert_dir: /data/autocert
autocert_email: nathan@nathanbaxter.com
databroker_storage_type: memory
# debug (not info) so the "ssh keyboard-interactive auth request" line exists:
# it is the only place the target route appears for a pending SSH auth, and
# ssh-auth-notify joins it against the databroker record by key fingerprint.
log_level: debug
proxy_log_level: info
signing_key_file: /run/pomerium-secrets/signing-key.pem

ssh_address: ${NUMBAT_RELAY_IPV4}:22
ssh_user_ca_key_file: /run/pomerium-secrets/ssh-user-ca-key
ssh_host_key_files: [/run/pomerium-secrets/ssh-host-key]

runtime_flags:
  ssh_routes_portal: true

routes:
  - &family_route
    from: https://edge-canary.pod.haus
    to: https://127.0.0.1:8443
    preserve_host_header: true
    tls_upstream_server_name: pomerium-origin.pod.haus
    tls_custom_ca_file: /run/pomerium-secrets/origin-ca.pem
    tls_client_cert_file: /run/pomerium-secrets/origin-client-cert.pem
    tls_client_key_file: /run/pomerium-secrets/origin-client-key.pem
    allow_websockets: true
    idle_timeout: 0s
    policy: &family_policy
      - allow:
          or:
            - email:
                is: nathan@nathanbaxter.com
            - email:
                is: scroeser@gmail.com

  - <<: *family_route
    from: https://gatus.pod.haus
  - <<: *family_route
    from: https://bugs.pod.haus
  - <<: *family_route
    from: https://backup.pod.haus
  - <<: *family_route
    from: https://fenwick.pod.haus
    pass_identity_headers: true
  - <<: *family_route
    from: https://kangaroo-backup.pod.haus
  - <<: *family_route
    from: https://kangaroo.pod.haus

  - &public_route
    from: https://komodo.pod.haus
    to: https://127.0.0.1:8443
    prefix: /listener/github
    preserve_host_header: true
    tls_upstream_server_name: pomerium-origin.pod.haus
    tls_custom_ca_file: /run/pomerium-secrets/origin-ca.pem
    tls_client_cert_file: /run/pomerium-secrets/origin-client-cert.pem
    tls_client_key_file: /run/pomerium-secrets/origin-client-key.pem
    allow_public_unauthenticated_access: true
  - <<: *family_route
    from: https://komodo.pod.haus
  - <<: *family_route
    from: https://torrent.pod.haus
  - <<: *family_route
    from: https://home.pod.haus
  - <<: *family_route
    from: https://plex.pod.haus
  - <<: *family_route
    from: https://music.pod.haus

  - <<: *public_route
    from: https://watch.pod.haus
    prefix: /api/mcp
  - <<: *family_route
    from: https://watch.pod.haus
  - <<: *family_route
    from: https://docs.pod.haus
  - <<: *family_route
    from: https://minio.pod.haus
  - <<: *family_route
    from: https://paperless.pod.haus
  - <<: *family_route
    from: https://stats.pod.haus

  - <<: *public_route
    from: https://git.pod.haus
    prefix: null
    regex: '^/[^/]+/[^/]+\.git/info/lfs(/.*)?$'
  # Forgejo REST API. Forgejo's own token auth is the boundary behind
  # this exception (REQUIRE_SIGNIN_VIEW is on, so anonymous API calls
  # get 401 from Forgejo itself) — same stance as MinIO SigV4. Needed
  # so Terraform's forgejo provider works from any machine.
  - <<: *public_route
    from: https://git.pod.haus
    prefix: null
    regex: '^/api/v1(/.*)?$'
  - <<: *family_route
    from: https://git.pod.haus

  - &nathan_route
    <<: *family_route
    from: https://sync.pod.haus
    policy: &nathan_policy
      - allow:
          and:
            - email:
                is: nathan@nathanbaxter.com
  - <<: *nathan_route
    from: https://dev.nathanbaxter.com

  # Per-host docs servers. nathan-only (not the shared docs.pod.haus'
  # family_route) because each host's own repos tree is more sensitive than
  # the shared docs site.
  #
  # bilby's own docs-server, addressed by its per-host name — an alias onto
  # the same container docs.pod.haus already serves.
  - <<: *nathan_route
    from: https://bilby.docs.pod.haus
  # fractal's docs server. Same mTLS origin contract as every other protected
  # route, but terminating on fractal's Caddy through its own loopback rathole
  # service rather than bilby's.
  - <<: *nathan_route
    from: https://fractal.docs.pod.haus
    to: https://127.0.0.1:8444
  # voltaire's docs server. Same shape as fractal's, its own loopback rathole
  # service and its own Caddy mTLS origin.
  - <<: *nathan_route
    from: https://voltaire.docs.pod.haus
    to: https://127.0.0.1:8445

  # Pocket ID is the gate; the key you hold decides how much that identity
  # buys. Two allow rules, OR'd: a registered key may assume any principal
  # (including root — the hosts run `PermitRootLogin without-password` with
  # no AuthorizedPrincipalsFile, so `ssh root@bilby` through Pomerium lands
  # a root shell, accepted knowingly since the same person could sudo);
  # an unregistered key is confined to the host's own login account.
  #
  # The key list is evaluated only *after* browser sign-in — v0.33.0 writes
  # the binding record before any policy runs — so it cannot suppress the
  # sign-in prompt. It decides what an approved link is worth. Which key
  # you hold separately decides whether the link is pushed to Signal at all
  # (ssh-auth-notify's owner map). An unregistered key on the host's own
  # account still works end to end: copy the URL Pomerium prints on the
  # terminal, approve, connect. A new device is never locked out, only less
  # convenient and less privileged.
  #
  # Keep in lockstep with POMERIUM_SSH_KEY_OWNERS in stack.toml —
  # registering a key means both lists.
  #
  # The behavioural rule this leaves: Pomerium hands the sign-in URL to
  # whoever is connecting, so a link reaching you by any route other than
  # Fenwick is someone else's parked connection. Never approve one you did
  # not just cause.
  - from: ssh://numbat
    to: ssh://127.0.0.1:22
    policy: &nathan_ssh_policy
      - allow:
          and:
            - email:
                is: nathan@nathanbaxter.com
            - ssh_publickey: &registered_ssh_keys
                - 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIZSaoga8/dYnCgeiOSaV+3Xe5Tl6AkBpqO0T863ZajR Nathan personal key'
                - 'ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBICkcW0YaP8wowCjemalLW81NWyautlRaCMEfbadXgFib10oScWeU+l2CWzhmwUFDl0njYlicAtgtVMXYtq16iM= bilby machine key'
                - 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGc4palJ9QLWwFABcbyHKXNUvrTRpKdAkqATs8Bmr5xW fractal machine key'
                - 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC5zEJO7pWBiUNL3Sx7VvTUCpIIaZoKVvNeqMKymgDl3 nb-macbook-air machine key'
                - 'ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBOzuSyhdhW8qk35HF8k7ftbnXPJrGEKGpf0QSdD2VCddcAX3NGMIa21nalGFpBOFK3QDBgd+nOogSOC8H/vzEjY= voltaire machine key'
      - allow:
          and:
            - email:
                is: nathan@nathanbaxter.com
            - ssh_username:
                is: nathan
  - from: ssh://bilby
    to: ssh://127.0.0.1:2201
    policy: *nathan_ssh_policy
  - from: ssh://voltaire
    to: ssh://127.0.0.1:2202
    policy: *nathan_ssh_policy
  - from: ssh://fractal
    to: ssh://127.0.0.1:2204
    policy: *nathan_ssh_policy
  # QTS names its UID 0 account `admin` and has no root passwd entry, so
  # that — not `nathan` — is kangaroo's unregistered-key fallback.
  - from: ssh://kangaroo
    to: ssh://127.0.0.1:2203
    policy:
      - allow:
          and:
            - email:
                is: nathan@nathanbaxter.com
            - ssh_publickey: *registered_ssh_keys
      - allow:
          and:
            - email:
                is: nathan@nathanbaxter.com
            - ssh_username:
                is: admin
