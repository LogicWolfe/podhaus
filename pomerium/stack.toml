[[stack]]
name = "numbat-pomerium"
description = "Pomerium Core on Numbat, backed by Pocket ID and outbound rathole origins"
tags = ["numbat", "podhaus"]

[stack.config]
server = "numbat"
linked_repo = "podhaus-numbat"
run_directory = "pomerium"
file_paths = ["compose.yaml"]
ignore_services = ["pomerium-secrets-init"]
run_build = true
auto_pull = true

environment = """
TZ=[[TZ]]
FENWICK_EVENTS_GATEWAY_TOKEN=[[OP__KOMODO__POMERIUM_GATEWAY_TOKENS__FENWICK_EVENTS]]
FENWICK_INTERNAL_HTTP_TOKEN=[[OP__KOMODO__FENWICK_INTERNAL_TOKEN__CREDENTIAL]]
FENWICK_DEFAULT_USER=[[POMERIUM_SSH_AUTH_DEFAULT_USER]]
FENWICK_USER_BY_FINGERPRINT=[[POMERIUM_SSH_KEY_OWNERS]]
SHARED_SECRET=[[OP__KOMODO__POMERIUM_SECRETS__SHARED_SECRET]]
COOKIE_SECRET=[[OP__KOMODO__POMERIUM_SECRETS__COOKIE_SECRET]]
SSH_USER_CA_KEY_B64=[[OP__KOMODO__POMERIUM_SECRETS__SSH_USER_CA_KEY_B64]]
SSH_HOST_KEY_B64=[[OP__KOMODO__POMERIUM_SECRETS__SSH_HOST_KEY_B64]]
ORIGIN_CLIENT_CERT_B64=[[OP__KOMODO__POMERIUM_SECRETS__ORIGIN_CLIENT_CERT_B64]]
ORIGIN_CLIENT_KEY_B64=[[OP__KOMODO__POMERIUM_SECRETS__ORIGIN_CLIENT_KEY_B64]]
ORIGIN_CA_CERT_B64=[[OP__KOMODO__POMERIUM_ORIGIN_PKI__CA_CERT_B64]]
SIGNING_KEY_B64=[[OP__KOMODO__POMERIUM_SECRETS__SIGNING_KEY_B64]]
IDP_CLIENT_ID=[[OP__KOMODO__POMERIUM_OIDC__USERNAME]]
IDP_CLIENT_SECRET=[[OP__KOMODO__POMERIUM_OIDC__PASSWORD]]
"""

[[variable]]
name = "POMERIUM_SSH_AUTH_DEFAULT_USER"
value = "Nathan"
description = "Fenwick account that receives SSH auth notifications for unmapped key fingerprints (the admin)"

[[variable]]
name = "POMERIUM_SSH_KEY_OWNERS"
value = '{"SHA256:xoFwRTtZZF3C28yg3VfgVSyseiKjgsMaoPIQnDv4abg":{"user":"Nathan","machine":"bilby machine key"},"SHA256:f3/+BExiF4aprqM94hFJuLDS0dF2+Ppaum9hN9UI8eU":{"user":"Nathan","machine":"Nathan personal key"},"SHA256:1sv7ZuiXn1VBwZLfCrEKaB4TR2HWM8iXlJM1f8EzXQ4":{"user":"Nathan","machine":"fractal machine key"},"SHA256:RhKW+weirrcPh6fpA8VWWWqO/YsWNEXlGyyGwAlDfLc":{"user":"Nathan","machine":"fractal soft machine key"}}'
description = "SSH key fingerprint -> fenwick account + machine label for ssh-auth-notify routing. Fingerprints are `ssh-keygen -lf` SHA256 values. Unmapped fingerprints never generate an in_flight prompt. Keep in lockstep with the ssh_publickey allow-list in pomerium/config.yaml: registering a key means both lists (plus a fenwick account for a new person)."
