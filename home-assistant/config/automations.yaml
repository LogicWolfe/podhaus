- id: doorbell_living_room_chime
  alias: Doorbell chime — living room
  description: >-
    Play a doorbell chime on the living-room Bowers & Wilkins Formation
    (via Music Assistant) when the front G4 doorbell is pressed. Additive
    to the UniFi chimes. The Formation ignores MA's announce_volume, so we
    snapshot the player volume, set a fixed chime level, play, then restore.
  triggers:
    - trigger: state
      entity_id: event.g4_doorbell_doorbell
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.to_state.state not in ['unknown', 'unavailable']
           and as_datetime(trigger.to_state.state) > now() - timedelta(seconds=30) }}
  actions:
    - variables:
        prev_volume: "{{ state_attr('media_player.living_room', 'volume_level') | float(0.32) }}"
    - action: media_player.volume_set
      target:
        entity_id: media_player.living_room
      data:
        volume_level: 0.6
    - delay:
        milliseconds: 500
    - action: music_assistant.play_announcement
      target:
        entity_id: media_player.living_room
      data:
        url: "http://10.0.0.119:8123/local/doorbell.wav"
        use_pre_announce: false
    - action: media_player.volume_set
      target:
        entity_id: media_player.living_room
      data:
        volume_level: "{{ prev_volume }}"
  mode: single

- id: burrow_switch_extras
  alias: 'Burrow switch: Shapes and fan downlight'
  description: >-
    The Burrow Hue tap switch drives the room's three Hue bulbs (bloom,
    cupboard strip, window strip) through rules stored on the Hue bridge
    itself, so they keep working over local Zigbee with no HA involved. Those
    rules can only reach Hue devices, so this automation adds the room's other
    two lights: the Nanoleaf Shapes and the Big Ass Fan downlight. Buttons 2
    and 3 light the Shapes alongside the Hue scene they fire; buttons 1 and 4
    turn both off. Button 3 picks its effect at random from three, so the
    effect names must stay in sync with what is actually loaded on the
    controller: effects live on the Nanoleaf itself and HA matches the name
    exactly, so a renamed or missing effect fails silently.

    The tap is kinetic, so every button emits a bare initial_press with no
    hold or long-press. not_from guards the restore transitions, which would
    otherwise fire the automation on restart or integration reload.
  triggers:
    - trigger: state
      entity_id: event.burrow_switch_button_2
      not_from:
        - unknown
        - unavailable
      id: bright
    - trigger: state
      entity_id: event.burrow_switch_button_3
      not_from:
        - unknown
        - unavailable
      id: orange
    - trigger: state
      entity_id:
        - event.burrow_switch_button_1
        - event.burrow_switch_button_4
      not_from:
        - unknown
        - unavailable
      id: extras_off
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: bright
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.haiku_fan_4
              data:
                brightness_pct: 70
            - action: light.turn_on
              target:
                entity_id: light.shapes_4108
              data:
                brightness_pct: 40
                effect: Sunlight through trees
        - conditions:
            - condition: trigger
              id: orange
          sequence:
            - action: light.turn_off
              target:
                entity_id: light.haiku_fan_4
            - action: light.turn_on
              target:
                entity_id: light.shapes_4108
              data:
                brightness_pct: 15
                effect: >-
                  {{ ['Aquarium', 'Retro Future', 'Vintage Modern'] | random }}
      default:
        - action: light.turn_off
          target:
            entity_id:
              - light.haiku_fan_4
              - light.shapes_4108
  mode: restart

- id: living_room_switch_extras
  alias: 'Living room switch: fan lights and night mode'
  description: >-
    The living room tap's two standing lamps are bridge-owned (Hue rules recall
    Bright, Relax and Nightlight for buttons 2, 3 and 4), so they are
    deliberately absent below. This automation adds the two Kitchen fan
    downlights, which are the Big Ass Fans covering this space -- the Living
    Room area itself has no fan.

    Button 4 is night mode and is the only button that reaches out of the room:
    it also shuts the front entry, drops the Hallway to brightness 1, and locks
    all five doors. The Hallway is a separate Hue room, so no living room button
    touches it without this automation, and buttons 1 to 3 deliberately leave it
    and the front entry alone. Hallway goes to brightness 1 rather than off on
    purpose: that is the kids' nightlight level, not a mistake.

    The locks go through the request booleans in packages/door_locks.yaml
    because HA cannot command them directly -- Apple Home does the actual
    locking. So the doors lock a second or two after the lights, and HA gets no
    confirmation that any of them moved.
  triggers:
    - trigger: state
      entity_id: event.living_room_switch_button_2
      not_from:
        - unknown
        - unavailable
      id: full
    - trigger: state
      entity_id: event.living_room_switch_button_3
      not_from:
        - unknown
        - unavailable
      id: dim
    - trigger: state
      entity_id: event.living_room_switch_button_4
      not_from:
        - unknown
        - unavailable
      id: night
    - trigger: state
      entity_id: event.living_room_switch_button_1
      not_from:
        - unknown
        - unavailable
      id: fans_off
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: full
          sequence:
            - action: light.turn_on
              target:
                entity_id:
                  - light.haiku_fan_2
                  - light.haiku_fan_6
              data:
                brightness_pct: 100
        - conditions:
            - condition: trigger
              id: dim
          sequence:
            - action: light.turn_on
              target:
                entity_id:
                  - light.haiku_fan_2
                  - light.haiku_fan_6
              data:
                brightness_pct: 60
        - conditions:
            - condition: trigger
              id: night
          sequence:
            - action: light.turn_off
              target:
                entity_id:
                  - light.front_entry
                  - light.haiku_fan_2
                  - light.haiku_fan_6
            - action: light.turn_on
              target:
                entity_id: light.hallway
              data:
                brightness: 1
            - action: input_boolean.turn_on
              target:
                entity_id:
                  - input_boolean.pantry_lock_request
                  - input_boolean.living_room_lock_request
                  - input_boolean.grasshopper_lock_request
                  - input_boolean.front_door_lock_request
                  - input_boolean.burrow_lock_request
      default:
        - action: light.turn_off
          target:
            entity_id:
              - light.haiku_fan_2
              - light.haiku_fan_6
  mode: single

- id: living_room_switch_morning_unlock
  alias: 'Living room switch: morning unlock'
  description: >-
    Pressing button 2 or 3 on the living room tap between 06:00 and 08:00
    unlocks the living room and pantry doors. Kept out of the lighting
    automation for this switch because those buttons' lighting behaviour is
    unconditional and this is a narrow time-boxed exception, so folding it into
    two lighting branches would bury it.

    Times are Australia/Perth, HA's configured zone. As with every lock action
    here, HA only raises a request and never learns whether the door moved.
  triggers:
    - trigger: state
      entity_id:
        - event.living_room_switch_button_2
        - event.living_room_switch_button_3
      not_from:
        - unknown
        - unavailable
  conditions:
    - condition: time
      after: "06:00:00"
      before: "08:00:00"
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id:
          - input_boolean.living_room_unlock_request
          - input_boolean.pantry_unlock_request
  mode: single

- id: fan_wall_control_morning_unlock
  alias: 'Kitchen fan wall control: morning unlock'
  description: >-
    Turning the Kitchen fan lights UP on the Haiku wall control between 06:00
    and 08:00 unlocks the living room and pantry, matching what the Hue tap's
    buttons 2 and 3 already do in the same window. Two physical controls, same
    morning routine.

    light.haiku_switch is the wall control at 10.0.0.134. It, light.haiku_fan_2
    and light.haiku_fan_6 mirror each other exactly, so a wall press and an
    HA-driven change are indistinguishable by entity.

    Brightness must go up. Old brightness defaults to 0, so off -> on and
    unavailable -> on both count as up; these lights go unavailable when their
    power is cut at the wall, so power returning is someone turning them on.
  triggers:
    - trigger: state
      entity_id: light.haiku_switch
      attribute: brightness
  conditions:
    - condition: time
      after: "06:00:00"
      before: "08:00:00"
    - condition: template
      value_template: >-
        {{ (trigger.to_state.attributes.brightness | int(0))
           > (trigger.from_state.attributes.brightness | int(0)) }}
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id:
          - input_boolean.living_room_unlock_request
          - input_boolean.pantry_unlock_request
  mode: single

- id: door_lock_request_reset
  alias: 'Door locks: reset request buttons'
  description: >-
    Makes the door lock request booleans (packages/door_locks.yaml) behave as
    momentary buttons. Apple Home automations trigger on an off->on edge, so a
    boolean left on would make the next identical request a no-op. Resetting it
    shortly after firing means every request is a fresh edge.

    The delay is generous because the signal has to cross the HomeKit bridge,
    reach a hub and then the lock over Bluetooth. Resetting too eagerly risks
    Apple missing the change entirely.

    Parallel mode so simultaneous requests on different doors do not queue
    behind each other; each run resets only the boolean that triggered it.
  triggers:
    - trigger: state
      entity_id:
        - input_boolean.pantry_lock_request
        - input_boolean.pantry_unlock_request
        - input_boolean.living_room_lock_request
        - input_boolean.living_room_unlock_request
        - input_boolean.grasshopper_lock_request
        - input_boolean.grasshopper_unlock_request
        - input_boolean.front_door_lock_request
        - input_boolean.front_door_unlock_request
        - input_boolean.burrow_lock_request
        - input_boolean.burrow_unlock_request
      to: "on"
  conditions: []
  actions:
    - delay:
        seconds: 10
    - action: input_boolean.turn_off
      target:
        entity_id: "{{ trigger.entity_id }}"
  mode: parallel
  max: 10

- id: turn_touch_burrow_lights
  alias: 'Turn Touch burrow: Hue, Shapes and fan downlight'
  description: >-
    The burrow Turn Touch mirrors the burrow Hue tap, but unlike the tap it has
    no rules stored on the Hue bridge, so this automation drives everything the
    room does. That means the three Hue bulbs (bloom, cupboard strip, window
    strip) via the same scenes the bridge recalls for the tap, plus the Nanoleaf
    Shapes and the Big Ass Fan downlight that burrow_switch_extras adds.

    North recalls Bright, West recalls Orange, East recalls Leave the lights on,
    South turns the room off. The extras follow the scene rather than the
    button: Bright lights the fan and Shapes, Orange kills the fan and drops the
    Shapes to a random effect, and both Leave-the-lights-on and Off clear the
    extras. Leave-the-lights-on deliberately keeps the Hue bulbs lit while
    clearing the extras -- it is not a variant of off. Effect names must match
    what is loaded on the Nanoleaf exactly, or the call fails silently.

    Holding a button runs a variant of its own scene rather than an unrelated
    one: North-hold is Bright with everything -- including the Hue bulbs --
    pinned to 100%. West-hold is a softer Orange: scene Lighter orange, fan
    off, Shapes at 50% on the same random effect the tap uses. East-hold is
    its own scene, Warm morning, fan off, Shapes fixed on Vintage Modern at
    10%. South-hold has no scene of its own: it turns the fan light off if it
    is on, and only once the fan light is already off does it fall back to
    halving the Hue bulbs' and Shapes' current brightness, so a second hold
    does something instead of nothing.

    Unlike the kinetic tap, the Turn Touch emits hold and double events on every
    button as well as press. Press and double both run the same actions, because
    the remote itself classifies two quick taps as a double: someone who presses
    again when the room did not react would otherwise send the one event that is
    ignored, so a weak link would read as a dead remote. not_from guards the
    restore transitions, which would otherwise fire this on restart or
    integration reload.
  triggers:
    - trigger: state
      entity_id: event.turn_touch_burrow_north
      not_from:
        - unknown
        - unavailable
      id: bright
    - trigger: state
      entity_id: event.turn_touch_burrow_west
      not_from:
        - unknown
        - unavailable
      id: orange
    - trigger: state
      entity_id: event.turn_touch_burrow_east
      not_from:
        - unknown
        - unavailable
      id: leave_on
    - trigger: state
      entity_id: event.turn_touch_burrow_south
      not_from:
        - unknown
        - unavailable
      id: all_off
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.to_state.attributes.event_type in ['press', 'double', 'hold'] }}
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: bright
            - condition: template
              value_template: >-
                {{ trigger.to_state.attributes.event_type in ['press', 'double'] }}
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.burrow_bright
            - action: light.turn_on
              target:
                entity_id: light.haiku_fan_4
              data:
                brightness_pct: 70
            - action: light.turn_on
              target:
                entity_id: light.shapes_4108
              data:
                brightness_pct: 40
                effect: Sunlight through trees
        - conditions:
            - condition: trigger
              id: bright
            - condition: template
              value_template: "{{ trigger.to_state.attributes.event_type == 'hold' }}"
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.burrow_bright
            - action: light.turn_on
              target:
                entity_id: light.burrow
              data:
                brightness_pct: 100
            - action: light.turn_on
              target:
                entity_id: light.haiku_fan_4
              data:
                brightness_pct: 100
            - action: light.turn_on
              target:
                entity_id: light.shapes_4108
              data:
                brightness_pct: 100
                effect: Sunlight through trees
        - conditions:
            - condition: trigger
              id: orange
            - condition: template
              value_template: >-
                {{ trigger.to_state.attributes.event_type in ['press', 'double'] }}
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.burrow_orange
            - action: light.turn_off
              target:
                entity_id: light.haiku_fan_4
            - action: light.turn_on
              target:
                entity_id: light.shapes_4108
              data:
                brightness_pct: 15
                effect: >-
                  {{ ['Aquarium', 'Retro Future', 'Vintage Modern'] | random }}
        - conditions:
            - condition: trigger
              id: orange
            - condition: template
              value_template: "{{ trigger.to_state.attributes.event_type == 'hold' }}"
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.burrow_burrow_lighter_orange
            - action: light.turn_off
              target:
                entity_id: light.haiku_fan_4
            - action: light.turn_on
              target:
                entity_id: light.shapes_4108
              data:
                brightness_pct: 50
                effect: >-
                  {{ ['Aquarium', 'Retro Future', 'Vintage Modern'] | random }}
        - conditions:
            - condition: trigger
              id: leave_on
            - condition: template
              value_template: >-
                {{ trigger.to_state.attributes.event_type in ['press', 'double'] }}
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.burrow_leave_the_lights_on
            - action: light.turn_off
              target:
                entity_id:
                  - light.haiku_fan_4
                  - light.shapes_4108
        - conditions:
            - condition: trigger
              id: leave_on
            - condition: template
              value_template: "{{ trigger.to_state.attributes.event_type == 'hold' }}"
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.burrow_warm_morning
            - action: light.turn_off
              target:
                entity_id: light.haiku_fan_4
            - action: light.turn_on
              target:
                entity_id: light.shapes_4108
              data:
                brightness_pct: 10
                effect: Vintage Modern
        - conditions:
            - condition: trigger
              id: all_off
            - condition: template
              value_template: "{{ trigger.to_state.attributes.event_type == 'hold' }}"
          sequence:
            - if:
                - condition: state
                  entity_id: light.haiku_fan_4
                  state: "on"
              then:
                - action: light.turn_off
                  target:
                    entity_id: light.haiku_fan_4
              else:
                - action: light.turn_on
                  target:
                    entity_id: light.burrow
                  data:
                    brightness: >-
                      {{ (state_attr('light.burrow', 'brightness') | int(0)) // 2 }}
                - action: light.turn_on
                  target:
                    entity_id: light.shapes_4108
                  data:
                    brightness: >-
                      {{ (state_attr('light.shapes_4108', 'brightness') | int(0)) // 2 }}
      default:
        - action: light.turn_off
          target:
            entity_id:
              - light.burrow
              - light.haiku_fan_4
              - light.shapes_4108
  mode: restart
- id: flic_blue_grasshopper_lamp
  alias: 'Flic blue: grasshopper lamp'
  description: >-
    The blue Flic drives the grasshopper lamp -- the Nanoleaf Essentials NL45,
    through the Apple Home relay in packages/grasshopper_lamp.yaml. NOT
    light.grasshopper_led_strip_strip (the ESP32 strip, now on black), and not
    light.grasshopper, the Hue room group, which holds only the bookshelf lamp
    and so would duplicate green.

    Triggered on the flic_click event rather than the button's binary_sensor.
    The flic integration initialises every one of its binary_sensors to `on`
    at startup, so a state trigger would fire this on every Home Assistant
    restart and reload. The event carries button_address and click_type and is
    only emitted by a real press. Every Flic automation in this file works that
    way, for that reason.

    There is no HA entity for this bulb and there cannot be one: it is a
    HomeKit-over-Thread accessory paired to Apple Home, and HAP allows a single
    controller. This raises a momentary request boolean; an Apple Shortcut on
    the HomePod reads the bulb's real state and decides what to do with it. HA
    stores nothing about this lamp, so nothing here can drift.

    This deliberately does NOT snapshot into a scene first. That was tried and
    it wedged the light permanently on 2026-08-14. scene.create captures
    whatever the light looks like at that instant, and Hue's state in HA lags
    the bulb by about a second, so pressing the button twice quickly let the
    snapshot capture the light already off. From then on every press restored
    that off snapshot -- the scene's timestamp advanced on each press while the
    bulb never moved, and the branch that would have turned it on could no
    longer be reached. Silent, permanent, and only fixable from another app.

    If a future light in this room genuinely does not remember its own state,
    give that light an explicit brightness/colour store in input_number and
    input_text helpers, which persist across restarts and can never hold an
    "off" to replay. Do not reach for scene.create.

    Single press toggles; hold advances the colour palette.
  triggers:
    - trigger: event
      event_type: flic_click
      event_data:
        button_address: '80:e4:da:73:d6:bd'
        click_type: single
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.grasshopper_lamp_toggle_request
  mode: queued
  max: 5
- id: flic_blue_grasshopper_lamp_colour
  alias: 'Flic blue (hold): grasshopper lamp colour'
  description: >-
    Holding the blue Flic advances the grasshopper lamp through its palette:
    an evening reading amber, a pink, a blue and a deep green.

    The palette is NOT here. It is hand-authored as `If` branches in an Apple
    Shortcut, because that is the only side that can read the bulb's current
    hue to work out which entry it is on. HA only ever says "next".
  triggers:
    - trigger: event
      event_type: flic_click
      event_data:
        button_address: '80:e4:da:73:d6:bd'
        click_type: hold
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.grasshopper_lamp_colour_request
  mode: queued
  max: 5
- id: grasshopper_lamp_request_reset
  alias: 'Grasshopper lamp: reset request buttons'
  description: >-
    Makes the grasshopper lamp request booleans momentary, exactly as
    door_lock_request_reset does for the locks. Apple Home triggers on an
    off->on edge, so a boolean left on would make the next identical request a
    silent no-op.

    One second rather than the locks' ten. This signal crosses the bridge to a
    hub in the same room and then Thread, rather than waiting on Bluetooth to
    a battery lock, and the button belongs to a 4-year-old who will press it
    again long before ten seconds are up.

    THIS IS THE NUMBER TO TUNE IF PRESSES GO MISSING. Too long and rapid
    repeats are swallowed; too short and the HomeKit bridge may coalesce the
    on and off into a single update the hub never sees as a change at all. To
    stop guessing, have the Apple automation flip an ack boolean back through
    the bridge -- that makes the round trip measurable.

    Parallel so the two requests never queue behind each other; each run
    resets only the boolean that triggered it.
  triggers:
    - trigger: state
      entity_id:
        - input_boolean.grasshopper_lamp_toggle_request
        - input_boolean.grasshopper_lamp_colour_request
      to: "on"
  conditions: []
  actions:
    - delay:
        seconds: 1
    - action: input_boolean.turn_off
      target:
        entity_id: "{{ trigger.entity_id }}"
  mode: parallel
  max: 10
- id: flic_green_bookshelf_lamp
  alias: 'Flic green: bookshelf lamp'
  description: >-
    The green Flic toggles light.bookshelf_lamp, the single Hue bulb in
    grasshopper. A bare toggle is all that is needed to have it come back at
    the brightness and colour it had -- the Hue bridge restores that itself on
    a turn_on with no attributes. See the blue button for why this must not be
    "improved" with a scene snapshot.

    Addressed as the bulb, not as light.grasshopper. That Hue room group holds
    only this lamp, so today they behave identically -- but a Hue room group
    can only ever contain Hue bulbs, so it would never grow to cover the room's
    Nanoleaf or the strip. Naming the bulb keeps the button honest about what
    it actually controls.

    Single press toggles; hold advances the colour (see
    flic_green_bookshelf_lamp_colour below).
  triggers:
    - trigger: event
      event_type: flic_click
      event_data:
        button_address: '80:e4:da:73:e3:2b'
        click_type: single
  actions:
    - action: light.toggle
      target:
        entity_id: light.bookshelf_lamp
  mode: single
- id: flic_green_bookshelf_lamp_colour
  alias: 'Flic green (hold): bookshelf lamp colour'
  description: >-
    Holding the green Flic advances the bookshelf lamp's colour, cycling
    Blue -> Red -> Blue + red -> Blue. input_select.select_next cycles by
    default, so there is no end stop.

    This ONLY advances the select; applying the colour is
    bookshelf_lamp_colour_apply's job. Split deliberately, for two reasons.
    Picking a colour from a dashboard then behaves identically to holding the
    button. And the apply step reads a state that has definitely settled,
    rather than racing its own select_next call in the same sequence.

    Queued rather than single so a fast second hold is not dropped. A press
    that does nothing is the one outcome the buttons in this room must not
    produce.
  triggers:
    - trigger: event
      event_type: flic_click
      event_data:
        button_address: '80:e4:da:73:e3:2b'
        click_type: hold
  actions:
    - action: input_select.select_next
      target:
        entity_id: input_select.bookshelf_lamp_colour
  mode: queued
  max: 5
- id: bookshelf_lamp_colour_apply
  alias: 'Bookshelf lamp: apply the selected colour'
  description: >-
    Applies input_select.bookshelf_lamp_colour (packages/bookshelf_lamp.yaml)
    to the lamp.

    Turns the light ON as well as setting the colour, so a hold on an off lamp
    brings it up in the next colour instead of silently recolouring a dark
    bulb.

    Full brightness and pure primaries by design. Saturation is the whiteness
    axis: anything short of full renders as a washed-out version of the colour,
    which is exactly what this palette exists to avoid.

    The from_state guard matters. State triggers also fire on attribute-only
    changes, and fire with a null from_state when the entity is restored at
    startup -- without the guard, every Home Assistant restart would switch
    this lamp on by itself.
  triggers:
    - trigger: state
      entity_id: input_select.bookshelf_lamp_colour
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none
           and trigger.to_state.state != trigger.from_state.state }}
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.bookshelf_lamp_colour
              state: 'Blue'
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.bookshelf_lamp
              data:
                brightness_pct: 100
                rgb_color: [0, 0, 255]
        - conditions:
            - condition: state
              entity_id: input_select.bookshelf_lamp_colour
              state: 'Red'
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.bookshelf_lamp
              data:
                brightness_pct: 100
                rgb_color: [255, 0, 0]
        - conditions:
            - condition: state
              entity_id: input_select.bookshelf_lamp_colour
              state: 'Blue + red'
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.bookshelf_lamp
              data:
                brightness_pct: 100
                rgb_color: [255, 0, 255]
  mode: queued
  max: 5
- id: flic_black_grasshopper_strip
  alias: 'Flic black: grasshopper LED strip'
  description: >-
    The black Flic toggles the LED strip -- the ESP32-driven strip on
    light.grasshopper_led_strip_strip, NOT light.grasshopper, which is the
    room's Hue bulb.

    Black is the only button here whose two gestures drive unrelated things: a
    short press is the strip, a hold is the whole-room light show. That is
    deliberate -- three buttons cover four jobs, so the show had to share, and
    it belongs on the gesture that cannot be hit by accident.

    Toggling the strip DURING a show does not stick. script.grasshopper_crazy_strip
    captures the strip's state when the show starts and restores it at the end,
    so a press mid-show is overwritten ~30s later. Accepted rather than fixed:
    the press still visibly does something at the time, which is the rule that
    matters in this room.
  triggers:
    - trigger: event
      event_type: flic_click
      event_data:
        button_address: '80:e4:da:73:e3:32'
        click_type: single
  actions:
    - action: light.toggle
      target:
        entity_id: light.grasshopper_led_strip_strip
  mode: single
- id: flic_black_crazy
  alias: 'Flic black (hold): crazy mode'
  description: >-
    Holding the black Flic starts the 30-second light show across all three
    lights. There is no cancel gesture: the show runs to the end and stops
    itself.

    turn_on, NOT toggle. The flag is raised here and lowered only by
    grasshopper_crazy_timer, which keeps the gesture absolute -- holding again
    at any point can only ever mean "start", never "stop". That is what makes
    black safe to hammer, and hammering is the expected way this button gets
    used. A toggle would have let two holds in a row start the show and kill it.

    A hold while the show is already running produces no edge and so starts
    nothing new. Accepted: the show is visibly running, which is the one place
    in this room where a dead press does not read as a dead room.

    CURFEW: 06:45 to 19:30. Outside it a hold does nothing at all, which is a
    deliberate exception to this room's no-dead-presses rule -- a strobing
    light show at bedtime is worse than a button that ignores you. The rest of
    the room stays available all night: black's short press still toggles the
    strip, and blue and green are unrestricted.

    The curfew sits on the BUTTON, not on the flag or the scripts. Everything
    downstream keeps treating "flag on" as "the show is running", with no
    second opinion about whether it should be, so crazy mode can still be
    triggered from a dashboard at any hour for testing.

    A show started at 19:29 runs its full 30 seconds past the boundary. Not
    worth guarding -- cutting it short would be a stranger result than letting
    it finish.
  triggers:
    - trigger: event
      event_type: flic_click
      event_data:
        button_address: '80:e4:da:73:e3:32'
        click_type: hold
  conditions:
    - condition: time
      after: '06:45:00'
      before: '19:30:00'
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.grasshopper_crazy_active
  mode: single
- id: grasshopper_crazy_start
  alias: 'Crazy mode: start the HA-driven lights'
  description: >-
    Launches the strip and Hue loops when the flag is raised. The Nanoleaf's
    loop is NOT started here -- it runs on the HomePod, triggered by the same
    flag arriving over the HomeKit bridge, because HA cannot command that bulb.

    script.turn_on rather than calling the scripts directly, so the two run
    concurrently and this automation returns immediately instead of blocking
    for the length of the show.

    The three lights therefore run independent random intervals and drift
    against each other. That is forced by the architecture rather than chosen,
    but it is also the more interesting result than three lights in lockstep.
  triggers:
    - trigger: state
      entity_id: input_boolean.grasshopper_crazy_active
      to: "on"
  conditions: []
  actions:
    - action: script.turn_on
      target:
        entity_id:
          - script.grasshopper_crazy_strip
          - script.grasshopper_crazy_hue
  mode: single
- id: grasshopper_crazy_timer
  alias: 'Crazy mode: end the show'
  description: >-
    Owns the flag's lifetime and is the ONLY thing that clears it -- there is
    no cancel gesture. The show is 30 seconds; this allows 32 so the loops
    finish their last cycle rather than being cut mid-flicker.

    Single owner on purpose. The Nanoleaf's half runs on a hub that kills
    shortcuts at ten minutes, and a killed shortcut cannot clear anything -- so
    if the flag's lifetime depended on the loops finishing, one hub-side kill
    would strand it on and make crazy mode permanently untriggerable.

    Being the sole owner makes this a single point of failure: a Home Assistant
    restart during the 32-second delay would drop it and leave the flag stuck
    on, with nothing left to lower it. `initial: off` on the boolean
    (packages/grasshopper_crazy.yaml) is what closes that -- it is the reason
    that key is there.

    Restart mode is defensive rather than load-bearing. The flag cannot
    normally be re-raised while it is on, so a second run has nothing to
    restart; it matters only if someone flips the boolean from a dashboard.
  triggers:
    - trigger: state
      entity_id: input_boolean.grasshopper_crazy_active
      to: "on"
  conditions: []
  actions:
    - delay:
        seconds: 32
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.grasshopper_crazy_active
  mode: restart
