- id: doorbell_living_room_chime
  alias: Doorbell chime — living room
  description: >-
    Play a doorbell chime on the living-room Bowers & Wilkins Formation
    (via Music Assistant) when the front G4 doorbell is pressed. Additive
    to the UniFi chimes. The Formation ignores MA's announce_volume, so we
    snapshot the player volume, set a fixed chime level, play, then restore.
  triggers:
    - trigger: state
      entity_id: event.g4_doorbell_doorbell
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.to_state.state not in ['unknown', 'unavailable']
           and as_datetime(trigger.to_state.state) > now() - timedelta(seconds=30) }}
  actions:
    - variables:
        prev_volume: "{{ state_attr('media_player.living_room', 'volume_level') | float(0.32) }}"
    - action: media_player.volume_set
      target:
        entity_id: media_player.living_room
      data:
        volume_level: 0.6
    - delay:
        milliseconds: 500
    - action: music_assistant.play_announcement
      target:
        entity_id: media_player.living_room
      data:
        url: "http://10.0.0.119:8123/local/doorbell.wav"
        use_pre_announce: false
    - action: media_player.volume_set
      target:
        entity_id: media_player.living_room
      data:
        volume_level: "{{ prev_volume }}"
  mode: single

- id: burrow_switch_extras
  alias: 'Burrow switch: Shapes and fan downlight'
  description: >-
    The Burrow Hue tap switch drives the room's three Hue bulbs (bloom,
    cupboard strip, window strip) through rules stored on the Hue bridge
    itself, so they keep working over local Zigbee with no HA involved. Those
    rules can only reach Hue devices, so this automation adds the room's other
    two lights: the Nanoleaf Shapes and the Big Ass Fan downlight. Buttons 2
    and 3 light the Shapes alongside the Hue scene they fire; buttons 1 and 4
    turn both off. Button 3 picks its effect at random from three, so the
    effect names must stay in sync with what is actually loaded on the
    controller: effects live on the Nanoleaf itself and HA matches the name
    exactly, so a renamed or missing effect fails silently.

    The tap is kinetic, so every button emits a bare initial_press with no
    hold or long-press. not_from guards the restore transitions, which would
    otherwise fire the automation on restart or integration reload.
  triggers:
    - trigger: state
      entity_id: event.burrow_switch_button_2
      not_from:
        - unknown
        - unavailable
      id: bright
    - trigger: state
      entity_id: event.burrow_switch_button_3
      not_from:
        - unknown
        - unavailable
      id: orange
    - trigger: state
      entity_id:
        - event.burrow_switch_button_1
        - event.burrow_switch_button_4
      not_from:
        - unknown
        - unavailable
      id: extras_off
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: bright
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.haiku_fan_4
              data:
                brightness_pct: 70
            - action: light.turn_on
              target:
                entity_id: light.shapes_4108
              data:
                brightness_pct: 40
                effect: Sunlight through trees
        - conditions:
            - condition: trigger
              id: orange
          sequence:
            - action: light.turn_off
              target:
                entity_id: light.haiku_fan_4
            - action: light.turn_on
              target:
                entity_id: light.shapes_4108
              data:
                brightness_pct: 15
                effect: >-
                  {{ ['Aquarium', 'Retro Future', 'Vintage Modern'] | random }}
      default:
        - action: light.turn_off
          target:
            entity_id:
              - light.haiku_fan_4
              - light.shapes_4108
  mode: restart

- id: living_room_switch_extras
  alias: 'Living room switch: fan lights and night mode'
  description: >-
    The living room tap's two standing lamps are bridge-owned (Hue rules recall
    Bright, Relax and Nightlight for buttons 2, 3 and 4), so they are
    deliberately absent below. This automation adds the two Kitchen fan
    downlights, which are the Big Ass Fans covering this space -- the Living
    Room area itself has no fan.

    Button 4 is night mode and is the only button that reaches out of the room:
    it also shuts the front entry, drops the Hallway to brightness 1, and locks
    all five doors. The Hallway is a separate Hue room, so no living room button
    touches it without this automation, and buttons 1 to 3 deliberately leave it
    and the front entry alone. Hallway goes to brightness 1 rather than off on
    purpose: that is the kids' nightlight level, not a mistake.

    The locks are driven through the request booleans in packages/door_locks.yaml
    rather than directly, because HA cannot command these locks at all -- Apple
    Home does the actual locking. Consequences worth knowing: the doors lock a
    second or two after the lights, and HA gets no confirmation that any of them
    moved. Only the lock direction is wired here; night mode must never unlock
    anything.
  triggers:
    - trigger: state
      entity_id: event.living_room_switch_button_2
      not_from:
        - unknown
        - unavailable
      id: full
    - trigger: state
      entity_id: event.living_room_switch_button_3
      not_from:
        - unknown
        - unavailable
      id: dim
    - trigger: state
      entity_id: event.living_room_switch_button_4
      not_from:
        - unknown
        - unavailable
      id: night
    - trigger: state
      entity_id: event.living_room_switch_button_1
      not_from:
        - unknown
        - unavailable
      id: fans_off
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: full
          sequence:
            - action: light.turn_on
              target:
                entity_id:
                  - light.haiku_fan_2
                  - light.haiku_fan_6
              data:
                brightness_pct: 100
        - conditions:
            - condition: trigger
              id: dim
          sequence:
            - action: light.turn_on
              target:
                entity_id:
                  - light.haiku_fan_2
                  - light.haiku_fan_6
              data:
                brightness_pct: 60
        - conditions:
            - condition: trigger
              id: night
          sequence:
            - action: light.turn_off
              target:
                entity_id:
                  - light.front_entry
                  - light.haiku_fan_2
                  - light.haiku_fan_6
            - action: light.turn_on
              target:
                entity_id: light.hallway
              data:
                brightness: 1
            - action: input_boolean.turn_on
              target:
                entity_id:
                  - input_boolean.pantry_lock_request
                  - input_boolean.living_room_lock_request
                  - input_boolean.grasshopper_lock_request
                  - input_boolean.front_door_lock_request
                  - input_boolean.burrow_lock_request
      default:
        - action: light.turn_off
          target:
            entity_id:
              - light.haiku_fan_2
              - light.haiku_fan_6
  mode: single

- id: door_lock_request_reset
  alias: 'Door locks: reset request buttons'
  description: >-
    Makes the door lock request booleans (packages/door_locks.yaml) behave as
    momentary buttons. Apple Home automations trigger on an off->on edge, so a
    boolean left on would make the next identical request a no-op. Resetting it
    shortly after firing means every request is a fresh edge.

    The delay is generous because the signal has to cross the HomeKit bridge,
    reach a hub and then the lock over Bluetooth. Resetting too eagerly risks
    Apple missing the change entirely.

    Parallel mode so simultaneous requests on different doors do not queue
    behind each other; each run resets only the boolean that triggered it.
  triggers:
    - trigger: state
      entity_id:
        - input_boolean.pantry_lock_request
        - input_boolean.pantry_unlock_request
        - input_boolean.living_room_lock_request
        - input_boolean.living_room_unlock_request
        - input_boolean.grasshopper_lock_request
        - input_boolean.grasshopper_unlock_request
        - input_boolean.front_door_lock_request
        - input_boolean.front_door_unlock_request
        - input_boolean.burrow_lock_request
        - input_boolean.burrow_unlock_request
      to: "on"
  conditions: []
  actions:
    - delay:
        seconds: 10
    - action: input_boolean.turn_off
      target:
        entity_id: "{{ trigger.entity_id }}"
  mode: parallel
  max: 10
