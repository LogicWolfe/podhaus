# Flic buttons, bridged by flicd on the Pi Zero (iot/pizero/).
#
# The Pi owns the BLE link and nothing else: flicd holds hci0 exclusively via
# HCI_CHANNEL_USER and serves its own protocol on TCP 5551, which this
# integration dials. No custom code sits between the two.
#
# The address is a UniFi reservation (terraform/unifi.tf) rather than
# pizero.local, because HA's container has no mDNS resolver and the name
# would simply never resolve.
#
# The integration names entities after the address -- binary_sensor.flic_
# 80e4da73d6bd -- and there is no per-button config block to name them in.
# Automations should trigger on the flic_click event and match
# button_address, so this table is the only place the colours are recorded:
#
#   Blue    80:e4:da:73:d6:bd
#   Green   80:e4:da:73:e3:2b
#   White   80:e4:da:73:c4:f1
#   Black   80:e4:da:73:e3:32
#
# Pairing is an explicit act, done once per button with the scan wizard on
# the Pi -- see docs/runbooks/pizero.md. discovery is therefore off: leaving
# it on makes HA scan continuously, which costs radio time on a single-core
# ARMv6 board that is already holding connections to every paired button.
# Turn it on temporarily if you would rather pair by holding a button for
# seven seconds than by SSHing in.
binary_sensor:
  - platform: flic
    host: 10.0.0.77
    port: 5551
    discovery: false
    # Discard a press rather than replaying it late. Flic buttons queue
    # presses locally while out of range, so without a bound a button that
    # spent an hour disconnected would dump an hour of history into HA the
    # moment it reconnects -- firing every automation attached to it.
    timeout: 3
    # Not cosmetic filtering: this selects which fliclib callback the
    # integration registers. Ignoring double switches it to
    # on_button_click_or_hold, so a single press fires the moment the button
    # is released. With double enabled it would instead have to wait out the
    # disambiguation window on every press, which is very noticeable on a
    # button that switches a light.
    ignored_click_types:
      - double
