# HomeKit Bridge, loaded as a package (see ../homeassistant.yaml -> packages).
# To add another integration, drop a new *.yaml in this dir — no edit to the
# host-side /config/configuration.yaml is needed. A package file is a dict of
# <domain>: <config>, so the bridge list lives under a top-level `homekit:` key.
#
# Publishes selected HA entities to Apple Home so Siri can control them. HA
# stays the controller: Siri -> Apple Home -> this bridge -> HA -> device.
# advertise_ip pins bilby's LAN address so the bridge is announced on end0
# (10.0.0.119), not a docker interface. Pairing state lives in host .storage.
#
# Exposed:
#   - Hue INDIVIDUAL bulbs only. The Hue Room/Zone group lights
#     (light.living_room, light.grasshopper, ...) are deliberately NOT exposed
#     — they overlap their member bulbs and duplicate Apple Home's own rooms.
#     Group by placing bulbs in Apple Home rooms instead.
#   - Big Ass Fans: the 6 Haiku ceiling fans + their downlights. The "Haiku
#     Switch" wall-control devices are NOT exposed (their fan/light entities
#     duplicate the fans; their presence sensors are for automations, not
#     voice). entity_config gives each a room-based HomeKit name because every
#     BAF entity is otherwise just "Haiku Fan".
#   - Sensibo Sky IR blasters: all 7, one per air conditioner. These are
#     cloud-only devices with no local API and no native HomeKit (that is the
#     Air, not the Sky), so the bridge is the only route to Siri. entity_config
#     appends "Aircon" to each room name so an accessory is never named
#     identically to the Apple Home room it sits in.
homekit:
  - name: Home Assistant Bridge
    port: 21063
    advertise_ip: 10.0.0.119
    filter:
      include_entities:
        # --- Hue bulbs (individual, no room groups) ---
        - light.bookshelf_lamp
        - light.burrow_bloom
        - light.change_table_1
        - light.change_table_2
        - light.cupboard_strip
        - light.front_entry
        - light.grove_door
        - light.grove_windows
        - light.hallway
        - light.hue_outdoor_pedestal_1
        - light.hue_outdoor_pedestal_2
        - light.hue_outdoor_pedestal_3
        - light.hue_outdoor_pedestal_4
        - light.hue_outdoor_pedestal_5
        - light.hue_outdoor_pedestal_6
        - light.hue_outdoor_spot_1
        - light.hue_outdoor_spot_2
        - light.ladybug_bloom
        - light.standing_lamp_bottom
        - light.standing_lamp_top
        - light.studio_outside
        - light.studio_standing_lamp
        - light.toilet_1
        - light.toilet_2
        - light.window_strip
        # --- Big Ass Fans: fans + downlights ---
        - fan.haiku_fan
        - fan.haiku_fan_2
        - fan.haiku_fan_3
        - fan.haiku_fan_4
        - fan.haiku_fan_5
        - fan.haiku_fan_6
        - light.haiku_fan
        - light.haiku_fan_2
        - light.haiku_fan_3
        - light.haiku_fan_4
        - light.haiku_fan_5
        - light.haiku_fan_6
        # --- Sensibo Sky aircon controllers (one per room) ---
        # The doubled entity IDs are as generated: the Sensibo device and its
        # climate entity are both named for the room. Deliberately NOT renamed
        # in the entity registry — registry renames live in host .storage, which
        # is not in git, so a DR rebuild would regenerate these IDs and break
        # any reference to a prettier one.
        - climate.burrow_burrow
        - climate.garage_garage
        - climate.grasshopper_grasshopper
        - climate.grove_grove
        - climate.ladybug_ladybug
        - climate.living_room_living_room
        - climate.studio_studio
        # --- Door lock request signals (see packages/door_locks.yaml) ---
        # Published so Apple Home can watch them. HA cannot command a HomeKit
        # lock, so an Apple Home automation per entry turns an off->on edge into
        # the real lock command via a hub that has Bluetooth range. These are
        # signals, not lock state; HA never learns whether the lock moved.
        - input_boolean.pantry_lock_request
        - input_boolean.pantry_unlock_request
        - input_boolean.living_room_lock_request
        - input_boolean.living_room_unlock_request
        - input_boolean.grasshopper_lock_request
        - input_boolean.grasshopper_unlock_request
        - input_boolean.front_door_lock_request
        - input_boolean.front_door_unlock_request
        - input_boolean.burrow_lock_request
        - input_boolean.burrow_unlock_request
    entity_config:
      fan.haiku_fan: { name: Grove Fan }
      fan.haiku_fan_2: { name: Kitchen Fan }
      fan.haiku_fan_3: { name: Grasshopper Fan }
      fan.haiku_fan_4: { name: Burrow Fan }
      fan.haiku_fan_5: { name: Ladybug Fan }
      fan.haiku_fan_6: { name: Kitchen Fan 2 }
      light.haiku_fan: { name: Grove Fan Light }
      light.haiku_fan_2: { name: Kitchen Fan Light }
      light.haiku_fan_3: { name: Grasshopper Fan Light }
      light.haiku_fan_4: { name: Burrow Fan Light }
      light.haiku_fan_5: { name: Ladybug Fan Light }
      light.haiku_fan_6: { name: Kitchen Fan 2 Light }
      climate.burrow_burrow: { name: Burrow Aircon }
      climate.garage_garage: { name: Garage Aircon }
      climate.grasshopper_grasshopper: { name: Grasshopper Aircon }
      climate.grove_grove: { name: Grove Aircon }
      climate.ladybug_ladybug: { name: Ladybug Aircon }
      climate.living_room_living_room: { name: Living Room Aircon }
      climate.studio_studio: { name: Studio Aircon }
