x-podhaus-content-paths:
  - ../config

services:
  home-assistant:
    container_name: home-assistant
    image: homeassistant/home-assistant:stable
    restart: unless-stopped
    privileged: true
    network_mode: host
    # Pin music.pod.haus to bilby so HA reaches Music Assistant through
    # Caddy (real LE cert) instead of Cloudflare. music.pod.haus carries a
    # Cloudflare AAAA we can't suppress on this CF plan, and HA would
    # otherwise prefer that IPv6 → hit Cloudflare Access, which blocks
    # server-to-server clients. This IPv4-only entry means HA never sees
    # the AAAA. Pairs with the UniFi split-horizon A record
    # (terraform/dns_unifi_split_horizon.tf) + MA base_url=https://music.pod.haus.
    extra_hosts:
      - "music.pod.haus:${BILBY_LAN_IPV4}"
    environment:
      TZ: ${TZ}
      # Read by config/packages/homekit.yaml's advertise_ip through YAML's
      # !env_var tag, so the bridge announces bilby's LAN interface.
      BILBY_LAN_IPV4: ${BILBY_LAN_IPV4}
    volumes:
      # HA config + recorder SQLite DB (~85 MB). Local NVMe per the
      # post-phase-6 sizing rule. Host bind mount so the container
      # matches exactly what's on the host; :z lets SELinux relabel
      # the content for container access.
      - /var/lib/home-assistant:/config:z
      # Version-controlled HA config (automations/scripts/scenes + the
      # homeassistant/http blocks), read from the deploy tree so a push is
      # what changes it. Read-only: HA's own editors write to the /config
      # root, never here. The host /config/configuration.yaml !includes from
      # podhaus/ — see config/configuration.root.yaml.
      - ${PODHAUS_REPO}/home-assistant/config:/config/podhaus:ro,z
      - /run/dbus:/run/dbus:ro
    labels:
      autoheal: "true"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8123/ > /dev/null && ls /config > /dev/null"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
