services:
  pinelake-plex-preferences-init:
    container_name: pinelake-plex-preferences-init
    build:
      context: ../../init-tools
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_PINELAKE_PLEX_PREFERENCES_INIT:-unset}
    image: init-tools:local
    pull_policy: never
    user: "0:0"
    environment:
      PLEX_ONLINE_TOKEN: ${PLEX_ONLINE_TOKEN}
    volumes:
      - /Users/Shared/Podhaus/periphery/etc-komodo/repos/podhaus-pinelake/pinelake/plex/Preferences.xml.tmpl:/tmpl/Preferences.xml.tmpl:ro
      - /Users/Shared/Podhaus/periphery/etc-komodo/repos/podhaus-pinelake/plex/plex-preferences.py:/script/plex-preferences.py:ro
      - /Users/Shared/Podhaus/plex:/config
    command:
      - /bin/sh
      - -ec
      - |
        envsubst < /tmpl/Preferences.xml.tmpl > /tmp/rendered.xml
        python3 /script/plex-preferences.py /tmp/rendered.xml '/config/Library/Application Support/Plex Media Server/Preferences.xml'
        chown 501:20 '/config/Library/Application Support/Plex Media Server/Preferences.xml'
    restart: "no"
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}

  pinelake-plex:
    container_name: pinelake-plex
    hostname: PineLake
    image: plexinc/pms-docker:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      pinelake-plex-preferences-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
      PLEX_UID: "501"
      PLEX_GID: "20"
      CHANGE_CONFIG_DIR_OWNERSHIP: "false"
      # OrbStack host networking does not expose the macOS LAN interface to
      # Plex discovery. Use Plex's documented raw-IP form so plex.tv marks
      # this endpoint local, while retaining the public endpoint for remote
      # native clients.
      ADVERTISE_IP: "http://192.168.1.128:32400/,https://66-226-146-158.5801df40ceea4deaaefd8bd027fc22ff.plex.direct:32400"
    volumes:
      - /Users/Shared/Podhaus/plex:/config
      - /Users/Shared/Podhaus/transcode:/transcode
      - type: bind
        source: /Volumes/TerraMaster/.podhaus-terramaster
        target: /Volumes/TerraMaster/.podhaus-terramaster
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /Volumes/TerraMaster/Movies
        target: /Volumes/TerraMaster/Movies
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /Volumes/TerraMaster/TV
        target: /Volumes/TerraMaster/TV
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /Volumes/TerraMaster/Kids
        target: /Volumes/TerraMaster/Kids
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /Volumes/TerraMaster/Sports
        target: /Volumes/TerraMaster/Sports
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /Volumes/TerraMaster/Torrents
        target: /Volumes/TerraMaster/Torrents
        read_only: true
        bind:
          create_host_path: false
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
      podhaus.depends-on-pinelake-plex-preferences-init: ${BUILD_HASH_PINELAKE_PLEX_PREFERENCES_INIT:-unset}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          expected="$$(dpkg-query -W -f='$${Version}' plexmediaserver)" &&
          actual="$$(curl -fsS --max-time 10 http://127.0.0.1:32400/identity |
          sed -n '/<MediaContainer /s/.*version="\([^"]*\)".*/\1/p')" &&
          test -n "$$actual" && test "$$actual" = "$$expected" &&
          test "$$(cat /Volumes/TerraMaster/.podhaus-terramaster)" =
          "EAED18A9-74C7-4163-ACB4-406B2226FDC6"
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 180s
