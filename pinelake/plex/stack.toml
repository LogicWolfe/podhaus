[[stack]]
name = "pinelake-plex"
description = "Pine Lake Plex with preserved native identity and state"
tags = ["pinelake", "podhaus"]

[stack.config]
server = "pinelake"
linked_repo = "podhaus-pinelake"
run_directory = "pinelake/plex"
run_build = true
ignore_services = ["pinelake-plex-preferences-init"]
environment = """
TZ=[[TZ]]
PLEX_ONLINE_TOKEN=[[OP__KOMODO__PINELAKE_PLEX__TOKEN]]
"""

[stack.config.pre_deploy]
path = "/"
command = """
/etc/komodo/repos/podhaus-pinelake/pinelake/periphery/predeploy-mount-gate Movies TV Kids Sports Torrents
/etc/komodo/repos/podhaus-pinelake/pinelake/periphery/predeploy-plex-gate
"""
