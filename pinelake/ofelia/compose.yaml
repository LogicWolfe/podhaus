services:
  pinelake-ofelia:
    container_name: pinelake-ofelia
    # Not latest: Docker Hub's latest is 0.3.22, older than this beta, which
    # follows Docker events and so needs no restart at a deployment boundary.
    image: mcuadros/ofelia:0.4.0-beta.5
    restart: unless-stopped
    command: daemon --docker
    environment:
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
