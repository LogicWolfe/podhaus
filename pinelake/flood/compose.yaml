# Shared config must change the init label so the installer reruns on config-only deploys.
x-podhaus-content-paths:
  - ../../flood
services:
  pinelake-flood-init:
    container_name: pinelake-flood-init
    image: alpine:latest
    restart: "no"
    user: "0:0"
    volumes:
      - /Users/Shared/Podhaus/flood:/flood-db
      - /Users/Shared/Podhaus/periphery/etc-komodo/repos/podhaus-pinelake/flood/conf:/conf:ro
      - rtorrent-socket:/tmp
    command:
      - /bin/sh
      - -ec
      - |
        install -o 501 -g 20 -m 0644 /conf/rtorrent.rc /flood-db/.rtorrent.rc
        touch /flood-db/flood-publish.log /flood-db/flood-publish.lock \
              /flood-db/plex-label-sync.log /flood-db/plex-label-sync.lock \
              /flood-db/pinelake-stignore.log /flood-db/pinelake-stignore.lock
        chown 501:20 /flood-db/flood-publish.log /flood-db/flood-publish.lock \
              /flood-db/plex-label-sync.log /flood-db/plex-label-sync.lock \
              /flood-db/pinelake-stignore.log /flood-db/pinelake-stignore.lock
        chmod 0664 /flood-db/flood-publish.log /flood-db/flood-publish.lock \
              /flood-db/plex-label-sync.log /flood-db/plex-label-sync.lock \
              /flood-db/pinelake-stignore.log /flood-db/pinelake-stignore.lock

        chown 501:20 /tmp
        chmod 0770 /tmp
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
  pinelake-flood:
    container_name: pinelake-flood
    build:
      context: ../../flood
      dockerfile: Dockerfile.flood
      secrets:
        - flood_source_token
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_PINELAKE_FLOOD:-unset}
    image: pinelake-flood:local
    pull_policy: build
    restart: unless-stopped
    depends_on:
      pinelake-rtorrent:
        condition: service_healthy
    command: --auth=none --rtsocket=/tmp/rtorrent.sock
    user: "501:20"
    network_mode: host
    environment:
      HOME: /flood-db
      FLOOD_SECRET: ${FLOOD_SECRET}
      TZ: ${TZ}
      LOG_FORMAT: json
    # Failed upload bytes are private and disappear on every container restart.
    tmpfs:
      - /tmp/failed-uploads:rw,noexec,nosuid,nodev,size=128m,mode=0700,uid=501,gid=20
    volumes:
      - /Users/Shared/Podhaus/flood:/flood-db
      - type: bind
        source: /Volumes/TerraMaster/Torrents
        target: /data
        bind:
          # A missing external volume must fail instead of creating a local stub.
          create_host_path: false
      - type: bind
        source: /Volumes/TerraMaster/.podhaus-terramaster
        target: /Volumes/TerraMaster/.podhaus-terramaster
        read_only: true
        bind:
          # A missing external volume must fail instead of creating a local stub.
          create_host_path: false
      - rtorrent-socket:/tmp
    labels:
      autoheal: 'true'
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
      podhaus.depends-on-pinelake-rtorrent: ${BUILD_HASH_PINELAKE_RTORRENT:-unset}
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 10 sh -c 'wget -qO- http://127.0.0.1:3000/ >/dev/null && grep -q " /flood-db " /proc/mounts &&
          test "$$(cat /Volumes/TerraMaster/.podhaus-terramaster)" = "EAED18A9-74C7-4163-ACB4-406B2226FDC6"'
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
  pinelake-rtorrent:
    container_name: pinelake-rtorrent
    build:
      context: ../../flood
      dockerfile: Dockerfile.rtorrent
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_PINELAKE_RTORRENT:-unset}
    image: pinelake-rtorrent:local
    pull_policy: build
    restart: unless-stopped
    depends_on:
      pinelake-flood-init:
        condition: service_completed_successfully
    user: "501:20"
    network_mode: host
    environment:
      HOME: /flood-db
      GATUS_OFELIA_PUSH_TOKEN: ${GATUS_OFELIA_PUSH_TOKEN}
      GATUS_BASE_URL: https://gatus.pod.haus
      GATUS_LABEL_SYNC_ENDPOINT_ID: torrents_pinelake-plex-label-sync
      GATUS_RAR_ENDPOINT_ID: torrents_pinelake-rar-extraction
      PINELAKE_STIGNORE_SOURCE: 'false'
      # Native Plex needs the macOS external-volume path.
      PLEX_MEDIA_ROOT: /Volumes/TerraMaster/Torrents
      PLEX_URL: http://127.0.0.1:32400
      PLEX_TOKEN: ${PLEX_ONLINE_TOKEN}
      TZ: ${TZ}
    volumes:
      - /Users/Shared/Podhaus/flood:/flood-db
      - type: bind
        source: /Volumes/TerraMaster/Torrents
        target: /data
        bind:
          # A missing external volume must fail instead of creating a local stub.
          create_host_path: false
      - type: bind
        source: /Volumes/TerraMaster/.podhaus-terramaster
        target: /Volumes/TerraMaster/.podhaus-terramaster
        read_only: true
        bind:
          # A missing external volume must fail instead of creating a local stub.
          create_host_path: false
      - /Users/Shared/Podhaus/periphery/etc-komodo/repos/podhaus-pinelake/flood/scripts:/scripts:ro
      - rtorrent-socket:/tmp
    labels:
      autoheal: 'true'
      ofelia.enabled: 'true'
      ofelia.job-exec.rar-backlog.schedule: 0 50 4 * * *
      ofelia.job-exec.rar-backlog.command: /scripts/rar-backlog.sh
      ofelia.job-exec.flood-publish.schedule: 0 * * * * *
      ofelia.job-exec.flood-publish.command: python3 /scripts/flood-publish.py
      ofelia.job-exec.flood-publish.user: '501:20'
      ofelia.job-exec.plex-label-sync.schedule: 0 */5 * * * *
      ofelia.job-exec.plex-label-sync.command: python3 /scripts/plex-label-sync.py
      ofelia.job-exec.plex-label-sync.user: '501:20'
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
      autoheal.stop.timeout: '120'
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 10 python3 /scripts/rtorrent-health.py /Volumes/TerraMaster/.podhaus-terramaster EAED18A9-74C7-4163-ACB4-406B2226FDC6
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    stop_grace_period: 2m
# Keep Unix sockets in OrbStack's Linux volume, not on APFS.
volumes:
  rtorrent-socket: {}
secrets:
  flood_source_token:
    environment: FLOOD_SOURCE_TOKEN
