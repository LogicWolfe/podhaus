# Cloudflare Tunnel ingress rules. Bind-mounted into the cloudflared
# container at /etc/cloudflared/config.yml. Edit, commit, ./komodo-sync.
#
# Anything not listed here returns 404 at the tunnel edge. New service?
# Add a hostname rule below, then add a matching CNAME in dns/dnsconfig.js
# pointing at the tunnel id, and an Access policy if it should be gated.
tunnel: cc68c7c9-1dad-42aa-af04-46119d3e515f
credentials-file: /etc/cloudflared/credentials.json
ingress:
  - hostname: backup.pod.haus
    # Backrest UI on bilby. Backrest is on dockernet alongside cloudflared,
    # so resolve by container name. Backrest's own auth is disabled in
    # config.json.tmpl — Cloudflare Access (`*.pod.haus` wildcard app) is
    # the sole gate.
    service: http://backrest:9898
  - hostname: kangaroo-backup.pod.haus
    # Backrest UI on kangaroo. cloudflared lives on bilby, so route via
    # the LAN to kangaroo's published :9898 (same path as kangaroo.pod.haus
    # → 10.0.0.25:8080). Hyphenated single-label hostname intentional —
    # keeps it under the `*.pod.haus` Access wildcard, which only covers
    # one label.
    service: http://10.0.0.25:9898
  - hostname: komodo.pod.haus
    service: http://komodo-core:9120
  - hostname: torrent.pod.haus
    service: http://flood:3000
  - hostname: home.pod.haus
    service: http://172.18.0.1:8123
  - hostname: kangaroo.pod.haus
    service: http://10.0.0.25:8080
  - hostname: sync.pod.haus
    # Syncthing now lives on kangaroo (Phase 16). bilby's cloudflared
    # routes LAN-side over the switch to the QNAP at 10.0.0.25:8384,
    # same fabric NFS mounts already use. Previously routed to
    # 172.18.0.1:8384 (bilby host gateway) before Phase 16.
    service: http://10.0.0.25:8384
  - hostname: unifi.pod.haus
    service: https://10.0.0.1:443
    originRequest:
      noTLSVerify: true
  - hostname: paperless.pod.haus
    service: http://paperless:8000
  - hostname: plex.pod.haus
    # Plex runs with network_mode: host, so reach it via the dockernet
    # bridge gateway IP (same pattern as home.pod.haus + sync.pod.haus).
    # This hostname is web-only — native Plex clients continue to use
    # plex.tv discovery (LAN / direct WAN / Relay) and are deliberately
    # not told about this URL via customConnections.
    service: http://172.18.0.1:32400
  - hostname: logs.pod.haus
    service: http://victoria-logs:9428
  - hostname: gatus.pod.haus
    service: http://gatus:8080
  - hostname: grafana.pod.haus
    service: http://grafana:3000
  - hostname: docs.pod.haus
    service: http://docs-server:80
  - hostname: minio.pod.haus
    # MinIO console UI. The S3 API stays internal on `http://minio:9000`
    # (dockernet only); the console is the only externally-reachable
    # surface. Gated by the existing `*.pod.haus` Cloudflare Access app.
    service: http://minio:9001
  - service: http_status:404
