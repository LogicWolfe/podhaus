configs:
  # tunnel-credentials stays as a compose `config` because it's an
  # env-sourced secret blob (TUNNEL_CREDENTIALS comes from 1P via
  # Komodo). The ingress rules used to live in conf/config.yml here
  # too — they now live in cloudflare/tunnel.tf, are stored in the
  # Cloudflare API, and cloudflared fetches them at start (and on
  # change) via the tunnel control-plane connection.
  tunnel-credentials:
    environment: TUNNEL_CREDENTIALS

services:
  cloudflare-tunnel:
    container_name: cloudflare-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # No --config flag — cloudflared fetches its ingress configuration
    # from the Cloudflare API (`source = "cloudflare"` on the
    # cloudflare_zero_trust_tunnel_cloudflared_config resource). Adding
    # --config would pin cloudflared to a local YAML and override the
    # remote config, defeating the TF-managed flow.
    #
    # The tunnel ID is the last positional argument to `tunnel run` —
    # required when not reading it from a config file. The
    # credentials.json mounted below contains this UUID too; cloudflared
    # uses the credential at runtime to authenticate the tunnel session
    # but still wants the ID explicitly on the command line.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --credentials-file /etc/cloudflared/credentials.json run cc68c7c9-1dad-42aa-af04-46119d3e515f
    configs:
      - source: tunnel-credentials
        target: /etc/cloudflared/credentials.json
    # No healthcheck / autoheal: the cloudflared image is distroless (no
    # shell, wget, or curl) so in-container probes can't reach /ready on
    # port 20241. cloudflared handles its own reconnection, and a true
    # crash is caught by `restart: unless-stopped`. External liveness is
    # monitored by Gatus hitting the public hostnames.
    networks:
      - dockernet

    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
networks:
  dockernet:
    external: true
