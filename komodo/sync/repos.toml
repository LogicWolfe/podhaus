# Komodo Repo (Linked Repo) resources.
#
# Each [[repo]] block declares a git remote that a Periphery host clones
# locally. Stacks targeted at remote Peripheries reference the repo by
# name + a relative path inside it for their compose files.
#
# Why this exists: Komodo's `files_on_host = true` mode requires the
# compose file to physically exist on the Periphery host's filesystem.
# Bilby has the repo bind-mounted into its Periphery container (see
# bilby/periphery/compose.yaml), so its stacks use files_on_host.
# Kangaroo (and any future remote Periphery host) doesn't, so we declare
# a Linked Repo and let Periphery do the clone. Auth via the github
# git_provider configured in each Periphery's periphery.config.toml.

[[repo]]
name = "podhaus"
description = "Komodo-managed clone of this monorepo on kangaroo's Periphery"
tags = ["podhaus", "kangaroo"]

[repo.config]
server = "kangaroo"
git_provider = "github.com"
git_account = "LogicWolfe"
repo = "LogicWolfe/podhaus"
branch = "main"

# Bandicoot clone of the fenwick monorepo. The fenwick repo carries
# its own stack defs (both the bot and the credential-redactor
# service) — see fenwick-push-deploy in procedures.toml. It follows
# the Forgejo `deploy` branch, not `main`: green Forgejo Actions is
# the only writer that advances this promotion pointer. Moved from
# bilby 2026-09-09 so the Fenwick family can reach op-connect-api on
# bandicoot's dockernet by name again; git.pod.haus resolves via
# bandicoot's Periphery extra_hosts entry (see bandicoot/periphery/
# compose.yaml).
[[repo]]
name = "fenwick"
description = "Komodo-managed clone of the fenwick monorepo on bandicoot's Periphery"
tags = ["podhaus", "bandicoot", "fenwick"]

[repo.config]
server = "bandicoot"
git_provider = "git.pod.haus"
git_account = "LogicWolfe"
repo = "LogicWolfe/fenwick"
branch = "deploy"

