# fractal's own clone of the docs-server repo. A separate Repo resource from
# bilby's `docs-server` because Repo resources are per-Periphery — each host's
# clone is independent state.
[[repo]]
name = "docs-server-fractal"
description = "Komodo-managed clone of the docs-server repo on fractal's Periphery"
tags = ["podhaus", "fractal", "docs"]

[repo.config]
server = "fractal"
git_provider = "github.com"
git_account = "LogicWolfe"
repo = "LogicWolfe/docs-server"
branch = "main"

