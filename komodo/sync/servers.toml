[[server]]
name = "podhaus"
description = "Primary home server (Linux)"
tags = ["podhaus"]

[server.config]
# bilby's Periphery is in the same compose as Core (komodo/ferretdb.compose.yaml).
# Core dials it via docker DNS on the internal `default` network. Inbound mode.
address = "https://periphery:8120"
enabled = true
disk_warning = 85.0
disk_critical = 95.0

[[server]]
name = "kangaroo"
description = "QNAP NAS — second deploy target (Container Station). v2 outbound: Periphery dials Core."
tags = ["kangaroo"]

[server.config]
# Outbound mode (v2 PKI noise handshake). `address = ""` signals to Core
# that this Server expects Periphery→Core direction — the kangaroo
# Periphery dials Core at ws://10.0.0.119:9120 (its PERIPHERY_CORE_ADDRESSES).
# Auth is the X25519 keypair handshake (kangaroo-periphery.pub trusted by
# Core's KOMODO_PERIPHERY_PUBLIC_KEYS list). Port 8120 is not published on
# kangaroo; its internal listener exists only for the local healthcheck.
address = ""
enabled = true
# kangaroo is a NAS — saturating CPU on downloads, Plex transcodes, and RAID
# scrubs is normal, healthy behaviour, not a fault. Komodo's CPU alert is an
# instantaneous threshold with no sustained-duration window, and these jobs hit
# a genuine 100%, so no threshold can distinguish them from a real runaway.
# Disable CPU alerts here; real kangaroo failures still surface via
# ServerUnreachable, the Gatus Periphery check, disk thresholds, and
# StackStateChange.
send_cpu_alerts = false
disk_warning = 85.0
disk_critical = 95.0

[[server]]
name = "kookaburra"
description = "DigitalOcean droplet (syd1, Fedora) — off-LAN public-ingress relay host. v2 outbound: Periphery dials Core over tailnet."
tags = ["kookaburra", "podhaus"]

[server.config]
# Outbound mode (v2 PKI noise handshake). kookaburra Periphery dials Core
# at ws://bilby-podnet:9120 over tailnet (its PERIPHERY_CORE_ADDRESSES).
# Auth is the X25519 keypair handshake. Port 8120 is not published on
# kookaburra; its internal listener is healthcheck-only. The public surface is
# just :443 (rathole data) +
# :2333 (rathole control); the management plane is tailnet-only.
address = ""
enabled = true
disk_warning = 85.0
disk_critical = 95.0

[[server]]
name = "numbat"
description = "BinaryLane Perth gateway. v2 outbound Periphery returns through rathole."
tags = ["numbat", "podhaus"]

[server.config]
address = ""
enabled = true
disk_warning = 85.0
disk_critical = 95.0

[[server]]
name = "fractal"
description = "Fedora 44 under WSL2 on a Windows desktop. Remote dev machine + docs host. v2 outbound: Periphery dials Core at core-connect.pod.haus."
tags = ["fractal", "podhaus"]

[server.config]
# Outbound mode (v2 PKI noise handshake). fractal has no reachable inbound
# address at all — its LAN address is the Windows host, which forwards only
# :22 into the guest — so every path in and out is a connection fractal
# makes. Port 8120 is not published.
address = ""
enabled = true
# A developer machine running builds and test suites hits 100% CPU as normal
# behaviour, the same argument as kangaroo. Real failures still surface via
# ServerUnreachable and StackStateChange.
send_cpu_alerts = false
disk_warning = 85.0
disk_critical = 95.0
