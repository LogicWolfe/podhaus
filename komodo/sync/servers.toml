[[server]]
name = "podhaus"
description = "Primary home server (Linux)"
tags = ["podhaus"]

[server.config]
address = "https://periphery:8120"
enabled = true
disk_warning = 85.0
disk_critical = 95.0

[[server]]
name = "kangaroo"
description = "QNAP NAS — second deploy target (Container Station)"
tags = ["kangaroo"]

[server.config]
address = "https://10.0.0.25:8120"
enabled = true
disk_warning = 85.0
disk_critical = 95.0

[[server]]
name = "kookaburra"
description = "DigitalOcean droplet (syd1, Fedora) — off-LAN public-ingress relay host. Periphery reached only over Tailscale (tag:podnet); the public path is just :443 (rathole data) + :2333 (rathole control)."
tags = ["kookaburra", "podhaus"]

[server.config]
# kookaburra-podnet's MagicDNS FQDN. bilby's /etc/docker/daemon.json
# sets dns: [100.100.100.100, 1.1.1.1] so the Docker embedded DNS
# resolver (127.0.0.11) forwards unknown names to Tailscale's
# MagicDNS first — Komodo Core resolves this FQDN to whatever
# tailnet IP kookaburra-podnet currently holds, so droplet rebuilds
# (which mint a fresh tailnet IP) no longer require editing this
# field. Service-name resolution for ferretdb/caddy etc. still
# works because the embedded resolver handles those internally,
# before forwarding. Periphery is never internet-exposed (DO
# firewall blocks 8120; reaches only via WireGuard tailnet —
# tag:podnet ACL gates it).
address = "https://kookaburra-podnet.tail9ceb.ts.net:8120"
enabled = true
disk_warning = 85.0
disk_critical = 95.0
