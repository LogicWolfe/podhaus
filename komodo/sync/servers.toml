[[server]]
name = "podhaus"
description = "Primary home server (Linux)"
tags = ["podhaus"]

[server.config]
address = "https://periphery:8120"
enabled = true
disk_warning = 85.0
disk_critical = 95.0

[[server]]
name = "kangaroo"
description = "QNAP NAS — second deploy target (Container Station)"
tags = ["kangaroo"]

[server.config]
address = "https://10.0.0.25:8120"
enabled = true
disk_warning = 85.0
disk_critical = 95.0

[[server]]
name = "kookaburra"
description = "DigitalOcean droplet (syd1, Fedora) — off-LAN public-ingress relay host. Periphery reached only over Tailscale (tag:podnet); the public path is just :443 (rathole data) + :2333 (rathole control)."
tags = ["kookaburra", "podhaus"]

[server.config]
# kookaburra-podnet's tailnet IP. The hostname (MagicDNS FQDN
# kookaburra-podnet.tail9ceb.ts.net) would be cleaner, but per-
# container dns: replaces Docker's embedded DNS — Komodo Core then
# loses service-name resolution for ferretdb/caddy. Daemon-wide
# dns config (/etc/docker/daemon.json on bilby host) is the proper
# fix and is the deferred follow-up. The IP is stable across stack
# redeploys on the SAME droplet (volume tailscale-state preserves
# machine identity); across DROPLET rebuilds the IP changes because
# the volume is local Docker storage on the droplet. Update this
# field as part of any droplet rebuild (terraform apply -replace).
# Periphery is never internet-exposed (DO firewall blocks 8120;
# reaches only via WireGuard tailnet — tag:podnet ACL gates it).
address = "https://100.75.34.3:8120"
enabled = true
disk_warning = 85.0
disk_critical = 95.0
