[[server]]
name = "podhaus"
description = "Primary home server (Linux)"
tags = ["podhaus"]

[server.config]
address = "https://periphery:8120"
enabled = true
disk_warning = 85.0
disk_critical = 95.0

[[server]]
name = "kangaroo"
description = "QNAP NAS — second deploy target (Container Station)"
tags = ["kangaroo"]

[server.config]
address = "https://10.0.0.25:8120"
enabled = true
disk_warning = 85.0
disk_critical = 95.0

[[server]]
name = "kookaburra"
description = "DigitalOcean droplet (syd1, Fedora) — off-LAN public-ingress relay host. Periphery reached only over Tailscale (tag:podnet); the public path is just :443 (rathole data) + :2333 (rathole control)."
tags = ["kookaburra", "podhaus"]

[server.config]
# kookaburra's tailnet IP — Periphery is never internet-exposed
# (DO firewall blocks 8120 publicly; this only reaches via the
# WireGuard tailnet bilby's own tailscale stack joined). IP changes
# when tailscale's persistent state volume is reset (e.g., during
# the bootstrap→Komodo cutover, since the projects use different
# named volumes). Update here on each such re-registration.
address = "https://100.109.22.101:8120"
enabled = true
disk_warning = 85.0
disk_critical = 95.0
