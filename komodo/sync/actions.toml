# Komodo Actions for podhaus.
#
# Actions are Deno scripts Komodo Core spawns with `deno run
# --allow-all`. Core prepends a preamble providing:
#   - `komodo`   : KomodoClient pre-authenticated with a per-execution
#                  API key (auto-rotated; never persisted)
#   - `YAML`     : @std/yaml parser/stringifier
#   - `TOML`     : @std/toml parser/stringifier
#   - `ARGS`     : invocation args (from `RunAction.args` / RunAction
#                  execution params), parsed per `arguments_format`
# User script lives inside an implicit `async function main()`.
#
# Filesystem: scripts run inside the Komodo Core container, which
# bind-mounts the Komodo-owned deploy tree at `/syncs/podhaus` — same
# content the Periphery on bilby sees at `/etc/komodo/repo/`, just a
# different mount point. Core additionally bind-mounts bilby's working
# checkout read-only at `/syncs/podhaus-local`, read only by
# podhaus-load-local-tree.

[[action]]
name = "podhaus-load-local-tree"
description = """
Mirrors bilby's working checkout (tracked + untracked-unignored files) \
into the deploy tree at /syncs/podhaus, so ./komodo-sync deploys \
exactly what is local regardless of origin/main. Counterpart feeder to \
podhaus-push-deploy's PullRepo stage; step 0 of komodo-sync, run before \
the out-of-procedure RunSync which reads the tree this writes. See \
docs/komodo.html#operating-models.\
"""
tags = ["podhaus"]

[action.config]
run_at_startup = false
schedule_enabled = false
schedule = ""
failure_alert = true
webhook_enabled = false
reload_deno_deps = false

file_contents = """
// podhaus-load-local-tree
//
// Mirrors the working checkout (bind-mounted read-only at
// /syncs/podhaus-local) into the Komodo-owned deploy tree
// (/syncs/podhaus) that every deploy-side consumer reads: the
// ResourceSync, the content-hash action, and every files_on_host
// stack's run_directory. Step 0 of komodo-sync — must run before the
// out-of-procedure RunSync, which reads the tree this writes.
//
// \"Tracked + untracked-unignored\" is git's own ls-files vocabulary:
// enumerate that set on both sides, copy the source set onto the
// deploy tree, then delete anything the deploy tree has that the
// source set doesn't. Never touches .git/ or anything git-ignored,
// which is exactly what keeps Komodo's deploy-written `.env` (rendered
// secrets + STACK_CONTENT_HASH) alive across every run: `.env` is
// git-ignored, so git never lists it on either side and the deletion
// pass never sees it.

const SRC = '/syncs/podhaus-local';
const DST = '/syncs/podhaus';
const NUL = String.fromCharCode(0);

async function exists(path) {
  try {
    await Deno.stat(path);
    return true;
  } catch (e) {
    if (e instanceof Deno.errors.NotFound) return false;
    throw e;
  }
}

// Enumerate tracked + untracked-but-not-ignored files in a repo via git
// itself, rather than a hand-rolled directory walk (AGENTS.md \"Use
// upstream primitives over hand-rolled regex/utility code\"). `-c
// safe.directory=<dir>` is required for SRC (nathan-owned; Core runs as
// root and git refuses to operate on a repo owned by another uid
// without it) and harmless for DST (already root-owned).
async function enumerate(dir) {
  const cmd = new Deno.Command('git', {
    args: [
      '-C', dir,
      '-c', `safe.directory=${dir}`,
      'ls-files', '--cached', '--others', '--exclude-standard', '-z',
    ],
    stdout: 'piped',
    stderr: 'piped',
  });
  const { code, stdout, stderr } = await cmd.output();
  if (code !== 0) {
    throw new Error(`git ls-files failed in ${dir}: ${new TextDecoder().decode(stderr)}`);
  }
  return new TextDecoder().decode(stdout)
    .split(NUL)
    .filter((rel) => rel.length > 0);
}

// --- main ---

if (!(await exists(`${DST}/.git`))) {
  throw new Error(`${DST}/.git is missing — the komodo-start bootstrap has not created the deploy tree yet`);
}
if (!(await exists(`${SRC}/.git`))) {
  throw new Error(`${SRC}/.git is missing — the /syncs/podhaus-local mount is absent or misconfigured`);
}

// Copy pass: mirror every file the checkout enumerates. A path that's
// indexed but missing on disk (e.g. an uncommitted `git rm`) is skipped
// and excluded from the \"present\" set below — a deleted-but-still-
// indexed file must never deploy.
const srcFiles = await enumerate(SRC);
const present = new Set();
let copied = 0;
let skippedMissing = 0;

for (const rel of srcFiles) {
  const srcPath = `${SRC}/${rel}`;
  let st;
  try {
    st = await Deno.stat(srcPath);
  } catch (e) {
    if (e instanceof Deno.errors.NotFound) {
      skippedMissing++;
      continue;
    }
    throw e;
  }
  if (!st.isFile) continue;

  const dstPath = `${DST}/${rel}`;
  const lastSlash = rel.lastIndexOf('/');
  if (lastSlash !== -1) {
    await Deno.mkdir(`${DST}/${rel.substring(0, lastSlash)}`, { recursive: true });
  }
  await Deno.copyFile(srcPath, dstPath); // preserves the executable bit
  present.add(rel);
  copied++;
}

// Delete pass: anything the deploy tree has (per its own git
// enumeration) that the checkout's present set doesn't. Ignored files
// on either side (.env, komodo/.runtime, OP_SERVICE_ACCOUNT_TOKEN)
// never appear in either enumeration, so they're never candidates here.
const dstFiles = await enumerate(DST);
let deleted = 0;
const deletedParents = new Set();
for (const rel of dstFiles) {
  if (present.has(rel)) continue;
  await Deno.remove(`${DST}/${rel}`);
  deleted++;
  const lastSlash = rel.lastIndexOf('/');
  if (lastSlash !== -1) deletedParents.add(`${DST}/${rel.substring(0, lastSlash)}`);
}

// Prune directories left empty by the delete pass, walking up from each
// deleted file's parent and stopping at DST. \"Not empty\" is expected
// (a sibling file still lives there, or a nested walk already pruned
// down to here) and swallowed; anything else propagates.
for (const startDir of deletedParents) {
  let dir = startDir;
  while (dir.length > DST.length && dir.startsWith(`${DST}/`)) {
    try {
      await Deno.remove(dir);
    } catch (e) {
      if (e instanceof Deno.errors.NotFound) break; // already pruned by another walk
      if (/not empty/i.test(e.message ?? '')) break; // still has content; so do its parents
      throw e;
    }
    dir = dir.substring(0, dir.lastIndexOf('/'));
  }
}

console.log(
  `[podhaus-load-local-tree] copied=${copied} skipped-missing=${skippedMissing} deleted=${deleted}`
);
"""

[[action]]
name = "podhaus-inject-content-hashes"
description = """
Compute per-service content hashes from the deploy tree, inject \
STACK_CONTENT_HASH + per-service BUILD_HASH_<name> into each podhaus \
stack's stored env, then force-deploy any stack whose running container \
carries a stale label or baked build hash while its compose text is unchanged — the \
config-only / build-context changes Komodo's DeployStackIfChanged can't \
see. Stage 1 of `podhaus-deploy`. See AGENTS.md \"Content-hash \
change detection\" for the architectural rationale.\
"""
tags = ["podhaus"]

[action.config]
# Triggered only as a stage of `podhaus-deploy` (reached through the
# podhaus-push-deploy webhook and through komodo-sync). Never on schedule,
# never at Komodo Core startup (the latter being a chicken-and-egg
# window where stacks may not yet be loaded).
run_at_startup = false
schedule_enabled = false
schedule = ""
failure_alert = true
webhook_enabled = false
# Don't pull deno deps on every run — first run primes the cache,
# subsequent runs reuse it. Flip to true if the @std versions
# referenced below ever go stale.
reload_deno_deps = false

file_contents = """
// podhaus-inject-content-hashes
//
// Two responsibilities, run as Stage 1 of `podhaus-deploy`:
//   (1) inject per-stack content hashes into stored env, and
//   (2) force-deploy stacks whose running containers carry a stale hash
//       label or baked build hash but whose compose text is unchanged (the reconcile at the
//       bottom). (2) is what actually makes the hashes load-bearing —
//       see the long note above that pass.
//
// The two hashes, injected idempotently into stack.config.environment:
//
//   STACK_CONTENT_HASH=<hash>
//     Hash of the stack's COMMITTED directory contents (the deploy-
//     written `.env` is excluded — see hashDir). Every service carries a
//     `podhaus.stack-content-hash` label referencing it; the reconcile
//     recreates the stack when the running label drifts from this.
//
//   BUILD_HASH_<SERVICE>=<hash>
//     One entry per service that has `build:` in this stack's compose.
//     The hash is computed over the resolved build context directory
//     (which may live outside the stack — `init-tools/`, `relay/`, etc.).
//     The owning build service uses this in its own `build.args` (busts
//     docker's layer cache on context change); services that
//     `depends_on` it use this in a `podhaus.depends-on-<svc>` label
//     (compose recreates the depender when the dependent's image rebuilds).
//     Service names with dashes / dots become underscores; whole name
//     is uppercased to match shell env-var conventions.
//
// Why the injected env is necessary but NOT sufficient: it lands in
// stack.config.environment via UpdateStack, which Komodo writes to .env
// at deploy time so the label renders to the real hash. But Komodo's
// DeployStackIfChanged (Stage 2) decides \"changed\" by diffing the
// compose-file TEXT — and the hashes live in `${VAR}` refs, so a hash
// change never alters that text. Stage 2 therefore never deploys on a
// hash change alone (proven 2026-06-18). The reconcile below is the
// trigger; Stage 2 is left to own compose-text changes + new stacks.
// Works uniformly for files_on_host and linked_repo stacks — the hashes
// come from the deploy tree, and the reconcile reads each
// stack's containers on their own host.

const REPO_ROOT = '/syncs/podhaus';
const NL = String.fromCharCode(10);

// run_directory → path relative to the repo root.
// files_on_host stacks have absolute /etc/komodo/repo/<rel> paths;
// linked_repo stacks have relative paths (e.g. the fenwick stacks)
// and aren't in our mount — they get skipped via the stat below.
function stackRelToRepo(runDir) {
  if (!runDir) return null;
  if (runDir.startsWith('/etc/komodo/repo/')) {
    return runDir.substring('/etc/komodo/repo/'.length);
  }
  if (runDir.startsWith('/')) return null; // absolute, outside our mount
  return runDir;
}

// Service name → env-var-safe identifier (uppercase, non-alnum → underscore).
function envSafeName(svc) {
  return svc.toUpperCase().replace(/[^A-Z0-9]/g, '_');
}

// Resolve `..` and `.` segments in an already-joined path.
function normalize(p) {
  const parts = p.split('/');
  const out = [];
  for (const seg of parts) {
    if (seg === '' || seg === '.') continue;
    if (seg === '..') { out.pop(); continue; }
    out.push(seg);
  }
  return (p.startsWith('/') ? '/' : '') + out.join('/');
}

// Walk a directory and hash sorted (relpath, content) tuples into a sha256.
// Returns 16-hex truncated digest (deterministic, plenty of entropy for
// cache-busting). Filesystem errors propagate — partial hashes would
// silently poison Stage 2's IfChanged baseline.
async function hashDir(absDir) {
  const files = [];
  async function recurse(d, rel) {
    for await (const entry of Deno.readDir(d)) {
      const child = `${d}/${entry.name}`;
      const childRel = rel ? `${rel}/${entry.name}` : entry.name;
      if (entry.isDirectory) {
        await recurse(child, childRel);
      } else if (entry.isFile) {
        // Exclude `.env`: Komodo writes a rendered `.env` (resolved
        // secrets + the self-referential STACK_CONTENT_HASH) into each
        // stack's run_directory at DEPLOY time. Hashing it would make the
        // hash depend on its own previous output — it never converges
        // (every deploy rewrites .env with the hash it just stamped, so
        // the next hash differs) — and would fold secret values into the
        // trigger. The hash must reflect COMMITTED content only. See
        // AGENTS.md \"Content-hash change detection\".
        if (entry.name === '.env') continue;
        files.push({ rel: childRel, data: await Deno.readFile(child) });
      }
    }
  }
  await recurse(absDir, '');
  files.sort((a, b) => (a.rel < b.rel ? -1 : a.rel > b.rel ? 1 : 0));

  const enc = new TextEncoder();
  const parts = [];
  for (const f of files) {
    parts.push(enc.encode(f.rel));
    parts.push(new Uint8Array([0]));
    parts.push(f.data);
    parts.push(new Uint8Array([0]));
  }
  const totalLen = parts.reduce((s, p) => s + p.length, 0);
  const buf = new Uint8Array(totalLen);
  let off = 0;
  for (const p of parts) { buf.set(p, off); off += p.length; }
  const digestBuf = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digestBuf))
    .map((b) => b.toString(16).padStart(2, '0'))
    .join('')
    .slice(0, 16);
}

// Resolve compose file paths for a stack (from stack.config.file_paths,
// default `compose.yaml`). Returns absolute paths to existing files.
async function resolveComposeFiles(stackDir, filePaths) {
  const paths = filePaths && filePaths.length > 0 ? filePaths : ['compose.yaml'];
  const out = [];
  for (const fp of paths) {
    const abs = fp.startsWith('/') ? fp : `${stackDir}/${fp}`;
    try {
      const st = await Deno.stat(abs);
      if (st.isFile) out.push(abs);
    } catch { /* missing; skip */ }
  }
  return out;
}

// Parse compose files for services that have `build:`. Returns a map of
// service-name -> resolved absolute build-context directory.
//
// docker compose resolves a relative `build.context` against the directory
// of the FIRST -f compose file, regardless of which file the service is
// defined in. Match that convention so multi-file stacks where the build
// directive lives in a non-first file (e.g. backup/bilby's
// file_paths = ["../compose.shared.yaml", "compose.yaml"] with build: in
// compose.yaml) resolve the same path docker does.
async function buildContexts(composeFiles) {
  if (composeFiles.length === 0) return {};
  const firstFile = composeFiles[0];
  const firstDir = normalize(firstFile.substring(0, firstFile.lastIndexOf('/')));
  // Walk in order; later files' service entries can override earlier ones'.
  const merged = {};
  for (const cf of composeFiles) {
    let text;
    try { text = await Deno.readTextFile(cf); } catch { continue; }
    let doc;
    try { doc = YAML.parse(text); } catch { continue; }
    const services = doc?.services;
    if (!services || typeof services !== 'object') continue;
    for (const [svc, def] of Object.entries(services)) {
      if (!def || typeof def !== 'object') continue;
      const build = def.build;
      if (build == null) continue;
      let ctx;
      if (typeof build === 'string') {
        ctx = build;
      } else if (typeof build === 'object') {
        ctx = build.context ?? '.';
      } else {
        continue;
      }
      const absCtx = ctx.startsWith('/') ? ctx : normalize(`${firstDir}/${ctx}`);
      merged[svc] = absCtx;
    }
  }
  return merged;
}

// Parse compose files for each service's container_name and the set of
// podhaus.* hash labels it declares. Used by the post-injection reconcile
// to compare a stack's freshly computed hashes against what its running
// containers actually carry. Returns svc -> { containerName, labelKeys }.
async function parseServiceMeta(composeFiles) {
  const merged = {};
  for (const cf of composeFiles) {
    let doc;
    try { doc = YAML.parse(await Deno.readTextFile(cf)); } catch { continue; }
    const services = doc?.services;
    if (!services || typeof services !== 'object') continue;
    for (const [svc, def] of Object.entries(services)) {
      if (!def || typeof def !== 'object') continue;
      const cur = merged[svc] ?? { containerName: null, labelKeys: [] };
      if (typeof def.container_name === 'string') cur.containerName = def.container_name;
      const keys = new Set(cur.labelKeys);
      const labels = def.labels;
      if (Array.isArray(labels)) {
        for (const item of labels) {
          if (typeof item === 'string') {
            const k = item.split('=')[0];
            if (k.startsWith('podhaus.')) keys.add(k);
          }
        }
      } else if (labels && typeof labels === 'object') {
        for (const k of Object.keys(labels)) {
          if (k.startsWith('podhaus.')) keys.add(k);
        }
      }
      cur.labelKeys = Array.from(keys);
      merged[svc] = cur;
    }
  }
  return merged;
}

// --- main ---

// Build the linked-repo allowlist by name. Stacks tied to a linked_repo
// outside this set point at a different working tree (fenwick lives in
// its own repo) and would resolve run_directory against the wrong root.
const repos = await komodo.read('ListRepos', {});
const podhausRepoIds = new Set(
  repos
    .filter((r) => r.name === 'podhaus' || r.name.startsWith('podhaus-'))
    .map((r) => r.id),
);

const stacksSummary = await komodo.read('ListStacks', {});

let processed = 0;
let updated = 0;
let skipped = 0;
const stackPlans = [];

for (const s of stacksSummary) {
  const stack = await komodo.read('GetStack', { stack: s.id ?? s.name });

  const linkedRepo = stack.config?.linked_repo ?? '';
  if (linkedRepo && !podhausRepoIds.has(linkedRepo)) {
    // Foreign linked-repo (e.g. fenwick-credential-redactor → fenwick
    // repo). run_directory is relative to that repo, not podhaus.
    console.log(`skipped: ${stack.name} (linked_repo=${linkedRepo}, not a podhaus repo)`);
    skipped++; continue;
  }

  const runDir = stack.config?.run_directory ?? '';
  const stackRel = stackRelToRepo(runDir);
  if (!stackRel) {
    // Stack lives outside our /syncs/podhaus mount (run_directory is
    // empty/relative — e.g. the linked_repo fenwick stacks). Logged by
    // name so the skip set is visible per run; an unexpected entry
    // here means a misrouted stack.
    console.log(`skipped: ${stack.name} (run_directory=${runDir || '<empty>'})`);
    skipped++; continue;
  }

  const stackDir = `${REPO_ROOT}/${stackRel}`;
  // Deno.stat throws on missing path — let it propagate. A podhaus stack
  // whose run_directory resolves under /etc/komodo/repo/ but whose dir is
  // absent is a misconfiguration, not a legitimate skip.
  const st = await Deno.stat(stackDir);
  if (!st.isDirectory) {
    throw new Error(`${stack.name}: ${stackDir} is not a directory`);
  }

  // Hash 1: the stack dir itself. Drives every service's
  // podhaus.stack-content-hash label.
  const stackHash = await hashDir(stackDir);

  // Hash 2..N: per-service build-context hashes. Drive build-arg cache
  // busting + depends-on label propagation.
  const composeFiles = await resolveComposeFiles(
    stackDir,
    stack.config?.file_paths ?? [],
  );
  const ctxMap = await buildContexts(composeFiles);
  const buildHashes = {};
  for (const [svc, absCtx] of Object.entries(ctxMap)) {
    buildHashes[svc] = await hashDir(absCtx);
  }

  // Record what this stack's running containers SHOULD carry, for the
  // reconcile pass after the loop. expectedLabels maps each podhaus.*
  // label to the hash the container must show.
  const svcMeta = await parseServiceMeta(composeFiles);
  const planServices = [];
  for (const [svc, meta] of Object.entries(svcMeta)) {
    const expectedLabels = {};
    for (const key of meta.labelKeys) {
      if (key === 'podhaus.stack-content-hash') {
        expectedLabels[key] = stackHash;
      } else if (key.startsWith('podhaus.depends-on-')) {
        const dep = key.substring('podhaus.depends-on-'.length);
        if (dep in buildHashes) expectedLabels[key] = buildHashes[dep];
      }
    }
    planServices.push({
      containerName: meta.containerName,
      expectedLabels,
      expectedBuildHash: buildHashes[svc] ?? null,
    });
  }
  // Tell apart \"Stage 2 will handle this\" (compose TEXT changed → its
  // IfChanged fires) from \"only Stage 2 misses it\" (config-only /
  // build-context change, compose unchanged). The reconcile deploys ONLY
  // the latter, so no stack is ever deployed by both paths. Compared by
  // content set (paths can be stored differently), against the stack's
  // deployed compose contents.
  const composeNow = [];
  for (const cf of composeFiles) {
    try { composeNow.push(await Deno.readTextFile(cf)); } catch { /* skip */ }
  }
  const deployedNow = (stack.info?.deployed_contents ?? []).map((f) => f.contents);
  const a = composeNow.slice().sort();
  const b = deployedNow.slice().sort();
  const composeUnchanged = a.length === b.length && a.every((c, i) => c === b[i]);
  stackPlans.push({
    name: stack.name,
    id: stack._id?.$oid ?? stack.id ?? stack.name,
    serverId: stack.config?.server_id ?? null,
    services: planServices,
    composeUnchanged,
  });

  // Construct the new env. Start from stored env minus any prior
  // STACK_CONTENT_HASH / BUILD_HASH_* line; append fresh values in a
  // stable order so unchanged repeated runs produce identical output.
  const curEnv = stack.config?.environment ?? '';
  const lines = curEnv.split(NL).filter((ln) => {
    return !ln.startsWith('STACK_CONTENT_HASH=') &&
           !ln.startsWith('BUILD_HASH_');
  });
  while (lines.length && lines[lines.length - 1] === '') lines.pop();
  lines.push('STACK_CONTENT_HASH=' + stackHash);
  const svcNames = Object.keys(buildHashes).sort();
  for (const svc of svcNames) {
    lines.push(`BUILD_HASH_${envSafeName(svc)}=${buildHashes[svc]}`);
  }
  lines.push(''); // trailing newline
  const newEnv = lines.join(NL);

  processed++;
  if (newEnv === curEnv) continue;

  await komodo.write('UpdateStack', {
    id: stack._id?.$oid ?? stack.id ?? stack.name,
    config: { environment: newEnv },
  });
  updated++;
  const buildSummary = svcNames.length > 0
    ? ' [' + svcNames.map((svc) => `${svc}=${buildHashes[svc]}`).join(' ') + ']'
    : '';
  console.log(`${stack.name}: ${stackHash}${buildSummary}`);
}

console.log(
  `[podhaus-inject-content-hashes] processed=${processed} env-updated=${updated} skipped=${skipped}`
);

// --- reconcile: force-deploy stacks whose running containers carry a
// stale content/dependency label or baked build hash, but ONLY where the
// compose TEXT is unchanged.
//
// This closes the gap that makes the hashes load-bearing. Komodo's
// DeployStackIfChanged (the procedure's Stage 2) decides \"changed\" by
// diffing the compose-file TEXT it stored at deploy time — and the hashes
// live in `${STACK_CONTENT_HASH}` / `${BUILD_HASH_*}` variable refs, so a
// hash change never alters that text. Result (verified 2026-06-18): a
// conf-only edit injected the right hash into stored env but Stage 2
// no-op'd, leaving the container on a stale config (gatus ran an old
// staleness window for ~hours; its label sat at `unset`). The injected
// env is NOT a deploy trigger on its own.
//
// So this pass reads each stack's running containers and compares their
// podhaus.* hash labels and baked build hash to the freshly computed hashes;
// on a mismatch it force-deploys (DeployStack, not IfChanged), which renders
// the new values into the container. We deploy ONLY stacks whose compose text is
// unchanged — compose-text changes and brand-new stacks are Stage 2's
// job, and deploying them here too would double-recreate. The deployed
// running container metadata is the only ground truth: stored env and
// `deployed_contents` don't reflect what's actually running.
const servers = await komodo.read('ListServers', {});
const serverNameById = new Map(servers.map((sv) => [sv.id, sv.name]));

let reconciled = 0;
for (const plan of stackPlans) {
  if (!plan.composeUnchanged) continue; // Stage 2 owns compose-text changes + new stacks
  const serverName = serverNameById.get(plan.serverId);
  if (!serverName) {
    console.log(`reconcile: ${plan.name} — unknown server ${plan.serverId}; skipping`);
    continue;
  }
  let stale = null;
  for (const svc of plan.services) {
    if (!svc.containerName ||
        (Object.keys(svc.expectedLabels).length === 0 && !svc.expectedBuildHash)) continue;
    let inspect;
    try {
      inspect = await komodo.read('InspectDockerContainer', {
        server: serverName, container: svc.containerName,
      });
    } catch {
      // Container absent / server unreachable. New-stack first-deploy is
      // Stage 2's job and crash recovery is autoheal's; skip rather than
      // risk a spurious deploy on a transient inspect error.
      continue;
    }
    // Only reconcile RUNNING containers. A stopped container has no live
    // config to be stale, and force-deploying it would START a stack
    // that's intentionally down — e.g. vpn-diagnostics, the normally-
    // stopped repro harness (deploy=false). Bringing a stack up is not
    // the reconcile's job. Exited one-shot inits are skipped the same way.
    if (((inspect && inspect.State && inspect.State.Status) || '') !== 'running') continue;
    if (svc.expectedBuildHash) {
      const env = (inspect && inspect.Config && inspect.Config.Env) || [];
      const baked = env.find((entry) => entry.startsWith('STACK_CONTENT_HASH='));
      const actualBuildHash = baked ? baked.substring('STACK_CONTENT_HASH='.length) : null;
      if (actualBuildHash !== svc.expectedBuildHash) {
        stale = `${svc.containerName} baked STACK_CONTENT_HASH=${actualBuildHash} want ${svc.expectedBuildHash}`;
        break;
      }
    }
    const labels = (inspect && inspect.Config && inspect.Config.Labels) || {};
    for (const [key, want] of Object.entries(svc.expectedLabels)) {
      if (labels[key] !== want) {
        stale = `${svc.containerName} ${key}=${labels[key]} want ${want}`;
        break;
      }
    }
    if (stale) break;
  }
  if (!stale) continue;
  try {
    await komodo.execute('DeployStack', { stack: plan.id });
    reconciled++;
    console.log(`reconcile: DeployStack ${plan.name} (${stale})`);
  } catch (e) {
    console.log(`reconcile: FAILED to deploy ${plan.name}: ${e}`);
  }
}
console.log(`[podhaus-inject-content-hashes] reconcile: deployed=${reconciled}`);
"""

[[action]]
name = "podhaus-run-oneshot-stack"
description = "Deploy a stack and fail unless the requested one-shot service is replaced and exits successfully."
tags = ["podhaus"]

[action.config]
run_at_startup = false
schedule_enabled = false
schedule = ""
failure_alert = true
webhook_enabled = false
reload_deno_deps = false

file_contents = """
const stackName = ARGS.stack;
const serviceName = ARGS.service;
if (typeof stackName !== 'string' || stackName.length === 0) throw new Error('stack argument is required');
if (typeof serviceName !== 'string' || serviceName.length === 0) throw new Error('service argument is required');

const stack = await komodo.read('GetStack', { stack: stackName });
const serverId = stack.config?.server_id;
if (!serverId) throw new Error(`${stackName}: deployed server is missing`);
const servers = await komodo.read('ListServers', {});
const server = servers.find((candidate) => candidate.id === serverId);
if (!server) throw new Error(`${stackName}: server ${serverId} was not found`);
const service = stack.info?.deployed_services?.find((candidate) => candidate.service_name === serviceName);
if (!service) throw new Error(`${stackName}: deployed service ${serviceName} was not found`);

let previousId = null;
let previousStartedAt = null;
try {
  const previous = await komodo.read('InspectDockerContainer', {
    server: server.name,
    container: service.container_name,
  });
  previousId = previous?.Id ?? null;
  previousStartedAt = previous?.State?.StartedAt ?? null;
} catch (_) {}

await komodo.execute('DeployStack', { stack: stackName });
const deadline = Date.now() + 30 * 60 * 1000;
let sawExecution = false;
while (Date.now() < deadline) {
  let inspect;
  try {
    inspect = await komodo.read('InspectDockerContainer', {
      server: server.name,
      container: service.container_name,
    });
  } catch (_) {
    await new Promise((resolve) => setTimeout(resolve, 1000));
    continue;
  }
  if (!previousId || inspect?.Id !== previousId || inspect?.State?.StartedAt !== previousStartedAt) sawExecution = true;
  if (!sawExecution) {
    await new Promise((resolve) => setTimeout(resolve, 1000));
    continue;
  }
  const state = inspect?.State;
  if (state?.Status === 'exited') {
    if (state.ExitCode !== 0) throw new Error(`${stackName}/${serviceName} exited ${state.ExitCode}: ${state.Error ?? ''}`);
    console.log(`[podhaus-run-oneshot-stack] ${stackName}/${serviceName} exited successfully`);
    return;
  }
  if (state?.Status === 'dead' || state?.OOMKilled === true) {
    throw new Error(`${stackName}/${serviceName} failed in state ${state.Status}`);
  }
  await new Promise((resolve) => setTimeout(resolve, 1000));
}
throw new Error(`${stackName}/${serviceName} did not exit within 30 minutes`);
"""

[[action]]
name = "podhaus-purge-stack-cache"
description = "Purge the Cloudflare cache tags declared by a deployed stack's container labels."
tags = ["podhaus", "cloudflare"]

[action.config]
run_at_startup = false
schedule_enabled = false
schedule = ""
failure_alert = true
webhook_enabled = false
reload_deno_deps = false

file_contents = """
const stackName = ARGS.stack;
if (typeof stackName !== 'string' || stackName.length === 0) {
  throw new Error('stack argument is required');
}

const stack = await komodo.read('GetStack', { stack: stackName });
const serverId = stack.config?.server_id;
if (!serverId) throw new Error(`${stackName}: deployed server is missing`);

const servers = await komodo.read('ListServers', {});
const server = servers.find((candidate) => candidate.id === serverId);
if (!server) throw new Error(`${stackName}: server ${serverId} was not found`);

const services = stack.info?.deployed_services;
if (!Array.isArray(services) || services.length === 0) {
  throw new Error(`${stackName}: no deployed services were found`);
}

const zones = new Set();
const tags = new Set();
let labelledContainers = 0;

for (const service of services) {
  const inspect = await komodo.read('InspectDockerContainer', {
    server: server.name,
    container: service.container_name,
  });
  const status = inspect?.State?.Status;
  if (status !== 'running' && !(status === 'exited' && inspect?.State?.ExitCode === 0)) continue;

  const labels = inspect?.Config?.Labels ?? {};
  const zone = labels['podhaus.cloudflare-cache-zone'];
  const declaredTags = labels['podhaus.cloudflare-cache-tags'];
  if (zone === undefined && declaredTags === undefined) continue;
  if (typeof zone !== 'string' || zone.length === 0) {
    throw new Error(`${service.container_name}: cache zone label is missing`);
  }
  if (typeof declaredTags !== 'string' || declaredTags.length === 0) {
    throw new Error(`${service.container_name}: cache tags label is missing`);
  }

  zones.add(zone);
  for (const tag of declaredTags.split(',').map((value) => value.trim())) {
    if (tag.length === 0) {
      throw new Error(`${service.container_name}: cache tags contain an empty value`);
    }
    tags.add(tag);
  }
  labelledContainers++;
}

if (labelledContainers === 0) {
  throw new Error(`${stackName}: no successful container declares cache labels`);
}
if (zones.size !== 1) {
  throw new Error(`${stackName}: expected one cache zone, found ${zones.size}`);
}
if (tags.size === 0) throw new Error(`${stackName}: no cache tags were declared`);

const tokenVariable = await komodo.read('GetVariable', {
  name: 'OP__KOMODO__CLOUDFLARE_API_TOKEN__CREDENTIAL',
});
const token = tokenVariable?.value;
if (typeof token !== 'string' || token.length === 0) {
  throw new Error('Cloudflare API token is missing');
}

async function cloudflare(path, init = {}) {
  const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
    ...init,
    headers: {
      Authorization: `Bearer ${token}`,
      'Content-Type': 'application/json',
      ...(init.headers ?? {}),
    },
  });
  const body = await response.json();
  if (!response.ok || body.success !== true) {
    throw new Error(`Cloudflare ${path} failed: ${response.status} ${JSON.stringify(body.errors ?? body)}`);
  }
  return body;
}

const [zone] = zones;
const zoneLookup = await cloudflare(`/zones?name=${encodeURIComponent(zone)}`);
if (!Array.isArray(zoneLookup.result) || zoneLookup.result.length !== 1) {
  throw new Error(`${stackName}: expected one Cloudflare zone named ${zone}`);
}

const purgeTags = [...tags].sort();
await cloudflare(`/zones/${zoneLookup.result[0].id}/purge_cache`, {
  method: 'POST',
  body: JSON.stringify({ tags: purgeTags }),
});
console.log(`[podhaus-purge-stack-cache] stack=${stackName} zone=${zone} tags=${purgeTags.join(',')}`);
"""
