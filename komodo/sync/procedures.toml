# Single push-to-deploy entrypoint for the whole fleet.
#
# Why a procedure instead of per-stack webhooks: GitHub hard-caps a
# repo at 20 `push` webhooks ("the push event cannot have more than 20
# hooks"). One per stack does not scale past 20. Instead ONE GitHub
# webhook hits this procedure's listener
# (komodo.pod.haus/listener/github/procedure/podhaus-push-deploy/main,
# branch-filtered to main), and the procedure fans out internally.
#
# Stage 0 — reconcile stack defs from disk (sync TOML → Komodo). Komodo
# separates the *stack resource definition* (what the env block, server,
# run_directory etc. ARE — populated only by RunSync) from the *deploy*
# (which renders compose using the STORED resource definition). Without
# this stage, a push that adds a new `environment` line to a stack.toml
# reached the deploy via the on-disk file but the deploy used the stored
# (pre-change) resource def, so the var resolved empty. Bit fenwick on
# 2026-05-17 (~30 min outage; see git history for the fix commits). With
# Stage 0, sync→deploy is deterministic via stage ordering, not racy via
# managed:true polling.
#
# Stage 1 — content-hash injection. The Action
# `podhaus-inject-content-hashes` (komodo/sync/actions.toml) walks every
# stack visible in /syncs/podhaus from Komodo Core, computes a hash of
# the stack directory excluding runtime-bind paths, and appends
# `STACK_CONTENT_HASH=<hash>` to each stack's stored environment.
# That turns Komodo's existing compose-file-only change detection into
# full stack-directory change detection — Dockerfile, build-context
# sources, bind-mounted config files, all get tracked uniformly.
# Crucially this is the SAME mechanism for files_on_host and linked_repo
# stacks: the hash is computed from bilby's view of the repo, so it
# routes around the stale-clone deadlock that breaks Komodo's native
# IfChanged on linked_repo (where the change-check compares against the
# Periphery's clone, which only advances during a deploy).
#
# Stage 2 — every stack, deploy ONLY if its rendered env diffs from
# what's deployed. Stage 1's hash appears in the env diff for any stack
# whose tracked files changed; unchanged stacks no-op (no churn).
# Works uniformly across bilby files_on_host AND linked_repo because
# the hash injection makes IfChanged correct for both.
#
# Stage 3 — restart ofelia so it picks up label changes on whichever
# containers Stage 2 just recreated. ofelia v0.3.22
# (mcuadros/ofelia:latest, built from the 0.3.x branch) reads labels
# ONCE at startup and has no live refresh: the dynamic-labels polling
# (upstream PR #319) and the event-listen replacement (PR #368) are
# both master-only and unreleased. Without this stage, a push that
# changes an ofelia.* schedule/command label on any stack silently
# wouldn't take effect until ofelia next restarts for unrelated
# reasons (image bump, host reboot, manual). RestartStack on ofelia
# is ~0.5s, ofelia has no persistent state to lose, and the cost is
# paid on every push regardless of whether anything ofelia-relevant
# changed — cheaper than tracking "did this push touch any ofelia
# labels?". Drop this stage when an ofelia release lands that includes
# #319 or #368.
#
# Wildcard `*` means new stacks are covered automatically — no repo
# edit, no list, no 20-cap, ever.

[[procedure]]
name = "podhaus-push-deploy"
description = "Push-to-deploy fan-out: reconcile stack defs from disk, inject per-stack content hashes, deploy-if-changed all stacks, restart ofelia. Triggered by the single GitHub push webhook (and by ./komodo-sync for the equivalent local path)."
tags = ["podhaus"]
config.webhook_enabled = true
# Webhook-only — no schedule. (schedule_enabled defaults true in
# Komodo; pinned false so it's unambiguous this never runs on a timer.)
config.schedule_enabled = false

[[procedure.config.stage]]
name = "Reconcile stack definitions (sync TOML → Komodo)"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params = { sync = "podhaus" }, enabled = true }
]

[[procedure.config.stage]]
name = "Inject per-stack content hashes into stored env"
enabled = true
executions = [
  { execution.type = "RunAction", execution.params = { action = "podhaus-inject-content-hashes" }, enabled = true }
]

[[procedure.config.stage]]
name = "Deploy changed stacks (surgical, content-hash-aware)"
enabled = true
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params = { pattern = "*" }, enabled = true }
]

[[procedure.config.stage]]
name = "Restart ofelia so it re-reads container labels"
enabled = true
executions = [
  { execution.type = "RestartStack", execution.params = { stack = "ofelia" }, enabled = true }
]


# fenwick-push-deploy — push-to-deploy for stacks sourced from the
# fenwick repo (the bot + the credential-redactor service).
#
# Bound to its own GitHub webhook
# (komodo.pod.haus/listener/github/procedure/fenwick-push-deploy/main,
# branch-filtered to main; see ../../terraform/github.tf). Stage shape:
#   - Stage 0 reconciles the fenwick sync into Komodo (without it,
#     a push that adds a new [[variable]] reaches the deploy via the
#     on-disk file but the deploy uses the stored pre-change resource
#     def — same trap that bit fenwick on 2026-05-17).
#   - Stage 1 BatchDeployStackIfChanged "fenwick" no-ops when the bot
#     compose hasn't changed (deno --watch reloads the bot in-process;
#     a save shouldn't drag the container through a restart).
#   - Stage 2 BatchDeployStack "fenwick-*" force-deploys the linked-
#     repo stacks (the stale-clone deadlock means
#     BatchDeployStackIfChanged would no-op forever — the change-
#     check compares the Periphery clone which only advances during
#     a deploy). This is the SAME deadlock the podhaus procedure
#     solves via Stage 1's content-hash injection above; fenwick
#     hasn't been extended to that mechanism yet because its stack
#     surface is small and the force-deploy cost is tolerable.
#     If fenwick grows more linked-repo stacks, consider porting the
#     content-hash Action over.
#
# The "fenwick-*" wildcard does NOT match the bare "fenwick" stack;
# that's why Stage 1 and Stage 2 are split.

[[procedure]]
name = "fenwick-push-deploy"
description = "Push-to-deploy for stacks sourced from the fenwick repo (the bot + the credential-redactor service)."
tags = ["fenwick", "podhaus"]
config.webhook_enabled = true
config.schedule_enabled = false

[[procedure.config.stage]]
name = "Reconcile fenwick stack definitions (sync TOML -> Komodo)"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params = { sync = "fenwick" }, enabled = true }
]

[[procedure.config.stage]]
name = "Deploy bot if compose changed (no churn during --watch iteration)"
enabled = true
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params = { pattern = "fenwick" }, enabled = true },
]

[[procedure.config.stage]]
name = "Force-deploy linked-repo fenwick-* stacks (pull + compose)"
enabled = true
executions = [
  { execution.type = "BatchDeployStack", execution.params = { pattern = "fenwick-*" }, enabled = true },
]
