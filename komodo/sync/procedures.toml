# Single push-to-deploy entrypoint for the whole fleet.
#
# Why a procedure instead of per-stack webhooks: GitHub hard-caps a
# repo at 20 `push` webhooks ("the push event cannot have more than 20
# hooks"). One per stack does not scale past 20. Instead ONE GitHub
# webhook hits this procedure's listener
# (komodo.pod.haus/listener/github/procedure/podhaus-push-deploy/main,
# branch-filtered to main), and the procedure fans out internally.
#
# Stage 0 — reconcile stack defs from disk (sync TOML → Komodo). Komodo
# separates the *stack resource definition* (what the env block, server,
# run_directory etc. ARE — populated only by RunSync) from the *deploy*
# (which renders compose using the STORED resource definition). Without
# this stage, a push that adds a new `environment` line to a stack.toml
# reached the deploy via the on-disk file but the deploy used the stored
# (pre-change) resource def, so the var resolved empty. Bit fenwick on
# 2026-05-17 (~30 min outage; see git history for the fix commits). With
# Stage 0, sync→deploy is deterministic via stage ordering, not racy via
# managed:true polling.
#
# Stage 0 is CONFIG-RECONCILE-ONLY. Komodo's RunSync also has a built-in
# "Sync Deploy" sub-stage that auto-deploys any stack whose stored config
# differs from deployed. Two problems: (a) it duplicates Stage 2's work,
# (b) it runs serially across stacks with no per-stack failure tolerance,
# so a transient linked-repo Periphery timeout fails the entire RunSync
# and aborts Stages 1–3 (bit kookaburra-relay/kookaburra-tailscale on
# 2026-05-25). Every podhaus stack.toml omits `deploy = true` (defaults
# to false — see Komodo source `client/core/rs/src/entities/toml.rs`),
# which makes Sync Deploy no-op at `deploy.rs:489` (`if !stack.deploy`)
# while still reconciling stored config via `Stack::execute_sync_updates`
# on line 379-382 of execute/sync.rs. Stages 1 and 2 below own deployment;
# `tools/lint-stack-toml.py` enforces the no-`deploy=true`
# invariant at commit time.
#
# Stage 1 — content-hash injection. The Action
# `podhaus-inject-content-hashes` (komodo/sync/actions.toml) walks every
# stack visible in /syncs/podhaus from Komodo Core and appends two kinds
# of env entries to each stack's stored environment:
# `STACK_CONTENT_HASH=<hash>` (hash of the entire stack directory,
# including bind-mounted config paths) and one
# `BUILD_HASH_<UPPER_SERVICE>=<hash>` per service with a `build:`
# directive (hash of the resolved build context, which may live outside
# the stack dir, such as shared init-tools/ or relay/). Injecting those
# values is necessary but does not itself trigger Komodo's IfChanged:
# that check compares stored compose text, not the rendered env. The
# Action therefore also compares the hashes against running container
# labels and force-deploys stale stacks whose compose text is unchanged.
# This is the load-bearing path for config-only and build-context edits,
# and it works for files_on_host and linked_repo stacks because hashes
# come from bilby's current repo view.
#
# Stage 2: BatchDeployStackIfChanged owns compose-text changes and new
# stacks. Stage 1 deliberately leaves those alone, so the stages do not
# recreate the same stack twice. Unchanged stacks no-op.
#
# Stage 3 — restart ofelia so it picks up label changes on whichever
# containers Stage 2 just recreated. ofelia v0.3.22
# (mcuadros/ofelia:latest, built from the 0.3.x branch) reads labels
# ONCE at startup and has no live refresh: the dynamic-labels polling
# (upstream PR #319) and the event-listen replacement (PR #368) are
# both master-only and unreleased. Without this stage, a push that
# changes an ofelia.* schedule/command label on any stack silently
# wouldn't take effect until ofelia next restarts for unrelated
# reasons (image bump, host reboot, manual). RestartStack on ofelia
# is ~0.5s, ofelia has no persistent state to lose, and the cost is
# paid on every push regardless of whether anything ofelia-relevant
# changed — cheaper than tracking "did this push touch any ofelia
# labels?". Drop this stage when an ofelia release lands that includes
# #319 or #368.
#
# Wildcard `*` means new stacks are covered automatically — no repo
# edit, no list, no 20-cap, ever.

[[procedure]]
name = "podhaus-push-deploy"
description = "Push-to-deploy fan-out: reconcile stack defs from disk, inject per-stack content hashes, deploy-if-changed all stacks, restart ofelia. Triggered by the single GitHub push webhook (and by ./komodo-sync for the equivalent local path)."
tags = ["podhaus"]
config.webhook_enabled = true
# Webhook-only — no schedule. (schedule_enabled defaults true in
# Komodo; pinned false so it's unambiguous this never runs on a timer.)
config.schedule_enabled = false

[[procedure.config.stage]]
name = "Reconcile stack definitions (sync TOML → Komodo)"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params = { sync = "podhaus" }, enabled = true }
]

[[procedure.config.stage]]
name = "Inject content hashes and reconcile stale running stacks"
enabled = true
executions = [
  { execution.type = "RunAction", execution.params = { action = "podhaus-inject-content-hashes" }, enabled = true }
]

[[procedure.config.stage]]
name = "Deploy changed stacks (surgical, content-hash-aware)"
enabled = true
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params = { pattern = "*" }, enabled = true }
]

[[procedure.config.stage]]
name = "Restart ofelia so it re-reads container labels"
enabled = true
executions = [
  { execution.type = "RestartStack", execution.params = { stack = "ofelia" }, enabled = true }
]


# fenwick-push-deploy — push-to-deploy for stacks sourced from the
# fenwick repo (the bot + the credential-redactor service; both
# linked_repo + run_build, Komodo builds the images on bilby).
#
# Bound to its own GitHub webhook
# (komodo.pod.haus/listener/github/procedure/fenwick-push-deploy/main,
# branch-filtered to main; see ../../terraform/github.tf). Also
# triggered manually from the fenwick checkout via `deno task deploy`.
# Stage shape:
#   - Stage 0 reconciles the fenwick sync into Komodo (without it,
#     a push that adds a new [[variable]] reaches the deploy via the
#     on-disk file but the deploy uses the stored pre-change resource
#     def — same trap that bit fenwick on 2026-05-17).
#   - Stage 1 BatchDeployStack "fenwick*" (matches both the bare
#     "fenwick" stack and "fenwick-*") force-deploys every fenwick
#     stack. Force, not IfChanged: the stale-clone deadlock means
#     BatchDeployStackIfChanged would no-op forever for linked_repo
#     stacks — the change-check compares the Periphery clone, which
#     only advances during a deploy. This is the SAME deadlock the
#     podhaus procedure solves via Stage 1's content-hash injection
#     above; fenwick hasn't been extended to that mechanism because
#     force is cheap here by construction — the Docker layer cache
#     rebuilds an unchanged stack to the same image id and
#     `compose up -d` recreates nothing, so an unchanged push is a
#     no-op at the container level.

[[procedure]]
name = "fenwick-push-deploy"
description = "Push-to-deploy for stacks sourced from the fenwick repo (the bot + the credential-redactor service)."
tags = ["fenwick", "podhaus"]
config.webhook_enabled = true
config.schedule_enabled = false

[[procedure.config.stage]]
name = "Reconcile fenwick stack definitions (sync TOML -> Komodo)"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params = { sync = "fenwick" }, enabled = true }
]

[[procedure.config.stage]]
name = "Deploy fenwick stacks (build + up; layer cache makes unchanged stacks no-ops)"
enabled = true
executions = [
  { execution.type = "BatchDeployStack", execution.params = { pattern = "fenwick*" }, enabled = true },
]


# nathanbaxter-deploy — push-to-deploy for nathanbaxter.com.
#
# Replaces the previous .github/workflows/deploy.yml. Bound to the
# nathanbaxter GitHub push webhook
# (komodo.pod.haus/listener/github/procedure/nathanbaxter-deploy/main,
# branch-filtered to main; see terraform/github.tf). Single stage:
# force-redeploy the nathanbaxter-deploy stack, whose one-shot builder
# container clones the repo, runs npm ci + npm run build, mcli mirrors
# dist/ to the nathanbaxter-com MinIO bucket, exits.
#
# Always force-deploy (DeployStack, not IfChanged) — every push to
# main should produce a fresh build, regardless of whether the stack
# definition itself changed. Source freshness comes from the build
# container's own `git clone --depth 1 -b main`, not from any
# Komodo-managed working tree.

# pets-push-deploy — push-to-deploy for the pets engine
# (linked_repo + run_build; Komodo builds the image on bilby). Same
# shape + rationale as fenwick-push-deploy above: Stage 0 reconciles
# the sync, Stage 1 force-deploys (the linked-repo stale-clone deadlock
# makes IfChanged a permanent no-op; the Docker layer cache makes an
# unchanged push a container-level no-op), and Stage 2 purges the cache
# zone and tags declared by the deployed stack's container labels. Bound
# to its own GitHub
# webhook (.../procedure/pets-push-deploy/main; see
# ../../terraform/github.tf) and to `deno task deploy` in the repo.

[[procedure]]
name = "pets-push-deploy"
description = "Push-to-deploy for the pets engine stack."
tags = ["pets", "podhaus"]
config.webhook_enabled = true
config.schedule_enabled = false

[[procedure.config.stage]]
name = "Reconcile pets stack definition (sync TOML -> Komodo)"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params = { sync = "pets" }, enabled = true }
]

[[procedure.config.stage]]
name = "Deploy pets (build + up; layer cache makes an unchanged push a no-op)"
enabled = true
executions = [
  { execution.type = "BatchDeployStack", execution.params = { pattern = "pets*" }, enabled = true },
]

[[procedure.config.stage]]
name = "Purge Pets cache tags declared by the deployed stack"
enabled = true
executions = [
  { execution.type = "RunAction", execution.params = { action = "podhaus-purge-stack-cache", args = { stack = "pets" } }, enabled = true },
]


# docs-push-deploy — push-to-deploy for the docs-server engine
# (linked_repo + run_build; Komodo builds the image on bilby). Same
# shape + rationale as fenwick/pets-push-deploy: Stage 0 reconciles the
# sync, Stage 1 force-deploys (the linked-repo stale-clone deadlock
# makes IfChanged a permanent no-op; the Docker layer cache makes an
# unchanged push a container-level no-op). Bound to its own GitHub
# webhook (.../procedure/docs-push-deploy/main; see
# ../../terraform/github.tf). The pattern lists both instances by exact
# name — never a wildcard — so it can't match the legacy "docs-server"
# nginx stack during the cutover window. Adding a docs instance on a new
# host means adding its stack name here too.

[[procedure]]
name = "docs-push-deploy"
description = "Push-to-deploy for the docs service stacks: docs on bilby, fractal-docs on fractal."
tags = ["docs", "podhaus"]
config.webhook_enabled = true
config.schedule_enabled = false

[[procedure.config.stage]]
name = "Reconcile docs stack definitions (sync TOML -> Komodo)"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params = { sync = "docs" }, enabled = true }
]

[[procedure.config.stage]]
name = "Deploy docs (build + up; layer cache makes an unchanged push a no-op)"
enabled = true
executions = [
  { execution.type = "BatchDeployStack", execution.params = { pattern = "docs, fractal-docs" }, enabled = true },
]


[[procedure]]
name = "nathanbaxter-deploy"
description = "Build and mirror nathanbaxter.com, verify the one-shot exit, then purge its Cloudflare cache tag."
tags = ["nathanbaxter", "podhaus"]
config.webhook_enabled = true
config.schedule_enabled = false

[[procedure.config.stage]]
name = "Build and verify nathanbaxter.com"
enabled = true
executions = [
  { execution.type = "RunAction", execution.params = { action = "podhaus-run-oneshot-stack", args = { stack = "nathanbaxter-deploy", service = "builder" } }, enabled = true }
]

[[procedure.config.stage]]
name = "Purge nathanbaxter.com cache tag"
enabled = true
executions = [
  { execution.type = "RunAction", execution.params = { action = "podhaus-purge-stack-cache", args = { stack = "nathanbaxter-deploy" } }, enabled = true }
]
