###################################
# KOMODO COMPOSE - FERRETDB       #
###################################

## This compose file deploys:
##   1. Postgres + FerretDB Mongo adapter (https://www.ferretdb.com)
##   2. Komodo Core
##   3. Komodo Periphery
##
## All state lives on NFS under /Jump/komodo/ so bilby remains stateless.
## These services are the orchestration layer — they're intentionally not
## labelled for autoheal (restart: unless-stopped handles crashes; autoheal
## loops here would risk interrupting in-flight deployments).

services:
  postgres:
    container_name: komodo-postgres
    image: ghcr.io/ferretdb/postgres-documentdb
    labels:
      komodo.skip:
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DB_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DB_PASSWORD}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KOMODO_DB_USERNAME}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  ferretdb:
    container_name: komodo-ferretdb
    image: ghcr.io/ferretdb/ferretdb
    labels:
      komodo.skip:
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ferretdb-state:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DB_USERNAME}:${KOMODO_DB_PASSWORD}@postgres:5432/postgres
    # No healthcheck — ferretdb image is distroless, no shell available
    # to probe from inside. Komodo Core's own healthcheck covers the pair
    # (Core depends on ferretdb so Core unhealthy == ferretdb broken).

  core:
    container_name: komodo-core
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    labels:
      komodo.skip:
    restart: unless-stopped
    # ResourceSync clones happen in Core; use the direct Forgejo origin while
    # preserving git.pod.haus for TLS and repository identity.
    extra_hosts:
      - "git.pod.haus:host-gateway"
    init: true
    # SELinux enforcing on Fedora Asahi denies the container from reading
    # the bind-mounted repo at /syncs/podhaus; label:disable lifts that
    # so ResourceSync can scan the repo contents.
    security_opt:
      - label:disable
    depends_on:
      - ferretdb
    ports:
      - 9120:9120
    networks:
      - default
      - dockernet
    environment:
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
      KOMODO_PRIVATE_KEY: ${KOMODO_PRIVATE_KEY}
      KOMODO_PERIPHERY_PUBLIC_KEYS: ${KOMODO_PERIPHERY_PUBLIC_KEYS}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}
      KOMODO_HOST: ${KOMODO_HOST}
      KOMODO_TITLE: ${KOMODO_TITLE}
      KOMODO_FIRST_SERVER: ${KOMODO_FIRST_SERVER}
      KOMODO_FIRST_SERVER_NAME: ${KOMODO_FIRST_SERVER_NAME}
      KOMODO_LOCAL_AUTH: ${KOMODO_LOCAL_AUTH}
      KOMODO_DISABLE_USER_REGISTRATION: ${KOMODO_DISABLE_USER_REGISTRATION}
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_INIT_ADMIN_USERNAME}
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD}
      # Tell Core to also scan /config/runtime/ for extra config
      # files. Komodo merges nested configs and extends arrays across
      # every path here, so files under /config/runtime add to (do
      # not replace) the env-derived config above. Used to ship the
      # central [[git_providers]] block — see komodo-start's render
      # step + komodo/core.config.toml.tmpl.
      KOMODO_CONFIG_PATHS: /config,/config/runtime
      TZ: ${TZ}
    volumes:
      - ${COMPOSE_KOMODO_BACKUPS_PATH}:/backups
      # Deploy tree: a Komodo-managed clone (Repo resource "podhaus-deploy"),
      # pulled to origin/main by the push webhook and overlaid with the
      # local checkout by komodo-sync. ResourceSync and the hash-injection
      # action both read this path.
      - /etc/komodo/repos/podhaus-deploy:/syncs/podhaus
      # Working checkout, read-only. Consumed solely by the
      # podhaus-load-local-tree action, which overlays it onto the deploy
      # tree above during komodo-sync.
      - ${COMPOSE_KOMODO_REPO_PATH}:/syncs/podhaus-local:ro
      # v2 PKI: X25519 keypairs for noise-handshake auth. Shared with the
      # bilby periphery service below (same compose, same bind), so Core
      # auto-trusts bilby's periphery via file:/config/keys/bilby-periphery.pub
      # and bilby's periphery auto-trusts Core via file:/config/keys/core.pub.
      # Remote peripheries have their own keys dirs on their
      # respective hosts; their pubkeys live alongside in this dir so Core
      # trusts them too.
      - ${COMPOSE_KOMODO_KEYS_PATH}:/config/keys
      # Rendered-at-startup extra config files (currently the central
      # [[git_providers]] block). Lives in komodo/.runtime/ on the
      # host (gitignored — contains a rendered PAT). Rendered fresh
      # every komodo-start invocation; never hand-edited.
      - ${COMPOSE_KOMODO_REPO_PATH}/komodo/.runtime:/config/runtime
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9120/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  periphery:
    container_name: komodo-periphery
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    labels:
      komodo.skip:
      autoheal: "true"
    restart: unless-stopped
    init: true
    # Linked Repo HTTPS traffic must reach Forgejo directly. The public route
    # is Pomerium's browser boundary and redirects Git's authenticated request.
    # Preserve the hostname/TLS SNI while routing to this host's Caddy.
    extra_hosts:
      - "git.pod.haus:host-gateway"
    # SELinux enforcing on Fedora Asahi denies cross-label writes to
    # /var/run/docker.sock; label:disable exempts the periphery container
    # from SELinux confinement so it can talk to the Docker daemon.
    security_opt:
      - label:disable
    environment:
      # v2 PKI: noise-handshake mutual auth. Periphery loads its X25519
      # private key + the list of Core public keys it accepts. Both files
      # come from the shared keys bind (see Core service). Replaces the
      # v1 PERIPHERY_PASSKEYS shared-secret model.
      PERIPHERY_PRIVATE_KEY: ${PERIPHERY_PRIVATE_KEY}
      PERIPHERY_CORE_PUBLIC_KEYS: ${PERIPHERY_CORE_PUBLIC_KEYS}
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}
      # Deploy tree, same clone as Core's /syncs/podhaus above. This alias
      # bind keeps /etc/komodo/repo as the in-container path so every
      # stack.toml run_directory (/etc/komodo/repo/<name>) stays unchanged.
      - /etc/komodo/repos/podhaus-deploy:/etc/komodo/repo
      - ${COMPOSE_KOMODO_KEYS_PATH}:/config/keys
    # Periphery returns HTTP 405 on `GET /` when alive (it only accepts
    # POST for its API). curl without -f exits 0 on any HTTP response,
    # so 405 satisfies the probe — a hung Periphery (no response) fails.
    # -k skips TLS verify (self-signed cert), --max-time bounds the wait.
    healthcheck:
      test: ["CMD-SHELL", "curl -sk --max-time 5 -o /dev/null https://localhost:8120/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  dockernet:
    external: true

volumes:
  # NOTE: These are intentionally local volumes, NOT NFS-backed.
  # The /Jump export on kangaroo uses all_squash (writes land as 1000:100
  # regardless of container UID, chown is denied), which breaks the
  # postgres entrypoint's `chown -R postgres:postgres $PGDATA` step.
  # Active database state belongs on bilby's local NVMe; Backrest protects
  # these volumes. If the backup is also unavailable, Komodo can still be
  # bootstrapped from the resource definitions in git.
  postgres-data:
  ferretdb-state:
