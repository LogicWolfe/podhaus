[[stack]]
name = "gatus"
description = "Gatus — config-as-code endpoint monitoring + status page"
tags = ["podhaus"]

[stack.config]
server = "podhaus"
files_on_host = true
run_directory = "/etc/komodo/repo/gatus"
run_build = true

environment = """
TZ=[[TZ]]
PODHAUS_REPO=[[PODHAUS_REPO]]
POSTMARK_SERVER_TOKEN=[[OP__KOMODO__POSTMARK_SMTP__CREDENTIAL]]
FENWICK_INTERNAL_HTTP_TOKEN=[[OP__KOMODO__FENWICK_INTERNAL_TOKEN__CREDENTIAL]]
GATUS_BACKREST_PUSH_TOKEN=[[OP__KOMODO__GATUS_BACKREST_PUSH_TOKEN__TOKEN]]
GATUS_OFELIA_PUSH_TOKEN=[[OP__KOMODO__GATUS_OFELIA_PUSH_TOKEN__TOKEN]]
GATUS_BACKREST_KANGAROO_PUSH_TOKEN=[[OP__KOMODO__GATUS_BACKREST_KANGAROO_PUSH_TOKEN__TOKEN]]
GATUS_HEARTBEAT_PUSH_TOKEN=[[OP__KOMODO__GATUS_HEARTBEAT_PUSH_TOKEN__TOKEN]]
SKY_BACKUPS_ACCESS_KEY=[[OP__KOMODO__SKY_BACKUPS_MONITOR__USERNAME]]
SKY_BACKUPS_SECRET_KEY=[[OP__KOMODO__SKY_BACKUPS_MONITOR__PASSWORD]]
KOMODO_API_KEY=[[ONEPASSWORD_API_KEY]]
KOMODO_API_SECRET=[[ONEPASSWORD_API_SECRET]]
CLICKHOUSE_PASSWORD=[[OP__KOMODO__CLICKSTACK_CLICKHOUSE_PASSWORD__PASSWORD]]
"""

# Stage-0 verify: 2026-05-22 (komodo-model-cleanup plan, step 3)
