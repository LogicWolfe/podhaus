[[stack]]
name = "gatus"
description = "Gatus — config-as-code endpoint monitoring + status page"
tags = ["podhaus"]
deploy = true

[stack.config]
server = "podhaus"
files_on_host = true
run_directory = "/etc/komodo/repo/gatus"

environment = """
TZ=[[TZ]]
PODHAUS_REPO=[[PODHAUS_REPO]]
POSTMARK_SERVER_TOKEN=[[OP__KOMODO__POSTMARK_SMTP__CREDENTIAL]]
GATUS_BACKREST_PUSH_TOKEN=[[OP__KOMODO__GATUS_BACKREST_PUSH_TOKEN__TOKEN]]
GATUS_UNPACKERR_PUSH_TOKEN=[[OP__KOMODO__GATUS_UNPACKERR_PUSH_TOKEN__TOKEN]]
GATUS_BACKREST_KANGAROO_PUSH_TOKEN=[[OP__KOMODO__GATUS_BACKREST_KANGAROO_PUSH_TOKEN__TOKEN]]
KOMODO_API_KEY=[[ONEPASSWORD_API_KEY]]
KOMODO_API_SECRET=[[ONEPASSWORD_API_SECRET]]
CLICKHOUSE_PASSWORD=[[OP__KOMODO__CLICKSTACK_CLICKHOUSE_PASSWORD__PASSWORD]]
"""
