# Gatus monitoring config — config-as-code, checked into the repo.
# Edit, commit, redeploy. No UI state to drift.
#
# All HTTP monitors hit the public tunnel-routed URL, proving the full
# DNS → Cloudflare → tunnel → container path. If a service is down
# internally the tunnel monitor catches it; if the tunnel itself breaks
# every monitor drops at once (obvious signal). No need for redundant
# internal-only checks.

storage:
  type: sqlite
  path: /data/gatus.db
  # Keep ~90 days of results per endpoint (at 2m intervals ≈ 65k checks).
  capping: 65000

ui:
  title: PodHaus Status
  header: PodHaus

alerting:
  custom:
    url: "https://api.postmarkapp.com/email"
    method: POST
    headers:
      Accept: application/json
      Content-Type: application/json
      X-Postmark-Server-Token: ${POSTMARK_SERVER_TOKEN}
    # Placeholder notes:
    #   [ALERT_DESCRIPTION] always renders (empty if not set). Set per
    #     alert to explain what it means + where to investigate.
    #   [RESULT_ERRORS] renders the `error=...` query param (or HTTP
    #     errors) for both HTTP and push-style external endpoints. Push
    #     endpoints use this to convey per-invocation failure context
    #     (e.g., "443 folders unhealthy") — the sender URL-encodes them.
    #   [RESULT_CONDITIONS] renders the failed condition expression
    #     (e.g., "✗ `[STATUS] < 400`") for HTTP endpoints; push-style
    #     external-endpoints have no conditions, so Gatus leaves the
    #     literal token in place. Kept for HTTP diagnostics; tolerate
    #     the trailing placeholder on push endpoints.
    body: |
      {
        "From": "uptime@nathanbaxter.com",
        "To": "nathan@nathanbaxter.com",
        "Subject": "[ALERT_TRIGGERED_OR_RESOLVED] [ENDPOINT_NAME]",
        "HtmlBody": "<p><strong>Status:</strong> [ALERT_TRIGGERED_OR_RESOLVED]</p><p><strong>Endpoint:</strong> [ENDPOINT_GROUP] / [ENDPOINT_NAME]</p><p><strong>What this means:</strong> [ALERT_DESCRIPTION]</p><p><strong>Details:</strong> [RESULT_ERRORS]</p><p><strong>Status page:</strong> <a href=\"https://gatus.pod.haus\">gatus.pod.haus</a> · <strong>Logs:</strong> <a href=\"https://logs.pod.haus\">logs.pod.haus</a></p><p><strong>Failed conditions:</strong><br/>[RESULT_CONDITIONS]</p>",
        "MessageStream": "outbound"
      }
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

# --- Reusable defaults ---

_defaults: &defaults
  group: services
  interval: 2m
  conditions:
    - "[STATUS] >= 200"
    - "[STATUS] < 400"

# --- Tunnel-routed *.pod.haus services ---

endpoints:
  - name: Grafana
    url: https://grafana.pod.haus/
    <<: *defaults

  - name: Home Assistant
    url: https://home.pod.haus/
    <<: *defaults

  - name: Kangaroo (NAS)
    url: https://kangaroo.pod.haus/
    <<: *defaults

  - name: Komodo
    url: https://komodo.pod.haus/
    <<: *defaults

  - name: Logs (Victoria Logs)
    url: https://logs.pod.haus/select/vmui/
    <<: *defaults

  - name: Paperless
    url: https://paperless.pod.haus/
    <<: *defaults

  - name: Plex
    url: https://plex.pod.haus/
    <<: *defaults

  - name: Syncthing
    url: https://sync.pod.haus/
    <<: *defaults

  - name: Flood (Torrent)
    url: https://torrent.pod.haus/
    <<: *defaults

  - name: UniFi
    url: https://unifi.pod.haus/
    <<: *defaults
    client:
      insecure: true

  - name: Yiayia Board Frontend
    url: https://yiayia.pod.haus/health
    <<: *defaults

  - name: Yiayia Board Device
    url: https://yiayia.pod.haus/boards/health
    <<: *defaults

  # Surfaces "Komodo Core can't reach <Periphery>" as a Gatus alert.
  # Periphery's :8120 isn't on dockernet so we check via Komodo Core's API:
  # POST GetServerState, assert status == Ok. Headers carry Komodo's API
  # credentials (same as komodo-op uses). Note: if BILBY periphery dies,
  # gatus on bilby may also be impaired — but Komodo Core can still answer
  # for as long as it's running, since Core polls Periphery independently.
  - name: Bilby Periphery (via Komodo)
    url: http://komodo-core:9120/read
    method: POST
    group: services
    interval: 60s
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"podhaus"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

  - name: Kangaroo Periphery (via Komodo)
    url: http://komodo-core:9120/read
    method: POST
    group: services
    interval: 60s
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"kangaroo"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

# --- Heartbeat endpoints (push-style) ---

external-endpoints:
  - name: Backrest Nightly
    group: heartbeat
    token: ${GATUS_BACKREST_PUSH_TOKEN}
    interval: 25h
    alerts:
      - type: custom
        description: "Backrest's nightly backup pipeline didn't check in. Either no snapshots ran tonight, or the post-plan rclone sync to OneDrive failed. Investigate: `docker logs backrest` in logs.pod.haus, and check /mnt/pouch/backups for the expected repository state."
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  # Daily health check from flood/rar-backlog.sh. Scans for RAR folders
  # older than 2h with no extracted content alongside — i.e., unpackerr
  # failed silently. Missing heartbeat OR success=false both trigger
  # Postmark alerts via the shared default-alert config.
  - name: RAR Extraction
    group: heartbeat
    token: ${GATUS_UNPACKERR_PUSH_TOKEN}
    interval: 25h
    alerts:
      - type: custom
        description: "RAR extraction pipeline is unhealthy. Either unpackerr is not processing new torrents (check `docker logs unpackerr`), the cron job itself is broken (check ofelia + `docker logs flood | grep rar-backlog`), or the scanner found folders with RAR files >2h old and no extracted content alongside. Manual scan: `docker exec flood /scripts/rar-backlog.sh`. Full backlog paths land in the flood container logs."
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  # Kangaroo's Backrest. Separate from bilby's because it's a separate
  # restic repo on a separate host. Hooks fire success/failure POSTs to
  # this endpoint via http://10.0.0.119:8080 (gatus published on bilby's
  # LAN). The kangaroo Backrest pipeline schedules at 06:00 — 25h interval
  # tolerates one missed firing before alerting.
  - name: Backrest Kangaroo Nightly
    group: heartbeat
    token: ${GATUS_BACKREST_KANGAROO_PUSH_TOKEN}
    interval: 25h
    alerts:
      - type: custom
        description: "Kangaroo's nightly Backrest pipeline didn't check in. Either no snapshots ran on kangaroo (check `docker logs backrest` filtered by host=kangaroo on logs.pod.haus), or the success-hook on the backrest-state plan failed. Manually trigger a snapshot of any kangaroo plan from gatus.pod.haus to test."
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
