services:
  gatus:
    container_name: gatus
    image: ghcr.io/twin/gatus:latest
    restart: unless-stopped
    # SELinux enforcing on Fedora Asahi denies cross-label reads into
    # the bind-mounted config file; label:disable lifts confinement.
    security_opt:
      - label:disable
    environment:
      TZ: ${TZ}
      # Postmark SMTP credential — now used only by the `email` alerter
      # (the Fenwick-health backstop), not the default `custom` alerter.
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN}
      # Bearer token for the default `custom` alerter's push to Fenwick's
      # internal /events transport. Same 1P source Fenwick itself uses.
      FENWICK_INTERNAL_HTTP_TOKEN: ${FENWICK_INTERNAL_HTTP_TOKEN}
      GATUS_BACKREST_PUSH_TOKEN: ${GATUS_BACKREST_PUSH_TOKEN}
      GATUS_OFELIA_PUSH_TOKEN: ${GATUS_OFELIA_PUSH_TOKEN}
      GATUS_BACKREST_KANGAROO_PUSH_TOKEN: ${GATUS_BACKREST_KANGAROO_PUSH_TOKEN}
      # General-purpose push token for new external-endpoint heartbeats (the
      # specific tokens above are kept, no migration). The endpoint key in the
      # push URL is what routes a heartbeat; the token is just shared auth.
      GATUS_HEARTBEAT_PUSH_TOKEN: ${GATUS_HEARTBEAT_PUSH_TOKEN}
      # Komodo Core API credentials — used by the "Kangaroo Periphery
      # (via Komodo)" check that asserts kangaroo's Server state is Ok.
      KOMODO_API_KEY: ${KOMODO_API_KEY}
      KOMODO_API_SECRET: ${KOMODO_API_SECRET}
      # ClickHouse default-user password for the pipeline-staleness
      # checks (query ClickHouse directly for recent log arrival). The
      # stack.toml env block only populates the compose project .env —
      # the service must still map the var here to receive it.
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    # 8080 published on bilby host so kangaroo's Backrest can POST
    # heartbeat events from across the LAN. The bearer-token check on
    # each external-endpoint is the auth layer; LAN exposure is fine.
    ports:
      - 8080:8080
    # Relay external-path probe DNS: a UniFi split-horizon record
    # (unifi_dns_record.kookaburra_probe_storage in cloudflare/) maps
    # kookaburra-probe.storage.pod.haus → relay reserved IP, so LAN
    # DNS (which gatus uses) routes that probe out to kookaburra and
    # back through the rathole tunnel — the actual external path —
    # while regular storage.pod.haus stays split-horizoned to bilby.
    # No container-level config needed; the IP source of truth is the
    # relay TF root, referenced via terraform_remote_state.
    volumes:
      # Directory bind (not file bind) — gatus auto-reloads its config on
      # change, but an atomic-rename save on the host would leave the
      # container pointed at the now-orphan inode forever. Bind the
      # containing dir; gatus's default config path /config/config.yaml
      # still resolves correctly. See docs/stack-conventions.html#bind-mounts.
      - ${PODHAUS_REPO}/gatus/conf:/config:ro
      - gatus-data:/data
    networks:
      - dockernet
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
    # No in-container healthcheck. Gatus ships FROM scratch (only
    # /gatus, no wget/curl/sh), and the binary has no self-probe mode
    # — so any healthcheck has to be either a multi-stage build that
    # bundles a probe binary, or nothing. We choose nothing: the
    # in-container probe would only confirm the HTTP listener is up,
    # which is upstream of the property that actually matters ("is the
    # alerter alerting"). That property is monitored externally
    # instead; the external dead-man is tracked in
    # docs/plans/alligator-bilby-migration/deferred-followups.md. autoheal label
    # also removed: without a healthcheck it can never fire.
    #
    # Background: the prior `["CMD", "/gatus", "healthcheck"]` looked
    # plausible but is a no-op (gatus has no `healthcheck` subcommand
    # in main.go upstream). The binary ignored the arg, started the
    # full server, hit "address already in use" on 8080, exited 1.
    # Result: container marked unhealthy after start_period + retries
    # × interval ≈ 3.5 min, autoheal killed it, gatus rebooted, and
    # any check whose `interval × failure-threshold` exceeded ~3.5 min
    # (Pipeline Log Ingest, Kangaroo Log Ingest — both 5m × 2 = 10m)
    # never got the consecutive failures it needed to fire an alert.
    # Postmark history showed 0 alerts ever sent for those endpoints
    # despite hours of unhealthy state.

  sky-backups-monitor:
    container_name: sky-backups-monitor
    build:
      context: .
      dockerfile: Dockerfile.monitor
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_SKY_BACKUPS_MONITOR:-unset}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec sleep infinity"]
    environment:
      MC_CONFIG_DIR: /dev/shm/mc
      SKY_BACKUPS_ENDPOINT: https://pouch.pod.haus
      SKY_BACKUPS_BUCKET: sky-backups
      SKY_BACKUPS_PREFIX: personal-laptop
      SKY_BACKUPS_MAX_AGE: 7d
      SKY_BACKUPS_ACCESS_KEY: ${SKY_BACKUPS_ACCESS_KEY}
      SKY_BACKUPS_SECRET_KEY: ${SKY_BACKUPS_SECRET_KEY}
      GATUS_BASE_URL: http://gatus:8080
      GATUS_HEARTBEAT_PUSH_TOKEN: ${GATUS_HEARTBEAT_PUSH_TOKEN}
    networks:
      - dockernet
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
      ofelia.enabled: "true"
      # One authenticated S3 LIST per hour. Gatus's 2h heartbeat window also
      # catches a stopped monitor or two consecutive query failures.
      ofelia.job-exec.sky-backups-monitor.schedule: "0 15 * * * *"
      ofelia.job-exec.sky-backups-monitor.command: "/usr/local/bin/check-sky-backups"

networks:
  dockernet:
    external: true

volumes:
  gatus-data:
