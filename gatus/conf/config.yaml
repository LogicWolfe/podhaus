  # Komodo server health → Gatus. This poll asserts zero unresolved
  # CRITICAL alerts in Komodo's alert store. In Komodo 2.3 only server
  # checks write those: a server going unreachable, or CPU, memory or disk
  # past its critical threshold.
  #
  # It cannot see a failed procedure, action, build or deploy, nor a stack
  # state change. Komodo raises those as WARNING alerts already marked
  # resolved, and a procedure, action or build failure is never stored at
  # all: it exists only as a push to an enabled Alerter resource (see
  # `bin/core/src/api/execute/procedure.rs` in Komodo). The two summary
  # checks after this one cover failed procedures and unhealthy stacks.
  #
  # We poll instead of using Komodo's webhook Alerter because the Custom
  # alerter only POSTs JSON to a URL; it can't add the Authorization
  # header Gatus's external-endpoint API requires.
  - name: Komodo Alerts
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Komodo
    interval: 60s
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"ListAlerts","params":{"query":{"resolved":false,"level":"CRITICAL"}}}'
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].alerts) == 0"
    alerts:
      - type: custom
        description: "Komodo has an unresolved CRITICAL server alert (server unreachable, or CPU, memory or disk past its critical threshold). Check komodo.pod.haus → Alerts for the server and reason."
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  # Failed deploys → Gatus. Every push deploy, podhaus's and each service
  # repo's, runs as a Komodo procedure, so a failed deploy, image build or
  # sync shows up as a procedure whose last run failed. Komodo keeps that
  # state until the procedure next succeeds, so this check stays red (and
  # alerts once) until a later run is green. A procedure that is re-running
  # counts as running, not failed. The summary carries counts only: the
  # alert says that a procedure failed, and komodo.pod.haus → Procedures
  # says which. While one procedure is failing, a second failure raises no
  # new alert.
  #
  # `total > 0` keeps a key that can see no procedures from passing as
  # healthy.
  - name: Komodo procedures
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Komodo
    interval: 60s
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetProceduresSummary","params":{}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].total > 0"
      - "[BODY].failed == 0"
    alerts:
      - type: custom
        description: "A Komodo procedure's last run failed, most likely a push deploy. Check komodo.pod.haus → Procedures for which one and its failed stage."
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  # Unhealthy stacks → Gatus. Komodo counts a stack as unhealthy when it is
  # Unhealthy, Restarting, Dead, Created or Removing; Running, Stopped,
  # Down and Unknown are counted apart. Three one-minute failures before
  # alerting rides out the brief states a deploy passes through. Counts
  # only, as above: komodo.pod.haus → Stacks says which stack.
  - name: Komodo stacks
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Komodo
    interval: 60s
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetStacksSummary","params":{}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].total > 0"
      - "[BODY].unhealthy == 0"
    alerts:
      - type: custom
        description: "A Komodo stack is unhealthy, restarting or dead. Check komodo.pod.haus → Stacks for which one."
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  # --- Observability-pipeline staleness ---
  # The Komodo badge proves "process alive", and Alloy's own healthcheck
  # proves only that its exporter's requests are completing, not that they
  # arrive: a dead path to the collector leaves Alloy healthy on purpose,
  # so its retry keeps the queue. These query ClickHouse directly (gatus is
  # on dockernet) and assert recent arrival per host — absence of
  # telemetry is itself the signal. ClickHouse always 200s; freshness is
  # in the body: `1` = a row within the window, `0` = stale.
  # The per-host heartbeat checks (kangaroo, numbat, pinelake, bandicoot,
  # voltaire) assert a fresh Alloy *self-metric* reached ClickHouse — i.e.
  # the host's whole telemetry ship-path (Alloy → collector → ClickHouse)
  # is alive. They are NOT log-volume checks (that's "Pipeline Log Ingest
  # (bilby / total)" below, which counts otel_logs rows); named for what
  # they measure. Fractal deliberately has no heartbeat: the existing
  # "Docs (fractal, via Komodo)" check is the one alert wanted for fractal,
  # and no further fractal alert is added.
  #
  # Thresholds: a wedged exporter that the restart heals never fails a
  # check; a path that stays down, or a wedge the restart does not cure,
  # alerts. Alloy's healthcheck (logging/compose.shared.yaml) makes a host's
  # alloy unhealthy 5-6 min after its exporter's last request completed,
  # autoheal restarts it within 30 s, and the restarted Alloy delivers its
  # first 60 s self-scrape within about 90 s:
  #   6 min (unhealthy) + 0.5 (autoheal poll) + ~0.25 (stop and start)
  #   + 1.25 (first scrape and send) = about 8 min without a metric
  # The 15-min window outlasts that by 7 min, so a healed wedge fails no
  # check. A down path never restarts Alloy: its requests keep completing
  # with errors, and the retry delivers the queue once the path is back.
  # A path down longer than the window, or an uncured wedge, empties it 15
  # min after the last metric: the first failing check comes 15-20 min after
  # it (5-min interval) and the second, which alerts (failure-threshold 2),
  # 20-25 min after it. One failure alone never alerts, so a single slow
  # ClickHouse query does not page.
  - name: Kangaroo Telemetry Pipeline (heartbeat)
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    group: Observability
    interval: 5m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    # Heartbeat, not organic volume. kangaroo's Alloy scrapes its own
    # self-metrics every 60 s (`prometheus.scrape "alloy_self"`) and
    # ships them through the SAME batch+exporter as the logs. So a fresh
    # kangaroo Alloy metric in ClickHouse proves the cross-LAN pipeline
    # is moving data on a FIXED cadence — independent of whether any
    # container happened to log. This replaces the old organic-log-volume
    # proxy, whose window was an ever-widening guess against irregular
    # chatter (60→150 min, still false-firing: organic gaps hit 152 and
    # 170 min in the days before this change). The `host.name` resource
    # attribute that makes kangaroo's metrics selectable is stamped by
    # the `host_name` transform in logging/alloy-modules/ship.alloy, from
    # the host name logging/kangaroo/alloy-conf/config.alloy gives it.
    #
    # `count() > 0` over a TimeUnix-windowed scan (not `max(TimeUnix) >
    # now() - X` unbounded): the Map predicate (`ResourceAttributes
    # ['host.name']=…`) defeats primary-key pruning, so without the explicit
    # TimeUnix filter the query scans every active part and times out at
    # gatus's 10 s budget. count() also matches the criterion directly.
    #
    # 15-min window @ 60 s cadence = ~15 expected scrapes. A collector
    # restart is ridden out by the exporter's 30-minute retry (metrics queue
    # and flush once it is back), and a wedged exporter is restarted by
    # Alloy's healthcheck within about 8 min; either way metrics resume
    # inside the window. Only a path down for longer, or a wedge the restart
    # does not cure, empties it (timeline above). See 2026-06-20 in the
    # alloy-exporter-keepalive-wedge postmortem.
    body: "SELECT toUInt8(count() > 0) FROM default.otel_metrics_gauge WHERE TimeUnix > now() - INTERVAL 15 MINUTE AND ResourceAttributes['host.name']='kangaroo'"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == 1"
    alerts:
      - type: custom
        description: "No kangaroo Alloy metrics reached ClickHouse in 15+ min — the cross-LAN Alloy->collector pipeline is down (the 60 s self-metric heartbeat stopped), or its exporter is wedged and autoheal's restart of alloy has not cleared it. If alloy's log shows 'network is unreachable', dockernet has detached or gone phantom and needs the disconnect/rm/create/restart repair; otherwise check the collector on bandicoot. Full runbook: docs/monitoring.html#known-issues."
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Numbat Telemetry Pipeline (heartbeat)
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    group: Observability
    interval: 5m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: "SELECT toUInt8(count() > 0) FROM default.otel_metrics_gauge WHERE TimeUnix > now() - INTERVAL 15 MINUTE AND ResourceAttributes['host.name']='numbat'"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == 1"
    alerts:
      - type: custom
        description: "No Numbat Alloy metrics reached ClickHouse in 15+ min: the path to the collector is down, or Alloy's exporter is wedged and autoheal's restart of alloy has not cleared it. Check numbat-logging, bilby's public wstunnel tunnel, Caddy mTLS, and the ClickStack ingestion key."
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Pinelake Telemetry Pipeline (heartbeat)
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    group: Observability
    interval: 5m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: "SELECT toUInt8(count() > 0) FROM default.otel_metrics_gauge WHERE TimeUnix > now() - INTERVAL 15 MINUTE AND ResourceAttributes['host.name']='pinelake'"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == 1"
    alerts:
      - type: custom
        description: "No Pinelake Alloy metrics reached ClickHouse in 15+ minutes: the path to the collector is down, or Alloy's exporter is wedged and autoheal's restart of alloy has not cleared it. Check pinelake-logging, outbound HTTPS, the mTLS client certificate, and the ClickStack ingestion key."
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Bandicoot Telemetry Pipeline (heartbeat)
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    group: Observability
    interval: 5m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: "SELECT toUInt8(count() > 0) FROM default.otel_metrics_gauge WHERE TimeUnix > now() - INTERVAL 15 MINUTE AND ResourceAttributes['host.name']='bandicoot'"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == 1"
    alerts:
      - type: custom
        description: "No bandicoot Alloy metrics reached ClickHouse in 15+ minutes: the path to the collector is down, or Alloy's exporter is wedged and autoheal's restart of alloy has not cleared it. Bandicoot's Alloy ships to the collector on the same host, clickstack-otel:4318 by container name over dockernet. Check bandicoot-logging, that alloy and clickstack-otel are both on bandicoot's dockernet, the clickstack-otel container, and the ClickStack ingestion key."
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Voltaire Telemetry Pipeline (heartbeat)
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    group: Observability
    interval: 5m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: "SELECT toUInt8(count() > 0) FROM default.otel_metrics_gauge WHERE TimeUnix > now() - INTERVAL 15 MINUTE AND ResourceAttributes['host.name']='voltaire'"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == 1"
    alerts:
      - type: custom
        description: "No voltaire Alloy metrics reached ClickHouse in 15+ minutes: the path to the collector is down, or Alloy's exporter is wedged and autoheal's restart of alloy has not cleared it. Check voltaire-logging, outbound HTTPS to logs-ingest.pod.haus, the mTLS client certificate, and the ClickStack ingestion key."
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Pipeline Log Ingest (bilby / total)
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    group: Observability
    interval: 5m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    # See Kangaroo check above for why this is count() over a windowed
    # scan rather than max(Timestamp) over the whole table. The host is
    # the `host.name` resource attribute stamped by the shared enrich
    # module (logging/alloy-modules/enrich.alloy, docs/logging.md). A log
    # attribute named `host` is the logging service's own field (Caddy's
    # and Pomerium's request host), never the machine. A healed wedge of
    # bilby's own exporter (timeline above) leaves a log gap of at most
    # about 8 min, inside the 10-min window.
    body: "SELECT toUInt8(count() > 0) FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 10 MINUTE AND ResourceAttributes['host.name']='bilby'"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == 1"
    alerts:
      - type: custom
        description: "No bilby logs in 10+ min — the whole observability pipeline is down (collector / ClickHouse / Alloy on bilby). High severity: nothing is being captured anywhere."
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  # Active probes for Backrest. The push-style heartbeats below only fire
  # on SNAPSHOT_SUCCESS — they catch "snapshot ran but a hook failed" but
  # cannot detect "backrest never ran" without `heartbeat.interval` set
  # (the staleness alarm). Active probes catch crash-loops within minutes.
  # Bilby backrest exposes :9898 on dockernet (gatus is on dockernet too).
  - name: Backrest (bilby)
    url: http://backrest:9898/
    group: Backup
    interval: 60s
    alerts:
      - type: custom
        description: "Backrest's HTTP UI on bilby isn't responding. The container is crash-looping or its NFS bind to /mnt/pouch/backups has lost its source. Recovery chain: confirm /mnt/pouch is mounted (`ls /mnt/pouch/.podhaus-share-mounted`), then `docker start backrest` or redeploy the stack."
    conditions:
      - "[STATUS] >= 200"
      - "[STATUS] < 400"

  # Kangaroo backrest is on a separate docker host — gatus can't reach it
  # directly. Komodo Core polls all peripheries, so we ask it to inspect
  # the container and assert State.Status == running. Same auth pattern as
  # the Periphery checks above.
  - name: Backrest (kangaroo, via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Backup
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"kangaroo","container":"backrest"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"

  - name: Backrest (bandicoot, via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Backup
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"bandicoot","container":"backrest"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"
      - "[BODY].State.Health.Status == healthy"

  - name: Backrest (pinelake, via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Backup
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"pinelake","container":"backrest"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"
      - "[BODY].State.Health.Status == healthy"

  # --- Fenwick health (the alert pipeline's own backstop) ---
  # Since every other check now alerts THROUGH Fenwick, these watch the
  # path itself (Gatus → Fenwick → signal-cli → Signal). They alert via
  # `email` (Postmark), NOT `custom` (Fenwick). A check must never route
  # through the thing it watches. See docs/monitoring.html#alerting.

  # Liveness: Fenwick's Hono server answers /health with "ok". Fast
  # (minutes) detection of a hard container-down / crash-loop / failed
  # deploy — the case where alerts vanish entirely.
  - name: Fenwick
    # The bot lives on bandicoot; Gatus reaches it across the LAN.
    url: http://${BANDICOOT_LAN_IPV4}:8088/health
    group: Fenwick
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == ok"
    alerts:
      - type: email
        description: "Fenwick's HTTP server isn't answering on :8088/health — the bot is down or crash-looping, so every alert routed through Fenwick is silently undelivered. Check `docker logs fenwick` and redeploy. (This alert arrives via Postmark email, independent of Fenwick.)"
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  # End-to-end "Fenwick can actually send a Signal message": query
  # ClickHouse for >=1 successful /v2/send (signal-cli returns 201) by
  # Fenwick in the last 24h. Fenwick's daily Signal digest guarantees a
  # daily send (verified >=6/day), so a 24h window with zero successes
  # means the Signal path is broken (signal-cli down, a protocol or
  # account-registration failure) — exactly the silent delivery failure
  # bare liveness can't see. Same direct-ClickHouse pattern + creds as
  # the log-ingest staleness checks; the Map predicate is bounded by the
  # 24h Timestamp filter so the scan stays well under the 10s budget.
  - name: Signal Delivery (Fenwick)
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    group: Fenwick
    interval: 15m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: "SELECT toUInt8(countIf(SpanAttributes['http.response.status_code'] = '201') > 0) FROM otel_traces WHERE Timestamp > now() - INTERVAL 24 HOUR AND ServiceName = 'fenwick' AND SpanAttributes['url.full'] LIKE '%/v2/send%'"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == 1"
    alerts:
      - type: email
        description: "Fenwick hasn't successfully delivered a Signal message in 24h+ — no 201 from signal-cli's /v2/send in the trace pipeline. The daily digest guarantees a daily send, so zero means the Signal path is broken (signal-cli down, or a protocol/account-registration failure); inbound Signal-routed alerts won't reach me. Check `docker logs signal-cli-rest-api` + fenwick. (Via Postmark email, independent of Fenwick.)"
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

# --- Heartbeat endpoints (push-style) ---

  # --- ClickStack-backed dead-man's switches ---
  # "Has X happened recently" is asked of ClickHouse (the bandicoot ClickStack
  # store, HTTP port published on the LAN), not inferred from a push's
  # silence: a pull endpoint checks on start and every check is stateless, so
  # a Gatus restart cannot defer it the way it defers a push heartbeat's
  # window. Each query returns one row with one column `why`: `ok`, or a
  # sentence naming what is wrong, which the failed condition carries into the
  # alert. Design and the full table: docs/plans/gatus-dead-mans-switches.md.

  # Brinno construction time-lapse downloader (fenwick-brinno-downloader on
  # bandicoot). One trace per hourly cycle, root span brinno.reconcile; one
  # brinno.archive span per video stored. Four questions, one endpoint each.
  - name: Brinno
    group: Timelapse
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    interval: 10m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: >-
      SELECT if(n > 0, 'ok', 'no video archived in 48h') AS why
      FROM (SELECT count() AS n FROM default.otel_traces
      WHERE ServiceName = 'brinno-downloader' AND SpanName = 'brinno.archive'
      AND Timestamp > now() - INTERVAL 48 HOUR)
      FORMAT JSONEachRow
    conditions:
      - "[STATUS] == 200"
      - "[BODY].why == ok"
    alerts:
      - type: custom
        description: "No site time-lapse footage has been archived for two days. The camera may be offline, unpowered or moved, its MCS cloud upload may have stalled, or the downloader is failing every download (then the Brinno stuck day check names the day). Investigate: the cycle traces in ClickStack (ServiceName brinno-downloader), `docker logs brinno-downloader` on bandicoot, the camera's power and connectivity, or the MCS app (mcs.my.brinno.com)."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

  - name: Brinno downloader
    group: Timelapse
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    interval: 10m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: >-
      SELECT if(n > 0, 'ok', 'no reconcile cycle in 3h') AS why
      FROM (SELECT count() AS n FROM default.otel_traces
      WHERE ServiceName = 'brinno-downloader' AND SpanName = 'brinno.reconcile'
      AND Timestamp > now() - INTERVAL 3 HOUR)
      FORMAT JSONEachRow
    conditions:
      - "[STATUS] == 200"
      - "[BODY].why == ok"
    alerts:
      - type: custom
        description: "The Brinno downloader has not completed an hourly cycle in three hours: the container is down or wedged, or its traces are not reaching ClickStack (then the Bandicoot Telemetry Pipeline check is red too). Investigate: `docker ps` and `docker logs brinno-downloader` on bandicoot, then the fenwick-brinno-downloader stack in Komodo."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

  - name: Brinno stuck day
    group: Timelapse
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    interval: 10m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: >-
      SELECT if(toInt32OrZero(SpanAttributes['brinno.files_overdue']) = 0, 'ok',
      concat(SpanAttributes['brinno.files_overdue'], ' overdue: ', SpanAttributes['brinno.overdue'])) AS why
      FROM default.otel_traces
      WHERE ServiceName = 'brinno-downloader' AND SpanName = 'brinno.reconcile'
      AND Timestamp > now() - INTERVAL 7 DAY
      ORDER BY Timestamp DESC LIMIT 1
      FORMAT JSONEachRow
    conditions:
      - "[STATUS] == 200"
      - "[BODY].why == ok"
    alerts:
      - type: custom
        description: "A day of site time-lapse footage has been retried for longer than the downloader's overdue window (two days) without a download that verifies: the cloud keeps rendering an empty or truncated file, or never finishes the render. The condition text names the day. Investigate: that day's render and download spans in ClickStack, then the file in the MCS app (mcs.my.brinno.com)."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

  - name: Brinno card
    group: Timelapse
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    interval: 10m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: >-
      SELECT multiIf(total = 0 OR used = 0, 'no card estimate on the latest cycle',
      used * 10 >= total * 9, concat('card ', toString(intDiv(used * 100, total)), '% full'), 'ok') AS why
      FROM (SELECT toUInt64OrZero(SpanAttributes['brinno.card_used_bytes']) AS used,
      toUInt64OrZero(SpanAttributes['brinno.card_total_bytes']) AS total
      FROM default.otel_traces
      WHERE ServiceName = 'brinno-downloader' AND SpanName = 'brinno.reconcile'
      AND Timestamp > now() - INTERVAL 7 DAY
      ORDER BY Timestamp DESC LIMIT 1)
      FORMAT JSONEachRow
    conditions:
      - "[STATUS] == 200"
      - "[BODY].why == ok"
    alerts:
      - type: custom
        description: "The camera's SD card is over 90% full by the downloader's estimate (the cloud's sizes of the files still on the card against the configured 128 GB). Retention should keep it near a month of footage; a full card means deletions are being refused (red brinno.retire spans in the cycle trace) or the card was swapped for a smaller one. Investigate the latest cycle trace in ClickStack, then the camera."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

  # Backrest nightly pipelines, one endpoint per host, from Backrest's own
  # logs in ClickStack. Backrest schedules a plan's `forget` only once a
  # snapshot exists, so "every plan that ran backup also ran forget" proves
  # the snapshots landed; "no ERROR task failed" catches a failed backup,
  # prune or check and a fatal hook (bilby's off-site mirror runs as one).
  - name: Backrest Nightly
    group: Backup
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    interval: 10m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: >-
      SELECT multiIf(errors > 0, concat(toString(errors), ' backrest errors, latest: ', latest_error),
      length(missing) > 0, concat('backed up without forget: ', arrayStringConcat(missing, ', ')),
      length(backed) = 0, 'no plan backed up in 25h', 'ok') AS why
      FROM (SELECT backed, arraySort(arrayFilter(p -> NOT has(forgotten, p), backed)) AS missing, errors, latest_error
      FROM (SELECT groupUniqArrayIf(plan, Body LIKE '%running task%backup for plan%') AS backed,
      groupUniqArrayIf(plan, Body LIKE '%running task%forget for plan%') AS forgotten,
      countIf(Body LIKE '%ERROR%task failed%') AS errors,
      anyLastIf(substring(Body, 1, 240), Body LIKE '%ERROR%task failed%') AS latest_error
      FROM (SELECT Body, extract(Body, 'for plan [^a-z0-9]+([a-z0-9-]+)') AS plan FROM default.otel_logs
      WHERE ServiceName = 'backrest' AND ResourceAttributes['host.name'] = 'bilby'
      AND TimestampTime > now() - INTERVAL 25 HOUR)))
      FORMAT JSONEachRow
    conditions:
      - "[STATUS] == 200"
      - "[BODY].why == ok"
    alerts:
      - type: custom
        description: "Bilby's nightly backups did not all land in the last 25 hours, or Backrest on bilby logged an error (a failed backup, prune or check, or the off-site mirror hook on the backrest-state plan, which copies bandicoot's repository and uploads to OneDrive). The condition text names the plan or the error. Investigate: `docker logs backrest` on bilby, the Backrest UI (backups.pod.haus), and /mnt/jump/backups on bilby."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

  - name: Backrest Nightly (bandicoot)
