# Gatus monitoring config — config-as-code, checked into the repo.
# Edit, commit, redeploy. No UI state to drift.
#
# All HTTP monitors hit the public tunnel-routed URL, proving the full
# DNS → Cloudflare → tunnel → container path. If a service is down
# internally the tunnel monitor catches it; if the tunnel itself breaks
# every monitor drops at once (obvious signal). No need for redundant
# internal-only checks.

# Expose Prometheus metrics at :8080/metrics (same port as the UI +
# external-endpoint hooks — no new port, no new ingress). Alloy on bilby
# scrapes this and bridges it to ClickStack over OTLP. Non-sensitive
# operational data; reachable only on dockernet (the public
# gatus.pod.haus path stays Access-gated and /metrics is not added to
# the tunnel ingress). See docs/plans/clickstack-migration/gatus-metrics.md.
metrics: true

storage:
  type: sqlite
  path: /data/gatus.db
  # Keep ~90 days of results per endpoint (at 2m intervals ≈ 65k checks).
  capping: 65000

ui:
  title: PodHaus Status
  header: PodHaus

alerting:
  custom:
    url: "https://api.postmarkapp.com/email"
    method: POST
    headers:
      Accept: application/json
      Content-Type: application/json
      X-Postmark-Server-Token: ${POSTMARK_SERVER_TOKEN}
    # Placeholder notes:
    #   [ALERT_DESCRIPTION] always renders (empty if not set). Set per
    #     alert to explain what it means + where to investigate.
    #   [RESULT_ERRORS] renders the `error=...` query param (or HTTP
    #     errors) for both HTTP and push-style external endpoints. Push
    #     endpoints use this to convey per-invocation failure context
    #     (e.g., "443 folders unhealthy") — the sender URL-encodes them.
    #   [RESULT_CONDITIONS] renders the failed condition expression
    #     (e.g., "✗ `[STATUS] < 400`") for HTTP endpoints; push-style
    #     external-endpoints have no conditions, so Gatus leaves the
    #     literal token in place. Kept for HTTP diagnostics; tolerate
    #     the trailing placeholder on push endpoints.
    body: |
      {
        "From": "uptime@nathanbaxter.com",
        "To": "nathan@nathanbaxter.com",
        "Subject": "[ALERT_TRIGGERED_OR_RESOLVED] [ENDPOINT_NAME]",
        "HtmlBody": "<p><strong>Status:</strong> [ALERT_TRIGGERED_OR_RESOLVED]</p><p><strong>Endpoint:</strong> [ENDPOINT_GROUP] / [ENDPOINT_NAME]</p><p><strong>What this means:</strong> [ALERT_DESCRIPTION]</p><p><strong>Details:</strong> [RESULT_ERRORS]</p><p><strong>Status page:</strong> <a href=\"https://gatus.pod.haus\">gatus.pod.haus</a> · <strong>Logs:</strong> <a href=\"https://watch.pod.haus\">watch.pod.haus</a></p><p><strong>Failed conditions:</strong><br/>[RESULT_CONDITIONS]</p>",
        "MessageStream": "outbound"
      }
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

# --- Reusable defaults ---

_defaults: &defaults
  group: services
  interval: 2m
  conditions:
    - "[STATUS] >= 200"
    - "[STATUS] < 400"

# --- Tunnel-routed *.pod.haus services ---

endpoints:
  - name: HyperDX (ClickStack)
    url: https://watch.pod.haus/
    <<: *defaults

  - name: Home Assistant
    url: https://home.pod.haus/
    <<: *defaults

  - name: Kangaroo (NAS)
    url: https://kangaroo.pod.haus/
    <<: *defaults

  - name: Komodo
    url: https://komodo.pod.haus/
    <<: *defaults

  - name: Paperless
    url: https://paperless.pod.haus/
    <<: *defaults

  - name: Plex
    url: https://plex.pod.haus/
    <<: *defaults

  - name: Syncthing
    url: https://sync.pod.haus/
    <<: *defaults

  - name: Flood (Torrent)
    url: https://torrent.pod.haus/
    <<: *defaults

  - name: UniFi
    url: https://unifi.pod.haus/
    <<: *defaults
    client:
      insecure: true

  - name: Yiayia Board Frontend
    url: https://yiayia.pod.haus/health
    <<: *defaults

  - name: Yiayia Board Device
    url: https://yiayia.pod.haus/boards/health
    <<: *defaults

  # --- storage.pod.haus paths ---
  # On-bilby probe (LAN/split-horizon resolves to bilby:443 directly):
  # tests Caddy + MinIO. Independent of the relay. Catches a
  # Caddy/MinIO/cert failure on-box. See docs/plans/storage-public-relay.md.
  - name: MinIO S3 (storage.pod.haus, on-bilby)
    url: https://storage.pod.haus/minio/health/live
    <<: *defaults

  # THE GAP-CLOSER: external-path probe via the kookaburra relay.
  # gatus/compose.yaml `extra_hosts` pins kookaburra-probe.storage.pod.haus
  # to the relay's reserved IP (170.64.241.136) ONLY inside this gatus
  # container — the rest of bilby keeps using split-horizon. Hostname is
  # under *.storage.pod.haus so the LE wildcard cert validates. Catches
  # exactly the failure mode that hid the UDM WAN:443 incident: bilby/
  # Caddy itself is fine but external clients can't reach it.
  - name: MinIO S3 (via kookaburra relay — external path)
    url: https://kookaburra-probe.storage.pod.haus/minio/health/live
    <<: *defaults

  # Publii site: Cloudflare-proxied → pod_haus tunnel → Caddy →
  # nathanbaxter-com bucket. Catches a tunnel/Caddy/bucket break.
  # See docs/plans/nathanbaxter-com-publii.md.
  - name: nathanbaxter.com (Publii)
    url: https://nathanbaxter.com/
    <<: *defaults

  # Surfaces "Komodo Core can't reach <Periphery>" as a Gatus alert.
  # Periphery's :8120 isn't on dockernet so we check via Komodo Core's API:
  # POST GetServerState, assert status == Ok. Headers carry Komodo's API
  # credentials (same as komodo-op uses). Note: if BILBY periphery dies,
  # gatus on bilby may also be impaired — but Komodo Core can still answer
  # for as long as it's running, since Core polls Periphery independently.
  - name: Bilby Periphery (via Komodo)
    url: http://komodo-core:9120/read
    method: POST
    group: services
    interval: 60s
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"podhaus"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

  - name: Kangaroo Periphery (via Komodo)
    url: http://komodo-core:9120/read
    method: POST
    group: services
    interval: 60s
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"kangaroo"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

  # Komodo alert pipeline → Gatus. Komodo emits an alert any time a stack
  # deploy fails, a state transitions to Down/Restarting unexpectedly, a
  # build fails, or a procedure/action errors. This poll asserts zero
  # unresolved CRITICAL alerts, so Postmark fires whenever the homelab
  # has a deploy-grade failure that Komodo itself recognised. (WARNING-
  # level alerts — image-update-available, etc. — don't trip this.)
  #
  # We poll instead of using Komodo's webhook Alerter because the Custom
  # alerter only POSTs JSON to a URL; it can't add the Authorization
  # header Gatus's external-endpoint API requires.
  - name: Komodo Alerts
    url: http://komodo-core:9120/read
    method: POST
    group: services
    interval: 60s
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"ListAlerts","params":{"query":{"resolved":false,"level":"CRITICAL"}}}'
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].alerts) == 0"
    alerts:
      - type: custom
        description: "Komodo has unresolved CRITICAL alerts. A stack deploy, build, procedure, or action failed. Check komodo.pod.haus → Alerts for the specific resource + failure reason."
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  # --- Observability-pipeline staleness ---
  # The Komodo badge and Alloy's :12345 port-check both prove "process
  # alive", not "logs actually arriving". A wedged exporter / dead
  # cross-LAN path is silent. These query ClickHouse directly (gatus is
  # on dockernet) and assert recent log arrival per host — absence of
  # telemetry is itself the signal. ClickHouse always 200s; freshness is
  # in the body: `1` = a row within the window, `0` = stale.
  - name: Kangaroo Log Ingest (staleness)
    url: http://clickstack-clickhouse:8123/
    method: POST
    group: services
    interval: 5m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: "SELECT toUInt8(max(Timestamp) > now() - INTERVAL 20 MINUTE) FROM default.otel_logs WHERE LogAttributes['host']='kangaroo'"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == 1"
    alerts:
      - type: custom
        description: "No kangaroo logs reached ClickHouse in 20+ min. The cross-LAN Alloy->collector pipeline is silently down (recurring known issue — exporter wedge). Investigate kangaroo Alloy; `RestartStack kangaroo-logging` restores it. See clickstack-migration/ingestion-pipeline.md."
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Pipeline Log Ingest (bilby / total)
    url: http://clickstack-clickhouse:8123/
    method: POST
    group: services
    interval: 5m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: "SELECT toUInt8(max(Timestamp) > now() - INTERVAL 10 MINUTE) FROM default.otel_logs WHERE LogAttributes['host']='bilby'"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == 1"
    alerts:
      - type: custom
        description: "No bilby logs in 10+ min — the whole observability pipeline is down (collector / ClickHouse / Alloy on bilby). High severity: nothing is being captured anywhere."
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  # Active probes for Backrest. The push-style heartbeats below only fire
  # on SNAPSHOT_SUCCESS — they catch "snapshot ran but a hook failed" but
  # cannot detect "backrest never ran" without `heartbeat.interval` set
  # (the staleness alarm). Active probes catch crash-loops within minutes.
  # Bilby backrest exposes :9898 on dockernet (gatus is on dockernet too).
  - name: Backrest (bilby)
    url: http://backrest:9898/
    group: services
    interval: 60s
    conditions:
      - "[STATUS] >= 200"
      - "[STATUS] < 400"

  # Kangaroo backrest is on a separate docker host — gatus can't reach it
  # directly. Komodo Core polls all peripheries, so we ask it to inspect
  # the container and assert State.Status == running. Same auth pattern as
  # the Periphery checks above.
  - name: Backrest (kangaroo, via Komodo)
    url: http://komodo-core:9120/read
    method: POST
    group: services
    interval: 60s
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"kangaroo","container":"backrest"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"

# --- Heartbeat endpoints (push-style) ---

external-endpoints:
  # `heartbeat.interval` is the staleness threshold — Gatus synthesises a
  # failure result if no push arrives within this window. The top-level
  # `interval:` field is NOT recognised on external-endpoints (it's only
  # for HTTP-polled endpoints) and was previously silently ignored, which
  # left these heartbeats as event-only — they could only ever alert on a
  # received-but-failed push, never on missing pushes. See Gatus README
  # → External Endpoints.
  - name: Backrest Nightly
    group: heartbeat
    token: ${GATUS_BACKREST_PUSH_TOKEN}
    heartbeat:
      interval: 25h
    alerts:
      - type: custom
        description: "Backrest's nightly backup pipeline didn't check in. Either no snapshots ran tonight, or the post-plan rclone sync to OneDrive failed. Investigate: `docker logs backrest`, or query in HyperDX (watch.pod.haus), and check /mnt/pouch/backups for the expected repository state."
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  # Daily safety-net check from flood/rar-backlog.sh (ofelia-driven at
  # 04:50 AWST). Real-time extraction is handled by the rtorrent
  # event.download.finished hook (flood/scripts/rtorrent-extract.sh);
  # this is the cron backstop that scans for RAR folders older than 2h
  # with no extracted content alongside — i.e., the hook didn't fire
  # or failed silently. Missing heartbeat OR success=false both trigger
  # Postmark alerts via the shared default-alert config. 25h staleness
  # threshold tolerates one missed firing.
  - name: RAR Extraction
    group: heartbeat
    token: ${GATUS_UNPACKERR_PUSH_TOKEN}
    heartbeat:
      interval: 25h
    alerts:
      - type: custom
        description: "RAR extraction pipeline is unhealthy. Either the rtorrent event.download.finished hook (rtorrent-extract.sh) didn't fire or failed (check `/flood-db/rtorrent-extract.log` inside the flood container), the cron job itself is broken (check ofelia + `docker logs flood | grep rar-backlog`), or the scanner found folders with RAR files >2h old and no extracted content alongside. Manual scan: `docker exec flood /scripts/rar-backlog.sh`. Full backlog paths land in the flood container logs."
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  # Kangaroo's Backrest. Separate from bilby's because it's a separate
  # restic repo on a separate host. Hooks fire success/failure POSTs to
  # this endpoint via http://10.0.0.119:8080 (gatus published on bilby's
  # LAN). The kangaroo Backrest pipeline schedules at 06:00 — 25h interval
  # tolerates one missed firing before alerting.
  - name: Backrest Kangaroo Nightly
    group: heartbeat
    token: ${GATUS_BACKREST_KANGAROO_PUSH_TOKEN}
    heartbeat:
      interval: 25h
    alerts:
      - type: custom
        description: "Kangaroo's nightly Backrest pipeline didn't check in. Either no snapshots ran on kangaroo (check `docker logs backrest` filtered by host=kangaroo in HyperDX (watch.pod.haus)), or the success-hook on the backrest-state plan failed. Manually trigger a snapshot of any kangaroo plan from gatus.pod.haus to test."
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
