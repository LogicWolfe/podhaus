    interval: 10m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: >-
      SELECT multiIf(runs = 0, 'no clickstack-mongo-dump run in 25h',
      ok = 0, concat('clickstack-mongo-dump failed: ', latest_error), 'ok') AS why
      FROM (SELECT count() AS runs, countIf(Body LIKE '%failed=false%') AS ok,
      anyLastIf(substring(Body, 1, 240), Body LIKE '%failed=true%') AS latest_error
      FROM default.otel_logs WHERE ServiceName = 'ofelia' AND Body LIKE '%Job stop job=clickstack-mongo-dump %'
      AND TimestampTime > now() - INTERVAL 25 HOUR)
      FORMAT JSONEachRow
    conditions:
      - "[STATUS] == 200"
      - "[BODY].why == ok"
    alerts:
      - type: custom
        description: "HyperDX's nightly mongo dump (03:50 AWST, ofelia on bandicoot) did not run or failed in the last 25 hours, so the dashboards/alerts/source config (tiny but hand-built, not reconstructible from telemetry) may have no fresh archive. Check `docker logs bandicoot-ofelia` and `docker logs clickstack-mongo`, and /var/lib/clickstack/mongo-dumps for the latest archive."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

