  # Per-plan switches on bilby: the quiesced Forgejo snapshot (plus its
  # ofelia recovery job, which exits non-zero when it had to restart a
  # Forgejo left stopped) and the two hourly plans.
  - name: Backrest Forgejo
    group: Backup
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    interval: 10m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: >-
      SELECT multiIf(errors > 0, concat(toString(errors), ' errors, latest: ', latest_error),
      recoveries > 0, concat('recovery job failed: ', latest_recovery),
      forgets = 0, 'no completed backup of plan forgejo in 25h', 'ok') AS why
      FROM (SELECT countIf(Body LIKE '%running task%forget for plan%') AS forgets,
      countIf(Body LIKE '%ERROR%task failed%') AS errors,
      anyLastIf(substring(Body, 1, 240), Body LIKE '%ERROR%task failed%') AS latest_error
      FROM default.otel_logs WHERE ServiceName = 'backrest' AND ResourceAttributes['host.name'] = 'bilby'
      AND Body LIKE '%forgejo%' AND TimestampTime > now() - INTERVAL 25 HOUR) AS b
      CROSS JOIN (SELECT count() AS recoveries, anyLast(substring(Body, 1, 240)) AS latest_recovery
      FROM default.otel_logs WHERE ServiceName = 'ofelia' AND Body LIKE '%Job stop job=forgejo-backup-recover %'
      AND Body LIKE '%failed=true%' AND TimestampTime > now() - INTERVAL 25 HOUR) AS r
      FORMAT JSONEachRow
    conditions:
      - "[STATUS] == 200"
      - "[BODY].why == ok"
    alerts:
      - type: custom
        description: "Forgejo's quiesced nightly snapshot did not complete in the last 25 hours, its stop/finish hook failed, or the five-minute recovery job had to restart a Forgejo left stopped by an interrupted snapshot. The condition text says which. Check the backrest Forgejo plan, `docker logs backrest`, `docker logs ofelia`, and `/data/forgejo-backup.lock` inside Backrest on bilby."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

