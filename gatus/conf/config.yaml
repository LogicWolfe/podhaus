  # sky-backups/ maintains Sky's Restic repository: a weekly integrity check,
  # a monthly prune and a monthly read of a tenth of the pack data. Each needs
  # a successful run within its cadence plus a day's slack.
  - name: Sky Restic Maintenance
    group: Backup
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    interval: 1h
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: >-
      SELECT concat(multiIf(checks = 0, 'no successful sky-backups-check in 8 days',
      prunes = 0, 'no successful sky-backups-prune in 33 days',
      reads = 0, 'no successful sky-backups-read-subset in 33 days', 'ok'),
      if((checks = 0 OR prunes = 0 OR reads = 0) AND latest_error != '',
      concat('; latest failure: ', latest_error), '')) AS why
      FROM (SELECT
      countIf(Body LIKE '%Job stop job=sky-backups-check %failed=false%'
      AND TimestampTime > now() - INTERVAL 8 DAY) AS checks,
      countIf(Body LIKE '%Job stop job=sky-backups-prune %failed=false%') AS prunes,
      countIf(Body LIKE '%Job stop job=sky-backups-read-subset %failed=false%') AS reads,
      anyLastIf(substring(Body, 1, 240), Body LIKE '%failed=true%') AS latest_error
      FROM default.otel_logs WHERE ServiceName = 'ofelia'
      AND match(Body, 'Job stop job=sky-backups-(check|prune|read-subset) ')
      AND TimestampTime > now() - INTERVAL 33 DAY)
      FORMAT JSONEachRow
    conditions:
      - "[STATUS] == 200"
      - "[BODY].why == ok"
    alerts:
      - type: custom
        description: "A maintenance job for Sky's Restic repository (sky-backups stack on bilby) has not succeeded within its window; the condition text names it. A missed prune only grows the repository, but a failed check can mean damaged backups. Check `docker logs ofelia` on bilby, then run `docker exec sky-backups-maintenance /scripts/maintain.sh check` there."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

  # Daily safety-net scan of the rtorrent RAR-extraction and publish
  # pipeline (flood/scripts/rar-backlog.sh, ofelia at 04:50 local). Its
  # stdout says healthy or UNHEALTHY with the offending paths; the latest
  # run's line is judged.
  - name: RAR Extraction
    group: Torrents
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    interval: 10m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: >-
      SELECT multiIf(last = '', 'no rar-backlog run in 25h',
      last LIKE '%failed=true%', concat('rar-backlog failed: ', substring(last, 1, 240)),
      last LIKE '%UNHEALTHY%', extract(last, 'stdout="([^"]{0,300})'), 'ok') AS why
      FROM (SELECT argMax(Body, TimestampTime) AS last FROM default.otel_logs
      WHERE ServiceName = 'ofelia' AND ResourceAttributes['host.name'] = 'bilby'
      AND Body LIKE '%Job stop job=rar-backlog %' AND TimestampTime > now() - INTERVAL 25 HOUR)
      FORMAT JSONEachRow
    conditions:
      - "[STATUS] == 200"
      - "[BODY].why == ok"
    alerts:
      - type: custom
        description: "The RAR extraction pipeline on bilby is unhealthy or its daily scan did not run. Either the rtorrent event.download.finished hook (rtorrent-extract.sh) failed (check `/flood-db/rtorrent-extract.log` inside the rtorrent container), the scan found RAR folders over 2h old with nothing extracted or torrents never published to Plex (the condition text lists them), or ofelia stopped running the job (`docker logs ofelia | grep rar-backlog`). Manual scan: `docker exec rtorrent /scripts/rar-backlog.sh`."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

  - name: Pinelake RAR Extraction
    group: Torrents
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    interval: 10m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: >-
      SELECT multiIf(last = '', 'no rar-backlog run in 25h',
      last LIKE '%failed=true%', concat('rar-backlog failed: ', substring(last, 1, 240)),
      last LIKE '%UNHEALTHY%', extract(last, 'stdout="([^"]{0,300})'), 'ok') AS why
      FROM (SELECT argMax(Body, TimestampTime) AS last FROM default.otel_logs
      WHERE ServiceName = 'ofelia' AND ResourceAttributes['host.name'] = 'pinelake'
      AND Body LIKE '%Job stop job=rar-backlog %' AND TimestampTime > now() - INTERVAL 25 HOUR)
      FORMAT JSONEachRow
    conditions:
      - "[STATUS] == 200"
      - "[BODY].why == ok"
    alerts:
      - type: custom
        description: "Pinelake's RAR extraction pipeline is unhealthy or its daily scan did not run. Inspect pinelake-rtorrent and pinelake-ofelia through Komodo; the condition text lists the offending paths when the scan itself reported them."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

external-endpoints:
  # Push endpoints. `heartbeat.interval` is the staleness window, and Gatus
  # checks it on a timer that starts at process boot, so every restart (each
  # deploy touching gatus/) defers the check by one whole window. Only short
  # windows live here for that reason; anything "has X happened in the last
  # day" is a ClickStack-backed pull endpoint above (see the dead-man's
  # switches block in `endpoints:` and docs/plans/gatus-dead-mans-switches.md).

  - name: Sky invalidation
    group: Cache
    token: ${GATUS_HEARTBEAT_PUSH_TOKEN}
    heartbeat:
      interval: 3m
    alerts:
      - type: custom
        description: "Sky's release monitor has not checked in for 3 minutes. The minute job may be stopped or unable to read the RustFS manifest; inspect the caddy/ofelia logs before trusting the edge cache."
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  # MeTube's plexify hook (the Exec postprocessor yt-dlp runs after every
  # download lands under Kids/_incoming/<Show>) posts here once per file:
  # success=true once Sonarr's ManualImport has placed it in the TV
  # library, success=false&error=... when the title can't be confidently
  # matched to one Sonarr episode or the import silently did nothing. No
  # heartbeat/staleness window — a family download has no fixed cadence,
  # so days of silence are not themselves a failure; only a reported
  # failure needs Nathan. Group is `MeTube`, not `Media` (the polled
  # Sonarr/MeTube checks' group): Gatus derives the push key applications
  # POST to from sanitize(group)_sanitize(name), so this group is what
  # makes the key come out to the literal `metube_plexify` the hook is
  # built to call — using `Media` here would silently give the hook a URL
  # nothing listens on. See docs/plans/metube.md.
  - name: Plexify
    group: MeTube
    token: ${GATUS_HEARTBEAT_PUSH_TOKEN}
    alerts:
      - type: custom
        description: "MeTube downloaded a file the plexify hook could not confidently place in the Plex library. Either the video title didn't clearly match exactly one Sonarr episode (no candidate, or two close candidates), or Sonarr's ManualImport reported success without actually placing a file. The file is left untouched under Kids/_incoming/<Show> on Pouch. Investigate: `docker logs metube` for the hook's match attempt, then place or rename the file by hand via Sonarr (sonarr.pod.haus)."
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  # An hourly monitor lists the Restic repository's committed snapshot objects
  # in Pouch RustFS. A normal backup creates snapshots/<id> even when its tree is
  # unchanged; interrupted uploads that leave only packs or indexes don't pass.
  # Endpoint key: `backup_sky-restic-repository`.
  - name: Sky Restic Repository
    group: Backup
    token: ${GATUS_HEARTBEAT_PUSH_TOKEN}
    heartbeat:
      interval: 2h
    alerts:
      - type: custom
        description: "Sky's Restic repository has no snapshot committed within the last 14 days, or the hourly RustFS snapshot check has stopped reporting. Check the laptop's backup scheduler and Restic logs, then inspect sky-backups/personal-laptop/snapshots/ at pouch.pod.haus. The client must not use --skip-if-unchanged."
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  # --- ofelia job dead-man's-switches ---
  # Every ofelia job pushes a heartbeat on each run; missing pushes mean
  # the job silently stopped firing. The 2026-05/06 incident proved this:
  # `rar-backlog` was dead 13 days (ofelia restarted while flood was down,
  # so the job-exec never re-registered — the released ofelia image reads
  # labels only at startup). Only that one job had a heartbeat then; these
  # close the gap for the rest. Shared GATUS_OFELIA_PUSH_TOKEN.

  # --- ofelia job pushes (short windows) ---
  # The ofelia-driven jobs below push on each run; a missed window means the
  # job silently stopped (ofelia reads labels only at startup, so a job can
  # vanish when its container was down at an ofelia restart). Shared
  # GATUS_OFELIA_PUSH_TOKEN. The daily/monthly ofelia jobs are ClickStack
  # queries in `endpoints:` instead.

  # pinelake-stignore — reconciles Pouch's .stignore allowlist with
  # pinelake-tagged finished torrents; ofelia ticks every 5 min (plus the
  # rtorrent event hook). 30m tolerates a few missed ticks.
  - name: Pinelake Stignore
    group: Torrents
    token: ${GATUS_OFELIA_PUSH_TOKEN}
    heartbeat:
      interval: 30m
    alerts:
      - type: custom
        description: "The pinelake .stignore reconciler hasn't ticked in 30 min — newly-completed pinelake-tagged torrents won't be allowlisted for replication until it resumes. Check ofelia + `docker exec rtorrent python3 /scripts/pinelake-stignore.py`."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

  # plex-label-sync — mirrors Flood tags onto the matching Plex show/movie
  # as Labels (per-managed-user content restrictions); ofelia ticks every
  # 5 min (plus the rtorrent event hook). 30m tolerates a few missed ticks.
  - name: Plex Label Sync
    group: Torrents
    token: ${GATUS_OFELIA_PUSH_TOKEN}
    heartbeat:
      interval: 30m
    alerts:
      - type: custom
        description: "The Plex label sync hasn't ticked in 30 min — newly-tagged torrents won't have their kid-access labels applied in Plex until it resumes. Check ofelia + `docker exec rtorrent python3 /scripts/plex-label-sync.py` (then `/flood-db/plex-label-sync.log`). A FATAL there usually means Plex is unreachable at 172.18.0.1:32400 or the token is stale."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

  - name: Pinelake Plex Label Sync
    group: Torrents
    token: ${GATUS_OFELIA_PUSH_TOKEN}
    heartbeat:
      interval: 30m
    alerts:
      - type: custom
        description: "Pinelake's Flood-to-Plex label sync stopped checking in. Inspect pinelake-rtorrent and pinelake-ofelia through Komodo and confirm the preserved Pinelake Plex token still reaches localhost:32400."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

  - name: StreamFab Publish
    group: Plex
    token: ${GATUS_OFELIA_PUSH_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: custom
        description: "The StreamFab publisher hasn't ticked in 5 minutes. Check the streamfab-publish container health and Ofelia logs; completed captures will remain under Pouch/Downloads until it resumes."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true
