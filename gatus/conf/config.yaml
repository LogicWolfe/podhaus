      length(backed) = 0, 'no plan backed up in 25h', 'ok') AS why
      FROM (SELECT backed, arraySort(arrayFilter(p -> NOT has(forgotten, p), backed)) AS missing, errors, latest_error
      FROM (SELECT groupUniqArrayIf(plan, Body LIKE '%running task%backup for plan%') AS backed,
      groupUniqArrayIf(plan, Body LIKE '%running task%forget for plan%') AS forgotten,
      countIf(Body LIKE '%ERROR%task failed%') AS errors,
