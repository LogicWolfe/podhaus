        description: "Bandicoot's local nightly backups did not all land in the last 25 hours, or Backrest on bandicoot logged an error. The condition text names the plan or the error. The separate Backrest Nightly check on bilby reports their off-site copy. Investigate: `docker logs backrest` on bandicoot and the bind's sentinel (`ls /mnt/jump/backups-bandicoot/.podhaus-share-mounted`)."
