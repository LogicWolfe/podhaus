# Gatus monitoring config — config-as-code, checked into the repo.
# Edit, commit, redeploy. No UI state to drift.
#
# Service liveness checks probe each service's INTERNAL endpoint
# (dockernet container name + port, or the dockernet bridge gateway
# 172.18.0.1:<port> for host-network services on bilby, or
# `InspectDockerContainer` via Komodo Core for kangaroo-resident
# containers). A previous design probed public *.pod.haus URLs to
# cover the full public path, but an identity gateway intercepts
# unauthenticated requests with a 302 to its login page. The existing
# `[STATUS] < 400` condition
# accepted that 302 as healthy, so backend death was invisible.
# See docs/postmortems/2026-05-30-power-outage-nfs-recovery.md.
# Full-path checks remain only where the path is genuinely external
# (storage.pod.haus, numbat-probe.storage.pod.haus,
# nathanbaxter.com, voice.pod.haus) that are intentionally public.

# Expose Prometheus metrics at :8080/metrics (same port as the UI +
# external-endpoint hooks — no new port, no new ingress). Alloy on bilby
# scrapes this and bridges it to ClickStack over OTLP. Non-sensitive
# operational data; the public path remains Pomerium-protected. See
# docs/monitoring.html.
metrics: true

storage:
  type: sqlite
  path: /data/gatus.db
  # Keep ~90 days of results per endpoint (at 2m intervals ≈ 65k checks).
  # The key is maximum-number-of-results — Gatus's only result-retention
  # knob. `capping` (used here previously) is not a real key; Gatus's
  # lenient YAML parser silently ignored it, leaving retention at the
  # default 100 results (~3h at 2m) despite the comment's intent.
  maximum-number-of-results: 65000
  # The endpoint-detail page renders an Events timeline (status
  # transitions) capped by this; default 50 truncates the incident
  # history on flappy endpoints. One tiny row per transition.
  maximum-number-of-events: 10000

ui:
  title: PodHaus Status
  header: PodHaus

alerting:
  # Default alerter for every service check: push the alert to Fenwick
  # (the Signal/email home-helper agent) over its token-gated internal
  # HTTP transport. Fenwick runs one agent turn per alert and decides how
  # to notify, under household guidance (starts as "just notify me"; can
  # iterate toward dedup/aggregate without code changes). `/events/async`
  # returns 202 immediately so this alerter call never blocks on the LLM
  # round-trip. The body is the `service_alert` contract Fenwick's
  # injectable schema validates; `X-Fenwick-User: Nathan` is the
  # auth-derived principal the turn triages as.
  #
  # Placeholder substitution is raw (Gatus does strings.ReplaceAll; only
  # [RESULT_ERRORS] gets its double-quotes escaped, not newlines), so
  # every substituted value must stay JSON-safe. It does: endpoint
  # names/groups, the TRIGGERED/RESOLVED token, and our own
  # [ALERT_DESCRIPTION] strings carry no raw double-quotes; conditions
  # are quote-free expressions. (Push endpoints render the literal
  # [RESULT_CONDITIONS] token — still a valid JSON string; the agent
  # ignores it.)
  custom:
    url: "http://fenwick:8088/events/async"
    method: POST
    headers:
      Content-Type: application/json
      Authorization: "Bearer ${FENWICK_INTERNAL_HTTP_TOKEN}"
      X-Fenwick-User: Nathan
    body: |
      {
        "type": "service_alert",
        "payload": {
          "service": "[ENDPOINT_NAME]",
          "group": "[ENDPOINT_GROUP]",
          "status": "[ALERT_TRIGGERED_OR_RESOLVED]",
          "description": "[ALERT_DESCRIPTION]",
          "errors": "[RESULT_ERRORS]",
          "conditions": "[RESULT_CONDITIONS]"
        }
      }
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

  # The Postmark backstop — used ONLY by the Fenwick-health checks (the
  # `Fenwick` group below), which must NOT route through the thing they
  # watch. Native SMTP to Postmark (the server token is both username
  # and password); `from` is the verified Postmark sender signature.
  email:
    from: "uptime@nathanbaxter.com"
    to: "nathan@nathanbaxter.com"
    host: "smtp.postmarkapp.com"
    port: 587
    username: "${POSTMARK_SERVER_TOKEN}"
    password: "${POSTMARK_SERVER_TOKEN}"
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

# --- Reusable defaults ---

# Single alert wired into the default endpoint shape so every service
# check pushes to Fenwick on failure (the `custom` alerter → Fenwick).
# `alerting.custom.default-alert` above sets threshold + send-on-resolved;
# the per-alert block only needs `type: custom` to pick those up.
# Endpoints that need a custom description declare their own `alerts:`
# list (this anchor's value is replaced, not merged, when an endpoint
# declares its own). The Fenwick-health checks deliberately opt out of
# this anchor and use `type: email` (Postmark) instead — they must not
# route through Fenwick.
_alerts: &alerts
  - type: custom

_defaults: &defaults
  interval: 2m
  conditions:
    - "[STATUS] >= 200"
    - "[STATUS] < 400"
  alerts: *alerts

# --- Service liveness (internal probes) ---

endpoints:
  - name: HyperDX (ClickStack)
    url: http://hyperdx:8080/
    <<: *defaults
    group: Observability

  # home-assistant runs in network_mode: host, so it's reachable from
  # dockernet via the bridge gateway (same address Cloudflare Tunnel uses).
  # `/manifest.json` is unauthenticated and returns 200 when HA is up.
  - name: Home Assistant
    url: http://172.18.0.1:8123/manifest.json
    <<: *defaults
    group: Home Assistant

  # Probe the QNAP web UI directly on the LAN — gatus is on dockernet,
  # which NATs out to the LAN gateway. Self-signed cert, hence insecure.
  # .25 is the active 10GbE link (.232 is the 1GbE live spare).
  - name: Kangaroo (NAS)
    url: https://10.0.0.25/
    <<: *defaults
    group: Kangaroo
    client:
      insecure: true

  # Komodo Core's HTTP API is on dockernet. `/version` is auth-free and
  # returns 200 when Core is up. The Periphery/Alerts checks below
  # exercise the API more deeply.
  - name: Komodo
    url: http://komodo-core:9120/version
    <<: *defaults
    group: Komodo

  # Pocket ID OIDC provider — internal probe of the app's /healthz
  # (returns 200 when up). The public id.pod.haus is a bypass app so a
  # public probe would work, but the internal one is the convention and
  # avoids the edge. See docs/runbooks/pocket-id.md.
  - name: Pocket ID
    url: http://pocket-id:1411/healthz
    <<: *defaults
    group: Identity

  - name: Forgejo
    url: http://forgejo:3000/api/healthz
    <<: *defaults
    group: Git

  # Protected public path: Numbat Pomerium returns the login redirect.
  # Forgejo itself is covered by the internal health check above.
  - name: Forgejo HTTPS edge
    url: https://git.pod.haus/api/healthz
    <<: *defaults
    group: Git
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] == 302"

  # DNS-only public path: Numbat application IP :22 → rathole →
  # Forgejo's embedded SSH server on bilby.
  - name: Forgejo SSH (public relay)
    url: tcp://git.pod.haus:22
    group: Git
    interval: 2m
    alerts: *alerts
    conditions:
      - "[CONNECTED] == true"

  # Mumble is non-HTTP. tcp:// proves DNS (DDNS-updated A) +
  # UDM forward (terraform/unifi.tf) + Murmur control channel are
  # all healthy. UDP/voice quality is not synthetically probed; ear-
  # test on first call after any networking change. See
  # docs/runbooks/mumble.md.
  - name: Mumble (Voice)
    url: "tcp://voice.pod.haus:64738"
    group: Mumble
    interval: 2m
    alerts: *alerts
    conditions:
      - "[CONNECTED] == true"

  # Django's ALLOWED_HOSTS rejects requests whose Host header isn't the
  # configured public hostname with a 400, so the gatus probe spoofs it.
  # paperless redirects to /accounts/login/ (302) when the app is healthy.
  - name: Paperless
    url: http://paperless:8000/
    <<: *defaults
    group: Paperless
    headers:
      Host: paperless.pod.haus

  # plex runs in network_mode: host. `/identity` is unauthenticated and
  # returns 200 XML when Plex Media Server is up.
  - name: Plex
    url: http://172.18.0.1:32400/identity
    <<: *defaults
    group: Plex

  # Syncthing lives on kangaroo (network_mode: host). gatus can't reach
  # it directly, so we use the same Komodo InspectDockerContainer pattern
  # as Backrest (kangaroo) below — asserts the container is `running`.
  - name: Syncthing (kangaroo, via Komodo)
    url: http://komodo-core:9120/read
    method: POST
    group: Syncthing
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"kangaroo","container":"syncthing"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"

  - name: Flood (Torrent)
    url: http://flood:3000/
    <<: *defaults
    group: Torrents

  - name: UniFi
    url: https://unifi.pod.haus/
    <<: *defaults
    group: UniFi
    client:
      insecure: true

  - name: Yiayia Board Frontend
    url: https://yiayia.pod.haus/health
    <<: *defaults
    group: Yiayia

  - name: Yiayia Board Device
    url: https://yiayia.pod.haus/boards/health
    <<: *defaults
    group: Yiayia

  # --- storage.pod.haus paths ---
  # On-bilby probe (LAN/split-horizon resolves to bilby:443 directly):
  # tests Caddy + MinIO. Independent of the relay. Catches a
  # Caddy/MinIO/cert failure on-box.
  - name: MinIO S3 (storage.pod.haus, on-bilby)
    url: https://storage.pod.haus/minio/health/live
    <<: *defaults
    group: Storage

  - name: MinIO S3 (via Numbat relay, external path)
    url: https://numbat-probe.storage.pod.haus/minio/health/live
    <<: *defaults
    group: Storage

  # nathanbaxter.com: Cloudflare CDN → Numbat relay → rathole → Caddy →
  # nathanbaxter-com bucket.
  - name: nathanbaxter.com
    url: https://nathanbaxter.com/
    <<: *defaults
    group: nathanbaxter.com

  # Umami analytics — internal probe of the shared container's heartbeat
  # (the public stats.* hosts expose only /script.js and /api/send, so an
  # external probe of /api/heartbeat is not useful). Returns
  # 200 when the app + its Postgres are up.
  - name: Umami
    url: http://umami:3000/api/heartbeat
    <<: *defaults
    group: Analytics

  # pets.indigopod.au: Cloudflare CDN → Numbat relay → rathole → the pets
  # engine container. /api/content exercises the whole stack (edge →
  # container → SQLite → published content), so it catches a tunnel,
  # container, or content-store break — not just a static 200.
  - name: pets.indigopod.au
    url: https://pets.indigopod.au/api/content
    <<: *defaults
    group: Pets

  # Surfaces "Komodo Core can't reach <Periphery>" as a Gatus alert.
  # Periphery's :8120 isn't on dockernet so we check via Komodo Core's API:
  # POST GetServerState, assert status == Ok. Headers carry Komodo's API
  # credentials (same as komodo-op uses). Note: if BILBY periphery dies,
  # gatus on bilby may also be impaired — but Komodo Core can still answer
  # for as long as it's running, since Core polls Periphery independently.
  - name: Bilby Periphery (via Komodo)
    url: http://komodo-core:9120/read
    method: POST
    group: Komodo
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"podhaus"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

  - name: Kangaroo Periphery (via Komodo)
    url: http://komodo-core:9120/read
    method: POST
    group: Komodo
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"kangaroo"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

  - name: Numbat Periphery (via Komodo)
    url: http://komodo-core:9120/read
    method: POST
    group: Komodo
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"numbat"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

  - name: Pinelake Periphery (via Komodo)
    url: http://komodo-core:9120/read
    method: POST
    group: Komodo
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"pinelake"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

  - name: Pinelake Plex (via Komodo)
    url: http://komodo-core:9120/read
    method: POST
    group: Plex
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"pinelake","container":"pinelake-plex"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"
      - "[BODY].State.Health.Status == healthy"

  # A healthy container proves nothing about what clients are told to connect
  # to. OrbStack hides the Mac's LAN interface from Plex, so the same-house
  # address is published by the `plex-advertise` launch daemon against a DHCP
  # lease; if that stalls while the lease moves, local playback silently falls
  # back to Plex's relay and every stream leaves the house. This reads the
  # list back from plex.tv and asserts a Pine Lake LAN address is still in it.
  # The subnet is the coupling here — if that household re-addresses its LAN,
  # update the pattern.
  - name: Pinelake Plex LAN advertisement
    url: https://plex.tv/api/v2/resources?includeHttps=1
    group: Plex
    interval: 300s
    alerts: *alerts
    headers:
      X-Plex-Token: ${PINELAKE_PLEX_TOKEN}
      X-Plex-Client-Identifier: podhaus-gatus
      Accept: application/json
    conditions:
      - "[STATUS] == 200"
      - "[BODY] pat *192.168.1.*"

  - name: Pinelake Syncthing (via Komodo)
    url: http://komodo-core:9120/read
    method: POST
    group: Syncthing
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"pinelake","container":"pinelake-syncthing"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"
      - "[BODY].State.Health.Status == healthy"

  - name: Pinelake Flood (via Komodo)
    url: http://komodo-core:9120/read
    method: POST
    group: Torrents
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"pinelake","container":"pinelake-flood"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"
      - "[BODY].State.Health.Status == healthy"

  # Komodo alert pipeline → Gatus. Komodo emits an alert for a range of
  # conditions: a stack deploy/build/procedure/action failure, a server
  # going unreachable, a host CPU/mem threshold breach, or an unexpected
  # state transition (Down/Restarting). This poll asserts zero unresolved
  # CRITICAL alerts, so Postmark fires whenever Komodo itself flags a
  # CRITICAL-grade problem. (WARNING-level alerts — image-update-
  # available, elevated-but-not-pegged CPU, etc. — don't trip this.)
  #
  # We poll instead of using Komodo's webhook Alerter because the Custom
  # alerter only POSTs JSON to a URL; it can't add the Authorization
  # header Gatus's external-endpoint API requires.
  - name: Komodo Alerts
    url: http://komodo-core:9120/read
    method: POST
    group: Komodo
    interval: 60s
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"ListAlerts","params":{"query":{"resolved":false,"level":"CRITICAL"}}}'
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].alerts) == 0"
    alerts:
      - type: custom
        description: "Komodo has an unresolved CRITICAL alert (deploy/build/procedure failure, server unreachable, CPU/mem threshold, or unexpected state change). Check komodo.pod.haus → Alerts for the specific resource + failure reason."
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  # --- Observability-pipeline staleness ---
  # The Komodo badge and Alloy's :12345 port-check both prove "process
  # alive", not "logs actually arriving". A wedged exporter / dead
  # cross-LAN path is silent. These query ClickHouse directly (gatus is
  # on dockernet) and assert recent log arrival per host — absence of
  # telemetry is itself the signal. ClickHouse always 200s; freshness is
  # in the body: `1` = a row within the window, `0` = stale.
  # These two per-host checks assert a fresh Alloy *self-metric* reached
  # ClickHouse — i.e. the host's whole telemetry ship-path (Alloy →
  # collector → ClickHouse) is alive. They are NOT log-volume checks
  # (that's "Pipeline Log Ingest (bilby / total)" below, which counts
  # otel_logs rows); named for what they measure.
  - name: Kangaroo Telemetry Pipeline (heartbeat)
    url: http://clickstack-clickhouse:8123/
    method: POST
    group: Observability
    interval: 5m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    # Heartbeat, not organic volume. kangaroo's Alloy scrapes its own
    # self-metrics every 60 s (`prometheus.scrape "alloy_self"`) and
    # ships them through the SAME batch+exporter as the logs. So a fresh
    # kangaroo Alloy metric in ClickHouse proves the cross-LAN pipeline
    # is moving data on a FIXED cadence — independent of whether any
    # container happened to log. This replaces the old organic-log-volume
    # proxy, whose window was an ever-widening guess against irregular
    # chatter (60→150 min, still false-firing: organic gaps hit 152 and
    # 170 min in the days before this change). The `host` resource
    # attribute that makes kangaroo's metrics selectable is stamped by
    # the `svc_alloy` transform in logging/kangaroo/alloy-conf/config.alloy.
    #
    # `count() > 0` over a TimeUnix-windowed scan (not `max(TimeUnix) >
    # now() - X` unbounded): the Map predicate (`ResourceAttributes
    # ['host']=…`) defeats primary-key pruning, so without the explicit
    # TimeUnix filter the query scans every active part and times out at
    # gatus's 10 s budget. count() also matches the criterion directly.
    #
    # 15-min window @ 60 s cadence = ~15 expected scrapes; the 30 m
    # bounded exporter retry rides out a transient collector restart
    # (metrics queue and flush), so only a genuine stall empties the
    # window. With the 2-fail debounce a real stoppage alerts in ~10 min
    # instead of 150. See 2026-06-20 in the alloy-exporter-keepalive-
    # wedge postmortem.
    body: "SELECT toUInt8(count() > 0) FROM default.otel_metrics_gauge WHERE TimeUnix > now() - INTERVAL 15 MINUTE AND ResourceAttributes['host']='kangaroo'"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == 1"
    alerts:
      - type: custom
        description: "No kangaroo Alloy metrics reached ClickHouse in 15+ min — the cross-LAN Alloy->collector pipeline is down (the 60 s self-metric heartbeat stopped). Two causes, two fixes: an exporter wedge (no errors in alloy's log, just silence) clears with `RestartStack kangaroo-logging`; a dockernet detach / phantom network (alloy log shows 'network is unreachable') needs the disconnect/rm/create/restart repair. Full runbook: docs/monitoring.html#known-issues."
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Numbat Telemetry Pipeline (heartbeat)
    url: http://clickstack-clickhouse:8123/
    method: POST
    group: Observability
    interval: 5m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: "SELECT toUInt8(count() > 0) FROM default.otel_metrics_gauge WHERE TimeUnix > now() - INTERVAL 15 MINUTE AND ResourceAttributes['host']='numbat'"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == 1"
    alerts:
      - type: custom
        description: "No Numbat Alloy metrics reached ClickHouse in 15+ min. Check numbat-logging, the logs-ingest rathole service, Caddy mTLS, and the ClickStack ingestion key."
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Pinelake Telemetry Pipeline (heartbeat)
    url: http://clickstack-clickhouse:8123/
    method: POST
    group: Observability
    interval: 5m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: "SELECT toUInt8(count() > 0) FROM default.otel_metrics_gauge WHERE TimeUnix > now() - INTERVAL 15 MINUTE AND ResourceAttributes['host']='pinelake'"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == 1"
    alerts:
      - type: custom
        description: "No Pinelake Alloy metrics reached ClickHouse in 15+ minutes. Check pinelake-logging, outbound HTTPS, the mTLS client certificate, and the ClickStack ingestion key."
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Pipeline Log Ingest (bilby / total)
    url: http://clickstack-clickhouse:8123/
    method: POST
    group: Observability
    interval: 5m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    # See Kangaroo check above for why this is count() over a windowed
    # scan rather than max(Timestamp) over the whole table.
    body: "SELECT toUInt8(count() > 0) FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 10 MINUTE AND LogAttributes['host']='bilby'"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == 1"
    alerts:
      - type: custom
        description: "No bilby logs in 10+ min — the whole observability pipeline is down (collector / ClickHouse / Alloy on bilby). High severity: nothing is being captured anywhere."
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  # Active probes for Backrest. The push-style heartbeats below only fire
  # on SNAPSHOT_SUCCESS — they catch "snapshot ran but a hook failed" but
  # cannot detect "backrest never ran" without `heartbeat.interval` set
  # (the staleness alarm). Active probes catch crash-loops within minutes.
  # Bilby backrest exposes :9898 on dockernet (gatus is on dockernet too).
  - name: Backrest (bilby)
    url: http://backrest:9898/
    group: Backup
    interval: 60s
    alerts:
      - type: custom
        description: "Backrest's HTTP UI on bilby isn't responding. The container is crash-looping or its NFS bind to /mnt/pouch/backups has lost its source. Recovery chain: confirm /mnt/pouch is mounted (`ls /mnt/pouch/.podhaus-share-mounted`), then `docker start backrest` or redeploy the stack."
    conditions:
      - "[STATUS] >= 200"
      - "[STATUS] < 400"

  # Kangaroo backrest is on a separate docker host — gatus can't reach it
  # directly. Komodo Core polls all peripheries, so we ask it to inspect
  # the container and assert State.Status == running. Same auth pattern as
  # the Periphery checks above.
  - name: Backrest (kangaroo, via Komodo)
    url: http://komodo-core:9120/read
    method: POST
    group: Backup
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"kangaroo","container":"backrest"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"

  - name: Backrest (pinelake, via Komodo)
    url: http://komodo-core:9120/read
    method: POST
    group: Backup
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"pinelake","container":"backrest"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"
      - "[BODY].State.Health.Status == healthy"

  # --- Fenwick health (the alert pipeline's own backstop) ---
  # Since every other check now alerts THROUGH Fenwick, these watch the
  # path itself (Gatus → Fenwick → signal-cli → Signal). They alert via
  # `email` (Postmark), NOT `custom` (Fenwick). A check must never route
  # through the thing it watches. See docs/monitoring.html#alerting.

  # Liveness: Fenwick's Hono server answers /health with "ok". Fast
  # (minutes) detection of a hard container-down / crash-loop / failed
  # deploy — the case where alerts vanish entirely.
  - name: Fenwick
    url: http://fenwick:8088/health
    group: Fenwick
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == ok"
    alerts:
      - type: email
        description: "Fenwick's HTTP server isn't answering on :8088/health — the bot is down or crash-looping, so every alert routed through Fenwick is silently undelivered. Check `docker logs fenwick` and redeploy. (This alert arrives via Postmark email, independent of Fenwick.)"
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  # End-to-end "Fenwick can actually send a Signal message": query
  # ClickHouse for >=1 successful /v2/send (signal-cli returns 201) by
  # Fenwick in the last 24h. Fenwick's daily Signal digest guarantees a
  # daily send (verified >=6/day), so a 24h window with zero successes
  # means the Signal path is broken (signal-cli down, a protocol or
  # account-registration failure) — exactly the silent delivery failure
  # bare liveness can't see. Same direct-ClickHouse pattern + creds as
  # the log-ingest staleness checks; the Map predicate is bounded by the
  # 24h Timestamp filter so the scan stays well under the 10s budget.
  - name: Signal Delivery (Fenwick)
    url: http://clickstack-clickhouse:8123/
    method: POST
    group: Fenwick
    interval: 15m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: "SELECT toUInt8(countIf(SpanAttributes['http.response.status_code'] = '201') > 0) FROM otel_traces WHERE Timestamp > now() - INTERVAL 24 HOUR AND ServiceName = 'fenwick' AND SpanAttributes['url.full'] LIKE '%/v2/send%'"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == 1"
    alerts:
      - type: email
        description: "Fenwick hasn't successfully delivered a Signal message in 24h+ — no 201 from signal-cli's /v2/send in the trace pipeline. The daily digest guarantees a daily send, so zero means the Signal path is broken (signal-cli down, or a protocol/account-registration failure); inbound Signal-routed alerts won't reach me. Check `docker logs signal-cli-rest-api` + fenwick. (Via Postmark email, independent of Fenwick.)"
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

# --- Heartbeat endpoints (push-style) ---

external-endpoints:
  # `heartbeat.interval` is the staleness threshold — Gatus synthesises a
  # failure result if no push arrives within this window. The top-level
  # `interval:` field is NOT recognised on external-endpoints (it's only
  # for HTTP-polled endpoints) and was previously silently ignored, which
  # left these heartbeats as event-only — they could only ever alert on a
  # received-but-failed push, never on missing pushes. See Gatus README
  # → External Endpoints.

  - name: Sky invalidation
    group: Cache
    token: ${GATUS_HEARTBEAT_PUSH_TOKEN}
    heartbeat:
      interval: 3m
    alerts:
      - type: custom
        description: "Sky's release monitor has not checked in for 3 minutes. The minute job may be stopped or unable to read the MinIO manifest; inspect the caddy/ofelia logs before trusting the edge cache."
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  # Brinno construction time-lapse downloader (the fenwick-brinno-downloader
  # stack). It pushes a heartbeat per archived video — roughly daily, since
  # it downloads the previous day's footage once the camera finishes
  # uploading it. >48h of silence means no new footage is landing (a
  # two-day grace tolerates a late upload / a missed day). Endpoint key
  # (for the service's push URL) is `timelapse_brinno`. Uses the
  # general-purpose heartbeat push token — these tokens aren't per-service
  # (the URL's endpoint key is what routes a heartbeat to the right check),
  # so new endpoints share GATUS_HEARTBEAT_PUSH_TOKEN rather than minting one.
  - name: Brinno
    group: Timelapse
    token: ${GATUS_HEARTBEAT_PUSH_TOKEN}
    heartbeat:
      interval: 48h
    alerts:
      - type: custom
        description: "Site time-lapse footage stopped arriving. The brinno-downloader checks in once per archived video (~daily); >48h of silence means no new footage is being downloaded — the camera may be offline, unpowered, or moved, its MCS cloud upload may have stalled, or the downloader is stuck. Investigate: `docker logs brinno-downloader`, the camera's power/connectivity, or the MCS app (mcs.my.brinno.com)."
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  # An hourly monitor lists the Restic repository's committed snapshot objects
  # in Pouch MinIO. A normal backup creates snapshots/<id> even when its tree is
  # unchanged; interrupted uploads that leave only packs or indexes don't pass.
  # Endpoint key: `backup_sky-restic-repository`.
  - name: Sky Restic Repository
    group: Backup
    token: ${GATUS_HEARTBEAT_PUSH_TOKEN}
    heartbeat:
      interval: 2h
    alerts:
      - type: custom
        description: "Sky's Restic repository has no snapshot committed within the last 7 days, or the hourly MinIO snapshot check has stopped reporting. Check the laptop's backup scheduler and Restic logs, then inspect sky-backups/personal-laptop/snapshots/ at pouch.pod.haus. The client must not use --skip-if-unchanged."
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  - name: Backrest Nightly
    group: Backup
    token: ${GATUS_BACKREST_PUSH_TOKEN}
    heartbeat:
      interval: 25h
    alerts:
      - type: custom
        description: "Backrest's nightly backup pipeline didn't check in. Either no snapshots ran tonight, or the post-plan rclone sync to OneDrive failed. Investigate: `docker logs backrest`, or query in HyperDX (watch.pod.haus), and check /mnt/pouch/backups for the expected repository state."
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  - name: Backrest Forgejo
    group: Backup
    token: ${GATUS_BACKREST_PUSH_TOKEN}
    heartbeat:
      interval: 25h
    alerts:
      - type: custom
        description: "Forgejo's quiesced nightly snapshot did not check in. The hook stops Forgejo, snapshots local SQLite state plus Jump repositories, restarts Forgejo, and only then reports success. Check the backrest Forgejo plan, `docker logs backrest`, and `/data/forgejo-backup.lock` inside Backrest."
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  # Hourly pets backup heartbeat. The pets plan (DB + assets in one
  # consistent snapshot) pushes on EVERY run — success OR unchanged-skip —
  # so it checks in hourly without false alarms during quiet periods.
  # Failures still also surface immediately on "Backrest Nightly" (the
  # repo-level any-error hook names the failing plan).
  - name: Backrest Pets
    group: Backup
    token: ${GATUS_BACKREST_PUSH_TOKEN}
    heartbeat:
      interval: 3h
    alerts:
      - type: custom
        description: "The hourly pets backup stopped checking in. The pets plan pushes a heartbeat every hour on success or unchanged-skip; >3h of silence means it stopped running or backrest is down. Investigate: `docker logs backrest`, the backrest UI (backups.pod.haus), or query in HyperDX (watch.pod.haus)."
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  # Daily safety-net check from flood/rar-backlog.sh (ofelia-driven at
  # 04:50 AWST). Real-time extraction is handled by the rtorrent
  # event.download.finished hook (flood/scripts/rtorrent-extract.sh);
  # this is the cron backstop that scans for RAR folders older than 2h
  # with no extracted content alongside — i.e., the hook didn't fire
  # or failed silently. Missing heartbeat OR success=false both trigger
  # Postmark alerts via the shared default-alert config. 25h staleness
  # threshold tolerates one missed firing.
  - name: RAR Extraction
    group: Torrents
    token: ${GATUS_OFELIA_PUSH_TOKEN}
    heartbeat:
      interval: 25h
    alerts:
      - type: custom
        description: "RAR extraction pipeline is unhealthy. Either the rtorrent event.download.finished hook (rtorrent-extract.sh) didn't fire or failed (check `/flood-db/rtorrent-extract.log` inside the flood container), the cron job itself is broken (check ofelia + `docker logs flood | grep rar-backlog`), or the scanner found folders with RAR files >2h old and no extracted content alongside. Manual scan: `docker exec flood /scripts/rar-backlog.sh`. Full backlog paths land in the flood container logs."
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  - name: Pinelake RAR Extraction
    group: Torrents
    token: ${GATUS_OFELIA_PUSH_TOKEN}
    heartbeat:
      interval: 25h
    alerts:
      - type: custom
        description: "Pinelake's RAR extraction and publish-backlog job stopped checking in or reported an error. Inspect pinelake-flood and pinelake-ofelia through Komodo; corrupt or incomplete archives are disposable, but completed media must publish before torrent working data is removed."
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  # Kangaroo's Backrest. Separate from bilby's because it's a separate
  # restic repo on a separate host. Hooks fire success/failure POSTs to
  # this endpoint via http://10.0.0.119:8080 (gatus published on bilby's
  # LAN). The kangaroo Backrest pipeline schedules at 06:00 — 25h interval
  # tolerates one missed firing before alerting.
  - name: Backrest Kangaroo Nightly
    group: Backup
    token: ${GATUS_BACKREST_KANGAROO_PUSH_TOKEN}
    heartbeat:
      interval: 25h
    alerts:
      - type: custom
        description: "Kangaroo's nightly Backrest pipeline didn't check in. Either no snapshots ran on kangaroo (check `docker logs backrest` filtered by host=kangaroo in HyperDX (watch.pod.haus)), or the success-hook on the backrest-state plan failed. Manually trigger a snapshot of any kangaroo plan from gatus.pod.haus to test."
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  - name: Backrest Pinelake Nightly
    group: Backup
    token: ${GATUS_OFELIA_PUSH_TOKEN}
    heartbeat:
      interval: 25h
    alerts:
      - type: custom
        description: "Pinelake's nightly Backrest pipeline stopped checking in. Inspect pinelake-backup through Komodo and verify the local TerraMaster restic repository."
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  # --- ofelia job dead-man's-switches ---
  # Every ofelia job pushes a heartbeat on each run; missing pushes mean
  # the job silently stopped firing. The 2026-05/06 incident proved this:
  # `rar-backlog` was dead 13 days (ofelia restarted while flood was down,
  # so the job-exec never re-registered — the released ofelia image reads
  # labels only at startup). Only that one job had a heartbeat then; these
  # close the gap for the rest. Shared GATUS_OFELIA_PUSH_TOKEN.

  # clickstack-mongo-dump — nightly HyperDX mongo logical dump (03:50 AWST).
  # The mongo image has no wget/curl, so /scripts/mongo-dump.sh pushes via
  # a bash /dev/tcp request. 25h tolerates one missed firing.
  - name: ClickStack Mongo Dump
    group: Observability
    token: ${GATUS_OFELIA_PUSH_TOKEN}
    heartbeat:
      interval: 25h
    alerts:
      - type: custom
        description: "HyperDX mongo nightly dump didn't check in — the dashboards/alerts/source config (tiny but hand-built, not reconstructible from telemetry) may have no fresh archive. Check ofelia + `docker logs clickstack-mongo`, and /var/lib/clickstack/mongo-dumps for the latest archive."
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  # plex-stats-cleanup — monthly statistics prune + VACUUM (1st, 05:30
  # AWST). 32-day interval tolerates the monthly cadence; gatus sqlite
  # storage persists last-seen across restarts so this won't false-red on
  # a deploy.
  - name: Plex Stats Cleanup
    group: Plex
    token: ${GATUS_OFELIA_PUSH_TOKEN}
    heartbeat:
      interval: 768h
    alerts:
      - type: custom
        description: "Monthly Plex statistics prune + VACUUM hasn't run in over a month — the Plex DB stats tables will slowly bloat. Low urgency. Check ofelia + `docker exec plex /scripts/stats-cleanup.sh`."
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  # pinelake-stignore — reconciles Pouch's .stignore allowlist with
  # pinelake-tagged finished torrents; ofelia ticks every 5 min (plus the
  # rtorrent event hook). 30m tolerates a few missed ticks.
  - name: Pinelake Stignore
    group: Torrents
    token: ${GATUS_OFELIA_PUSH_TOKEN}
    heartbeat:
      interval: 30m
    alerts:
      - type: custom
        description: "The pinelake .stignore reconciler hasn't ticked in 30 min — newly-completed pinelake-tagged torrents won't be allowlisted for replication until it resumes. Check ofelia + `docker exec flood python3 /scripts/pinelake-stignore.py`."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

  # plex-label-sync — mirrors Flood tags onto the matching Plex show/movie
  # as Labels (per-managed-user content restrictions); ofelia ticks every
  # 5 min (plus the rtorrent event hook). 30m tolerates a few missed ticks.
  - name: Plex Label Sync
    group: Torrents
    token: ${GATUS_OFELIA_PUSH_TOKEN}
    heartbeat:
      interval: 30m
    alerts:
      - type: custom
        description: "The Plex label sync hasn't ticked in 30 min — newly-tagged torrents won't have their kid-access labels applied in Plex until it resumes. Check ofelia + `docker exec flood python3 /scripts/plex-label-sync.py` (then `/flood-db/plex-label-sync.log`). A FATAL there usually means Plex is unreachable at 172.18.0.1:32400 or the token is stale."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

  - name: Pinelake Plex Label Sync
    group: Torrents
    token: ${GATUS_OFELIA_PUSH_TOKEN}
    heartbeat:
      interval: 30m
    alerts:
      - type: custom
        description: "Pinelake's Flood-to-Plex label sync stopped checking in. Inspect pinelake-flood and pinelake-ofelia through Komodo and confirm the preserved Pinelake Plex token still reaches localhost:32400."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

  - name: StreamFab Publish
    group: Plex
    token: ${GATUS_OFELIA_PUSH_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: custom
        description: "The StreamFab publisher hasn't ticked in 5 minutes. Check the streamfab-publish container health and Ofelia logs; completed captures will remain under Pouch/Downloads until it resumes."
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true
