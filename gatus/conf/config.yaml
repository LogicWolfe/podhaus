# Gatus monitoring config — config-as-code, checked into the repo.
# Edit, commit, redeploy. No UI state to drift.
#
# Service liveness checks probe each service's INTERNAL endpoint
# (dockernet container name + port, or the dockernet bridge gateway
# 172.18.0.1:<port> for host-network services on bilby, or
# `InspectDockerContainer` via Komodo Core for kangaroo-resident
# containers). A previous design probed public *.pod.haus URLs to
# cover the full public path, but an identity gateway intercepts
# unauthenticated requests with a 302 to its login page. The existing
# `[STATUS] < 400` condition
# accepted that 302 as healthy, so backend death was invisible.
# See docs/postmortems/2026-05-30-power-outage-nfs-recovery.md.
# Full-path checks remain only where the path is genuinely external
# (storage.pod.haus, numbat-probe.storage.pod.haus,
# nathanbaxter.com, voice.pod.haus) that are intentionally public.

# Expose Prometheus metrics at :8080/metrics (same port as the UI +
# external-endpoint hooks — no new port, no new ingress). Alloy on bilby
# scrapes this and bridges it to ClickStack over OTLP. Non-sensitive
# operational data; the public path remains Pomerium-protected. See
# docs/monitoring.html.
metrics: true

storage:
  type: sqlite
  path: /data/gatus.db
  # Keep ~90 days of results per endpoint (at 2m intervals ≈ 65k checks).
  # The key is maximum-number-of-results — Gatus's only result-retention
  # knob. `capping` (used here previously) is not a real key; Gatus's
  # lenient YAML parser silently ignored it, leaving retention at the
  # default 100 results (~3h at 2m) despite the comment's intent.
  maximum-number-of-results: 65000
  # The endpoint-detail page renders an Events timeline (status
  # transitions) capped by this; default 50 truncates the incident
  # history on flappy endpoints. One tiny row per transition.
  maximum-number-of-events: 10000

ui:
  title: PodHaus Status
  header: PodHaus

alerting:
  # Default alerter for every service check: push the alert to Fenwick
  # (the Signal/email home-helper agent) over its token-gated internal
  # HTTP transport. Fenwick runs one agent turn per alert and decides how
  # to notify, under household guidance (starts as "just notify me"; can
  # iterate toward dedup/aggregate without code changes). `/events/async`
  # returns 202 immediately so this alerter call never blocks on the LLM
  # round-trip. The body is the `service_alert` contract Fenwick's
  # injectable schema validates; `X-Fenwick-User: Nathan` is the
  # auth-derived principal the turn triages as.
  #
  # Placeholder substitution is raw (Gatus does strings.ReplaceAll; only
  # [RESULT_ERRORS] gets its double-quotes escaped, not newlines), so
  # every substituted value must stay JSON-safe. It does: endpoint
  # names/groups, the TRIGGERED/RESOLVED token, and our own
  # [ALERT_DESCRIPTION] strings carry no raw double-quotes; conditions
  # are quote-free expressions. (Push endpoints render the literal
  # [RESULT_CONDITIONS] token — still a valid JSON string; the agent
  # ignores it.)
  custom:
    # The bot lives on bandicoot; Gatus reaches it across the LAN.
    url: "http://${BANDICOOT_LAN_IPV4}:8088/events/async"
    method: POST
    headers:
      Content-Type: application/json
      Authorization: "Bearer ${FENWICK_INTERNAL_HTTP_TOKEN}"
      X-Fenwick-User: Nathan
    body: |
      {
        "type": "service_alert",
        "payload": {
          "service": "[ENDPOINT_NAME]",
          "group": "[ENDPOINT_GROUP]",
          "status": "[ALERT_TRIGGERED_OR_RESOLVED]",
          "description": "[ALERT_DESCRIPTION]",
          "errors": "[RESULT_ERRORS]",
          "conditions": "[RESULT_CONDITIONS]"
        }
      }
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

  # The Postmark backstop — used ONLY by the Fenwick-health checks (the
  # `Fenwick` group below), which must NOT route through the thing they
  # watch. Native SMTP to Postmark (the server token is both username
  # and password); `from` is the verified Postmark sender signature.
  email:
    from: "uptime@nathanbaxter.com"
    to: "nathan@nathanbaxter.com"
    host: "smtp.postmarkapp.com"
    port: 587
    username: "${POSTMARK_SERVER_TOKEN}"
    password: "${POSTMARK_SERVER_TOKEN}"
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

# --- Reusable defaults ---

# Single alert wired into the default endpoint shape so every service
# check pushes to Fenwick on failure (the `custom` alerter → Fenwick).
# `alerting.custom.default-alert` above sets threshold + send-on-resolved;
# the per-alert block only needs `type: custom` to pick those up.
# Endpoints that need a custom description declare their own `alerts:`
# list (this anchor's value is replaced, not merged, when an endpoint
# declares its own). The Fenwick-health checks deliberately opt out of
# this anchor and use `type: email` (Postmark) instead — they must not
# route through Fenwick.
_alerts: &alerts
  - type: custom

_defaults: &defaults
  interval: 2m
  conditions:
    - "[STATUS] >= 200"
    - "[STATUS] < 400"
  alerts: *alerts

# --- Service liveness (internal probes) ---

endpoints:
  - name: HyperDX (ClickStack)
    url: http://${BANDICOOT_LAN_IPV4}:8080/
    <<: *defaults
    group: Observability

  # home-assistant runs in network_mode: host, so it's reachable from
  # dockernet via the bridge gateway (same address Cloudflare Tunnel uses).
  # `/manifest.json` is unauthenticated and returns 200 when HA is up.
  - name: Home Assistant
    url: http://172.18.0.1:8123/manifest.json
    <<: *defaults
    group: Home Assistant

  # Probe the QNAP web UI directly on the LAN — gatus is on dockernet,
  # which NATs out to the LAN gateway. Self-signed cert, hence insecure.
  # KANGAROO_LAN_IPV4 is the active 10GbE link; the 1GbE NIC is a live
  # spare with a reservation but no consumers.
  - name: Kangaroo (NAS)
    url: https://${KANGAROO_LAN_IPV4}/
    <<: *defaults
    group: Kangaroo
    client:
      insecure: true

  # Komodo Core's HTTP API, reached over the LAN since Core moved to
  # bandicoot. `/version` is auth-free and returns 200 when Core is up.
  # The Periphery/Alerts checks below exercise the API more deeply.
  - name: Komodo
    url: http://${BANDICOOT_LAN_IPV4}:9120/version
    <<: *defaults
    group: Komodo

  # Pocket ID OIDC provider — internal probe of the app's /healthz
  # (returns 200 when up). The public id.pod.haus is a bypass app so a
  # public probe would work, but the internal one is the convention and
  # avoids the edge. See docs/runbooks/pocket-id.md.
  - name: Pocket ID
    url: http://pocket-id:1411/healthz
    <<: *defaults
    group: Identity

  - name: Forgejo
    url: http://forgejo:3000/api/healthz
    <<: *defaults
    group: Git

  # Protected public path: Numbat Pomerium returns the login redirect.
  # Forgejo itself is covered by the internal health check above.
  - name: Forgejo HTTPS edge
    url: https://git.pod.haus/api/healthz
    <<: *defaults
    group: Git
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] == 302"

  # DNS-only public path: Numbat application IP :22 → wstunnel →
  # Forgejo's embedded SSH server on bilby.
  - name: Forgejo SSH (public relay)
    url: tcp://git.pod.haus:22
    group: Git
    interval: 2m
    alerts: *alerts
    conditions:
      - "[CONNECTED] == true"

  # Mumble is non-HTTP. tcp:// proves DNS (DDNS-updated A) +
  # UDM forward (terraform/unifi.tf) + Murmur control channel are
  # all healthy. UDP/voice quality is not synthetically probed; ear-
  # test on first call after any networking change. See
  # docs/runbooks/mumble.md.
  - name: Mumble (Voice)
    url: "tcp://voice.pod.haus:64738"
    group: Mumble
    interval: 2m
    alerts: *alerts
    conditions:
      - "[CONNECTED] == true"

  # Django's ALLOWED_HOSTS rejects requests whose Host header isn't the
  # configured public hostname with a 400, so the gatus probe spoofs it.
  # paperless redirects to /accounts/login/ (302) when the app is healthy.
  - name: Paperless
    url: http://paperless:8000/
    <<: *defaults
    group: Paperless
    headers:
      Host: paperless.pod.haus

  # plex runs in network_mode: host. `/identity` is unauthenticated and
  # returns 200 XML when Plex Media Server is up.
  - name: Plex
    url: http://172.18.0.1:32400/identity
    <<: *defaults
    group: Plex

  # MeTube lives on bandicoot; the front door stays on bilby's Caddy.
  - name: MeTube
    url: http://${BANDICOOT_LAN_IPV4}:8081/
    <<: *defaults
    group: Media

  # Sonarr lives on bandicoot; the front door stays on bilby's Caddy.
  - name: Sonarr
    url: http://${BANDICOOT_LAN_IPV4}:8989/ping
    <<: *defaults
    group: Media

  # Radarr (bandicoot, lookup-only for Fenwick's movie suggestions) has
  # no published port and no front door — nothing outside dockernet ever
  # calls it directly, so there's no LAN address for gatus to probe the
  # way it probes Sonarr above. Same Komodo InspectDockerContainer
  # pattern as the Backrest (bandicoot) check below: asserts the
  # container is running and its own healthcheck (curl against /ping)
  # reports healthy.
  - name: Radarr (bandicoot, via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Media
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"bandicoot","container":"radarr"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"
      - "[BODY].State.Health.Status == healthy"

  # Catches a stalled MeTube batch: if the last download in a batch errors,
  # metube/scripts/plexify's Exec postprocessor never runs, so the batch
  # sweep never runs either, and any file waiting its turn under
  # Kids/_incoming sits there indefinitely with nothing to notice. Sonarr's
  # own manual-import scan already recurses into every show folder under
  # the staging root and reports what's sitting there unimported; an empty
  # list is the same "nothing waiting" signal the sweep itself checks
  # (docs/plans/metube.md, "Batch matching: the second pass"). Verified
  # empty staging returns `[]`; a file dropped into a show folder appears
  # as one entry with its `path`/`relativePath`/`folderName`. failure-
  # threshold sized to ~2h at this interval so a long-running batch never
  # alerts mid-flight — only a batch that's actually stalled.
  - name: MeTube staging
    url: http://${BANDICOOT_LAN_IPV4}:8989/api/v3/manualimport?folder=%2Fkids%2F_incoming
    group: Media
    interval: 15m
    headers:
      X-Api-Key: ${SONARR_API_KEY}
    conditions:
      - "[STATUS] == 200"
      - "len([BODY]) == 0"
    alerts:
      - type: custom
        description: "Files have sat unimported under Kids/_incoming for 2+ hours. This means the last download in a MeTube batch errored (yt-dlp/MeTube shows it as failed), so the plexify hook's Exec postprocessor never ran and the batch sweep never triggered. Check `docker logs metube` for the failed download, then re-run the batch (or place the waiting files by hand via Sonarr, sonarr.pod.haus) so the sweep gets another chance to run."
        failure-threshold: 8
        success-threshold: 2
        send-on-resolved: true

  # Syncthing lives on kangaroo (network_mode: host). gatus can't reach
  # it directly, so we use the same Komodo InspectDockerContainer pattern
  # as Backrest (kangaroo) below — asserts the container is `running`.
  - name: Syncthing (kangaroo, via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Syncthing
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"kangaroo","container":"syncthing"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"

  - name: Flood (Torrent)
    url: http://flood:3000/
    <<: *defaults
    group: Torrents

  - name: UniFi
    url: https://unifi.pod.haus/
    <<: *defaults
    group: UniFi
    client:
      insecure: true

  # Yiayia's stories (yiayia.pod.haus): the container on dockernet, then the
  # full public path (relay -> wstunnel -> Caddy :4444 -> app). /health is the
  # one route outside the family gate; it answers ok only when the database
  # under the data bind is readable, which catches a container up with its
  # bind missing.
  - name: Yiayia's stories (container)
    url: http://yiayia-stories:8000/health
    <<: *defaults
    group: Yiayia

  - name: Yiayia's stories (yiayia.pod.haus)
    url: https://yiayia.pod.haus/health
    group: Yiayia
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
    alerts: *alerts

  # The book services live on bandicoot. bookshelf publishes 8789 on its LAN
  # address, the same path bilby's Caddy takes for books.pod.haus; /health is
  # 200 while it serves. bookbinder and bookcard publish nothing, so their
  # checks ask Komodo for the container's own healthcheck, a curl of /health,
  # the way Radarr's does. bookcard's /health never signs in, so it stays
  # green while Amazon sessions come and go.
  - name: bookbinder (bandicoot, via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Books
    interval: 2m
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"bandicoot","container":"bookbinder"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"
      - "[BODY].State.Health.Status == healthy"

  - name: bookcard (bandicoot, via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Books
    interval: 2m
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"bandicoot","container":"bookcard"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"
      - "[BODY].State.Health.Status == healthy"

  - name: bookshelf
    url: http://${BANDICOOT_LAN_IPV4}:8789/health
    <<: *defaults
    group: Books

  # Signed out, the workbench must not exist: a 200 here means the editor
  # gate has failed open.
  - name: Yiayia's stories (workbench hidden)
    url: https://yiayia.pod.haus/workbench
    group: Yiayia
    interval: 5m
    conditions:
      - "[STATUS] == 404"
    alerts: *alerts

  # --- storage.pod.haus paths ---
  # On-bilby probe (LAN/split-horizon resolves to bilby:443 directly):
  # tests Bilby Caddy + Bandicoot RustFS. Independent of the relay. Catches a
  # Caddy/RustFS/cert failure on-box.
  - name: RustFS S3 (storage.pod.haus, on-bilby)
    url: https://storage.pod.haus/health/ready
    <<: *defaults
    group: Storage

  - name: RustFS S3 (via Numbat relay, external path)
    url: https://numbat-probe.storage.pod.haus/health/ready
    <<: *defaults
    group: Storage

  # nathanbaxter.com: Cloudflare CDN → Numbat relay → wstunnel → Caddy →
  # nathanbaxter-com bucket.
  - name: nathanbaxter.com
    url: https://nathanbaxter.com/
    <<: *defaults
    group: nathanbaxter.com

  # doggos.indigopod.au: Numbat relay → wstunnel → Caddy → doggos-indigo
  # bucket (no CDN). Indigo's Blocs site.
  - name: doggos.indigopod.au
    url: https://doggos.indigopod.au/
    <<: *defaults
    group: doggos.indigopod.au

  # Umami analytics — internal probe of the shared container's heartbeat
  # (the public stats.* hosts expose only /script.js and /api/send, so an
  # external probe of /api/heartbeat is not useful). Returns
  # 200 when the app + its Postgres are up.
  - name: Umami
    url: http://umami:3000/api/heartbeat
    <<: *defaults
    group: Analytics

  # pets.indigopod.au: Cloudflare CDN → Numbat relay → wstunnel → the pets
  # engine container. /api/content exercises the whole stack (edge →
  # container → SQLite → published content), so it catches a tunnel,
  # container, or content-store break — not just a static 200.
  - name: pets.indigopod.au
    url: https://pets.indigopod.au/api/content
    <<: *defaults
    group: Pets

  # Indigo's room controller and display panel each send a status record
  # through indy-service every supervisor tick (20-30 s), which the service
  # exports to ClickStack. Either board missing from 15 minutes of records
  # means it is off, off the WiFi or stuck in a boot loop, or the service is
  # down. Same direct-ClickHouse pattern as the ingest checks.
  - name: Indy Board devices reporting
    url: http://${BANDICOOT_LAN_IPV4}:8123/
    method: POST
    group: Indy Board
    interval: 5m
    headers:
      X-ClickHouse-User: default
      X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}
    body: "SELECT toUInt8(uniqExact(LogAttributes['device']) = 2) FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 15 MINUTE AND ServiceName = 'indy-service' AND Body = 'device alive'"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == 1"
    alerts:
      - type: custom
        description: "The controller or the display panel in Indigo's room hasn't reported in 15+ min. Check `docker logs indy-service` on bilby and the service's error records in ClickStack (service indy-service, filter by device); a board that stays away needs a visit."
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  # Surfaces "Komodo Core can't reach <Periphery>" as a Gatus alert.
  # Periphery's :8120 isn't on dockernet so we check via Komodo Core's API:
  # POST GetServerState, assert status == Ok. Headers carry Komodo's API
  # credentials (same as komodo-op uses). Note: if BILBY periphery dies,
  # gatus on bilby may also be impaired — but Komodo Core can still answer
  # for as long as it's running, since Core polls Periphery independently.
  - name: Bilby Periphery (via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Komodo
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"podhaus"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

  - name: Kangaroo Periphery (via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Komodo
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"kangaroo"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

  - name: Numbat Periphery (via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Komodo
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"numbat"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

  - name: Fractal Periphery (via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Komodo
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"fractal"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

  - name: Bandicoot Periphery (via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Komodo
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"bandicoot"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

  - name: Quokka Periphery (via Komodo)
    enabled: false  # quokka is lent to Sky
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Komodo
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"quokka"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

  - name: Voltaire Periphery (via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Komodo
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"voltaire"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

  - name: Pinelake Periphery (via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Komodo
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"GetServerState","params":{"server":"pinelake"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == Ok"

  - name: Pinelake Plex (via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Plex
    interval: 60s
    alerts: *alerts
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"pinelake","container":"pinelake-plex"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"
      - "[BODY].State.Health.Status == healthy"

  # Source-aware health is intentionally allowed to go red while the
  # process keeps serving repositories from available sources. docs-server
  # has no autoheal label: restarting cannot restore a missing checkout.
  - name: Docs (bilby)
    url: http://docs:8000/health
    group: Docs
    interval: 60s
    alerts:
      - type: custom
        description: "Bilby docs is unavailable or degraded. A 503 means at least one configured repository source is unavailable or conflicted; inspect `/health` and `systemctl status podhaus-docs-source-reconcile.service`. A connection failure means the container is down. Restore the source adapter or correct the deployment; restarting Caddy does not repair either condition."
    conditions:
      - "[STATUS] == 200"

  - name: Docs (fractal, via Komodo)
    url: http://${BANDICOOT_LAN_IPV4}:9120/read
    method: POST
    group: Docs
    interval: 60s
    alerts:
      - type: custom
        description: "Fractal docs is down or source-degraded. If the container is running/unhealthy, inspect its `/health` response and `podhaus-docs-source-reconcile.service`; if it is `created`, inspect `State.Error` for an OCI mount failure. Restore the source adapter or redeploy the corrected stack, not Caddy."
    headers:
      X-Api-Key: ${KOMODO_API_KEY}
      X-Api-Secret: ${KOMODO_API_SECRET}
      Content-Type: application/json
    body: '{"type":"InspectDockerContainer","params":{"server":"fractal","container":"docs"}}'
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Status == running"
      - "[BODY].State.Health.Status == healthy"

  - name: Docs (quokka, via Komodo)
