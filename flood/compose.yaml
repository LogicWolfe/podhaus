services:
  # One-shot init container that lays down the repo's rtorrent.rc into
  # the flood-db volume at the dotfile path rtorrent expects. Replaces
  # the previous single-file bind (which is forbidden — see
  # docs/stack-conventions.html#bind-mounts). rtorrent reads the file
  # once at startup, so this runs every time flood starts and the
  # in-volume copy is always the same as the repo copy on next deploy.
  flood-init:
    container_name: flood-init
    image: alpine:latest
    restart: "no"
    volumes:
      - /var/lib/flood-db:/flood-db:z
      - ${PODHAUS_REPO}/flood/conf:/conf:ro,z
    command:
      - /bin/sh
      - -c
      - |
        set -e
        install -o 1000 -g 1001 -m 0644 /conf/rtorrent.rc /flood-db/.rtorrent.rc
        echo "rtorrent.rc installed at /flood-db/.rtorrent.rc"

    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
  flood:
    container_name: flood
    # Local build adds libarchive-tools to the upstream image so the
    # event.download.finished hook (scripts/rtorrent-extract.sh) can
    # extract RARs in place. Pinning `pull_policy: build` keeps Komodo's
    # deploy from trying to pull from Docker Hub.
    #
    # STACK_CONTENT_HASH is the build-arg side of the podhaus content-
    # hash mechanism (see AGENTS.md "Content-hash change detection").
    # The Stage 1 Action of podhaus-push-deploy injects per-service
    # BUILD_HASH_<service> into the stack's env; feeding it into build
    # args means any Dockerfile / build-context change invalidates
    # docker's layer cache so the image actually rebuilds. The ARG
    # inside the Dockerfile is named STACK_CONTENT_HASH for uniformity
    # across stacks — the per-service variable is just how it reaches
    # the build.
    build:
      context: .
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_FLOOD:-unset}
    image: flood:local
    pull_policy: build
    restart: unless-stopped
    depends_on:
      flood-init:
        condition: service_completed_successfully
    command: --auth=none --rtsocket=/tmp/rtorrent.sock
    user: "1000:1001"
    environment:
      HOME: /flood-db
      FLOOD_SECRET: ${FLOOD_SECRET}
      GID: "44"
      TZ: ${TZ}
      # Used by /scripts/rar-backlog.sh to push daily health pings to
      # Gatus's heartbeat_rar-extraction external endpoint. Shared-secret
      # bearer token; Gatus rejects pushes with any other value.
      GATUS_UNPACKERR_PUSH_TOKEN: ${GATUS_UNPACKERR_PUSH_TOKEN}
    volumes:
      # rtorrent session (~16 MB: .torrent + .libtorrent_resume + .rtorrent
      # files). Local NVMe per the post-phase-6 sizing rule. The .rtorrent.rc
      # file lands here too via flood-init above.
      - /var/lib/flood-db:/flood-db:z
      - ${MEDIA_DIR}:/data
      # Hook + ofelia scripts as a directory bind so host edits propagate
      # without restart. File-level binds pin the inode at mount time, so
      # any tool that saves via atomic rename (vim, $EDITOR, Claude Code)
      # leaves the container looking at the original inode forever.
      # Contents:
      #   - rtorrent-extract.sh   (event.download.finished hook; real-time
      #                            in-place RAR extraction)
      #   - rtorrent-cleanup.sh   (event.download.erased hook; deletes
      #                            rar pieces after seed-out)
      #   - rar-backlog.sh        (daily ofelia health-check + safety-net)
      #   - pinelake-stignore.sh  (event hook + 5min ofelia tick)
      - ${PODHAUS_REPO}/flood/scripts:/scripts:ro,z
    labels:
      autoheal: "true"
      # Daily RAR-extraction backlog scan. Runs 04:50 AWST (dead-time
      # window, after backrest + plex cleanup). Pushes success/failure
      # to Gatus heartbeat — dead-man's switch on the full extraction
      # pipeline's health. See flood/rar-backlog.sh for logic.
      ofelia.enabled: "true"
      ofelia.job-exec.rar-backlog.schedule: "0 50 4 * * *"
      ofelia.job-exec.rar-backlog.command: "/scripts/rar-backlog.sh"
      # pinelake-tag → Pouch .stignore reconciler. 5min tick catches the
      # tag-applied-after-completion case the rtorrent event.download.finished
      # hook in rtorrent.rc can't cover. Script is idempotent (insert-only,
      # grep -Fxq dedupe), so collisions with the event hook are harmless.
      ofelia.job-exec.pinelake-stignore.schedule: "0 */5 * * * *"
      ofelia.job-exec.pinelake-stignore.command: "/scripts/pinelake-stignore.sh"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
    healthcheck:
      # Stall-proof + stub-proof: prove the service via loopback wget,
      # verify the local flood-db bind via /proc/mounts (cheap local read,
      # never blocks), and prove /data is the real Pouch NFS via the
      # .podhaus-share-mounted sentinel dropped on every NFS bind-source
      # path. A bare-stub /mnt/pouch (NFS unmounted, host btrfs directory
      # showing through the bind) lacks the sentinel and goes red —
      # caught the 2026-05-23 post-reboot regression where /proc/mounts
      # presence alone false-greened. The `timeout 10` envelope still
      # guards against any soft-NFS stall. See
      # docs/postmortems/2026-05-23-pouch-jump-mount-failure.md.
      test: ["CMD-SHELL", "timeout 10 sh -c 'wget -q -O- http://localhost:3000/ >/dev/null && grep -q \" /flood-db \" /proc/mounts && [ -e /data/.podhaus-share-mounted ]'"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    networks:
      - dockernet

networks:
  dockernet:
    external: true
