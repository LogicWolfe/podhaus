services:
  # Install the startup config into local state; a directory bind survives atomic edits.
  flood-init:
    container_name: flood-init
    image: alpine:latest
    restart: "no"
    volumes:
      - /var/lib/flood-db:/flood-db:z
      - ${PODHAUS_REPO}/flood/conf:/conf:ro,z
      - rtorrent-socket:/tmp
    command:
      - /bin/sh
      - -c
      - |
        set -e
        install -o 1000 -g 1001 -m 0644 /conf/rtorrent.rc /flood-db/.rtorrent.rc
        echo "rtorrent.rc installed at /flood-db/.rtorrent.rc"
        # Explicit paths prevent Compose from expanding shell variables to empty strings.
        # Pre-own logs and locks so scheduled jobs and completion hooks share one owner.
        touch /flood-db/flood-publish.log /flood-db/flood-publish.lock \
              /flood-db/plex-label-sync.log /flood-db/plex-label-sync.lock
        chown 1000:1001 /flood-db/flood-publish.log /flood-db/flood-publish.lock \
              /flood-db/plex-label-sync.log /flood-db/plex-label-sync.lock
        chmod 0664 /flood-db/flood-publish.log /flood-db/flood-publish.lock \
              /flood-db/plex-label-sync.log /flood-db/plex-label-sync.lock

        chown 1000:1001 /tmp
        chmod 0770 /tmp
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
  flood:
    container_name: flood
    build:
      context: .
      dockerfile: Dockerfile.flood
      secrets: [flood_source_token]
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_FLOOD:-unset}
    image: flood:local
    pull_policy: build
    restart: unless-stopped
    depends_on:
      rtorrent:
        condition: service_healthy
    command: --auth=none --rtsocket=/tmp/rtorrent.sock
    user: "1000:1001"
    environment:
      HOME: /flood-db
      FLOOD_SECRET: ${FLOOD_SECRET}
      TZ: ${TZ}
      LOG_FORMAT: json
    # Failed upload bytes are private and disappear on every container restart.
    tmpfs:
      - /tmp/failed-uploads:rw,noexec,nosuid,nodev,size=128m,mode=0700,uid=1000,gid=1001
    volumes:
      - /var/lib/flood-db:/flood-db:z
      - ${MEDIA_DIR}:/data
      - rtorrent-socket:/tmp
    labels:
      autoheal: "true"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
      podhaus.depends-on-rtorrent: ${BUILD_HASH_RTORRENT:-unset}
    healthcheck:
      # The sentinel rejects bare NFS mountpoints; timeout bounds stalled filesystem calls.
      # Fifteen retries ride out NAS reboots without restart storms (2026-06-16).
      test:
        - CMD-SHELL
        - timeout 10 sh -c 'wget -q -O- http://localhost:3000/ >/dev/null && grep -q " /flood-db " /proc/mounts
          && [ -e /data/.podhaus-share-mounted ]'
      interval: 60s
      timeout: 15s
      retries: 15
      start_period: 60s
    networks:
      - dockernet
  rtorrent:
    container_name: rtorrent
    build:
      context: .
      dockerfile: Dockerfile.rtorrent
      args:
        STACK_CONTENT_HASH: ${BUILD_HASH_RTORRENT:-unset}
    image: rtorrent:local
    pull_policy: build
    restart: unless-stopped
    depends_on:
      flood-init:
        condition: service_completed_successfully
    user: "1000:1001"
    environment:
      HOME: /flood-db
      TZ: ${TZ}
      PLEX_URL: http://172.18.0.1:32400
      PLEX_TOKEN: ${PLEX_ONLINE_TOKEN}
      GATUS_OFELIA_PUSH_TOKEN: ${GATUS_OFELIA_PUSH_TOKEN}
      GATUS_BASE_URL: http://gatus:8080
      GATUS_LABEL_SYNC_ENDPOINT_ID: torrents_plex-label-sync
      GATUS_RAR_ENDPOINT_ID: torrents_rar-extraction
      GATUS_STIGNORE_ENDPOINT_ID: torrents_pinelake-stignore
      # Only Bilby mutates source-side Syncthing exclusions; Pinelake disables this.
      PINELAKE_STIGNORE_SOURCE: 'true'
    volumes:
      - /var/lib/flood-db:/flood-db:z
      - ${MEDIA_DIR}:/data
      - ${PODHAUS_REPO}/flood/scripts:/scripts:ro,z
      - rtorrent-socket:/tmp
    labels:
      autoheal: "true"
      autoheal.stop.timeout: "120"
      # Daily extraction audit, minute publishing, and five-minute tag reconciliation
      # cover torrents missed by completion hooks and tags applied after completion.
      ofelia.enabled: "true"
      ofelia.job-exec.rar-backlog.schedule: 0 50 4 * * *
      ofelia.job-exec.rar-backlog.command: /scripts/rar-backlog.sh
      ofelia.job-exec.pinelake-stignore.schedule: 0 */5 * * * *
      ofelia.job-exec.pinelake-stignore.command: python3 /scripts/pinelake-stignore.py
      ofelia.job-exec.flood-publish.schedule: 0 * * * * *
      ofelia.job-exec.flood-publish.command: python3 /scripts/flood-publish.py
      ofelia.job-exec.flood-publish.user: 1000:1001
      ofelia.job-exec.plex-label-sync.schedule: 0 */5 * * * *
      ofelia.job-exec.plex-label-sync.command: python3 /scripts/plex-label-sync.py
      ofelia.job-exec.plex-label-sync.user: 1000:1001
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
    healthcheck:
      # The sentinel rejects bare NFS mountpoints; timeout bounds stalled filesystem calls.
      # Fifteen retries ride out NAS reboots without restart storms (2026-06-16).
      test:
        - CMD-SHELL
        - timeout 10 python3 /scripts/rtorrent-health.py /data/.podhaus-share-mounted
      interval: 60s
      timeout: 15s
      retries: 15
      start_period: 60s
    networks:
      - dockernet
    stop_grace_period: 2m
networks:
  dockernet:
    external: true
volumes:
  rtorrent-socket: {}

secrets:
  flood_source_token:
    environment: FLOOD_SOURCE_TOKEN
