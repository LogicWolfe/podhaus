services:
  # One-shot init container that lays down the repo's rtorrent.rc into
  # the flood-db volume at the dotfile path rtorrent expects. Replaces
  # the previous single-file bind (which is forbidden — see
  # docs/stack-conventions.html#bind-mounts). rtorrent reads the file
  # once at startup, so this runs every time flood starts and the
  # in-volume copy is always the same as the repo copy on next deploy.
  flood-init:
    container_name: flood-init
    image: alpine:latest
    restart: "no"
    volumes:
      - /var/lib/flood-db:/flood-db:z
      - ${PODHAUS_REPO}/flood/conf:/conf:ro,z
    command:
      - /bin/sh
      - -c
      - |
        set -e
        install -o 1000 -g 1001 -m 0644 /conf/rtorrent.rc /flood-db/.rtorrent.rc
        echo "rtorrent.rc installed at /flood-db/.rtorrent.rc"

  flood:
    container_name: flood
    image: jesec/rtorrent-flood
    restart: unless-stopped
    depends_on:
      flood-init:
        condition: service_completed_successfully
    command: --auth=none --rtsocket=/tmp/rtorrent.sock
    user: "1000:1001"
    environment:
      HOME: /flood-db
      FLOOD_SECRET: ${FLOOD_SECRET}
      GID: "44"
      TZ: ${TZ}
      # Used by /scripts/rar-backlog.sh to push daily health pings to
      # Gatus's heartbeat_rar-extraction external endpoint. Shared-secret
      # bearer token; Gatus rejects pushes with any other value.
      GATUS_UNPACKERR_PUSH_TOKEN: ${GATUS_UNPACKERR_PUSH_TOKEN}
    volumes:
      # rtorrent session (~16 MB: .torrent + .libtorrent_resume + .rtorrent
      # files). Local NVMe per the post-phase-6 sizing rule. The .rtorrent.rc
      # file lands here too via flood-init above.
      - /var/lib/flood-db:/flood-db:z
      - ${MEDIA_DIR}:/data
      # Hook + ofelia scripts as a directory bind so host edits propagate
      # without restart. File-level binds pin the inode at mount time, so
      # any tool that saves via atomic rename (vim, $EDITOR, Claude Code)
      # leaves the container looking at the original inode forever.
      # Contents: rtorrent-cleanup.sh (event.download.erased hook),
      # rar-backlog.sh (daily health-check pushed via ofelia label).
      - ${PODHAUS_REPO}/flood/scripts:/scripts:ro,z
    labels:
      autoheal: "true"
      # Daily RAR-extraction backlog scan. Runs 04:50 AWST (dead-time
      # window, after backrest + plex cleanup). Pushes success/failure
      # to Gatus heartbeat — dead-man's switch on the full extraction
      # pipeline's health. See flood/rar-backlog.sh for logic.
      ofelia.enabled: "true"
      ofelia.job-exec.rar-backlog.schedule: "50 4 * * *"
      ofelia.job-exec.rar-backlog.command: "/scripts/rar-backlog.sh"
    healthcheck:
      # Stall-proof: prove the service via loopback wget, and verify the
      # mounts via the kernel mount table (/proc/mounts is a local read —
      # never blocks) instead of `ls`-ing them. The old `ls /data` hit
      # the *soft* NFS Pouch mount, so a transient QNAP/NFS stall (e.g.
      # nightly backup load) made the check time out → Docker unhealthy
      # → Komodo latched a false red even after NFS recovered. Now red
      # only means: flood not serving, or a mount genuinely vanished.
      test: ["CMD-SHELL", "timeout 10 sh -c 'wget -q -O- http://localhost:3000/ >/dev/null && grep -q \" /flood-db \" /proc/mounts && grep -q \" /data \" /proc/mounts'"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    networks:
      - dockernet

networks:
  dockernet:
    external: true
