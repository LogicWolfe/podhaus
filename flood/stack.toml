[[stack]]
name = "flood"
description = "Separate rTorrent engine and Flood web UI with media publishing"
tags = ["podhaus"]

[stack.config]
server = "podhaus"
files_on_host = true
run_directory = "/etc/komodo/repo/flood"

# Successful one-shot init containers must not make the whole stack unhealthy.
ignore_services = ["flood-init"]

# Both images are built locally, including the private Flood logging patch.
run_build = true

environment = """
FLOOD_SOURCE_TOKEN=[[OP__KOMODO__FLOOD_SOURCE__PASSWORD]]
FLOOD_SECRET=[[OP__KOMODO__FLOOD_SECRET__PASSWORD]]
GATUS_OFELIA_PUSH_TOKEN=[[OP__KOMODO__GATUS_OFELIA_PUSH_TOKEN__TOKEN]]
MEDIA_DIR=[[MEDIA_DIR]]
PLEX_ONLINE_TOKEN=[[OP__KOMODO__PLEX_ONLINE_TOKEN__CREDENTIAL]]
PODHAUS_REPO=[[PODHAUS_REPO]]
TZ=[[TZ]]
"""
