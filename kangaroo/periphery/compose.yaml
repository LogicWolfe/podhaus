# Komodo Periphery for kangaroo (QNAP NAS, AMD x86_64, QTS 5.2 + Container Station).
#
# This is the only stack on kangaroo that is NOT itself managed by Komodo —
# it has to come up before kangaroo can be a Komodo deploy target. Bootstrapped
# via ./kangaroo_bootstrap from bilby; survives Container Station + QTS upgrades
# via the @reboot crontab line that bootstrap installs.
#
# All other kangaroo stacks (syncthing, kangaroo/backrest, etc.) live under
# the standard <stackname>/compose.yaml pattern and are deployed by Komodo
# Core via the Linked Repo on this Periphery.
#
# v2 outbound mode: Periphery dials Core at ws://10.0.0.119:9120 (bilby's
# LAN IP). No inbound :8120 listener exposed — kangaroo is no longer a TCP
# server in the management plane. Auth is X25519 noise handshake; the
# periphery.key + core.pub are SCPed in by the bootstrap script.

services:
  periphery:
    container_name: komodo-periphery
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    restart: unless-stopped
    init: true
    environment:
      # v2 PKI: noise-handshake mutual auth. periphery.key generated by the
      # bootstrap process, core.pub copied from bilby's keys volume. Pubkey
      # derived from periphery.key is the kangaroo-periphery.pub committed
      # in komodo/keys/ that Core's KOMODO_PERIPHERY_PUBLIC_KEYS trusts.
      PERIPHERY_PRIVATE_KEY: file:/config/keys/periphery.key
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      # v2 outbound: Periphery dials Core (LAN). The noise handshake is
      # the auth gate (replaces v1's allowed_ips + passkey-list combo).
      PERIPHERY_CORE_ADDRESSES: ws://10.0.0.119:9120
      PERIPHERY_CONNECT_AS: kangaroo
      # Since Periphery v2.2.0, setting core_addresses defaults
      # server_enabled to false — no :8120 listener at all, which fails
      # the healthcheck below (curl gets connection-refused forever).
      # Re-enable the internal listener (no host port publish) purely as
      # the liveness probe target.
      PERIPHERY_SERVER_ENABLED: "true"
      # Periphery has no default config-file discovery — must point at the
      # rendered file explicitly. kangaroo_bootstrap drops the rendered
      # periphery.config.toml at /etc/komodo/ (host: etc-komodo/).
      PERIPHERY_CONFIG_PATHS: /etc/komodo/periphery.config.toml
      TZ: ${TZ}
    volumes:
      # Docker daemon socket — Periphery's whole job is talking to docker.
      - /var/run/docker.sock:/var/run/docker.sock
      # /proc for system stats reporting back to Core.
      - /proc:/proc
      # Periphery state: cloned Linked Repo working dirs, deployed stack
      # files, action cache. Persisted on the QNAP storage pool so it
      # survives Container Station upgrades.
      - /share/CACHEDEV2_DATA/Container/komodo-periphery/etc-komodo:/etc/komodo
      # v2 PKI keys. Bind is separate from /etc/komodo so a periphery
      # state reset (rare) doesn't take the keys with it.
      - /share/CACHEDEV2_DATA/Container/komodo-periphery/keys:/config/keys
    # NB: no SELinux label:disable here — QTS doesn't run SELinux. Bilby's
    # Periphery needs label:disable for Fedora Asahi; QNAP doesn't.
    # NB: no repo bind-mount. Bilby's Periphery has the repo at /etc/komodo/repo
    # because bilby uses files_on_host. Kangaroo uses Linked Repo, so Komodo
    # Core orchestrates the clone into /etc/komodo/repos/podhaus/ at sync time.
    labels:
      # kangaroo-autoheal restarts this container if the healthcheck below
      # fails repeatedly. (bilby's autoheal can't reach kangaroo's docker
      # daemon, so each Periphery host has its own autoheal stack.)
      autoheal: "true"
    # In outbound mode Periphery still serves a /health endpoint on :8120
    # internally (no host port publish). curl -sk returns 200/4xx on a live
    # process; --max-time bounds the wait.
    healthcheck:
      test: ["CMD-SHELL", "curl -sk --max-time 5 -o /dev/null https://localhost:8120/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
