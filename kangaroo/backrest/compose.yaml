services:
  # Init container — renders config.json from the template + RESTIC_REPO_PASSWORD
  # env var, writes into the shared backrest-config named volume, then exits.
  # Backrest depends on this completing successfully before starting. Runs once
  # per `docker compose up`; doesn't re-run on per-container restarts. See the
  # migration doc's "Stack customization primitives" section for the pattern.
  backrest-init:
    container_name: backrest-init
    image: init-tools:local
    # Build context is periphery-internal (the docker client running inside
    # periphery packages the tarball). For kangaroo's Linked Repo, periphery
    # runs compose from /etc/komodo/repos/podhaus/kangaroo/backrest, so
    # ../../init-tools resolves to /etc/komodo/repos/podhaus/init-tools.
    build:
      context: ../../init-tools
      dockerfile: Dockerfile
    pull_policy: never
    user: "0:0"
    environment:
      RESTIC_REPO_PASSWORD: ${RESTIC_REPO_PASSWORD}
    volumes:
      - /share/CACHEDEV1_DATA/Container/komodo-periphery/etc-komodo/repos/podhaus/kangaroo/backrest/config.json.tmpl:/tmpl/config.json.tmpl:ro
      - backrest-config:/config
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        envsubst < /tmpl/config.json.tmpl > /config/config.json
        chmod 600 /config/config.json
        echo "rendered /config/config.json"
    restart: "no"

  backrest:
    container_name: backrest
    image: garethgeorge/backrest:latest
    restart: unless-stopped
    depends_on:
      backrest-init:
        condition: service_completed_successfully
    ports:
      - 9898:9898
    environment:
      BACKREST_PORT: "0.0.0.0:9898"
      BACKREST_CONFIG: /config/config.json
      BACKREST_DATA: /data
      BACKREST_RESTIC_COMMAND: /bin/restic
      XDG_CACHE_HOME: /cache
      TZ: ${TZ}
      # Backrest's own shell hooks + ad-hoc restic CLI calls read these.
      RESTIC_REPOSITORY: /repos/podhaus-kangaroo
      RESTIC_PASSWORD: ${RESTIC_REPO_PASSWORD}
    volumes:
      # Backrest's writable runtime state (oplog, jwt-secret, kvdb, tasklogs).
      - backrest-data:/data
      - backrest-cache:/cache
      # /config is the named volume populated by backrest-init above.
      # Backrest rewrites config.json in place on UI edits / normalization;
      # the init container re-renders from the template on next compose up,
      # so any drift is erased — repo is the source of truth.
      - backrest-config:/config
      # Restic repository on Jump (NAS SSD). Separate from bilby's repo
      # at /mnt/jump/backups (= /share/CACHEDEV2_DATA/Jump/backups) — the
      # `-kangaroo` suffix avoids two-client coordination on a single repo.
      # Same restic password as bilby's repo; consolidating later is a
      # one-liner once we want to deduplicate the OneDrive mirror.
      - /share/CACHEDEV2_DATA/Jump/backups-kangaroo:/repos/podhaus-kangaroo
      # Source data — read-only bind mounts of every kangaroo-resident
      # stack's state dir. Backrest runs as root inside the container, so
      # squash/uid concerns from the all_squash NFS pattern don't apply
      # (this is local QNAP storage, not NFS).
      - /share/CACHEDEV1_DATA/Container/syncthing-config:/userdata/syncthing:ro
      - /share/CACHEDEV1_DATA/Container/komodo-periphery/etc-komodo:/userdata/komodo-periphery:ro
      - backrest-data:/userdata/backrest-state:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9898/ > /dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  backrest-data:
  backrest-cache:
  backrest-config:
