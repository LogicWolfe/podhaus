[[stack]]
name = "forgejo"
description = "Forgejo — private Git hosting; local SQLite state, repositories on Jump, public SSH through Numbat"
tags = ["podhaus"]

[stack.config]
server = "podhaus"
files_on_host = true
run_directory = "/etc/komodo/repo/forgejo"
ignore_services = ["forgejo-preflight", "forgejo-auth-init"]
# Backrest deliberately stops Forgejo for about a minute at 03:45 to snapshot
# SQLite and Jump at one consistency point. Gatus remains the service-health
# authority and alerts only when the outage exceeds its six-minute threshold.
send_alerts = false

environment = """
TZ=[[TZ]]
FORGEJO_SECRET_KEY=[[OP__KOMODO__FORGEJO_SECRETS__SECRET_KEY]]
FORGEJO_INTERNAL_TOKEN=[[OP__KOMODO__FORGEJO_SECRETS__INTERNAL_TOKEN]]
FORGEJO_LFS_JWT_SECRET=[[OP__KOMODO__FORGEJO_SECRETS__LFS_JWT_SECRET]]
# Literal, not [[OP__KOMODO__FORGEJO_OIDC__USERNAME]]: an OAuth client id
# is not a secret, and that variable's value is the string "forgejo" —
# interpolating it as a secret made Komodo redact every "forgejo" in the
# stack's stored deploy state, mangling the recorded service names so the
# runtime containers never matched and the stack reported down forever.
FORGEJO_OIDC_CLIENT_ID=forgejo
FORGEJO_OIDC_CLIENT_SECRET=[[OP__KOMODO__FORGEJO_OIDC__PASSWORD]]
"""
