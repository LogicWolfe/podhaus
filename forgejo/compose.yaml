# Forgejo runs on bilby. Latency-sensitive state stays on local NVMe;
# repositories and large object stores live on Jump. Public HTTPS and
# SSH both arrive at git.pod.haus through kookaburra's rathole relay:
# TLS goes to Caddy then forgejo:3000; SSH goes directly to
# forgejo:2222. Pocket ID is the only interactive identity source.

x-forgejo-environment: &forgejo-environment
  USER: git
  FORGEJO_WORK_DIR: /var/lib/gitea
  GITEA_CUSTOM: /etc/gitea
  GITEA_APP_INI: /etc/gitea/app.ini
  FORGEJO____APP_NAME: PodHaus Git
  FORGEJO__server__PROTOCOL: http
  FORGEJO__server__HTTP_ADDR: 0.0.0.0
  FORGEJO__server__HTTP_PORT: "3000"
  FORGEJO__server__DOMAIN: git.pod.haus
  FORGEJO__server__ROOT_URL: https://git.pod.haus/
  FORGEJO__server__LOCAL_ROOT_URL: http://forgejo:3000/
  FORGEJO__server__START_SSH_SERVER: "true"
  FORGEJO__server__SSH_LISTEN_HOST: 0.0.0.0
  FORGEJO__server__SSH_LISTEN_PORT: "2222"
  FORGEJO__server__SSH_DOMAIN: git.pod.haus
  FORGEJO__server__SSH_PORT: "22"
  FORGEJO__server__SSH_USER: git
  FORGEJO__server__LFS_START_SERVER: "true"
  FORGEJO__server__LFS_JWT_SECRET: ${FORGEJO_LFS_JWT_SECRET}
  FORGEJO__database__DB_TYPE: sqlite3
  FORGEJO__database__PATH: /var/lib/gitea/database/forgejo.db
  FORGEJO__database__SQLITE_JOURNAL_MODE: WAL
  FORGEJO__security__INSTALL_LOCK: "true"
  FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY}
  FORGEJO__security__INTERNAL_TOKEN: ${FORGEJO_INTERNAL_TOKEN}
  FORGEJO__security__REVERSE_PROXY_LIMIT: "1"
  FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: 172.18.0.0/16
  FORGEJO__security__DISABLE_QUERY_AUTH_TOKEN: "true"
  FORGEJO__service__DISABLE_REGISTRATION: "true"
  FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
  FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
  FORGEJO__service__ENABLE_INTERNAL_SIGNIN: "false"
  FORGEJO__service__ENABLE_BASIC_AUTHENTICATION: "false"
  FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
  FORGEJO__oauth2_client__USERNAME: preferred_username
  FORGEJO__oauth2_client__ACCOUNT_LINKING: disabled
  FORGEJO__oauth2_client__OPENID_CONNECT_SCOPES: openid email profile groups
  FORGEJO__admin__EXTERNAL_USER_DISABLE_FEATURES: deletion,manage_password
  FORGEJO__repository__ROOT: /data/jump/repositories
  FORGEJO__repository__FORCE_PRIVATE: "true"
  FORGEJO__repository__DEFAULT_PRIVATE: private
  FORGEJO__repository__DISABLE_HTTP_GIT: "true"
  FORGEJO__repository__USE_COMPAT_SSH_URI: "false"
  FORGEJO__repository__DISABLED_REPO_UNITS: repo.actions
  FORGEJO__attachment__STORAGE_TYPE: local
  FORGEJO__attachment__PATH: /data/jump/attachments
  FORGEJO__lfs__STORAGE_TYPE: local
  FORGEJO__lfs__PATH: /data/jump/lfs
  FORGEJO__storage.repo-archive__STORAGE_TYPE: local
  FORGEJO__storage.repo-archive__PATH: /data/jump/repo-archives
  FORGEJO__packages__ENABLED: "false"
  FORGEJO__actions__ENABLED: "false"
  FORGEJO__log__MODE: console
  FORGEJO__log__LEVEL: Info
  FORGEJO__log__ROOT_PATH: /var/lib/gitea/log
  TZ: ${TZ}

x-forgejo-volumes: &forgejo-volumes
  - /var/lib/forgejo/data:/var/lib/gitea
  - /var/lib/forgejo/config:/etc/gitea
  - /mnt/jump/forgejo:/data/jump

services:
  forgejo-preflight:
    container_name: forgejo-preflight
    image: codeberg.org/forgejo/forgejo:16.0.1-rootless@sha256:71863f6b6c5837a27b3a2d133c3161c78a432aa878d57798d74b1d917ff842be
    user: "1000:100"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        grep -q ' /data/jump ' /proc/mounts
        test -f /data/jump/.podhaus-share-mounted
        test -w /data/jump
        test -w /var/lib/gitea
        test -w /etc/gitea
        for path in repositories lfs attachments repo-archives; do
          test -d "/data/jump/$$path"
          test -w "/data/jump/$$path"
        done
        echo "forgejo storage preflight passed"
    volumes: *forgejo-volumes
    security_opt:
      - label:disable
    restart: "no"
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}

  forgejo:
    container_name: forgejo
    image: codeberg.org/forgejo/forgejo:16.0.1-rootless@sha256:71863f6b6c5837a27b3a2d133c3161c78a432aa878d57798d74b1d917ff842be
    user: "1000:100"
    restart: unless-stopped
    depends_on:
      forgejo-preflight:
        condition: service_completed_successfully
    environment: *forgejo-environment
    volumes: *forgejo-volumes
    security_opt:
      - label:disable
    networks:
      - dockernet
    labels:
      autoheal: "true"
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O- http://127.0.0.1:3000/api/healthz >/dev/null
          && grep -q ' /data/jump ' /proc/mounts
      interval: 60s
      timeout: 10s
      retries: 15
      start_period: 60s

  forgejo-auth-init:
    container_name: forgejo-auth-init
    image: codeberg.org/forgejo/forgejo:16.0.1-rootless@sha256:71863f6b6c5837a27b3a2d133c3161c78a432aa878d57798d74b1d917ff842be
    user: "1000:100"
    restart: "no"
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      <<: *forgejo-environment
      FORGEJO_OIDC_CLIENT_ID: ${FORGEJO_OIDC_CLIENT_ID}
      FORGEJO_OIDC_CLIENT_SECRET: ${FORGEJO_OIDC_CLIENT_SECRET}
    volumes: *forgejo-volumes
    security_opt:
      - label:disable
    networks:
      - dockernet
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        auth_id="$$(forgejo admin auth list --vertical-bars \
          | awk -F '|' 'NR > 1 {
              gsub(/^[ \t]+|[ \t]+$$/, "", $$1)
              gsub(/^[ \t]+|[ \t]+$$/, "", $$2)
              if ($$2 == "PocketID") print $$1
            }')"

        if [ -n "$$auth_id" ]; then
          action=update-oauth
          id_args="--id $$auth_id"
        else
          action=add-oauth
          id_args=
        fi

        # Authentication sources live in Forgejo's database and no
        # Terraform provider exposes them. Converge this one object
        # through Forgejo's supported CLI; users, groups, roles and SSH
        # keys remain Terraform-owned in Pocket ID.
        # shellcheck disable=SC2086
        forgejo admin auth "$$action" $$id_args \
          --name PocketID \
          --provider openidConnect \
          --key "$$FORGEJO_OIDC_CLIENT_ID" \
          --secret "$$FORGEJO_OIDC_CLIENT_SECRET" \
          --auto-discover-url https://id.pod.haus/.well-known/openid-configuration \
          --skip-local-2fa \
          --scopes openid \
          --scopes email \
          --scopes profile \
          --scopes groups \
          --required-claim-name groups \
          --required-claim-value forgejo-users \
          --group-claim-name groups \
          --admin-group forgejo-admins \
          --attribute-ssh-public-key ssh_keys
    labels:
      podhaus.stack-content-hash: ${STACK_CONTENT_HASH:-unset}

networks:
  dockernet:
    external: true
