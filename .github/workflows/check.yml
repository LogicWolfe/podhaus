name: Check infrastructure
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: jdx/mise-action@v4
      - run: mise exec -- pipenv install --dev
      - run: tools/check

  # A push to main deploys only once every check is green. This job is the
  # deploy trigger: it calls the podhaus-push-deploy procedure's Komodo
  # listener with the signed body a GitHub push webhook would send, and no
  # webhook calls it directly.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
    steps:
      # The procedure deploys whatever main holds when it runs, not this
      # commit. When main has moved on, the newer commit's own run deploys it
      # once its checks pass, so this one must not deploy untested code.
      - name: Confirm this commit is still the tip of main
        id: tip
        run: |
          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at $tip; its own run deploys it."
          fi
      - name: Start podhaus-push-deploy
        if: steps.tip.outputs.current == 'true'
        env:
          WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          body='{"ref":"refs/heads/main"}'
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')
          curl --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --header "X-Hub-Signature-256: sha256=$signature" \
            --data "$body" \
            https://komodo.pod.haus/listener/github/procedure/podhaus-push-deploy/main
